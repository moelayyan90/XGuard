name: Deploy XGuard inference public fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/wrangler.public-fallback.jsonc"
      - "apps/worker/src/inference-provider*.ts"
      - "apps/worker/migrations/**"
      - ".github/workflows/public-fallback.yml"

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run inference:verify
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Resolve D1 and deploy fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || exit 1
          export CLOUDFLARE_API_TOKEN="$token"
          config_path="${GITHUB_WORKSPACE}/apps/worker/wrangler.public-fallback.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs --template apps/worker/wrangler.public-fallback.jsonc --output "$config_path" --database-name xguard-mainnet
          node - "$config_path" "$GITHUB_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, sha] = process.argv.slice(2);
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(/("XGUARD_GIT_COMMIT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(sha)}`);
          source = source.replace(/("XGUARD_DEPLOYED_AT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(new Date().toISOString())}`);
          if (/XGUARD_PAY_TO|0x[0-9a-fA-F]{40}/.test(source)) throw new Error('hard-coded payout destination');
          fs.writeFileSync(file, source);
          NODE
          npx wrangler d1 migrations apply xguard-mainnet --remote --config "$config_path"
          npx wrangler deploy --config "$config_path" 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          [[ -n "$url" ]] || exit 1
          echo "PUBLIC_FALLBACK_URL=$url" >> "$GITHUB_ENV"
      - name: Verify fallback truth surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 15 "${PUBLIC_FALLBACK_URL}/v1/status?attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const x=require("/tmp/status.json");if(x.service!=="XGuard Autonomous AI Inference Provider")process.exit(1)'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Publish fallback status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard inference fallback failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success && -n "${PUBLIC_FALLBACK_URL:-}" ]]; then state=success; description='XGuard inference fallback is verified'; target_url="$PUBLIC_FALLBACK_URL"; fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-inference-fallback",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
