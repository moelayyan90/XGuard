name: Deploy XGuard public fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/wrangler.public-fallback.jsonc'
      - 'apps/worker/src/**'
      - 'apps/worker/migrations/**'
      - '.github/workflows/public-fallback.yml'

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify production code
        run: npm run verify:mainnet-release
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Resolve D1 and deploy fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare deployment credentials unavailable'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.public-fallback.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs --template apps/worker/wrangler.public-fallback.jsonc --output "$CONFIG_PATH" --database-name xguard-mainnet
          npx wrangler deploy --config "$CONFIG_PATH" 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          [[ -n "$url" ]] || { echo 'workers.dev URL not emitted'; exit 1; }
          echo "PUBLIC_FALLBACK_URL=$url" >> "$GITHUB_ENV"
      - name: Verify fallback live
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PUBLIC_FALLBACK_URL:-}"
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 15 "${PUBLIC_FALLBACK_URL}/v1/commerce/status?attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("/tmp/status.json","utf8"));if(x.mode!=="global-commerce-hunter"||x.inventoryPolicy!=="no speculative inventory")process.exit(1)'; then
              echo "Fallback live: ${PUBLIC_FALLBACK_URL}"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/status.json || true
          exit 1
