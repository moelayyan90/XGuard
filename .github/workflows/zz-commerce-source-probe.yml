name: Commerce source probe

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/commerce-official-sources]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify TED production query syntax
        shell: bash
        run: |
          node <<'NODE'
          async function search(query,scope='ACTIVE'){
            const body={query,fields:['publication-number','notice-title','buyer-name','buyer-email','classification-cpv','total-value','total-value-cur','deadline-date-lot'],page:1,limit:3,scope,checkQuerySyntax:true,paginationMode:'PAGE_NUMBER'};
            const r=await fetch('https://api.ted.europa.eu/v3/notices/search',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','user-agent':'XGuard/1.0'},body:JSON.stringify(body)});
            console.log(query,scope,'status',r.status,(await r.text()).slice(0,8000));
          }
          await search('PD >= 20260814');
          await search('publication-date >= 20260814','ALL');
          await search('ND = "417571-2026"','ALL');
          NODE