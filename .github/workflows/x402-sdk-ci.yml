name: XGuard x402 SDK CI

on:
  pull_request:
    paths:
      - "package.json"
      - "sdk/**"
      - "integrations/**"
      - ".github/workflows/x402-sdk-ci.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "sdk/**"
      - "integrations/**"
      - ".github/workflows/x402-sdk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json');
          if (p.name !== 'xguard-x402-control-plane') throw new Error('wrong package name');
          if (p.version !== '5.1.0') throw new Error('package version must match XGuard 5.1.0');
          if (p.license !== 'Apache-2.0') throw new Error('package license must match LICENSE');
          if (!String(p.peerDependencies?.['@x402/core'] || '').includes('<3')) throw new Error('x402 v2 peer range missing');
          NODE
          node --check sdk/index.js
          for f in sdk/examples/*.mjs; do node --check "$f"; done
          python -m py_compile integrations/python/fastapi_xguard.py
          test -z "$(gofmt -d integrations/go/gin_xguard.go)"

      - name: Pack and install the SDK in a clean project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          pack_json="$(npm pack --json)"
          pack_file="$(printf '%s' "$pack_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x[0].filename)})')"
          test -f "$pack_file"
          mkdir -p /tmp/xguard-sdk-smoke
          cd /tmp/xguard-sdk-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$pack_file" @x402/core@2.24.0
          node --input-type=module <<'NODE'
          import {
            XGUARD_FACILITATOR_URL,
            XGUARD_VERSION,
            facilitator,
            createXGuardFacilitator,
            createXGuardResourceServer,
            xguardSupported,
            xguardFacilitator,
            xguardRoute,
          } from 'xguard-x402-control-plane';

          if (XGUARD_FACILITATOR_URL !== 'https://api.xguardgate.com') throw new Error('bad canonical URL');
          if (XGUARD_VERSION !== '5.1.0') throw new Error('bad SDK version');
          if (!facilitator || typeof facilitator !== 'object') throw new Error('drop-in facilitator missing');
          if (!createXGuardFacilitator() || !createXGuardResourceServer()) throw new Error('constructors failed');

          const supported = await xguardSupported();
          if (!supported || !Array.isArray(supported.kinds) || supported.kinds.length < 1) throw new Error('live /supported invalid');

          const provider = await xguardFacilitator();
          if (!provider || typeof provider !== 'object') throw new Error('live /facilitator invalid');

          const route = await xguardRoute({ network: 'eip155:8453', scheme: 'exact' });
          if (!route || typeof route !== 'object') throw new Error('live route selection invalid');
          console.log(JSON.stringify({ kinds: supported.kinds.length, route }));
          NODE
