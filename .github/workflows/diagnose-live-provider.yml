name: Diagnose live provider

on:
  push:
    branches:
      - agent/diagnose-provider-live

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump live discovery responses
        shell: bash
        run: |
          set -u
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"

          dump_get() {
            local path="$1"
            echo "=== GET ${path} ==="
            curl -sS --max-time 15 -D - -w $'\nHTTP_CODE=%{http_code}\n' "${BASE_URL}${path}" || true
            echo
          }

          echo "=== POST / ==="
          curl -sS --max-time 15 -X POST -D - -w $'\nHTTP_CODE=%{http_code}\n' "${BASE_URL}/" || true
          echo

          dump_get "/healthz"
          dump_get "/.well-known/agent-card.json"
          dump_get "/.well-known/agent-market.json"
          dump_get "/.well-known/x402/facilitator.json"
          dump_get "/openapi.json"
          dump_get "/llms.txt"
          dump_get "/llms-full.txt"
          dump_get "/robots.txt"
          dump_get "/readyz"
          dump_get "/supported"
          dump_get "/status"
