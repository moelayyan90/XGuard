name: Publish XGuard A2A Registry

on:
  workflow_run:
    workflows:
      - Deploy XGuard mainnet
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xguard-a2a-registry
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for live A2A surface
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          BASE='https://xguard-mainnet.maqamapp.workers.dev'
          ready=0

          for attempt in {1..18}; do
            card="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE}/.well-known/agent-card.json?a2a_registry=${DEPLOY_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "${card}" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d).on("end",()=>{
                try {
                  const x=JSON.parse(s);
                  const ok=x.name==="XGuard" && typeof x.description==="string" && x.description.length>0 && x.url==="https://xguard-mainnet.maqamapp.workers.dev/a2a" && x.version==="0.4.0" && x.protocolVersion==="0.3" && x.preferredTransport==="JSONRPC" && x.capabilities && Array.isArray(x.supportedInterfaces) && x.supportedInterfaces.some(i=>i&&i.protocolBinding==="JSONRPC"&&i.protocolVersion==="0.3");
                  process.exit(ok?0:1);
                } catch { process.exit(1); }
              });
            '; then
              reply="$(curl -fsS --max-time 15 \
                -X POST "${BASE}/a2a" \
                -H 'Content-Type: application/json' \
                --data '{"jsonrpc":"2.0","id":"registry-preflight","method":"message/send","params":{"message":{"role":"user","messageId":"registry-preflight-message","parts":[{"kind":"text","text":"Describe XGuard integration."}]}}}' || true)"
              if printf '%s' "${reply}" | node -e '
                let s="";
                process.stdin.on("data",d=>s+=d).on("end",()=>{
                  try {
                    const x=JSON.parse(s);
                    const ok=x.jsonrpc==="2.0" && x.id==="registry-preflight" && x.result && x.result.kind==="message" && x.result.role==="agent" && x.result?.metadata?.discoveryOnly===true && x.result?.metadata?.paymentExecution===false;
                    process.exit(ok?0:1);
                  } catch { process.exit(1); }
                });
              '; then
                ready=1
                break
              fi
            fi
            sleep 5
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::The deployed XGuard A2A Agent Card and message/send endpoint did not become ready within 90 seconds."
            exit 1
          fi

      - name: Register XGuard Agent Card
        shell: bash
        run: |
          set -euo pipefail
          URI='https://xguard-mainnet.maqamapp.workers.dev/.well-known/agent-card.json'
          body_file="$(mktemp)"
          status="$(curl -sS --max-time 30 \
            -o "${body_file}" \
            -w '%{http_code}' \
            -X POST 'https://a2aregistry.org/api/agents/register' \
            -H 'Content-Type: application/json' \
            --data "{\"wellKnownURI\":\"${URI}\"}" || true)"
          response="$(cat "${body_file}")"
          rm -f "${body_file}"
          printf 'A2A Registry HTTP %s\n%s\n' "${status}" "${response}"

          RESPONSE="${response}" STATUS="${status}" node <<'NODE'
          const status = Number(process.env.STATUS || 0);
          const raw = process.env.RESPONSE || "";
          let x = {};
          try { x = JSON.parse(raw || "{}"); } catch {}
          const text = `${raw} ${JSON.stringify(x)}`.toLowerCase();
          const already = text.includes("already") || text.includes("exist") || text.includes("duplicate");
          const accepted = status >= 200 && status < 300 && (
            x.id || x.agent || x.success === true || x.registered === true || x.message || Object.keys(x).length > 0
          );
          if (accepted || already) {
            console.log("XGuard A2A Registry submission accepted or already registered.");
            process.exit(0);
          }
          console.error(x.error || x.message || raw || `A2A Registry rejected XGuard with HTTP ${status}`);
          process.exit(1);
          NODE
