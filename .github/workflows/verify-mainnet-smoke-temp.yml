name: Verify live mainnet smoke once

on:
  push:
    branches:
      - agent/verify-mainnet-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Run canonical mainnet smoke
        run: npm run smoke:mainnet
      - name: Print public status contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' 'https://xguard-mainnet.maqamapp.workers.dev/status?diagnose=public-contract' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(JSON.stringify(x,null,2))})'
