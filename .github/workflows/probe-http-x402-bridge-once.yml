name: Probe deployed HTTP x402 bridge once

on:
  push:
    branches:
      - feature/http-x402-v1-client-v2-resource-bridge

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private target is rejected before outbound fetch
        shell: bash
        run: |
          set -euo pipefail
          URL='https://xguard-mainnet.maqamapp.workers.dev/v1/x402/bridge?url=https%3A%2F%2F127.0.0.1%2Fpaid'
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$URL")"
          cat "$body"
          printf '\nHTTP_STATUS=%s\n' "$code"
          test "$code" = '400'
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.error !== 'private_target_rejected') process.exit(1);
          console.log(JSON.stringify({
            httpX402BridgeLive: true,
            privateTargetRejected: true,
            outboundPaymentPerformed: false
          }));
          NODE
          grep -qi '^strict-transport-security:' "$headers"
          rm -f "$headers" "$body"
