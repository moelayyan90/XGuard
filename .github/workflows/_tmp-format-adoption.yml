name: Temporary format adoption branch

on:
  push:
    branches:
      - agent/adoption-engine
    paths:
      - ".github/workflows/_tmp-format-adoption.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/adoption-engine
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format target and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/adoption-targets.mjs
          rm .github/workflows/_tmp-format-adoption.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/adoption-targets.mjs .github/workflows/_tmp-format-adoption.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format adoption targets"
          git push origin HEAD:agent/adoption-engine
