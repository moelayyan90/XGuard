name: Browser Extension Store Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-store-package.yml"
      - "tests/browser-extension-store-release.test.ts"
  push:
    branches:
      - main
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-store-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate store release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const manifest = JSON.parse(fs.readFileSync("browser-extension/manifest.json", "utf8"));

          if (manifest.manifest_version !== 3) throw new Error("Manifest V3 required");
          if (manifest.version !== "0.2.0") throw new Error("Unexpected store version");
          if (JSON.stringify(manifest.permissions) !== JSON.stringify(["storage"])) {
            throw new Error("Extension must keep the minimal storage permission only");
          }
          if (JSON.stringify(manifest.host_permissions) !== JSON.stringify(["https://xguardgate.com/*"])) {
            throw new Error("Unexpected API host permission");
          }

          const scripts = manifest.content_scripts ?? [];
          if (scripts.length !== 1 || JSON.stringify(scripts[0].matches) !== JSON.stringify(["https://*/*"])) {
            throw new Error("Payment-surface detection must be HTTPS-only");
          }
          if (JSON.stringify(scripts[0].js) !== JSON.stringify(["universal-layer.js"])) {
            throw new Error("Universal payment layer must be the active content script");
          }

          for (const size of ["16", "32", "48", "128"]) {
            const icon = manifest.icons?.[size];
            if (!icon || !fs.existsSync(path.join("browser-extension", icon))) {
              throw new Error(`Missing ${size}px extension icon`);
            }
          }

          const expectedAssets = {
            "icon128.png": [128, 128],
            "edge-logo-300.png": [300, 300],
            "small-promo-440x280.png": [440, 280],
            "large-promo-1400x560.png": [1400, 560],
            "screenshot-1280x800.png": [1280, 800],
          };
          const pngSize = (buffer) => {
            const signature = buffer.subarray(0, 8).toString("hex");
            if (signature !== "89504e470d0a1a0a") throw new Error("Not a PNG");
            return [buffer.readUInt32BE(16), buffer.readUInt32BE(20)];
          };
          for (const [file, dimensions] of Object.entries(expectedAssets)) {
            const buffer = fs.readFileSync(path.join("browser-extension/store-assets", file));
            const actual = pngSize(buffer);
            if (actual[0] !== dimensions[0] || actual[1] !== dimensions[1]) {
              throw new Error(`${file} has ${actual.join("x")}, expected ${dimensions.join("x")}`);
            }
          }

          for (const file of ["universal-layer.js", "service-worker.js", "options.js"]) {
            const source = fs.readFileSync(path.join("browser-extension", file), "utf8");
            if (/\beval\s*\(|\bnew\s+Function\s*\(/.test(source)) {
              throw new Error(`Remote/dynamic execution primitive found in ${file}`);
            }
            if (/https?:\/\/[^"'`\s]+\.js\b/i.test(source)) {
              throw new Error(`Remote JavaScript URL found in ${file}`);
            }
          }

          for (const required of [
            "browser-extension/PRIVACY.md",
            "browser-extension/STORE_SUBMISSION.md",
          ]) {
            if (!fs.existsSync(required)) throw new Error(`Missing ${required}`);
          }
          NODE

      - name: Build minimal runtime ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./browser-extension/manifest.json").version')"
          OUT="${RUNNER_TEMP}/xguard-extension"
          mkdir -p "${OUT}/icons" dist/browser-extension
          cp browser-extension/manifest.json "${OUT}/"
          cp browser-extension/universal-layer.js "${OUT}/"
          cp browser-extension/service-worker.js "${OUT}/"
          cp browser-extension/options.html "${OUT}/"
          cp browser-extension/options.js "${OUT}/"
          cp browser-extension/icons/icon16.png "${OUT}/icons/"
          cp browser-extension/icons/icon32.png "${OUT}/icons/"
          cp browser-extension/icons/icon48.png "${OUT}/icons/"
          cp browser-extension/icons/icon128.png "${OUT}/icons/"
          (
            cd "${OUT}"
            zip -X -r "${GITHUB_WORKSPACE}/dist/browser-extension/xguard-payment-layer-${VERSION}.zip" .
          )
          (
            cd dist/browser-extension
            sha256sum "xguard-payment-layer-${VERSION}.zip" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Verify ZIP root and forbidden files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find dist/browser-extension -name 'xguard-payment-layer-*.zip' -print -quit)"
          unzip -Z1 "${ZIP}" | grep -qx 'manifest.json'
          unzip -Z1 "${ZIP}" | grep -qx 'universal-layer.js'
          ! unzip -Z1 "${ZIP}" | grep -E '(^|/)(PRIVACY|STORE_SUBMISSION|README).*\.md$'
          ! unzip -Z1 "${ZIP}" | grep -E '\.(map|pem|key|env)$'
          (
            cd dist/browser-extension
            sha256sum -c SHA256SUMS.txt
          )

      - name: Build store submission kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/store-submission/assets
          cp browser-extension/PRIVACY.md dist/store-submission/
          cp browser-extension/STORE_SUBMISSION.md dist/store-submission/
          cp browser-extension/store-assets/*.png dist/store-submission/assets/
          cp dist/browser-extension/SHA256SUMS.txt dist/store-submission/

      - name: Upload runtime package
        uses: actions/upload-artifact@v6
        with:
          name: xguard-browser-extension-store-package
          path: dist/browser-extension/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload submission kit
        uses: actions/upload-artifact@v6
        with:
          name: xguard-browser-extension-submission-kit
          path: dist/store-submission/**
          if-no-files-found: error
          retention-days: 30
