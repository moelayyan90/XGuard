name: Prettier diff
on:
  pull_request:
    paths:
      - "apps/worker/src/mainnet-entry.ts"
      - "tests/mainnet-endpoint-discovery.test.ts"
      - ".github/workflows/prettier-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write apps/worker/src/mainnet-entry.ts tests/mainnet-endpoint-discovery.test.ts
          git diff -- apps/worker/src/mainnet-entry.ts tests/mainnet-endpoint-discovery.test.ts
