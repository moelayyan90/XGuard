name: Publish XGuard to Official MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"
      - "lhm.plugin.json"
      - "apps/worker/src/mainnet-mcp-modern.ts"
      - ".github/workflows/publish-official-mcp-registry.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify local MCP metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          const lhm = JSON.parse(fs.readFileSync('lhm.plugin.json', 'utf8'));
          const runtime = fs.readFileSync('apps/worker/src/mainnet-mcp-modern.ts', 'utf8');

          const runtimeVersion = runtime.match(/XGUARD_MCP_VERSION\s*=\s*"([^"]+)"/)?.[1];
          if (!runtimeVersion) throw new Error('Could not read XGUARD_MCP_VERSION from runtime');
          if (server.version !== runtimeVersion) throw new Error(`server.json ${server.version} != runtime ${runtimeVersion}`);
          if (lhm.version !== runtimeVersion) throw new Error(`lhm.plugin.json ${lhm.version} != runtime ${runtimeVersion}`);

          const requiredTools = [
            'xguard_payment_offer',
            'xguard_payment_decision',
            'xguard_discover',
            'xguard_resource_details',
            'xguard_status',
          ];
          const lhmNames = new Set(Array.isArray(lhm.tools) ? lhm.tools.map(t => t?.name) : []);
          for (const tool of requiredTools) {
            if (!runtime.includes(`name: "${tool}"`)) throw new Error(`Runtime no longer exposes ${tool}`);
            if (!lhmNames.has(tool)) throw new Error(`LHM manifest is missing ${tool}`);
          }

          if (!Array.isArray(server.remotes) || !server.remotes.some(r => r?.type === 'streamable-http' && r?.url === 'https://xguardgate.com/mcp')) {
            throw new Error('server.json is missing the canonical streamable-http XGuard MCP remote');
          }
          console.log(`Local MCP metadata is consistent at ${runtimeVersion}`);
          NODE

      - name: Check whether Official MCP Registry already has this version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          target_name="$(node -p "require('./server.json').name")"
          target_version="$(node -p "require('./server.json').version")"
          encoded_name="$(node -p "encodeURIComponent(require('./server.json').name)")"

          response="$(curl --fail-with-body -sS --max-time 20 --retry 4 --retry-all-errors --retry-delay 2 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/latest")"

          current_version="$(printf '%s' "${response}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const v=x?.server?.version ?? x?.version ?? "";
              process.stdout.write(String(v));
            });
          ')"

          echo "target_name=${target_name}" >> "${GITHUB_OUTPUT}"
          echo "target_version=${target_version}" >> "${GITHUB_OUTPUT}"
          echo "encoded_name=${encoded_name}" >> "${GITHUB_OUTPUT}"
          if [[ "${current_version}" == "${target_version}" ]]; then
            echo "needs_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Official MCP Registry already serves ${target_name} ${target_version}."
          else
            echo "needs_publish=true" >> "${GITHUB_OUTPUT}"
            echo "Official MCP Registry latest is '${current_version:-missing}', target is '${target_version}'."
          fi

      - name: Install official MCP publisher
        if: steps.registry.outputs.needs_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 --retry 4 --retry-all-errors --retry-delay 2 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate and publish with GitHub OIDC
        if: steps.registry.outputs.needs_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
          ./mcp-publisher publish server.json --registry=https://registry.modelcontextprotocol.io

      - name: Verify Official MCP Registry publication
        shell: bash
        run: |
          set -euo pipefail
          encoded_name="${{ steps.registry.outputs.encoded_name }}"
          target_name="${{ steps.registry.outputs.target_name }}"
          target_version="${{ steps.registry.outputs.target_version }}"

          response="$(curl --fail-with-body -sS --max-time 20 --retry 6 --retry-all-errors --retry-delay 3 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/latest")"

          printf '%s' "${response}" | TARGET_NAME="${target_name}" TARGET_VERSION="${target_version}" node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const server=x?.server ?? x;
              if (server?.name !== process.env.TARGET_NAME) {
                throw new Error(`Registry returned unexpected server name: ${server?.name}`);
              }
              if (server?.version !== process.env.TARGET_VERSION) {
                throw new Error(`Registry version ${server?.version} != target ${process.env.TARGET_VERSION}`);
              }
              const remotes=Array.isArray(server?.remotes)?server.remotes:[];
              if (!remotes.some(r => r?.type === "streamable-http" && r?.url === "https://xguardgate.com/mcp")) {
                throw new Error('Registry latest is missing canonical XGuard streamable-http remote');
              }
              console.log(`Official MCP Registry verified ${server.name} ${server.version}`);
            });
          '
