name: MCP format preview

on:
  push:
    branches: [fix/mcp-2026-agent-discovery]
    paths:
      - "apps/worker/src/mainnet-mcp-modern.ts"
      - ".github/workflows/format-mcp-preview.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mcp-2026-agent-discovery
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact repository formatting
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write apps/worker/src/mainnet-mcp-modern.ts
          if git diff --quiet -- apps/worker/src/mainnet-mcp-modern.ts; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet-mcp-modern.ts
          git commit -m "Format modern MCP implementation"
          git push origin HEAD:fix/mcp-2026-agent-discovery
