name: XGuard adoption engine

on:
  pull_request:
    paths:
      - "scripts/adoption-engine.mjs"
      - "scripts/adoption-targets.mjs"
      - "scripts/conversion-engine.mjs"
      - "scripts/migration-engine.mjs"
      - "scripts/code-switch-engine.mjs"
      - "scripts/revenue-funnel.mjs"
      - ".github/workflows/adoption-engine.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "scripts/adoption-engine.mjs"
      - "scripts/adoption-targets.mjs"
      - "scripts/conversion-engine.mjs"
      - "scripts/migration-engine.mjs"
      - "scripts/code-switch-engine.mjs"
      - "scripts/revenue-funnel.mjs"
      - ".github/workflows/adoption-engine.yml"
      - "package.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Public metadata discovery, conversion planning, repository/file-level
# migration/code analysis, and revenue-funnel measurement only; never executes
# payments, synthetic settlements, third-party configuration changes,
# pull requests, or bulk outreach.
permissions:
  contents: read
  issues: write

concurrency:
  group: xguard-adoption-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Self-test adoption, conversion, migration, code-switch, and revenue engines
        run: npm run adoption:self-test

      - name: Discover, verify, rank, and build x402 conversion funnel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XGUARD_ADOPTION_MAX_PAGES: "100"
          XGUARD_ADOPTION_PROBE_LIMIT: "100"
          XGUARD_ADOPTION_PROBE_CONCURRENCY: "8"
          XGUARD_ADOPTION_MIN_SCORE: "25"
          XGUARD_CONVERSION_QUEUE_LIMIT: "50"
          XGUARD_MIGRATION_TARGET_LIMIT: "16"
          XGUARD_MIGRATION_REPOS_PER_TARGET: "3"
          XGUARD_MIGRATION_FILES_PER_REPO: "24"
          XGUARD_CODE_SWITCH_REPO_LIMIT: "24"
          XGUARD_CODE_SWITCH_FILES_PER_REPO: "30"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f adoption-report.json adoption-report.md adoption-targets.json adoption-targets.md conversion-queue.json conversion-queue.md migration-queue.json migration-queue.md code-switch-queue.json code-switch-queue.md revenue-funnel.json revenue-funnel.md adoption-scan.log
            set +e
            npm run adoption:scan 2>&1 | tee adoption-scan.log
            scan_status=${PIPESTATUS[0]}
            set -e

            if [[ "$scan_status" -eq 0 ]] \
              && grep -Fq '"event":"adoption_source_scanned","source":"cdp-bazaar"' adoption-scan.log \
              && grep -Fq '"event":"adoption_source_scanned","source":"payai-bazaar"' adoption-scan.log \
              && grep -Fq '"event":"conversion_queue_ready"' adoption-scan.log \
              && grep -Fq '"event":"migration_queue_ready"' adoption-scan.log \
              && grep -Fq '"event":"code_switch_queue_ready"' adoption-scan.log \
              && grep -Fq '"event":"revenue_funnel_ready"' adoption-scan.log; then
              echo "Primary adoption catalogs and revenue conversion funnel completed on attempt ${attempt}."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 5))
              echo "Primary adoption/conversion coverage incomplete on attempt ${attempt}; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Primary adoption/conversion coverage remained incomplete; keeping the previous canonical queue unchanged."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: xguard-adoption-conversion-migration-report
          path: |
            adoption-report.json
            adoption-report.md
            adoption-targets.json
            adoption-targets.md
            conversion-queue.json
            conversion-queue.md
            migration-queue.json
            migration-queue.md
            code-switch-queue.json
            code-switch-queue.md
            revenue-funnel.json
            revenue-funnel.md
          if-no-files-found: error
          retention-days: 14

      - name: Update canonical adoption, conversion, migration, and revenue issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "[adoption] XGuard public x402 candidate pipeline";
            const targets = fs.readFileSync("adoption-targets.md", "utf8");
            const conversion = fs.readFileSync("conversion-queue.md", "utf8");
            const migration = fs.readFileSync("migration-queue.md", "utf8");
            const codeSwitch = fs.readFileSync("code-switch-queue.md", "utf8");
            const revenue = fs.readFileSync("revenue-funnel.md", "utf8");
            const body = [
              "This issue is maintained automatically by the XGuard adoption, conversion, migration, code-switch, and revenue-funnel engine.",
              "",
              "It ranks distinct public x402 merchant/service targets, scans public repository trees to locate real facilitator-client switch points without depending on the tight GitHub code-search quota, measures the path from observed paid traffic to patch-ready migration, and produces repository/file-level side-effect-free switch packets. Public 402 observations are opportunities, never reported as earned XGuard revenue.",
              "",
              revenue,
              "",
              "---",
              "",
              codeSwitch,
              "",
              "---",
              "",
              migration,
              "",
              "---",
              "",
              conversion,
              "",
              "---",
              "",
              targets,
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n").slice(0, 65000);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
