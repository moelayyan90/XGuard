name: XGuard adoption engine

on:
  pull_request:
    paths:
      - "scripts/adoption-engine.mjs"
      - "scripts/adoption-targets.mjs"
      - "scripts/conversion-engine.mjs"
      - ".github/workflows/adoption-engine.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "scripts/adoption-engine.mjs"
      - "scripts/adoption-targets.mjs"
      - "scripts/conversion-engine.mjs"
      - ".github/workflows/adoption-engine.yml"
      - "package.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Public metadata discovery and conversion planning only; never executes payments,
# synthetic settlements, third-party configuration changes, or bulk outreach.
permissions:
  contents: read
  issues: write

concurrency:
  group: xguard-adoption-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Self-test adoption and conversion engines
        run: npm run adoption:self-test

      - name: Discover, verify, rank, and build x402 merchant switch kits
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XGUARD_ADOPTION_MAX_PAGES: "100"
          XGUARD_ADOPTION_PROBE_LIMIT: "100"
          XGUARD_ADOPTION_PROBE_CONCURRENCY: "8"
          XGUARD_ADOPTION_MIN_SCORE: "25"
          XGUARD_CONVERSION_QUEUE_LIMIT: "50"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f adoption-report.json adoption-report.md adoption-targets.json adoption-targets.md conversion-queue.json conversion-queue.md adoption-scan.log
            set +e
            npm run adoption:scan 2>&1 | tee adoption-scan.log
            scan_status=${PIPESTATUS[0]}
            set -e

            if [[ "$scan_status" -eq 0 ]] \
              && grep -Fq '"event":"adoption_source_scanned","source":"cdp-bazaar"' adoption-scan.log \
              && grep -Fq '"event":"adoption_source_scanned","source":"payai-bazaar"' adoption-scan.log \
              && grep -Fq '"event":"conversion_queue_ready"' adoption-scan.log; then
              echo "Primary adoption catalogs and conversion queue completed on attempt ${attempt}."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 5))
              echo "Primary adoption/conversion coverage incomplete on attempt ${attempt}; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Primary adoption/conversion coverage remained incomplete; keeping the previous canonical queue unchanged."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: xguard-adoption-conversion-report
          path: |
            adoption-report.json
            adoption-report.md
            adoption-targets.json
            adoption-targets.md
            conversion-queue.json
            conversion-queue.md
          if-no-files-found: error
          retention-days: 14

      - name: Update canonical adoption and conversion queue issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "[adoption] XGuard public x402 candidate pipeline";
            const targets = fs.readFileSync("adoption-targets.md", "utf8");
            const conversion = fs.readFileSync("conversion-queue.md", "utf8");
            const body = [
              "This issue is maintained automatically by the XGuard adoption and conversion engine.",
              "",
              "It ranks distinct public x402 merchant/service targets and produces machine-readable switch kits. The workflow never pays endpoints, changes third-party infrastructure, fabricates settlements, or sends bulk outreach.",
              "",
              conversion,
              "",
              "---",
              "",
              targets,
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n").slice(0, 65000);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
