name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: codeql-init
        name: Initialize CodeQL
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - id: codeql-analyze
        name: Analyze with CodeQL
        if: steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
      - name: Report CodeQL availability
        if: steps.codeql-init.outcome != 'success' || steps.codeql-analyze.outcome == 'failure'
        run: echo "::warning::GitHub CodeQL did not complete; the required Email Shield CI remains independent and CodeQL will retry on the next run."
