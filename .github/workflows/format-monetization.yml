name: Format monetization changes

on:
  push:
    branches:
      - agent/monetize-universal-gateway
    paths:
      - apps/worker/src/monetized-mainnet.ts
      - apps/worker/wrangler.mainnet.jsonc
      - BILLING.md
      - QUICKSTART.md
      - .github/workflows/format-monetization.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/monetize-universal-gateway
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/monetized-mainnet.ts apps/worker/wrangler.mainnet.jsonc BILLING.md QUICKSTART.md tests/monetized-mainnet.test.ts server.json
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/monetized-mainnet.ts apps/worker/wrangler.mainnet.jsonc BILLING.md QUICKSTART.md tests/monetized-mainnet.test.ts server.json
          git commit -m "Format monetization changes"
          git push origin HEAD:agent/monetize-universal-gateway
