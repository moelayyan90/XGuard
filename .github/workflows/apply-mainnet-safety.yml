name: Apply mainnet safety patch

on:
  push:
    branches:
      - mainnet/live-worker
    paths:
      - ".github/workflows/apply-mainnet-safety.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/live-worker
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-mainnet-safety.mjs
      - run: npx prettier --write apps/worker/src/mainnet.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet.ts
          git commit -m "Harden post-submit and finality failure handling"
          git push origin HEAD:mainnet/live-worker
