name: Fix Economic Firewall preview smoke expectation

on:
  push:
    branches:
      - agent/economic-firewall-clean
    paths:
      - .github/workflows/fix-economic-preview-smoke.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-clean
      - name: Correct expected protocol guard status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-economic-preview-clean.yml')
          s = p.read_text()
          old = '[[ "$X402_BAD_STATUS" == "400" ]]'
          new = '[[ "$X402_BAD_STATUS" == "409" ]]'
          if old not in s:
              raise SystemExit('expected smoke assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-economic-preview-clean.yml
          git commit -m "test: expect x402 protocol guard before envelope parsing"
          git push origin HEAD:agent/economic-firewall-clean
