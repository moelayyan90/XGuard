name: Wire mainnet Economic Firewall shadow

on:
  push:
    branches:
      - agent/economic-firewall-mainnet-shadow
    paths:
      - .github/workflows/wire-mainnet-economic-shadow.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-mainnet-shadow
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Wire shadow observer without changing payment outcomes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet.ts')
          s = p.read_text()

          protocol_old = '''  payAIVerify,\n  type MainnetProtocolEnv,\n} from "./mainnet-protocol.js";'''
          protocol_new = '''  payAIVerify,\n  type MainnetProtocolEnv,\n  type ParsedMainnetRequest,\n} from "./mainnet-protocol.js";'''
          if protocol_old not in s:
              raise SystemExit('protocol import anchor not found')
          s = s.replace(protocol_old, protocol_new, 1)

          coordinator_anchor = '''} from "./mainnet-coordinator.js";\n\nexport { MainnetPaymentCoordinator, MainnetRequestGate };'''
          coordinator_new = '''} from "./mainnet-coordinator.js";\nimport {\n  deriveMainnetEconomicShadowBinding,\n  parseMainnetEconomicShadowMode,\n} from "./mainnet-economic-shadow.js";\n\nexport { MainnetPaymentCoordinator, MainnetRequestGate };'''
          if coordinator_anchor not in s:
              raise SystemExit('coordinator import anchor not found')
          s = s.replace(coordinator_anchor, coordinator_new, 1)

          env_old = '''  PAYAI_DOWNSTREAM_COST_MICRO_USD: string;\n}'''
          env_new = '''  PAYAI_DOWNSTREAM_COST_MICRO_USD: string;\n  ECONOMIC_FIREWALL_SHADOW_MODE?: string;\n}'''
          if env_old not in s:
              raise SystemExit('env anchor not found')
          s = s.replace(env_old, env_new, 1)

          verify_old = '''    assertRuntimeConfig(context.env);\n    await requireMerchant(context);\n    await requireHealthyPayAI(context.env);\n    const body = await parseMainnetFacilitatorRequest(context.req.raw);\n    const result = await payAIVerify(context.env, body.raw, body.payer);'''
          verify_new = '''    assertRuntimeConfig(context.env);\n    const merchant = await requireMerchant(context);\n    await requireHealthyPayAI(context.env);\n    const body = await parseMainnetFacilitatorRequest(context.req.raw);\n    observeEconomicFirewallShadow(context, merchant, body, "verify");\n    const result = await payAIVerify(context.env, body.raw, body.payer);'''
          if verify_old not in s:
              raise SystemExit('verify route anchor not found')
          s = s.replace(verify_old, verify_new, 1)

          settle_old = '''    const body = await parseMainnetFacilitatorRequest(context.req.raw);\n    network = body.paymentRequirements.network;\n    const identities = derivePaymentIdentities('''
          settle_new = '''    const body = await parseMainnetFacilitatorRequest(context.req.raw);\n    network = body.paymentRequirements.network;\n    observeEconomicFirewallShadow(context, merchant, body, "settle");\n    const identities = derivePaymentIdentities('''
          if settle_old not in s:
              raise SystemExit('settle route anchor not found')
          s = s.replace(settle_old, settle_new, 1)

          helper_anchor = '''async function requireMerchant(context: AppContext): Promise<MerchantIdentity> {'''
          helper = '''function observeEconomicFirewallShadow(\n  context: AppContext,\n  merchant: MerchantIdentity,\n  request: ParsedMainnetRequest,\n  operation: "verify" | "settle",\n): void {\n  if (\n    parseMainnetEconomicShadowMode(context.env.ECONOMIC_FIREWALL_SHADOW_MODE) !==\n    "observe"\n  )\n    return;\n\n  try {\n    const shadow = deriveMainnetEconomicShadowBinding(\n      merchant.merchantId,\n      request,\n    );\n    console.log(\n      JSON.stringify({\n        event: "economic_firewall_shadow_bound",\n        requestId: context.get("requestId"),\n        operation,\n        merchantId: merchant.merchantId,\n        intentId: shadow.intent.intentId,\n        termsHash: shadow.intent.termsHash,\n        authorizationHash: shadow.authorizationHash,\n        amountMicroUsd: shadow.amountMicroUsd,\n      }),\n    );\n  } catch (error) {\n    console.warn(\n      JSON.stringify({\n        event: "economic_firewall_shadow_rejected",\n        requestId: context.get("requestId"),\n        operation,\n        merchantId: merchant.merchantId,\n        code: errorCode(error),\n      }),\n    );\n  }\n}\n\n'''
          if helper_anchor not in s:
              raise SystemExit('helper anchor not found')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)
          p.write_text(s)
          PY
      - name: Verify full repository with shadow wiring
        run: |
          npx prettier --write apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-shadow.ts tests/mainnet-economic-shadow.test.ts
          npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Commit verified wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-shadow.ts tests/mainnet-economic-shadow.test.ts
          git commit -m "feat: observe Economic Firewall shadow on mainnet x402 paths"
          git push origin HEAD:agent/economic-firewall-mainnet-shadow
