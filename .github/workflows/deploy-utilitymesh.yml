name: Deploy XGuard UtilityMesh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/utilitymesh/**"
      - ".github/workflows/deploy-utilitymesh.yml"
  pull_request:
    paths:
      - "apps/utilitymesh/**"
      - ".github/workflows/deploy-utilitymesh.yml"

permissions:
  contents: read

concurrency:
  group: xguard-utilitymesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install --prefix apps/utilitymesh --no-audit --no-fund
      - name: Syntax and config
        run: |
          set -euo pipefail
          node --check apps/utilitymesh/src/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps/utilitymesh/wrangler.jsonc','utf8'))"
      - name: Dry-run bundle
        run: npx --yes wrangler@4.123.0 deploy --dry-run --config apps/utilitymesh/wrangler.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install --prefix apps/utilitymesh --no-audit --no-fund
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/utilitymesh/wrangler.jsonc
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for base in 'https://api.xguardgate.com' 'https://xguardgate.com'; do
            for attempt in {1..30}; do
              if body="$(curl --fail --silent --show-error --max-time 10 "${base}/healthz" 2>/dev/null)" && \
                printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.service!=="XGuard UtilityMesh"||x.paid_endpoints!==15)process.exit(1)})'; then
                break
              fi
              sleep 4
            done
          done
          curl --fail --silent --show-error https://api.xguardgate.com/catalog | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.endpoints)||x.endpoints.length!==15)process.exit(1)})'
          curl --fail --silent --show-error https://api.xguardgate.com/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.openapi!=="3.1.0")process.exit(1)})'
