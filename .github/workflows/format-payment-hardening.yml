name: Format payment hardening branch

on:
  push:
    branches:
      - agent/payment-discovery-hardening-v2

permissions:
  contents: write

concurrency:
  group: format-payment-hardening
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/payment-discovery-hardening-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format hardened edge files
        run: >-
          npx prettier --write
          apps/worker/src/a2a-gateway-v1.ts
          apps/worker/src/public-payment-contract.ts
          apps/worker/src/resilient-webhook-ingress.ts
          apps/worker/src/universal-security-guard.ts
          apps/worker/wrangler.mainnet.jsonc
          apps/worker/src/universal-mainnet.ts
          tests/mainnet-release-gate-source.test.ts
          tests/universal-webhook-source.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src apps/worker/wrangler.mainnet.jsonc tests
          git commit -m "Format payment hardening files"
          git push origin HEAD:agent/payment-discovery-hardening-v2
