name: Live readiness diagnostic

on:
  push:
    branches:
      - diag/live-readiness-20260817

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/live-readiness-20260817
      - name: Probe public production surface
        shell: bash
        run: |
          set -u
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          REPORT="diagnostics/live-readiness.txt"
          mkdir -p diagnostics
          : > "${REPORT}"
          printf 'commit=%s\nchecked_at=%s\n\n' "${GITHUB_SHA}" "$(date -u +%FT%TZ)" >> "${REPORT}"

          probe() {
            method="$1"
            path="$2"
            tmp="$(mktemp)"
            if [[ "${method}" == "POST" ]]; then
              code="$(curl -sS --max-time 20 -X POST -H 'Cache-Control: no-cache' -o "${tmp}" -w '%{http_code}' "${BASE_URL}${path}" || printf 'curl_error')"
            else
              code="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -o "${tmp}" -w '%{http_code}' "${BASE_URL}${path}" || printf 'curl_error')"
            fi
            printf '=== %s %s ===\nstatus=%s\n' "${method}" "${path}" "${code}" >> "${REPORT}"
            head -c 5000 "${tmp}" >> "${REPORT}" || true
            printf '\n\n' >> "${REPORT}"
            rm -f "${tmp}"
          }

          probe GET /healthz
          probe POST /
          probe GET /.well-known/agent-card.json
          probe GET /.well-known/agent-market.json
          probe GET /.well-known/x402/facilitator.json
          probe GET /.well-known/x402
          probe GET /.well-known/monetization
          probe GET /.well-known/mcp/server.json
          probe GET /openapi.json
          probe GET /llms.txt
          probe GET /llms-full.txt
          probe GET /robots.txt
          probe GET /readyz
          probe GET /supported
          probe GET /status
          probe GET /.git/config
          probe GET /.env
      - name: Commit public diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/live-readiness.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostics: capture live readiness [skip ci]'
          git push origin HEAD:diag/live-readiness-20260817
