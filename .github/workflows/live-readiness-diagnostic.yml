name: Live readiness diagnostic

on:
  push:
    branches:
      - diag/live-readiness-20260817

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/live-readiness-20260817
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Probe public production surface
        shell: bash
        run: |
          set -u
          REPORT="diagnostics/live-readiness.txt"
          mkdir -p diagnostics
          : > "${REPORT}"
          printf 'commit=%s\nchecked_at=%s\n\n' "${GITHUB_SHA}" "$(date -u +%FT%TZ)" >> "${REPORT}"

          probe() {
            base="$1"
            method="$2"
            path="$3"
            tmp="$(mktemp)"
            headers="$(mktemp)"
            if [[ "${method}" == "POST" ]]; then
              code="$(curl -sS --max-time 20 -X POST -H 'Cache-Control: no-cache' -D "${headers}" -o "${tmp}" -w '%{http_code}' "${base}${path}" || printf 'curl_error')"
            else
              code="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -D "${headers}" -o "${tmp}" -w '%{http_code}' "${base}${path}" || printf 'curl_error')"
            fi
            printf '=== %s %s%s ===\nstatus=%s\n' "${method}" "${base}" "${path}" "${code}" >> "${REPORT}"
            grep -iE '^(x-xguard-discovery|content-type|cache-control|strict-transport-security):' "${headers}" >> "${REPORT}" || true
            head -c 5000 "${tmp}" >> "${REPORT}" || true
            printf '\n\n' >> "${REPORT}"
            rm -f "${tmp}" "${headers}"
          }

          WORKERS="https://xguard-mainnet.maqamapp.workers.dev"
          CUSTOM="https://xguardgate.com"

          probe "${WORKERS}" GET /healthz
          probe "${WORKERS}" GET /readyz
          probe "${WORKERS}" GET /status
          probe "${WORKERS}" GET /.git/config
          probe "${WORKERS}" GET /.env

          probe "${CUSTOM}" GET /healthz
          probe "${CUSTOM}" POST /
          probe "${CUSTOM}" GET /readyz
          probe "${CUSTOM}" GET /status
          probe "${CUSTOM}" GET /.well-known/x402/facilitator.json
          probe "${CUSTOM}" GET /.git/config
          probe "${CUSTOM}" GET /.env

          printf '=== npm run smoke:mainnet ===\n' >> "${REPORT}"
          set +e
          npm run smoke:mainnet >> "${REPORT}" 2>&1
          smoke_status=$?
          set -e
          printf '\nexit=%s\n' "${smoke_status}" >> "${REPORT}"
      - name: Commit public diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/live-readiness.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostics: capture custom-domain readiness [skip ci]'
          git push origin HEAD:diag/live-readiness-20260817
