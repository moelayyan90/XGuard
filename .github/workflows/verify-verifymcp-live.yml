name: Verify VerifyMCP live surface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-verifymcp-live.yml"
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live trust signals
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://xguardgate.com"
          HTTP_URL="http://xguardgate.com"

          secure_headers="$(curl -fsS --max-time 15 -D - -o /dev/null "${BASE_URL}/status" | tr -d '\r')"
          if ! printf '%s\n' "${secure_headers}" \
            | grep -qi '^strict-transport-security:[[:space:]]*max-age=31536000; includeSubDomains'; then
            echo "::error::HSTS is missing or weaker than the XGuard production policy."
            printf '%s\n' "${secure_headers}"
            exit 1
          fi

          plaintext_headers="$(curl -sS --max-time 15 -D - -o /dev/null "${HTTP_URL}/mcp" | tr -d '\r')"
          plaintext_status="$(printf '%s\n' "${plaintext_headers}" | awk '/^HTTP\// { code=$2 } END { print code }')"
          case "${plaintext_status}" in
            301|302|307|308) ;;
            *)
              echo "::error::Plaintext HTTP did not redirect to HTTPS; status=${plaintext_status:-missing}."
              printf '%s\n' "${plaintext_headers}"
              exit 1
              ;;
          esac
          if ! printf '%s\n' "${plaintext_headers}" \
            | grep -qi '^location:[[:space:]]*https://xguardgate\.com/mcp'; then
            echo "::error::Plaintext redirect did not target the canonical HTTPS MCP endpoint."
            printf '%s\n' "${plaintext_headers}"
            exit 1
          fi

          owners_body="$(curl -fsS --max-time 15 "${BASE_URL}/.well-known/owners.json")"
          printf '%s' "${owners_body}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.$schema !== "https://verifymcp.io/schemas/owners.json") process.exit(1);
              if (!Array.isArray(x.owners) || !x.owners.map(v=>String(v).toLowerCase()).includes("mo.elayyan2023@gmail.com")) process.exit(1);
            });
          '

          manifest_body="$(curl -fsS --max-time 15 "${BASE_URL}/.well-known/mcp/server.json")"
          printf '%s' "${manifest_body}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.name !== "io.github.moelayyan90/xguard") process.exit(1);
              if (!Array.isArray(x.remotes) || !x.remotes.some(r=>r && r.type==="streamable-http" && r.url==="https://xguardgate.com/mcp")) process.exit(1);
            });
          '

          tools_body="$(curl -fsS --max-time 15 \
            -X POST \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2025-11-25' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "${BASE_URL}/mcp")"
          printf '%s' "${tools_body}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const tools=x && x.result && Array.isArray(x.result.tools) ? x.result.tools : null;
              if (!tools) process.exit(1);
              const expected=["xguard_discover","xguard_resource_details","xguard_status"];
              if (tools.length !== expected.length || expected.some(name=>!tools.some(t=>t && t.name===name))) process.exit(1);
              for (const tool of tools) {
                const a=tool.annotations || {};
                if (a.readOnlyHint !== true || a.destructiveHint !== false || a.idempotentHint !== true || a.openWorldHint !== false) process.exit(1);
                if (typeof tool.description !== "string" || !tool.description.includes("Example:")) process.exit(1);
                const props=(tool.inputSchema && tool.inputSchema.properties) || {};
                for (const value of Object.values(props)) {
                  if (!value || typeof value.description !== "string" || value.description.trim()==="") process.exit(1);
                }
              }
            });
          '

          echo "VerifyMCP live trust signals verified successfully on xguardgate.com."
