name: Publish XGuard Actor to Apify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commercial/apify-xguard/**"
      - ".github/workflows/publish-apify-actor.yml"

permissions:
  contents: read
  statuses: write

env:
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Actor before publication
        working-directory: commercial/apify-xguard
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          node --check scripts/configure-store.mjs
          python -m json.tool .actor/actor.json >/dev/null
          python -m json.tool .actor/input_schema.json >/dev/null
          python -m json.tool .actor/output_schema.json >/dev/null
          python -m json.tool .actor/dataset_schema.json >/dev/null
          python -m json.tool .actor/pay_per_event.json >/dev/null

      - name: Push and build Actor
        if: ${{ env.APIFY_TOKEN != '' }}
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ env.APIFY_TOKEN }}
          working-directory: commercial/apify-xguard
          build-tag: latest
          version: "1.0"

      - name: Verify Apify build result
        if: ${{ env.APIFY_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.push.outputs.build-status }}'
          echo "Apify build status: ${status}"
          [[ "$status" == 'SUCCEEDED' ]]

      - name: Publish to Store and configure pay-per-event pricing
        if: ${{ env.APIFY_TOKEN != '' }}
        working-directory: commercial/apify-xguard
        run: node scripts/configure-store.mjs

      - name: Record missing publication credential
        if: ${{ env.APIFY_TOKEN == '' }}
        run: |
          echo 'APIFY_TOKEN is not present in repository secrets. Actor code is validated but account-level publication cannot authenticate.'

      - name: Publish truthful Apify status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Apify publication did not complete'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -z "${APIFY_TOKEN:-}" ]]; then
            description='Apify account token is not configured'
          elif [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='XGuard Actor is published and pricing verified'
            target_url='https://apify.com/store'
          fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-apify-publication",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
