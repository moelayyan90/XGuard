name: Fix Universal Gateway Lint

on:
  push:
    branches:
      - agent/universal-gateway-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unused gateway import
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/worker/src/universal-gateway.ts';
          const source = fs.readFileSync(path, 'utf8');
          const next = source.replace('  gatewayEventKey,\n', '');
          if (next === source) throw new Error('expected unused import not found');
          fs.writeFileSync(path, next);
          NODE
      - name: Commit lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/universal-gateway.ts
          git commit -m "Remove unused universal gateway import"
          git push origin "HEAD:${GITHUB_REF_NAME}"
