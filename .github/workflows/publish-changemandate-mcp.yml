name: Publish ChangeMandate to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/changemandate/server.json"
      - ".github/workflows/publish-changemandate-mcp.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: changemandate-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate manifest shape
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('apps/changemandate/server.json', 'utf8'));
          if (x.name !== 'io.github.moelayyan90/changemandate') throw new Error('unexpected MCP namespace');
          if (x.version !== '1.0.0') throw new Error('unexpected MCP version');
          if (!Array.isArray(x.remotes) || x.remotes.length !== 1) throw new Error('one remote transport is required');
          if (x.remotes[0].type !== 'streamable-http') throw new Error('streamable-http is required');
          if (!x.remotes[0].url.startsWith('https://')) throw new Error('remote MCP URL must use https');
          NODE

      - name: Install pinned MCP Publisher
        run: |
          set -euo pipefail
          VERSION="1.8.1"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry https://registry.modelcontextprotocol.io

      - name: Publish ChangeMandate
        run: ./mcp-publisher publish apps/changemandate/server.json
