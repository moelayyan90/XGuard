name: Sync PR 154 with current main once

on:
  push:
    branches: [fix/mainnet-doc-entrypoints]

permissions:
  contents: write

concurrency:
  group: sync-pr154-main-once
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/mainnet-doc-entrypoints
      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm -f .github/workflows/sync-pr154-main-once.yml
          git add -A
          git commit -m 'Sync PR 154 with current main'
          git push origin HEAD:fix/mainnet-doc-entrypoints
