name: Debug Economic Firewall create

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/debug-economic-create.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Add preview-only exception detail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/economic-firewall.ts')
          s = p.read_text()
          old = '  return context.json({ error: "internal_error" }, 500);'
          new = '''  return context.json(\n    {\n      error: "internal_error",\n      debugName: error instanceof Error ? error.name : typeof error,\n      debugMessage: error instanceof Error ? error.message : String(error),\n    },\n    500,\n  );'''
          if old not in s:
              raise SystemExit('error response not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write apps/worker/src/economic-firewall.ts
      - name: Deploy and capture create exception
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          mkdir -p economic-create-debug
          CONFIG="apps/worker/wrangler.economic-preview.jsonc"
          npx wrangler deploy --config "$CONFIG" > economic-create-debug/deploy.txt 2>&1
          PREVIEW_TOKEN="$(node -e 'const {createHmac}=require("node:crypto"); process.stdout.write(createHmac("sha256", process.env.CLOUDFLARE_API_TOKEN).update("xguard-economic-preview-v1").digest("hex"));')"
          printf '%s' "$PREVIEW_TOKEN" | npx wrangler secret put PREVIEW_API_TOKEN --config "$CONFIG" > economic-create-debug/secret-put.txt 2>&1
          BASE_URL="https://xguard-economic-preview.maqamapp.workers.dev"
          for attempt in {1..12}; do
            STATUS="$(curl -sS -o economic-create-debug/health.json -w '%{http_code}' "$BASE_URL/healthz" || true)"
            if [[ "$STATUS" == "200" ]]; then break; fi
            sleep 5
          done
          EXPIRES_AT="$(node -e 'console.log(new Date(Date.now()+10*60*1000).toISOString())')"
          NONCE="$(node -e 'console.log(require("node:crypto").randomUUID())')"
          CREATE_BODY="$(node -e 'process.stdout.write(JSON.stringify({actorId:"ci-debug-agent",protocol:"preview",resource:{method:"GET",url:"https://example.com/",bodyHash:null},money:{maxAmountMicroUsd:0,currency:"USD",network:null,asset:null},expiresAt:process.argv[1],nonce:process.argv[2],metadataHash:null}))' "$EXPIRES_AT" "$NONCE")"
          CREATE_STATUS="$(curl -sS -o economic-create-debug/create.json -w '%{http_code}' -X POST "$BASE_URL/v1/intents" -H "Authorization: Bearer $PREVIEW_TOKEN" -H 'Content-Type: application/json' --data "$CREATE_BODY" || true)"
          printf '%s' "$CREATE_STATUS" > economic-create-debug/create-status.txt
      - name: Upload create debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-create-debug
          path: economic-create-debug
          if-no-files-found: error
