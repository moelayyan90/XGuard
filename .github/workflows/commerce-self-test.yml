name: XGuard inference mainnet self-test

on:
  pull_request:
    paths:
      - "apps/worker/src/inference-provider*.ts"
      - "apps/worker/migrations/0028_autonomous_inference_provider.sql"
      - "apps/worker/wrangler.mainnet.jsonc"
      - "scripts/validate-inference-provider.mjs"
      - "package.json"
      - ".github/workflows/commerce-self-test.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run inference:validate
