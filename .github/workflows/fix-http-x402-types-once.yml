name: Fix HTTP x402 bridge type guards once

on:
  push:
    branches:
      - feature/http-x402-v1-client-v2-resource-bridge

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/http-x402-v1-client-v2-resource-bridge
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('apps/worker/src/x402-http-compatibility-bridge.ts')
          source = source_path.read_text()
          old = '''  if (\n    !Number.isSafeInteger(raw.maxTimeoutSeconds) ||\n    raw.maxTimeoutSeconds <= 0\n  )\n    throw new Error("invalid_requirement_max_timeout_seconds");\n  const extra = raw.extra === undefined ? undefined : asRecord(raw.extra);\n  return {\n    scheme: "exact",\n    network: BASE_V2,\n    amount,\n    asset: raw.asset,\n    payTo,\n    maxTimeoutSeconds: raw.maxTimeoutSeconds,\n'''
          new = '''  if (\n    typeof raw.maxTimeoutSeconds !== "number" ||\n    !Number.isSafeInteger(raw.maxTimeoutSeconds) ||\n    raw.maxTimeoutSeconds <= 0\n  )\n    throw new Error("invalid_requirement_max_timeout_seconds");\n  const maxTimeoutSeconds = raw.maxTimeoutSeconds;\n  const extra = raw.extra === undefined ? undefined : asRecord(raw.extra);\n  return {\n    scheme: "exact",\n    network: BASE_V2,\n    amount,\n    asset: raw.asset,\n    payTo,\n    maxTimeoutSeconds,\n'''
          if old not in source:
              raise SystemExit('expected type-guard source block not found')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/x402-http-compatibility-bridge.test.ts')
          test = test_path.read_text()
          old_test = '''    const body = (await response.json()) as Record<string, unknown>;\n    expect(body.error).toBe("target_is_not_x402_v2");\n    expect(await response.clone().text()).not.toContain(\n      "private upstream content",\n    );\n'''
          new_test = '''    const body = (await response.json()) as Record<string, unknown>;\n    expect(body.error).toBe("target_is_not_x402_v2");\n    expect(JSON.stringify(body)).not.toContain("private upstream content");\n'''
          if old_test not in test:
              raise SystemExit('expected consumed-body test block not found')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - run: npx prettier --write apps/worker/src/x402-http-compatibility-bridge.ts tests/x402-http-compatibility-bridge.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/x402-http-compatibility-bridge.ts tests/x402-http-compatibility-bridge.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix x402 HTTP bridge type guards"
          git push
