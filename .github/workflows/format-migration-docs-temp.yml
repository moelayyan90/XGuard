name: Format migration docs once

on:
  push:
    branches: [agent/migrant-assistance-platform]
    paths:
      - docs/migration-openapi.yaml
      - scripts/check-docs.mjs
      - README.md
      - .github/workflows/format-migration-docs-temp.yml

permissions:
  contents: write

concurrency:
  group: format-migration-docs
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrant-assistance-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write README.md scripts/check-docs.mjs docs/migration-openapi.yaml
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md scripts/check-docs.mjs docs/migration-openapi.yaml; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/check-docs.mjs docs/migration-openapi.yaml
          git commit -m "Format migration documentation"
          git push origin HEAD:agent/migrant-assistance-platform
