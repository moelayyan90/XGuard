name: Diagnose live x402 compatibility responses

on:
  push:
    branches: [fix/live-x402-compatibility-verification]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts

      - name: Run legacy mainnet smoke alone
        shell: bash
        run: |
          set +e
          node scripts/smoke-mainnet.mjs > /tmp/mainnet-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/mainnet-smoke.log
          echo "MAINNET_SMOKE_EXIT=${status}"

      - name: Run compatibility smoke alone
        shell: bash
        run: |
          set +e
          node scripts/smoke-compatibility-mainnet.mjs > /tmp/compat-smoke.log 2>&1
          status=$?
          set -e
          cat /tmp/compat-smoke.log
          echo "COMPAT_SMOKE_EXIT=${status}"

      - name: Probe live compatibility bridge without billable execution
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xguard-mainnet.maqamapp.workers.dev'
          body='{"x402Version":1,"paymentPayload":{"x402Version":1,"scheme":"exact","network":"base","payload":{"signature":"0x2222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222","authorization":{"from":"0x857b06519E91e3A54538791bDbb0E22373e36b66","to":"0x209693Bc6afc0C5328bA36FaF03C514EF312287C","value":"10000","validAfter":"0","validBefore":"1999999999","nonce":"0x1111111111111111111111111111111111111111111111111111111111111111"}}},"paymentRequirements":{"scheme":"exact","network":"base","maxAmountRequired":"10000","resource":"https://example.com/xguard-compatibility-smoke","description":"Non-billable XGuard compatibility smoke request","mimeType":"application/json","payTo":"0x209693Bc6afc0C5328bA36FaF03C514EF312287C","maxTimeoutSeconds":60,"asset":"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913","extra":{"name":"USD Coin","version":"2"}}}'

          echo '=== SUPPORTED ==='
          curl -sS --max-time 15 -D /tmp/supported.headers "${BASE}/supported" -o /tmp/supported.body
          cat /tmp/supported.headers
          cat /tmp/supported.body

          echo '=== V1 VERIFY NO AUTH ==='
          code="$(curl -sS --max-time 15 -D /tmp/v1.headers -o /tmp/v1.body -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "${body}" "${BASE}/verify")"
          echo "HTTP=${code}"
          cat /tmp/v1.headers
          cat /tmp/v1.body

          echo '=== V1 WRONG NETWORK ==='
          wrong="${body//\"network\":\"base\"/\"network\":\"base-sepolia\"}"
          code="$(curl -sS --max-time 15 -D /tmp/wrong.headers -o /tmp/wrong.body -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "${wrong}" "${BASE}/verify")"
          echo "HTTP=${code}"
          cat /tmp/wrong.headers
          cat /tmp/wrong.body
