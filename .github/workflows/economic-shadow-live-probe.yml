name: Prove live Economic Firewall shadow observation

on:
  push:
    branches:
      - agent/economic-shadow-live-probe
    paths:
      - .github/workflows/economic-shadow-live-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-shadow-live-probe
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Capture one observe-only shadow event from live mainnet
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          mkdir -p shadow-proof

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare CI authorization unavailable" >&2
            exit 1
          fi

          REGISTER_STATUS="$(curl -sS -o register-private.json -w '%{http_code}' \
            -X POST "$BASE_URL/v1/register" \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"economic-shadow-probe-${GITHUB_RUN_ID}\"}")"
          [[ "$REGISTER_STATUS" == "201" ]]
          API_KEY="$(node -e 'const x=require("./register-private.json"); if(typeof x.apiKey!=="string"||x.apiKey.length<16) process.exit(1); process.stdout.write(x.apiKey)')"
          MERCHANT_ID="$(node -e 'const x=require("./register-private.json"); const id=x.merchant?.merchantId??x.merchant?.id; if(typeof id!=="string"||id.length<4) process.exit(1); process.stdout.write(id)')"
          rm -f register-private.json
          printf '%s' "$MERCHANT_ID" > shadow-proof/merchant-id.txt

          npx wrangler tail --help > tail-help.txt 2>&1
          TAIL_ARGS=(tail xguard-mainnet --format json)
          if grep -q -- '--search' tail-help.txt; then
            TAIL_ARGS+=(--search economic_firewall_shadow_bound)
          fi
          rm -f tail-help.txt

          timeout 40s npx wrangler "${TAIL_ARGS[@]}" > tail-private.log 2>&1 &
          TAIL_PID=$!
          sleep 7

          VALID_BEFORE="$(node -e 'process.stdout.write(String(Math.floor(Date.now()/1000)+3600))')"
          NONCE="0x$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          VERIFY_BODY="$(node - <<'NODE' "$VALID_BEFORE" "$NONCE"
          const validBefore = process.argv[2];
          const nonce = process.argv[3];
          const payer = "0x1111111111111111111111111111111111111111";
          const payTo = "0x2222222222222222222222222222222222222222";
          const asset = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";
          const requirements = {
            scheme: "exact",
            network: "eip155:8453",
            asset,
            amount: "1",
            payTo,
            maxTimeoutSeconds: 60,
            extra: {
              name: "USDC",
              version: "2",
              assetTransferMethod: "eip3009",
              paymentFlow: "authorization"
            }
          };
          const paymentPayload = {
            x402Version: 2,
            resource: {
              url: "https://example.com/economic-shadow-probe",
              description: "XGuard observe-only probe",
              mimeType: "application/json"
            },
            accepted: structuredClone(requirements),
            payload: {
              signature: `0x${"ab".repeat(65)}`,
              authorization: {
                from: payer,
                to: payTo,
                value: requirements.amount,
                validAfter: "0",
                validBefore,
                nonce
              }
            }
          };
          process.stdout.write(JSON.stringify({
            x402Version: 2,
            paymentPayload,
            paymentRequirements: requirements
          }));
          NODE
          )"

          VERIFY_STATUS="000"
          for attempt in 1 2 3; do
            VERIFY_STATUS="$(curl -sS -o shadow-proof/verify-response.json -w '%{http_code}' \
              -X POST "$BASE_URL/verify" \
              -H "Authorization: Bearer $API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$VERIFY_BODY" || true)"
            printf '%s' "$VERIFY_STATUS" > shadow-proof/verify-status.txt
            sleep 3
          done

          sleep 8
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          grep 'economic_firewall_shadow_bound' tail-private.log > shadow-proof/shadow-events.log || true
          rm -f tail-private.log

          if [[ ! -s shadow-proof/shadow-events.log ]]; then
            echo "No economic_firewall_shadow_bound event captured" >&2
            exit 1
          fi
          if ! grep -q '"operation":"verify"' shadow-proof/shadow-events.log; then
            echo "Shadow event did not identify verify operation" >&2
            exit 1
          fi
          if ! grep -q "$MERCHANT_ID" shadow-proof/shadow-events.log; then
            echo "Shadow event merchant did not match probe merchant" >&2
            exit 1
          fi

          printf '%s\n' '{"moneyMoved":false,"settleCalled":false,"shadowEventCaptured":true}' > shadow-proof/result.json
      - name: Upload sanitized shadow proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-economic-shadow-proof
          path: shadow-proof
          if-no-files-found: warn
