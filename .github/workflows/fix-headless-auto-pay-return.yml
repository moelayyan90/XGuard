name: Fix Headless Auto Pay Return

on:
  push:
    branches:
      - feature/headless-auto-pay

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/headless-auto-pay
      - name: Add explicit success return
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/sdk/src/auto-pay.ts')
          source = path.read_text()
          needle = '''    if (!decision.allow) {
              return {
                abort: true,
                reason: decision.reason ?? "XGuard blocked automated payment",
              };
            }
          });'''
          # Match the Prettier-formatted block without relying on indentation from YAML.
          old = '''    if (!decision.allow) {
      return {
        abort: true,
        reason: decision.reason ?? "XGuard blocked automated payment",
      };
    }
  });'''
          new = '''    if (!decision.allow) {
      return {
        abort: true,
        reason: decision.reason ?? "XGuard blocked automated payment",
      };
    }
    return undefined;
  });'''
          if old not in source:
              raise SystemExit('target block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sdk/src/auto-pay.ts
          git commit -m "Return explicitly after allowing automated payment"
          git push origin HEAD:feature/headless-auto-pay
