name: Diagnose Economic Firewall v2

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/diagnose-economic-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format check
        run: npm run format:check
      - name: Capture lint report
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: economic-v2-lint-report
          path: lint-output.txt
          if-no-files-found: error
      - name: Fail if lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
