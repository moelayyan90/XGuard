name: Auto-rollback XGuard mainnet

on:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  rollback:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Prove this is a post-deploy live-verification failure
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          verdict="$(printf '%s' "${jobs}" | node -e '
          let s = "";
          process.stdin.on("data", d => s += d).on("end", () => {
            const payload = JSON.parse(s);
            const steps = (payload.jobs || []).flatMap(job => job.steps || []);
            const deployed = steps.some(step =>
              step.name === "Deploy guarded production Worker" && step.conclusion === "success");
            const liveFailed = steps.some(step =>
              step.name === "Verify live mainnet readiness" && step.conclusion === "failure");
            process.stdout.write(deployed && liveFailed ? "rollback" : "skip");
          });
          ')"

          echo "verdict=${verdict}" >> "${GITHUB_OUTPUT}"
          if [[ "${verdict}" != "rollback" ]]; then
            echo "::notice::Failure did not prove a bad live deployment; automatic rollback is intentionally skipped."
          fi

      - name: Roll back the bad Cloudflare Worker version
        if: steps.gate.outputs.verdict == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare authorization is unavailable; refusing to claim a rollback occurred."
            exit 1
          fi

          echo "Current deployment before rollback:"
          npx wrangler deployments status --name xguard-mainnet --json
          npx wrangler rollback \
            --name xguard-mainnet \
            --message "XGuard automatic rollback after failed live verification for ${BAD_SHA}"
          echo "Deployment after rollback:"
          npx wrangler deployments status --name xguard-mainnet --json

      - name: Verify recovered mainnet
        if: steps.gate.outputs.verdict == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          recovered=0
          for attempt in {1..18}; do
            health_code="$(curl -sS --max-time 15 -o /tmp/xguard-health.json -w '%{http_code}' "${BASE_URL}/healthz" || true)"
            ready_code="$(curl -sS --max-time 15 -o /tmp/xguard-ready.json -w '%{http_code}' "${BASE_URL}/readyz" || true)"
            if [[ "${health_code}" == "200" && "${ready_code}" == "200" ]] \
              && node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/xguard-health.json","utf8"));const r=JSON.parse(fs.readFileSync("/tmp/xguard-ready.json","utf8"));if(h.status!=="ok"||r.status!=="ready")process.exit(1)'; then
              recovered=1
              break
            fi
            sleep 5
          done
          if [[ "${recovered}" -ne 1 ]]; then
            echo "::error::Rollback completed but XGuard did not recover readiness."
            exit 1
          fi
