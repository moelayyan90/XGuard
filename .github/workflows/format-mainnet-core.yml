name: Format mainnet core

on:
  push:
    branches: [mainnet/prepaid-live-gateway]
    paths:
      - "apps/worker/src/base-usdc.ts"
      - "apps/worker/src/mainnet-billing.ts"
      - "tests/worker/mainnet-billing.test.ts"
      - ".github/workflows/format-mainnet-core.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/prepaid-live-gateway
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/base-usdc.ts apps/worker/src/mainnet-billing.ts tests/worker/mainnet-billing.test.ts
      - name: Commit exact formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/base-usdc.ts apps/worker/src/mainnet-billing.ts tests/worker/mainnet-billing.test.ts
          git commit -m "Format mainnet billing core"
          git push origin HEAD:mainnet/prepaid-live-gateway
