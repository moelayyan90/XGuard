name: Format mainnet core

on:
  push:
    branches: [mainnet/prepaid-live-gateway]
    paths:
      - "apps/worker/src/base-usdc.ts"
      - "apps/worker/src/mainnet-billing.ts"
      - "tests/worker/mainnet-billing.test.ts"
      - ".github/workflows/format-mainnet-core.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/prepaid-live-gateway
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/base-usdc.ts apps/worker/src/mainnet-billing.ts tests/worker/mainnet-billing.test.ts
      - name: Show exact formatting diff
        run: git diff -- apps/worker/src/base-usdc.ts apps/worker/src/mainnet-billing.ts tests/worker/mainnet-billing.test.ts
