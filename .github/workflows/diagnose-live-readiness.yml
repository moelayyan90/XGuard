name: Diagnose live readiness

on:
  push:
    branches: [agent/diagnose-live-readiness]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live MCP discover
        shell: bash
        run: |
          set -u
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 15 \
            -X POST \
            -D "$headers" \
            -o "$body" \
            -w '%{http_code}' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"xguard-diagnostic","version":"1.0.0"}}}}' \
            "${BASE_URL}/mcp" || true)"
          echo "===== MCP server/discover HTTP ${code} ====="
          cat "$headers"; echo; cat "$body"; echo
