name: Diagnose live readiness

on:
  push:
    branches: [agent/diagnose-live-readiness]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture full production runtime failures
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -u
          : > /tmp/failed.log
          : > /tmp/errors.log
          (timeout 80s npx --yes wrangler@4.123.0 tail xguard-mainnet --format=json --search failed > /tmp/failed.log 2>&1 || true) &
          p1=$!
          (timeout 80s npx --yes wrangler@4.123.0 tail xguard-mainnet --format=json --status error > /tmp/errors.log 2>&1 || true) &
          p2=$!
          wait "$p1" || true
          wait "$p2" || true
          echo '===== EVENTS MATCHING failed ====='
          cat /tmp/failed.log
          echo '===== INVOCATIONS WITH ERROR OUTCOME ====='
          cat /tmp/errors.log
