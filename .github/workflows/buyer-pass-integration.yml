name: Buyer Pass integration

on:
  push:
    branches: [agent/buyer-pass]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/buyer-pass
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 .github/scripts/apply-buyer-pass.py
      - run: npx prettier --write apps/worker/src/buyer-pass.ts apps/worker/src/payment-decision.ts apps/worker/src/universal-mainnet.ts browser-extension/service-worker.js browser-extension/options.js browser-extension/options.html tests/buyer-pass.test.ts PAYMENT_DECISION.md
      - run: npm run verify:release
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/buyer-pass.ts apps/worker/src/payment-decision.ts apps/worker/src/universal-mainnet.ts browser-extension/service-worker.js browser-extension/options.js browser-extension/options.html tests/buyer-pass.test.ts apps/worker/migrations/0015_buyer_pass.sql PAYMENT_DECISION.md
          if ! git diff --cached --quiet; then
            git commit -m "Complete Buyer Pass payment-decision integration"
            git push origin HEAD:agent/buyer-pass
          fi
