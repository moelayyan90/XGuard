name: UtilityMesh Production Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/smoke-utilitymesh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live health and payment rail
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 10 https://api.xguardgate.com/healthz)"
          printf '%s' "$health" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              console.log(JSON.stringify({status:x.status,service:x.service,version:x.version,payment_ready:x.payment_ready,network:x.network,paid_endpoints:x.paid_endpoints}));
              if(x.status!=="ok"||x.service!=="XGuard UtilityMesh"||x.payment_ready!==true||x.paid_endpoints!==15) process.exit(1);
            });'
          code="$(curl --silent --show-error --max-time 10 -D /tmp/xg-h -o /tmp/xg-b -w '%{http_code}' https://api.xguardgate.com/v1/chain/base/block)"
          echo "paid_endpoint_http_status=${code}"
          test "$code" = "402"
          grep -qi '^payment-required:' /tmp/xg-h
          node - <<'NODE'
          const fs=require('node:fs');
          const hdr=fs.readFileSync('/tmp/xg-h','utf8').split(/\r?\n/).find(x=>/^payment-required:/i.test(x));
          if(!hdr) throw new Error('payment-required header missing');
          const raw=hdr.replace(/^[^:]+:\s*/,'').trim();
          let p; try { p=JSON.parse(Buffer.from(raw,'base64').toString('utf8')); } catch(e) { throw new Error('payment-required header is not valid base64 JSON'); }
          const a=Array.isArray(p.accepts)?p.accepts[0]:null;
          console.log(JSON.stringify({x402Version:p.x402Version,network:a?.network,scheme:a?.scheme,payTo_present:Boolean(a?.payTo),amount_present:Boolean(a?.amount||a?.maxAmountRequired)}));
          if(p.x402Version!==2 || a?.network!=='eip155:8453' || a?.scheme!=='exact' || !a?.payTo) process.exit(1);
          NODE
