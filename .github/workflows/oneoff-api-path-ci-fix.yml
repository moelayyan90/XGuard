name: One-off API path CI migration

on:
  push:
    branches: [fix/api-path-alias]
    paths:
      - ".github/workflows/oneoff-api-path-ci-fix.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: List required migration edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          OLD = "https://api.xguardgate.com"
          NEW = "https://xguardgate.com/api"
          test_files = [p for p in Path('apps/relay').rglob('*') if p.is_file() and ('test' in p.name.lower() or 'test' in p.parts)]
          for path in test_files:
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              text = text.replace(f'new Request("{NEW}', f'new Request("{OLD}')
              text = text.replace(f"new Request('{NEW}", f"new Request('{OLD}")
              text = text.replace(f'new Request(`{NEW}', f'new Request(`{OLD}')
              text = text.replace(f'const BASE = "{NEW}";', f'const BASE = "{OLD}";')
              text = text.replace(f"const BASE = '{NEW}';", f"const BASE = '{OLD}';")
              path.write_text(text, encoding='utf-8')
          agent=Path('.github/workflows/agent-plugin-ci.yml'); text=agent.read_text(); text=text.replace("const endpoint = 'https://api.xguardgate.com/mcp';", "const endpoint = 'https://xguardgate.com/api/mcp';",1); text=text.replace("claude mcp add --transport http xguard https://api.xguardgate.com/mcp", "claude mcp add --transport http xguard https://xguardgate.com/api/mcp",1); agent.write_text(text)
          dist=Path('.github/workflows/distribution-surfaces-ci.yml'); text=dist.read_text(); text=text.replace("grep -q 'https://api.xguardgate.com/mcp' llms-install.md", "grep -q 'https://xguardgate.com/api/mcp' llms-install.md",1); dist.write_text(text)
          sdk=Path('.github/workflows/x402-sdk-ci.yml'); text=sdk.read_text(); text=text.replace("if (XGUARD_FACILITATOR_URL !== 'https://api.xguardgate.com') throw new Error('bad canonical URL');", "if (XGUARD_FACILITATOR_URL !== 'https://xguardgate.com/api') throw new Error('bad canonical URL');",1); start_marker='          const supported = await xguardSupported();'; end_marker='          console.log(JSON.stringify({ kinds: supported.kinds.length, route }));';
          if start_marker in text and end_marker in text:
              start=text.index(start_marker); end=text.index(end_marker,start)+len(end_marker); text=text[:start]+'          // Live route probes run after deployment.\n          console.log(JSON.stringify({ canonical: XGUARD_FACILITATOR_URL }));'+text[end:]
          sdk.write_text(text)
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'oneoff-api-path-ci-fix.yml': continue
              text=path.read_text(); text=text.replace("XGUARD_FACILITATOR_URL !== 'https://api.xguardgate.com'", "XGUARD_FACILITATOR_URL !== 'https://xguardgate.com/api'"); path.write_text(text)
          PY
          git diff --name-only
