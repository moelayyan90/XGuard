name: One-off API path CI migration

on:
  push:
    branches: [fix/api-path-alias]
    paths:
      - ".github/workflows/oneoff-api-path-ci-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --prefix apps/relay --no-audit --no-fund

      - name: Separate public canonical URL from internal test origin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD = "https://api.xguardgate.com"
          NEW = "https://xguardgate.com/api"

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if 'test' not in path.name.lower():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if NEW in text:
                  path.write_text(text.replace(NEW, OLD), encoding='utf-8')

          agent = Path('.github/workflows/agent-plugin-ci.yml')
          text = agent.read_text(encoding='utf-8')
          text = text.replace("const endpoint = 'https://api.xguardgate.com/mcp';", "const endpoint = 'https://xguardgate.com/api/mcp';", 1)
          text = text.replace("claude mcp add --transport http xguard https://api.xguardgate.com/mcp", "claude mcp add --transport http xguard https://xguardgate.com/api/mcp", 1)
          agent.write_text(text, encoding='utf-8')

          dist = Path('.github/workflows/distribution-surfaces-ci.yml')
          text = dist.read_text(encoding='utf-8')
          text = text.replace("grep -q 'https://api.xguardgate.com/mcp' llms-install.md", "grep -q 'https://xguardgate.com/api/mcp' llms-install.md", 1)
          dist.write_text(text, encoding='utf-8')

          sdk = Path('.github/workflows/x402-sdk-ci.yml')
          text = sdk.read_text(encoding='utf-8')
          text = text.replace("if (XGUARD_FACILITATOR_URL !== 'https://api.xguardgate.com') throw new Error('bad canonical URL');", "if (XGUARD_FACILITATOR_URL !== 'https://xguardgate.com/api') throw new Error('bad canonical URL');", 1)
          start = text.index('          const supported = await xguardSupported();')
          end_marker = '          console.log(JSON.stringify({ kinds: supported.kinds.length, route }));'
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + '''          // Live probes run after deployment; PR CI validates the package contract.\n          console.log(JSON.stringify({ canonical: XGUARD_FACILITATOR_URL }));''' + text[end:]
          sdk.write_text(text, encoding='utf-8')

          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'oneoff-api-path-ci-fix.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace("XGUARD_FACILITATOR_URL !== 'https://api.xguardgate.com'", "XGUARD_FACILITATOR_URL !== 'https://xguardgate.com/api'")
              path.write_text(text, encoding='utf-8')
          PY

          node --check apps/relay/src/discovery-entry.js
          node --check apps/relay/src/product-entry.js
          node --test apps/relay/src/entry-test.js
          node --test apps/relay/src/action-rail-test.js
          node --test apps/relay/src/egress-vault-test.js
          node --test apps/relay/src/product-entry-test.js
          node apps/relay/test/public-metadata.mjs

      - name: Commit CI-aligned migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/oneoff-api-path-ci-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: align API path tests and CI contracts"
          git push origin HEAD:fix/api-path-alias
