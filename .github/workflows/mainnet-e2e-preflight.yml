name: Mainnet E2E funding probe

on:
  push:
    branches: [test/mainnet-e2e-live]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
      OKX_API_BASE_URL: ${{ vars.OKX_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe OKX funding and API permissions without moving funds
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHmac } = await import('node:crypto');
          const baseUrlRaw = (process.env.OKX_API_BASE_URL || 'https://openapi.okx.com').trim();
          const baseUrl = new URL(baseUrlRaw);
          const allowedHosts = new Set(['openapi.okx.com','www.okx.com','us.okx.com','eea.okx.com','tr.okx.com']);
          if (baseUrl.protocol !== 'https:' || !allowedHosts.has(baseUrl.hostname)) throw new Error('untrusted_okx_host');
          async function okxGet(path) {
            const ts = new Date().toISOString();
            const sig = createHmac('sha256', process.env.OKX_API_SECRET).update(`${ts}GET${path}`).digest('base64');
            const r = await fetch(`${baseUrl.origin}${path}`, {headers:{
              'OK-ACCESS-KEY':process.env.OKX_API_KEY,
              'OK-ACCESS-SIGN':sig,
              'OK-ACCESS-TIMESTAMP':ts,
              'OK-ACCESS-PASSPHRASE':process.env.OKX_API_PASSPHRASE,
              'content-type':'application/json',
            }});
            const p = await r.json();
            if (!r.ok || p.code !== '0' || !Array.isArray(p.data)) throw new Error(`okx_read_failed_${r.status}_${p.code}`);
            return p.data;
          }
          const [configRows, currencyRows, fundingRows, tradingRows] = await Promise.all([
            okxGet('/api/v5/account/config'),
            okxGet('/api/v5/asset/currencies?ccy=USDC'),
            okxGet('/api/v5/asset/balances?ccy=USDC,USDT'),
            okxGet('/api/v5/account/balance?ccy=USDC,USDT'),
          ]);
          const cfg = configRows[0] || {};
          const perms = String(cfg.perm || '').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
          const baseUsdc = currencyRows.find(x => String(x.chain||'').toLowerCase().endsWith('-base'));
          if (!baseUsdc) throw new Error('okx_usdc_base_missing');
          const needed = Number(baseUsdc.minWd || 0) + Number(baseUsdc.fee || 0);
          const funding = new Map(fundingRows.map(x => [String(x.ccy||'').toUpperCase(), Number(x.availBal ?? x.bal ?? 0)]));
          const details = Array.isArray(tradingRows[0]?.details) ? tradingRows[0].details : [];
          const trading = new Map(details.map(x => [String(x.ccy||'').toUpperCase(), Number(x.availBal ?? x.cashBal ?? 0)]));
          const enough = (value) => Number.isFinite(value) && value >= needed;
          console.log(JSON.stringify({
            event:'mainnet_e2e_funding_probe',
            requiredToWithdrawMinimumUsdc:String(needed),
            apiCanWithdraw:perms.includes('withdraw'),
            apiCanTrade:perms.includes('trade'),
            fundingUsdcEnough:enough(funding.get('USDC')||0),
            tradingUsdcEnough:enough(trading.get('USDC')||0),
            fundingUsdtEnough:enough(funding.get('USDT')||0),
            tradingUsdtEnough:enough(trading.get('USDT')||0),
          }));
          NODE
