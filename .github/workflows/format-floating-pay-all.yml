name: Format Floating Pay All

on:
  push:
    branches:
      - feature/floating-pay-all

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/floating-pay-all
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write browser-extension/content.js browser-extension/service-worker.js
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/content.js browser-extension/service-worker.js
          git commit -m "Format floating Pay All extension"
          git push origin HEAD:feature/floating-pay-all
