name: Sanitized Cloudflare Observability Audit

on:
  push:
    branches:
      - audit/cloudflare-observability-20260826

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Query sanitized xguard-mainnet telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) {
            console.log('AUDIT_UNAVAILABLE missing_cloudflare_credentials');
            process.exit(0);
          }

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`;
          const to = Date.now();
          const from = to - 24 * 60 * 60 * 1000;
          const pageLimit = 250;
          const maxPages = 20;

          const clean = (value, max = 180) => String(value || '')
            .replace(/https?:\/\/[^\s"']+/gi, '[url]')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[email]')
            .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, '[ip]')
            .replace(/\b[a-f0-9]{24,}\b/gi, '[id]')
            .replace(/\b[A-Za-z0-9_-]{40,}\b/g, '[token]')
            .replace(/\?.*$/, '')
            .slice(0, max);

          const hash = value => crypto.createHash('sha256').update(String(value || '')).digest('hex').slice(0, 12);
          const groups = new Map();
          let returned = 0;
          let totalMatching = null;
          let offset;

          for (let page = 0; page < maxPages; page++) {
            const body = {
              queryId: 'xguard-observability-audit',
              timeframe: { from, to },
              view: 'events',
              limit: pageLimit,
              dry: true,
              parameters: {
                filterCombination: 'and',
                filters: [
                  { key: '$metadata.service', operation: 'eq', type: 'string', value: 'xguard-mainnet' }
                ]
              }
            };
            if (offset) {
              body.offset = offset;
              body.offsetDirection = 'next';
            }

            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json'
              },
              body: JSON.stringify(body)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) {
              const reason = clean((data.errors || []).map(x => x?.message).filter(Boolean).join(' | '), 220) || `http_${response.status}`;
              console.log(`AUDIT_UNAVAILABLE status=${response.status} reason=${reason}`);
              process.exit(0);
            }

            const result = data.result || data;
            const eventBlock = result.events || {};
            const events = Array.isArray(eventBlock.events) ? eventBlock.events : [];
            if (totalMatching == null && Number.isFinite(eventBlock.count)) totalMatching = eventBlock.count;
            if (!events.length) break;

            returned += events.length;
            for (const event of events) {
              const md = event?.$metadata || {};
              const wk = event?.$workers || {};
              const level = clean(md.level || 'unknown', 30).toLowerCase();
              const outcome = clean(wk.outcome || 'unknown', 40).toLowerCase();
              const status = Number.isFinite(md.statusCode) ? String(md.statusCode) : 'none';
              const eventType = clean(wk.eventType || md.origin || 'unknown', 50);
              const trigger = clean(md.trigger || '', 120);
              const isProblem = level === 'error' || level === 'warn' || (outcome && !['ok', 'success', 'unknown'].includes(outcome)) || (Number(status) >= 500);
              if (!isProblem) continue;

              const template = md.errorTemplate || md.messageTemplate || '';
              const signature = template ? clean(template, 180) : `hash:${hash(md.error || md.message || trigger || `${level}|${outcome}|${status}|${eventType}`)}`;
              const key = JSON.stringify({ level, outcome, status, eventType, trigger, signature });
              groups.set(key, (groups.get(key) || 0) + 1);
            }

            const last = events[events.length - 1];
            const next = last?.$metadata?.id;
            if (!next || next === offset || events.length < pageLimit) break;
            offset = next;
          }

          console.log(`AUDIT_OK window_hours=24 total_matching=${totalMatching ?? 'unknown'} events_scanned=${returned} problem_groups=${groups.size}`);
          const rows = [...groups.entries()]
            .map(([key, count]) => ({ ...JSON.parse(key), count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 100);
          for (const row of rows) {
            console.log(`PROBLEM count=${row.count} level=${row.level} outcome=${row.outcome} status=${row.status} type=${row.eventType} trigger=${JSON.stringify(row.trigger)} signature=${JSON.stringify(row.signature)}`);
          }
          NODE
