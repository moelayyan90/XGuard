name: Probe Base RPC from Cloudflare once

on:
  push:
    branches: [agent/rpc-provider-probe]
    paths:
      - ".github/workflows/probe-base-rpc-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Deploy and run temporary Cloudflare RPC probe
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cleanup() {
            npx --yes wrangler@4.123.0 delete xguard-rpc-probe --force >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          cat > "$work/index.js" <<'JS'
          const providers = [
            "https://mainnet.base.org",
            "https://base.drpc.org",
            "https://base-rpc.publicnode.com",
          ];
          const USDC = "0x833589fCD6eDb6E08f4c7C32D4f71b54BDa02913";
          const TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
          const TREASURY = "0x4f32f8fe1ee3e9f5c5a6587dc019a13bb453ba07";
          const topicTo = `0x${"0".repeat(24)}${TREASURY.slice(2).toLowerCase()}`;

          async function rpc(url, method, params) {
            const started = Date.now();
            try {
              const r = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
                redirect: "manual",
              });
              const text = await r.text();
              let payload = null;
              try { payload = JSON.parse(text); } catch {}
              return {
                status: r.status,
                ms: Date.now() - started,
                ok: r.ok && payload && payload.error === undefined && "result" in payload,
                error: payload && payload.error ? payload.error : null,
                result: payload && "result" in payload ? payload.result : null,
              };
            } catch (e) {
              return { status: 0, ms: Date.now() - started, ok: false, error: String(e), result: null };
            }
          }

          export default {
            async fetch() {
              const out = [];
              for (const url of providers) {
                const attempts = [];
                for (let i = 0; i < 6; i++) {
                  const finalized = await rpc(url, "eth_getBlockByNumber", ["finalized", false]);
                  let logs = null;
                  if (finalized.ok && finalized.result && finalized.result.number) {
                    const block = finalized.result.number;
                    logs = await rpc(url, "eth_getLogs", [{
                      fromBlock: block,
                      toBlock: block,
                      address: USDC,
                      topics: [TRANSFER, null, topicTo],
                    }]);
                  }
                  attempts.push({
                    round: i + 1,
                    finalized: { status: finalized.status, ok: finalized.ok, ms: finalized.ms, error: finalized.error },
                    logs: logs ? { status: logs.status, ok: logs.ok, ms: logs.ms, error: logs.error } : null,
                  });
                }
                out.push({ url, attempts });
              }
              return new Response(JSON.stringify(out, null, 2), {
                headers: { "Content-Type": "application/json" },
              });
            },
          };
          JS

          cat > "$work/wrangler.jsonc" <<'JSON'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "xguard-rpc-probe",
            "main": "index.js",
            "compatibility_date": "2026-08-14",
            "workers_dev": true
          }
          JSON

          npx --yes wrangler@4.123.0 deploy --config "$work/wrangler.jsonc"

          probe_url="https://xguard-rpc-probe.maqamapp.workers.dev/"
          body=""
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 120 -w $'\n%{http_code}' "${probe_url}?attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]]; then
              printf '%s\n' "${body}"
              exit 0
            fi
            sleep 5
          done
          echo "RPC probe did not propagate"
          printf '%s\n' "${body}"
          exit 1
