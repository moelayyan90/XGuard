name: Fix mainnet billing tests

on:
  push:
    branches: [mainnet/prepaid-live-gateway]
    paths:
      - ".github/workflows/fix-mainnet-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/prepaid-live-gateway
      - name: Use the exact credited balance in fee assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/worker/mainnet-billing.test.ts")
          s = p.read_text()
          s = s.replace("availableMicroUsd: 18_000", "availableMicroUsd: created.balance.availableMicroUsd - 2_000")
          s = s.replace("availableMicroUsd: 20_000", "availableMicroUsd: created.balance.availableMicroUsd")
          p.write_text(s)
          PY
          npx prettier --write tests/worker/mainnet-billing.test.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/worker/mainnet-billing.test.ts
          git commit -m "Align billing tests with exact credited top-up amounts"
          git push origin HEAD:mainnet/prepaid-live-gateway
