name: Regenerate Worker types

on:
  push:
    branches:
      - agent/complete-agent-discovery-stack

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[worker-types-regenerated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-agent-discovery-stack
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate Cloudflare bindings
        run: npm --workspace @xguard/worker run types
      - name: Verify generated bindings
        run: npm --workspace @xguard/worker run types -- --check
      - name: Commit generated bindings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xguard-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/worker-configuration.d.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate Cloudflare Worker types [worker-types-regenerated]"
          git push origin HEAD:agent/complete-agent-discovery-stack
