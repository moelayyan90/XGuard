name: Detect first real XGuard settlement

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: xguard-first-real-settlement
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read private settlement truth from production D1
        id: truth
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          ACCOUNT="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n[:space:]')"

          if [[ -z "$TOKEN" || -z "$ACCOUNT" ]]; then
            echo "::error::Cloudflare credentials required for private settlement accounting are unavailable."
            exit 1
          fi

          DATABASES_JSON="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/d1/database?name=xguard-mainnet&per_page=10")"

          DB_ID="$(printf '%s' "$DATABASES_JSON" | jq -r '
            if .success == true then
              ([.result[] | select(.name == "xguard-mainnet") | .uuid][0] // empty)
            else empty end
          ')"
          if [[ -z "$DB_ID" ]]; then
            echo "::error::Production D1 database xguard-mainnet could not be resolved."
            exit 1
          fi

          SQL="SELECT
            COUNT(*) AS successful_billable_settlements,
            COALESCE(SUM(fee_micro_usd), 0) AS earned_micro_usd,
            (SELECT COUNT(*) FROM settlement_finality_jobs WHERE state='PENDING') AS pending_finality,
            (SELECT COUNT(*) FROM settlement_recovery_jobs WHERE state='PENDING') AS pending_recovery
          FROM usage_events
          WHERE kind='SUCCESSFUL_BILLABLE_SETTLEMENT';"
          BODY="$(jq -cn --arg sql "$SQL" '{sql:$sql}')"

          QUERY_JSON="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "$BODY" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/d1/database/${DB_ID}/query")"

          ROW="$(printf '%s' "$QUERY_JSON" | jq -cer '
            if .success == true and (.result | type == "array") and (.result | length > 0)
              and (.result[0].success == true) and (.result[0].results | type == "array")
              and (.result[0].results | length > 0)
            then .result[0].results[0]
            else error("invalid_d1_query_response") end
          ')"

          COUNT="$(printf '%s' "$ROW" | jq -r '.successful_billable_settlements')"
          EARNED="$(printf '%s' "$ROW" | jq -r '.earned_micro_usd')"
          PENDING_FINALITY="$(printf '%s' "$ROW" | jq -r '.pending_finality')"
          PENDING_RECOVERY="$(printf '%s' "$ROW" | jq -r '.pending_recovery')"

          for value in "$COUNT" "$EARNED" "$PENDING_FINALITY" "$PENDING_RECOVERY"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::Production D1 returned an invalid settlement-accounting value."
              exit 1
            fi
          done

          DETECTED=false
          if (( COUNT > 0 && EARNED > 0 )); then
            DETECTED=true
            echo "FIRST_REAL_SETTLEMENT_DETECTED"
          else
            echo "NO_REAL_SETTLEMENT_YET"
          fi

          echo "detected=${DETECTED}" >> "$GITHUB_OUTPUT"
          {
            echo "## XGuard private settlement truth"
            echo
            if [[ "$DETECTED" == "true" ]]; then
              echo "**FIRST_REAL_SETTLEMENT_DETECTED**"
            else
              echo "**NO_REAL_SETTLEMENT_YET**"
            fi
            echo
            echo "Financial counters remain private; this workflow exposes only the existence signal."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create one-time first-settlement evidence issue
        if: ${{ steps.truth.outputs.detected == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "XGuard: first real mainnet settlement detected";

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });

            if (issues.some((issue) => issue.title === title)) {
              core.info("First-settlement evidence issue already exists; no duplicate created.");
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "# First real XGuard mainnet settlement detected",
              "",
              "The private production D1 accounting source has recorded at least one `SUCCESSFUL_BILLABLE_SETTLEMENT` with earned XGuard revenue.",
              "",
              `- workflow evidence: ${runUrl}`,
              "- financial counters: intentionally private",
              "",
              "This issue is created once and does not expose merchant, payer, transaction, balance, or revenue values.",
            ].join("\n");

            await github.rest.issues.create({ owner, repo, title, body });
