name: Format typed migration test

on:
  push:
    branches:
      - agent/safe-conversion-engine
    paths:
      - ".github/workflows/format-migration-test-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx prettier tests/migration-kit.test.ts --write
      - name: Commit and rebase formatted test
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/migration-kit.test.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/migration-kit.test.ts
          git commit -m "style: format typed migration kit test"
          git fetch origin agent/safe-conversion-engine
          git rebase origin/agent/safe-conversion-engine
          git push origin HEAD:agent/safe-conversion-engine
