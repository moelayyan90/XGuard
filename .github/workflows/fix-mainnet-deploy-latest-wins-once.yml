name: Fix mainnet deploy latest wins once

on:
  push:
    branches:
      - fix/mainnet-deploy-latest-wins

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mainnet-deploy-latest-wins
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Make newest mainnet deploy win
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-mainnet.yml')
          s = p.read_text()
          old = 'concurrency:\n  group: xguard-mainnet-deploy\n  cancel-in-progress: false'
          new = 'concurrency:\n  group: xguard-mainnet-deploy\n  cancel-in-progress: true'
          if old not in s:
              raise SystemExit('mainnet concurrency block not found')
          p.write_text(s.replace(old, new, 1))
          Path('tests/mainnet-deploy-concurrency.test.ts').write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst workflow = readFileSync(".github/workflows/deploy-mainnet.yml", "utf8");\n\ndescribe("mainnet deployment concurrency", () => {\n  it("cancels stale deploys so the newest main commit wins", () => {\n    expect(workflow).toContain("group: xguard-mainnet-deploy");\n    expect(workflow).toContain("cancel-in-progress: true");\n    expect(workflow).not.toContain("cancel-in-progress: false");\n  });\n});\n''')
          PY
          npx prettier --write .github/workflows/deploy-mainnet.yml tests/mainnet-deploy-concurrency.test.ts
          rm .github/workflows/fix-mainnet-deploy-latest-wins-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-mainnet.yml tests/mainnet-deploy-concurrency.test.ts .github/workflows/fix-mainnet-deploy-latest-wins-once.yml
          git commit -m "Make newest mainnet deployment win"
          git push origin HEAD:fix/mainnet-deploy-latest-wins
