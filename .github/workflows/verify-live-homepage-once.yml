name: Verify live homepage once

on:
  push:
    branches: [pivot/eudr-network]

permissions:
  contents: read
  statuses: write

jobs:
  verify-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live XGuard homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://xguardgate.com/?homepage-check=59b27030' -o /tmp/home.html
          grep -Fq 'XGuard — Cross-Border Operations, Executed' /tmp/home.html
          grep -Fq 'Your company has work that' /tmp/home.html
          grep -Fq 'smart cross-border operations employee' /tmp/home.html
          grep -Fq 'Request a pilot' /tmp/home.html
          grep -Fq 'Mood has no place in the workflow' /tmp/home.html
          echo 'LIVE_HOMEPAGE=OPERATIONS'
          sed -n '1,28p' /tmp/home.html

      - name: Publish live homepage status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard operations homepage verification failed'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='XGuard operations homepage is live'
          fi
          node - "$state" "$description" <<'NODE' > /tmp/status.json
          const [state, description] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({state,context:'xguard-homepage-live',description,target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
