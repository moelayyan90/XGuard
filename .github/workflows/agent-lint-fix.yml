name: Fix Bazaar lint

on:
  push:
    branches:
      - agent/complete-agent-discovery-stack

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-agent-discovery-stack
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Replace control-character regex with code-point check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet-bazaar.ts')
          s = p.read_text()
          old = '!/[\\u0000-\\u001F\\u007F]/.test(value) &&'
          new = '!hasAsciiControlCharacters(value) &&'
          if old not in s:
              raise SystemExit('target regex not found')
          s = s.replace(old, new, 1)
          marker = '\nfunction isForbiddenHost(hostname: string): boolean {'
          helper = '''\nfunction hasAsciiControlCharacters(value: string): boolean {\n  for (const character of value) {\n    const code = character.codePointAt(0);\n    if (code !== undefined && (code < 0x20 || code === 0x7f)) return true;\n  }\n  return false;\n}\n'''
          if marker not in s:
              raise SystemExit('helper insertion point not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          npx prettier --write apps/worker/src/mainnet-bazaar.ts
          npm run lint
          npm run typecheck
          npx vitest run tests/mainnet-bazaar.test.ts
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xguard-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet-bazaar.ts
          git commit -m "fix: avoid control-character regex lint violation [lint-fixed]"
          git push origin HEAD:agent/complete-agent-discovery-stack
