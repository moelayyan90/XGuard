name: Patch auto invoke pre-auth once

on:
  push:
    branches: [agent/zero-study-auto-invoke-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-study-auto-invoke-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-auto-invoke-preauth.mjs
      - run: npx prettier --write apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts
      - run: npx vitest run tests/auto-invoke.test.ts
      - run: npm run typecheck
      - name: Commit hardened auto-invoke
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts
          git commit -m "Authenticate before auto-invoke model inference"
          git push origin HEAD:agent/zero-study-auto-invoke-v2
