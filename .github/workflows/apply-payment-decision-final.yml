name: Apply final payment decision hardening

on:
  push:
    branches:
      - agent/buyer-side-payment-decision
    paths:
      - .github/workflows/apply-payment-decision-final.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/buyer-side-payment-decision
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply deterministic hardening
        run: python .github/scripts/harden-payment-decision.py
      - name: Format changed surfaces
        run: |
          npx prettier --write apps/worker/src/payment-decision.ts apps/worker/src/agent-discovery-modern.ts browser-extension/service-worker.js tests/browser-payment-surface-source.test.ts tests/mainnet-mcp-modern.test.ts tests/agent-discovery-modern.test.ts
      - name: Run full release verification
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run verify:release
      - name: Publish verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/apply-payment-decision-final.yml
          git rm -f --ignore-unmatch .github/workflows/apply-payment-decision-hardening-v4.yml
          git rm -f --ignore-unmatch .github/workflows/apply-payment-decision-hardening-v3.yml
          git rm -f --ignore-unmatch .github/workflows/apply-payment-decision-hardening-v2.yml
          git rm -f --ignore-unmatch .github/workflows/patch-payment-decision.yml
          git rm -f --ignore-unmatch .github/scripts/harden-payment-decision.py
          git add apps/worker/src/payment-decision.ts apps/worker/src/agent-discovery-modern.ts browser-extension/service-worker.js tests/browser-payment-surface-source.test.ts tests/mainnet-mcp-modern.test.ts tests/agent-discovery-modern.test.ts
          git commit -m "Complete buyer and agent payment decision layer"
          git push origin HEAD:agent/buyer-side-payment-decision
