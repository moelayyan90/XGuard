name: Patch operations copy once

on:
  push:
    branches: [pivot/eudr-network]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pivot/eudr-network
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/eudr-smart-employee-site.ts')
          s = p.read_text()
          s = s.replace('Cross-border operations, executed</div><h1>', 'smart cross-border operations employee · Cross-border operations, executed</div><h1>')
          s = s.replace('Machines do not get tired. Deadlines do not care about workload.', 'The system does not get tired. Deadlines do not care about workload.')
          s = s.replace('Automation does not replace legal responsibility or professional judgment. It replaces avoidable repetition:', 'Mood has no place in the workflow. Automation does not replace legal responsibility or professional judgment. It replaces avoidable repetition:')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/eudr-smart-employee-site.ts
          git commit -m "copy: restore core operations positioning"
          git push origin HEAD:pivot/eudr-network
