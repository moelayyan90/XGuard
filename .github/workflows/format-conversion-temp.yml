name: Format conversion branch

on:
  push:
    branches:
      - agent/conversion-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format conversion files
        run: npx prettier apps/worker/src/agent-discovery-modern.ts apps/worker/src/mainnet-modern.ts scripts/conversion-engine.mjs --write
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/worker/src/agent-discovery-modern.ts apps/worker/src/mainnet-modern.ts scripts/conversion-engine.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/agent-discovery-modern.ts apps/worker/src/mainnet-modern.ts scripts/conversion-engine.mjs
          git commit -m "style: format conversion engine"
          git push origin HEAD:agent/conversion-engine
