name: Pin XGuard Commercial Domains

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy XGuard Autonomous AI Inference Provider"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xguard-canonical-domain-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Rebind canonical and legacy domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/rebind-worker-domains.mjs \
            xguardgate.com=xguard-web-extractor \
            www.xguardgate.com=xguard-web-extractor \
            extract.xguardgate.com=xguard-web-extractor \
            inference.xguardgate.com=xguard-mainnet \
            legacy.xguardgate.com=xguard-mainnet

      - name: Verify canonical product identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "https://xguardgate.com/healthz?pin=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const x=require("/tmp/health.json");if(x.service!=="xguard-web-extractor"||x.live!==true)process.exit(1)'; then exit 0; fi
            sleep 4
          done
          cat /tmp/health.json || true
          exit 1
