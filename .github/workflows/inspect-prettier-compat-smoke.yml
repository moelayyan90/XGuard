name: Inspect compatibility smoke formatting

on:
  push:
    branches: [fix/live-x402-compatibility-verification]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-x402-compatibility-verification
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Print canonical smoke file
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/smoke-compatibility-mainnet.mjs >/dev/null
          echo '---CANONICAL-BEGIN---'
          cat scripts/smoke-compatibility-mainnet.mjs
          echo '---CANONICAL-END---'
