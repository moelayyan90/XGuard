name: Sync economic audit with current main

on:
  push:
    branches: [agent/economic-firewall-audit-mode]

permissions:
  contents: write

concurrency:
  group: sync-economic-audit-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/economic-firewall-audit-mode
      - name: Merge current main and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm -f .github/workflows/sync-economic-audit-main.yml
          git add -A
          git commit -m 'Sync economic audit mode with current main'
          git push origin HEAD:agent/economic-firewall-audit-mode
