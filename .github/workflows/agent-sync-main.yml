name: Integrate latest main discovery code

on:
  push:
    branches:
      - agent/complete-agent-discovery-stack

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[integrated-main-code]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-agent-discovery-stack
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Integrate non-workflow discovery changes from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xguard-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git show origin/main:apps/worker/src/discovery.ts > apps/worker/src/discovery.ts
          git show origin/main:apps/worker/src/mainnet-entry.ts > apps/worker/src/mainnet-entry.ts
          git show origin/main:tests/discovery.test.ts > tests/discovery.test.ts

          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet-edge.ts')
          s = p.read_text()
          s = s.replace('} from "./mainnet.js";', '} from "./mainnet-entry.js";', 1)
          discovery_import = 'import { discoveryResponse } from "./discovery.js";\n'
          if discovery_import not in s:
              marker = 'import { parseMainnetFacilitatorRequest } from "./mainnet-protocol.js";\n'
              if marker not in s:
                  raise SystemExit('mainnet protocol import marker not found')
              s = s.replace(marker, marker + discovery_import, 1)
          hook = '    const url = new URL(request.url);\n'
          insertion = '''    const url = new URL(request.url);\n\n    const publicDiscovery = discoveryResponse(request);\n    if (publicDiscovery !== null) return publicDiscovery;\n'''
          if 'const publicDiscovery = discoveryResponse(request);' not in s:
              if hook not in s:
                  raise SystemExit('fetch URL hook not found')
              s = s.replace(hook, insertion, 1)
          p.write_text(s)
          PY

          npm ci --ignore-scripts
          npx prettier --write \
            apps/worker/src/discovery.ts \
            apps/worker/src/mainnet-entry.ts \
            apps/worker/src/mainnet-edge.ts \
            tests/discovery.test.ts
          npm run typecheck
          npx vitest run tests/discovery.test.ts tests/mainnet-bazaar.test.ts
          npm --workspace @xguard/worker run build:mainnet

          git add \
            apps/worker/src/discovery.ts \
            apps/worker/src/mainnet-entry.ts \
            apps/worker/src/mainnet-edge.ts \
            tests/discovery.test.ts
          git commit -m "feat: integrate main discovery surfaces with Bazaar MCP edge [integrated-main-code]"
          git push origin HEAD:agent/complete-agent-discovery-stack
