name: Fix MCP TypeScript

on:
  push:
    branches:
      - fix/verifymcp-trust

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verifymcp-trust
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply deterministic consent-page type fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          oauth = Path('apps/worker/src/mcp-oauth.ts')
          text = oauth.read_text()
          pattern = re.compile(
              r'(function consentPage\(input: AuthorizationRequest\): Response \{\n'
              r'  const fields: Array<\[string, string\]> = \[.*?'
              r'    \.\.\.\(input\.state === null \? \[\] : \[\["state", input\.state\]\]\),\n)'
              r'  \]\n'
              r'    \.map\(',
              re.S,
          )
          def replacement(match):
              return match.group(1) + '  ];\n  const hidden = fields\n    .map('
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one consentPage repair, got {count}')
          oauth.write_text(text)
          PY
      - run: npx prettier --write apps/worker/src/mcp-oauth.ts
      - name: Verify targeted TypeScript files
        run: npx tsc -b --pretty false
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mcp-oauth.ts
          git commit -m "Complete MCP TypeScript compatibility fix"
          git push origin HEAD:fix/verifymcp-trust
