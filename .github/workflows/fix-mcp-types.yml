name: Fix MCP TypeScript

on:
  push:
    branches:
      - fix/verifymcp-trust

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verifymcp-trust
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply narrow type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          oauth = Path('apps/worker/src/mcp-oauth.ts')
          text = oauth.read_text()
          old = '''    ...(input.state === null ? [] : [["state", input.state]]),
          ]
            .map(
          '''
          new = '''    ...(input.state === null ? [] : [["state", input.state]]),
          ];
          const hidden = fields
            .map(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          oauth.write_text(text)
          PY
      - run: npx prettier --write apps/worker/src/mcp-oauth.ts apps/worker/src/universal-mainnet.ts
      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mcp-oauth.ts apps/worker/src/universal-mainnet.ts
          git commit -m "Complete MCP TypeScript compatibility fix"
          git push origin HEAD:fix/verifymcp-trust
