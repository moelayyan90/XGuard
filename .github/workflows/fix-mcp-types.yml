name: Fix MCP TypeScript

on:
  push:
    branches:
      - fix/verifymcp-trust

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verifymcp-trust
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply narrow type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          oauth = Path('apps/worker/src/mcp-oauth.ts')
          text = oauth.read_text()
          old = '''function consentPage(input: AuthorizationRequest): Response {
            const hidden = [
          '''
          new = '''function consentPage(input: AuthorizationRequest): Response {
            const fields: Array<[string, string]> = [
          '''
          if old in text:
              text = text.replace(old, new, 1)
          old = '''            ...(input.state === null ? [] : [["state", input.state]]),
            ]
              .map(
          '''
          new = '''            ...(input.state === null ? [] : [["state", input.state]]),
            ];
            const hidden = fields
              .map(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          oauth.write_text(text)

          universal = Path('apps/worker/src/universal-mainnet.ts')
          text = universal.read_text()
          old = ''': normalizeMcpPublicResponse(mcpSnapshot, normalized);'''
          new = ''': normalizeMcpPublicResponse(
                  mcpSnapshot as unknown as Request,
                  normalized,
                );'''
          if old in text:
              text = text.replace(old, new, 1)
          universal.write_text(text)
          PY
      - run: npx prettier --write apps/worker/src/mcp-oauth.ts apps/worker/src/universal-mainnet.ts
      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mcp-oauth.ts apps/worker/src/universal-mainnet.ts
          git commit -m "Fix MCP TypeScript compatibility"
          git push origin HEAD:fix/verifymcp-trust
