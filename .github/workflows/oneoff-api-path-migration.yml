name: One-off API path migration

on:
  push:
    branches:
      - fix/api-path-alias
    paths:
      - ".github/workflows/oneoff-api-path-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fix and validate API path alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("apps/relay/src/discovery-entry.js")
          text = target.read_text(encoding="utf-8")

          bad = '''  headers.set("x-xguard-version", VERSION);\n    if (routed.apiAlias) headers.set("x-xguard-api-path", "/api");\n  return new Response(JSON.stringify(body), { status: response.status, statusText: response.statusText, headers });'''
          good = '''  headers.set("x-xguard-version", VERSION);\n  return new Response(JSON.stringify(body), { status: response.status, statusText: response.statusText, headers });'''
          text = text.replace(bad, good)

          anchor = '''    headers.set("x-xguard-canonical-mcp", MCP);\n    headers.set("x-xguard-version", VERSION);\n    if (effectiveRequest.method === "GET" && url.pathname === "/" && !routed.apiAlias) {'''
          replacement = '''    headers.set("x-xguard-canonical-mcp", MCP);\n    headers.set("x-xguard-version", VERSION);\n    if (routed.apiAlias) headers.set("x-xguard-api-path", "/api");\n    if (effectiveRequest.method === "GET" && url.pathname === "/" && !routed.apiAlias) {'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif replacement not in text:
              raise SystemExit("Could not place alias response header")

          if 'const API = "https://xguardgate.com/api";' not in text:
              raise SystemExit("Canonical API constant was not migrated")
          if "function routeApiAlias(request)" not in text:
              raise SystemExit("API alias router missing")
          if 'app.fetch(effectiveRequest, env, ctx)' not in text:
              raise SystemExit("API alias request is not routed to app")
          if 'if (routed.apiAlias) headers.set("x-xguard-api-path", "/api");' not in text:
              raise SystemExit("API alias response marker missing")

          target.write_text(text, encoding="utf-8")
          PY

          node --check apps/relay/src/discovery-entry.js
          node --check apps/relay/src/product-entry.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/relay/src/discovery-entry.js
          git commit -m "fix: place API alias header in request handler"
          git push origin HEAD:fix/api-path-alias
