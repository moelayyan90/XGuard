name: Publish XGuard Gate Image

on:
  push:
    branches: [main]
    paths:
      - "apps/edge-gate/**"
      - "apps/universal-gate/**"
      - ".github/workflows/publish-gate-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/universal-gate/Dockerfile
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/moelayyan90/XGuard
            org.opencontainers.image.title=XGuard Universal Gate
            org.opencontainers.image.version=5.0.1
          tags: |
            ghcr.io/moelayyan90/xguard-gate:5.0.1
            ghcr.io/moelayyan90/xguard-gate:latest
      - name: Verify anonymous pull and smoke-test immutable image
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm ghcr.io/moelayyan90/xguard-gate:5.0.1 >/dev/null 2>&1 || true
          docker pull ghcr.io/moelayyan90/xguard-gate:5.0.1
          docker run -d --rm --name xguard-gate-release -p 18080:8080 ghcr.io/moelayyan90/xguard-gate:5.0.1
          trap 'docker stop xguard-gate-release >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/__xguard/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (x.version !== "5.0.1") process.exit(1);
            if (x.facilitator !== "https://api.xguardgate.com") process.exit(1);
          '
