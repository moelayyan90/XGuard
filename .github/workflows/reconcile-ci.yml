name: XGuard Reconcile CI
on:
  pull_request:
    paths: ['apps/reconcile/**', '.github/workflows/reconcile-*.yml']
  push:
    branches: [main]
    paths: ['apps/reconcile/**', '.github/workflows/reconcile-*.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix apps/reconcile --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix apps/reconcile && npm test --prefix apps/reconcile
      - run: npm run build --prefix apps/reconcile && npm run test:workerd --prefix apps/reconcile
      - run: npx --yes wrangler@4.147.0 deploy --dry-run --config apps/reconcile/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
