name: Publish XGuard MCP Registry metadata

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          if (server.name !== 'io.github.moelayyan90/xguard') {
            throw new Error('server.json name does not match the published XGuard registry identity');
          }
          if (typeof server.description !== 'string' || server.description.length === 0 || server.description.length > 100) {
            throw new Error(`server.json description must contain 1-100 characters; got ${String(server.description ?? '').length}`);
          }
          if (typeof server.version !== 'string' || server.version.length === 0) {
            throw new Error('server.json version is missing');
          }
          if (!Array.isArray(server.remotes) || !server.remotes.some((remote) =>
            remote && remote.type === 'streamable-http' &&
            remote.url === 'https://xguardgate.com/mcp')) {
            throw new Error('server.json must advertise the production XGuard Streamable HTTP MCP endpoint');
          }
          NODE

      - name: Detect local publication state
        id: local
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('server.json','utf8')).version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          server_changed=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" \
            && -n "${BEFORE_SHA:-}" \
            && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BEFORE_SHA}" || true
            fi
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
              && git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- server.json | grep -qx 'server.json'; then
              server_changed=true
            fi
          fi
          echo "server_changed=${server_changed}" >> "${GITHUB_OUTPUT}"

      - name: Validate remote MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 https://xguardgate.com/.well-known/mcp/server.json)"
          printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="io.github.moelayyan90/xguard"||!Array.isArray(x.remotes)||!x.remotes.some(r=>r&&r.type==="streamable-http"&&String(r.url||"").endsWith("/mcp")))process.exit(1)})'

      - name: Check existing MCP Registry version
        id: registry
        shell: bash
        env:
          LOCAL_VERSION: ${{ steps.local.outputs.version }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.moelayyan90%2Fxguard' || true)"
          already_published="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s||"{}");const a=Array.isArray(x.servers)?x.servers:[];const version=process.env.LOCAL_VERSION;const found=a.some(v=>{const server=v?.server??v??{};return String(server.name||"")==="io.github.moelayyan90/xguard"&&String(server.version||"")===version});process.stdout.write(found?"true":"false")})')"
          echo "already_published=${already_published}" >> "${GITHUB_OUTPUT}"

          if [[ "${already_published}" == "true" && "${{ steps.local.outputs.server_changed }}" == "true" ]]; then
            echo "::error::server.json changed but version ${LOCAL_VERSION} is already published. Bump server.json version before publishing changed metadata."
            exit 1
          fi

      - name: Install official MCP publisher
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.already_published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        env:
          SERVER_CHANGED: ${{ steps.local.outputs.server_changed }}
        run: |
          set -euo pipefail
          set +e
          output="$(./mcp-publisher publish 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if grep -Fq 'invalid version: cannot publish duplicate version' <<< "$output"; then
            if [[ "${SERVER_CHANGED}" == "true" ]]; then
              echo "::error::The Registry already contains this version, but server.json changed. Bump the version and publish again."
              exit 1
            fi
            echo "::notice::This XGuard MCP version is already published; treating duplicate publication as idempotent success."
            exit 0
          fi
          exit "$status"

      - name: Verify registry publication
        shell: bash
        env:
          LOCAL_VERSION: ${{ steps.local.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body="$(curl -fsS --max-time 15 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.moelayyan90%2Fxguard' || true)"
            if printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s||"{}");const a=Array.isArray(x.servers)?x.servers:[];const version=process.env.LOCAL_VERSION;if(!a.some(v=>{const server=v?.server??v??{};return String(server.name||"")==="io.github.moelayyan90/xguard"&&String(server.version||"")===version}))process.exit(1)})'; then
              exit 0
            fi
            sleep 5
          done
          echo "Registry publication for io.github.moelayyan90/xguard ${LOCAL_VERSION} could not be verified"
          exit 1
