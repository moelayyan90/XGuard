name: Deploy XGuard Billing

on:
  push:
    branches: [main]
    paths:
      - "apps/billing/**"
      - "scripts/verify-billing-readiness.mjs"
      - ".github/workflows/deploy-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
        working-directory: apps/billing

      - name: Detect coordinated provider and Worker secret setup
        id: readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BILLING_RELEASE_APPROVED: ${{ secrets.BILLING_RELEASE_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BILLING_RELEASE_APPROVED" != "webhook-path:/webhooks/lemonsqueezy" ]]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'reason=provider_release_not_approved' >> "$GITHUB_OUTPUT"
            echo 'Billing tests passed; deployment is intentionally disabled until the provider webhook path is approved.'
            exit 0
          fi
          npx --yes wrangler@4.123.0 secret list --config apps/billing/wrangler.jsonc | grep -q 'LEMONSQUEEZY_WEBHOOK_SECRET'
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          echo 'reason=configured' >> "$GITHUB_OUTPUT"

      - name: Deploy billing Worker
        if: steps.readiness.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config apps/billing/wrangler.jsonc --tag "git-${GITHUB_SHA:0:12}" --message "Deploy XGuard billing ${GITHUB_SHA}"

      - name: Verify signed-webhook rejection and public package
        if: steps.readiness.outputs.deploy == 'true'
        run: node scripts/verify-billing-readiness.mjs

      - name: Report deployment gate
        if: steps.readiness.outputs.deploy != 'true'
        run: echo "Billing deployment skipped safely (${STEPS_READINESS_REASON}); x402 remains the production payment path."
        env:
          STEPS_READINESS_REASON: ${{ steps.readiness.outputs.reason }}
