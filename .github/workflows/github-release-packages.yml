name: Publish installable GitHub package tarballs

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/core/**"
      - "packages/sdk/**"
      - "packages/cli/**"
      - ".github/workflows/github-release-packages.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/core/**"
      - "packages/sdk/**"
      - "packages/cli/**"
      - ".github/workflows/github-release-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Build release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --workspace @xguard/core --pack-destination release-assets
          npm pack --workspace @xguard/sdk --pack-destination release-assets
          npm pack --workspace xguard --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS)
          ls -lh release-assets

      - name: Verify CLI installs from tarball with no registry publication
        shell: bash
        run: |
          set -euo pipefail
          CLI_TARBALL="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name 'xguard-0.1.0-alpha.0.tgz' -print -quit)"
          test -n "$CLI_TARBALL"
          mkdir -p /tmp/xguard-cli-prefix
          npm install --global --prefix /tmp/xguard-cli-prefix "$CLI_TARBALL"
          /tmp/xguard-cli-prefix/bin/xguard --help | tee /tmp/xguard-help.txt
          /tmp/xguard-cli-prefix/bin/xguard doctor --help | tee /tmp/xguard-doctor.txt
          grep -qi 'xguard' /tmp/xguard-help.txt
          grep -qi 'doctor' /tmp/xguard-doctor.txt

      - name: Verify SDK and core install together from local tarballs
        shell: bash
        run: |
          set -euo pipefail
          CORE_TARBALL="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name 'xguard-core-0.1.0-alpha.0.tgz' -print -quit)"
          SDK_TARBALL="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -name 'xguard-sdk-0.1.0-alpha.0.tgz' -print -quit)"
          test -n "$CORE_TARBALL"
          test -n "$SDK_TARBALL"
          mkdir -p /tmp/xguard-sdk-smoke
          cd /tmp/xguard-sdk-smoke
          npm init -y >/dev/null
          npm install "$CORE_TARBALL" "$SDK_TARBALL"
          node --input-type=module -e 'import { createXGuardFacilitator } from "@xguard/sdk"; if(typeof createXGuardFacilitator!=="function") process.exit(1)'

      - uses: actions/upload-artifact@v4
        with:
          name: xguard-installable-packages
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release fallback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="xguard-packages-v0.1.0-alpha.0"
          NOTES='Installable fallback artifacts for XGuard while first npm publication remains identity-gated. Includes @xguard/core, @xguard/sdk, xguard CLI, and SHA256 checksums. These artifacts are built and smoke-tested by GitHub Actions from protected main.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "XGuard installable packages v0.1.0-alpha.0" --notes "$NOTES" --prerelease
          fi
