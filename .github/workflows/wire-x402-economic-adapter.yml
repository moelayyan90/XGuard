name: Diagnose x402 Economic Firewall adapter

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/wire-x402-economic-adapter.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply x402 adapter wiring
        run: python scripts/wire-x402-economic-adapter.py
      - name: Format
        run: npx prettier --write apps/worker/src/economic-firewall.ts apps/worker/wrangler.economic-preview.jsonc apps/worker/src/x402-economic-adapter.ts tests/x402-economic-adapter.test.ts
      - name: Capture verification
        shell: bash
        run: |
          mkdir -p x402-adapter-diagnostics
          set +e
          npm run lint > x402-adapter-diagnostics/lint.txt 2>&1
          echo $? > x402-adapter-diagnostics/lint-code.txt
          npm run typecheck > x402-adapter-diagnostics/typecheck.txt 2>&1
          echo $? > x402-adapter-diagnostics/typecheck-code.txt
          npm run test > x402-adapter-diagnostics/test.txt 2>&1
          echo $? > x402-adapter-diagnostics/test-code.txt
          npm --workspace @xguard/worker run build:economic-preview > x402-adapter-diagnostics/build-preview.txt 2>&1
          echo $? > x402-adapter-diagnostics/build-preview-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: x402-economic-adapter-diagnostics-v2
          path: x402-adapter-diagnostics
          if-no-files-found: error
