name: Wire x402 Economic Firewall adapter

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/wire-x402-economic-adapter.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply x402 adapter wiring
        run: python scripts/wire-x402-economic-adapter.py
      - name: Format
        run: npx prettier --write apps/worker/src/economic-firewall.ts apps/worker/wrangler.economic-preview.jsonc apps/worker/src/x402-economic-adapter.ts tests/x402-economic-adapter.test.ts
      - name: Verify x402 adapter wiring
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm --workspace @xguard/worker run build:economic-preview
      - name: Commit x402 adapter wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/economic-firewall.ts apps/worker/wrangler.economic-preview.jsonc apps/worker/src/x402-economic-adapter.ts tests/x402-economic-adapter.test.ts
          git commit -m "feat: wire x402 testnet adapter into Economic Firewall"
          git push origin HEAD:agent/economic-firewall-v2
