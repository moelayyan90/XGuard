name: Probe mcp.so free submission endpoint

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public free-submit page and request shape
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://mcp.so"
          url = base + "/submit?type=server"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 XGuard-registry-check"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          print("PAGE_LENGTH", len(html))
          scripts = sorted(set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+\.js[^\"\']*)[\"\']', html, re.I)))
          print("SCRIPTS", len(scripts))
          for script in scripts:
              full = urllib.parse.urljoin(url, script)
              try:
                  req = urllib.request.Request(full, headers={"User-Agent": "Mozilla/5.0 XGuard-registry-check"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js = r.read().decode("utf-8", "replace")
              except Exception as exc:
                  print("FETCH_ERROR", full, type(exc).__name__, str(exc))
                  continue
              lower = js.lower()
              if not any(k in lower for k in ["free submission", "submit", "repository url", "project", "/api/"]):
                  continue
              print("=== BUNDLE", full, "LEN", len(js), "===")
              for needle in ["free submission", "repository url", "submit", "/api/", "fetch(", "method:", "POST", "repository", "project"]:
                  for m in list(re.finditer(re.escape(needle), js, re.I))[:6]:
                      a=max(0,m.start()-500); b=min(len(js),m.end()+1000)
                      print("NEEDLE", needle, js[a:b].replace("\\n"," "))
          PY
