name: Probe mcp.so free submission endpoint

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public submit modules
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request

          base = "https://mcp.so/assets/"
          assets = [
              "submit-CpMQIRpg.js",
              "project-url-Ddi_Zpfq.js",
              "submission-upgrade-button-Bl6pncjQ.js",
              "pending-review-notice-drbLCd0F.js",
              "useMutation-ffivVhIE.js",
              "useForm-CPkXYiGi.js",
          ]
          ua = {"User-Agent": "Mozilla/5.0 XGuard-registry-check"}
          for asset in assets:
              url = base + asset
              try:
                  req = urllib.request.Request(url, headers=ua)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js = r.read().decode("utf-8", "replace")
              except Exception as exc:
                  print("FETCH_ERROR", url, type(exc).__name__, str(exc))
                  continue
              print("=== ASSET", asset, "LEN", len(js), "===")
              hits = []
              for needle in ["/api/", "submit", "repository", "projectUrl", "project_url", "free", "payment", "email", "sign-in", "auth", "remote-server", "server", "mutationFn", "Tc(", "POST"]:
                  for m in re.finditer(re.escape(needle), js, re.I):
                      a=max(0,m.start()-650); b=min(len(js),m.end()+1300)
                      snippet=js[a:b].replace("\\n"," ")
                      key=(needle,m.start())
                      hits.append((m.start(), needle, snippet))
                      if sum(1 for h in hits if h[1]==needle)>=8:
                          break
              for _, needle, snippet in sorted(hits)[:120]:
                  print("NEEDLE", needle, snippet)
          PY
