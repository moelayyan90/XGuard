name: Agent discovery autofix

on:
  push:
    branches:
      - agent/complete-agent-discovery-stack

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-agent-discovery-stack
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Apply protocol fixes
        run: node scripts/agent-autofix-discovery.mjs
      - name: Format changed files
        run: |
          npx prettier --write \
            apps/worker/src/mainnet-bazaar.ts \
            apps/worker/src/mainnet-edge.ts \
            apps/worker/migrations/0005_bazaar_discovery.sql \
            scripts/smoke-mainnet.mjs \
            tests/mainnet-bazaar.test.ts \
            ARCHITECTURE.md \
            DISTRIBUTION.md \
            server.json
      - name: Verify discovery implementation
        run: |
          npm run typecheck
          npx vitest run tests/mainnet-bazaar.test.ts
          npm --workspace @xguard/worker run build:mainnet
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "xguard-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker/src/mainnet-bazaar.ts \
            apps/worker/src/mainnet-edge.ts \
            apps/worker/migrations/0005_bazaar_discovery.sql \
            scripts/smoke-mainnet.mjs \
            tests/mainnet-bazaar.test.ts \
            ARCHITECTURE.md \
            DISTRIBUTION.md \
            package-lock.json \
            server.json
          git commit -m "fix: harden agent discovery stack [autofix]"
          git push origin HEAD:agent/complete-agent-discovery-stack
