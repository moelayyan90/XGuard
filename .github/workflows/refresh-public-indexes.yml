name: Refresh XGuard Public Indexes

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-public-indexes.yml"
      - "apps/relay/src/canonical-entry.js"
      - "apps/relay/src/public-metadata.js"
  push:
    branches: [main]
    paths:
      - "apps/relay/src/canonical-entry.js"
      - "apps/relay/src/public-metadata.js"
      - ".github/workflows/refresh-public-indexes.yml"
  workflow_dispatch:
    inputs:
      submit_not_human_search:
        description: "Submit the canonical homepage to Not Human Search after verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install relay dependencies for pull request verification
        if: github.event_name == 'pull_request'
        run: npm install --prefix apps/relay --ignore-scripts --no-audit --no-fund
      - name: Verify canonical contracts before deployment
        if: github.event_name == 'pull_request'
        run: |
          node --test apps/relay/src/canonical-entry-test.js
          node apps/relay/test/public-metadata.mjs

      - name: Verify canonical public signals after deployment
        if: github.event_name != 'pull_request'
        run: node scripts/verify-production-identity.mjs

      - name: Submit canonical homepage only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.submit_not_human_search
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o /tmp/nhs-response.json -w '%{http_code}' -X POST 'https://nothumansearch.ai/api/v1/submit' -H 'content-type: application/json' --data '{"url":"https://xguardgate.com"}')"
          cat /tmp/nhs-response.json
          test "$code" -ge 200 -a "$code" -lt 300
