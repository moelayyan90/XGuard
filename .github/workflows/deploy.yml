name: Deploy XGuard Relay
on:
  push:
    branches: [main]
    paths:
      - "apps/relay/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --prefix apps/relay --no-audit --no-fund
      - name: Deploy gateway to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/relay/wrangler.jsonc
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            h="$(curl --silent --show-error --max-time 8 https://api.xguardgate.com/healthz || true)"
            if printf '%s' "$h" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);if(x.service==="XGuard Reliability Gateway"&&x.version==="2.2.0"&&x.non_custodial===true&&x.durable_receipts===true&&Array.isArray(x.upstreams)&&x.upstreams.some(u=>u.ok))process.exit(0)}catch{}process.exit(1)})'; then break; fi
            sleep 4
          done
          printf '%s' "$h" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(JSON.stringify(x));if(x.service!=="XGuard Reliability Gateway"||x.version!=="2.2.0"||x.durable_receipts!==true||!x.upstreams?.some(u=>u.ok))process.exit(1)})'
          code="$(curl --silent --show-error --max-time 8 -o /tmp/supported -w '%{http_code}' https://api.xguardgate.com/supported)"
          test "$code" = "200"
          test -s /tmp/supported
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/docs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard Reliability Gateway"||x.behavior?.durable_idempotency_receipts!==true||x.pricing?.credits_per_successful_settlement!==2)process.exit(1)})'
          page="$(curl --fail --silent --show-error --max-time 8 https://xguardgate.com/)"
          printf '%s' "$page" | grep -q "Don't lose paid requests"
