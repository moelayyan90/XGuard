name: Deploy XGuard Live

on:
  workflow_run:
    workflows: ["XGuard Live CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: xguard-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix apps/relay --no-audit --no-fund
      - name: Install verified settlement Worker dependencies
        if: hashFiles('apps/settlement-gateway/package-lock.json') != ''
        run: npm ci --prefix apps/settlement-gateway --no-audit --no-fund

      - name: Snapshot current production version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(npx --yes wrangler@4.147.0 deployments list --json --config apps/relay/wrangler.jsonc)"
          version_id="$(printf '%s' "$deployments" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s),d=x.at(-1),v=d?.versions?.find(item=>Number(item.percentage)>0);if(!v?.version_id)process.exit(1);process.stdout.write(v.version_id)})')"
          version="$(npx --yes wrangler@4.147.0 versions view "$version_id" --json --config apps/relay/wrangler.jsonc)"
          git_ref="$(printf '%s' "$version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s),tag=x.annotations?.["workers/tag"]||"";if(!/^git-[0-9a-f]{12,40}$/.test(tag))process.exit(1);process.stdout.write(tag.slice(4))})')"
          git_ref="$(git rev-parse "${git_ref}^{commit}")"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - name: Guard Durable Object deployment and recovery
        id: do_guard
        shell: bash
        run: node scripts/durable-object-deploy-guard.mjs '${{ steps.previous.outputs.git_ref }}' "$DEPLOY_SHA"

      - name: Select compatible protocol canary deployment
        id: protocol_release
        if: steps.do_guard.outputs.rollback_allowed == 'true'
        env:
          PREVIOUS_GIT_REF: ${{ steps.previous.outputs.git_ref }}
        shell: bash
        run: |
          if ! git diff --quiet "$PREVIOUS_GIT_REF" "$DEPLOY_SHA" -- apps/relay/src/live/mcp.ts apps/relay/src/live/a2a.ts server.json &&
             git diff --quiet "$PREVIOUS_GIT_REF" "$DEPLOY_SHA" -- apps/relay/wrangler.jsonc apps/settlement-gateway; then
            echo 'gradual=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Provision owner access from the existing repository secret
        if: steps.protocol_release.outputs.gradual != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_ADMIN_KEY: ${{ secrets.LIVE_ADMIN_KEY || secrets.XGUARD_OPERATOR_KEY }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#LIVE_ADMIN_KEY} -ge 24 ]]; then
            printf '%s' "$LIVE_ADMIN_KEY" | npx --yes wrangler@4.147.0 secret put LIVE_ADMIN_KEY --config apps/relay/wrangler.jsonc
          else
            echo '::warning::No usable owner key in repository secrets. Existing Worker secrets are preserved; owner access stays fail-closed if unconfigured.'
          fi

      - name: Initialize missing owner credential with encrypted delivery
        if: steps.protocol_release.outputs.gradual != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/live-owner-bootstrap.mjs

      - name: Deploy private settlement Worker before exposing the paid route
        if: steps.protocol_release.outputs.gradual != 'true' && hashFiles('apps/settlement-gateway/wrangler.jsonc') != ''
        working-directory: apps/settlement-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"|"$/ /g; s/^[[:space:]]+|[[:space:]]+$//g')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          node_modules/.bin/wrangler deploy --config wrangler.jsonc --tag "git-${DEPLOY_SHA:0:12}" --message "Deploy XGuard settlement gateway ${DEPLOY_SHA}"

      - name: Deploy Worker
        id: deploy
        env:
          PROTOCOL_GRADUAL: ${{ steps.protocol_release.outputs.gradual }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          config=apps/relay/wrangler.jsonc
          wrangler=apps/relay/node_modules/.bin/wrangler
          tag="git-${DEPLOY_SHA:0:12}"
          if [[ "$PROTOCOL_GRADUAL" != true ]]; then
            "$wrangler" deploy --config "$config" --tag "$tag" --message "Deploy XGuard $DEPLOY_SHA"
            exit 0
          fi

          upload_log="$RUNNER_TEMP/xguard-protocol-upload.log"
          "$wrangler" versions upload --config "$config" --tag "$tag" --message "Deploy XGuard protocol fix $DEPLOY_SHA" | tee "$upload_log"
          candidate="$(sed -nE 's/.*Worker Version ID: ([0-9a-f-]{36}).*/\1/p' "$upload_log" | tail -1)"
          [[ "$candidate" =~ ^[0-9a-f-]{36}$ && "$PREVIOUS_VERSION" =~ ^[0-9a-f-]{36}$ ]]
          rollback_canary() {
            local result=$?
            trap - EXIT
            if (( result != 0 )); then
              "$wrangler" rollback "$PREVIOUS_VERSION" --yes --config "$config" --message "Rollback failed XGuard protocol canary $DEPLOY_SHA" || true
            fi
            exit "$result"
          }
          trap rollback_canary EXIT
          "$wrangler" versions deploy "$PREVIOUS_VERSION@95" "$candidate@5" --yes --config "$config" --message "XGuard protocol canary 5%"
          for attempt in {1..3}; do
            if CANDIDATE_WORKER_ID="$candidate" EXPECTED_XGUARD_TAG="$tag" node apps/relay/test/live-a2a-smoke.mjs &&
               CANDIDATE_WORKER_ID="$candidate" EXPECTED_XGUARD_TAG="$tag" node apps/relay/test/live-mcp-smoke.mjs; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 5
          done
          "$wrangler" versions deploy "$candidate@100" --yes --config "$config" --message "Promote verified XGuard protocol release"
          trap - EXIT

      - name: Verify public Live deployment
        id: production_smoke
        shell: bash
        run: |
          set -euo pipefail
          export EXPECTED_XGUARD_TAG="git-${DEPLOY_SHA:0:12}"
          for attempt in {1..8}; do
            if node scripts/live-smoke.mjs; then exit 0; fi
            if grep -q '^quota_exhausted=true$' "$GITHUB_OUTPUT"; then exit 1; fi
            sleep 5
          done
          exit 1

      - name: Verify owner access and start curated collection
        if: success()
        env:
          LIVE_ADMIN_KEY: ${{ secrets.LIVE_ADMIN_KEY || secrets.XGUARD_OPERATOR_KEY }}
        run: node scripts/live-admin-smoke.mjs

      - name: Verify isolated paid contract without signing or spending
        id: paid_smoke
        if: always() && steps.deploy.outcome == 'success'
        run: EXPECTED_XGUARD_TAG="git-${DEPLOY_SHA:0:12}" node scripts/live-paid-smoke.mjs

      - name: Verify production settlement and Lemon Squeezy admission without spending
        id: gateway_smoke
        if: always() && steps.deploy.outcome == 'success' && hashFiles('scripts/live-gateway-smoke.mjs') != ''
        shell: bash
        run: |
          for attempt in {1..3}; do
            if node scripts/live-gateway-smoke.mjs; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          exit 1

      - name: Verify production MCP clients and unpaid boundary
        id: mcp_smoke
        if: always() && steps.deploy.outcome == 'success' && hashFiles('apps/relay/test/live-mcp-smoke.mjs') != ''
        env:
          MCP_TAG_SHA: ${{ env.DEPLOY_SHA }}
        shell: bash
        run: |
          for attempt in {1..3}; do
            if EXPECTED_XGUARD_TAG="git-${MCP_TAG_SHA:0:12}" node apps/relay/test/live-mcp-smoke.mjs; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          exit 1

      - name: Verify production A2A discovery and published fact read
        id: a2a_smoke
        if: always() && steps.deploy.outcome == 'success' && hashFiles('apps/relay/test/live-a2a-smoke.mjs') != ''
        shell: bash
        run: |
          for attempt in {1..3}; do
            if EXPECTED_XGUARD_TAG="git-${DEPLOY_SHA:0:12}" node apps/relay/test/live-a2a-smoke.mjs; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          exit 1

      - name: Roll back compatible code-only deployment after failed verification
        if: failure() && steps.deploy.outcome == 'success' && steps.previous.outputs.version_id != '' && steps.do_guard.outputs.rollback_allowed == 'true' && (steps.production_smoke.outputs.quota_exhausted != 'true' || steps.paid_smoke.outcome == 'failure' || steps.gateway_smoke.outcome == 'failure' || steps.mcp_smoke.outcome == 'failure' || steps.a2a_smoke.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          PREVIOUS_GIT_REF: ${{ steps.previous.outputs.git_ref }}
          PUBLIC_QUOTA_EXHAUSTED: ${{ steps.production_smoke.outputs.quota_exhausted }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.147.0 rollback "$PREVIOUS_VERSION" --yes --config apps/relay/wrangler.jsonc --message "Automatic rollback after failed XGuard ${DEPLOY_SHA} verification"
          EXPECTED_XGUARD_TAG="git-${PREVIOUS_GIT_REF:0:12}" node scripts/live-paid-smoke.mjs
          if [[ "$PUBLIC_QUOTA_EXHAUSTED" == 'true' ]]; then
            echo '::warning::Rollback revision and paid contract verified. Public data verification remains failed on the previously observed provider quota; no recovery is claimed.'
            exit 0
          fi
          for attempt in {1..4}; do
            if curl --fail --silent --show-error --max-time 10 https://xguardgate.com/healthz >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Require forward recovery after incompatible durable state change
        if: failure() && steps.deploy.outcome == 'success' && steps.do_guard.outputs.rollback_allowed != 'true' && (steps.production_smoke.outputs.quota_exhausted != 'true' || steps.paid_smoke.outcome == 'failure' || steps.gateway_smoke.outcome == 'failure' || steps.mcp_smoke.outcome == 'failure' || steps.a2a_smoke.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          echo '::error title=Forward recovery required::Production verification failed after an incompatible durable state change. Preserve payment reconciliation and no-repeat safeguards; publish a compatible corrective version. No unsafe rollback was attempted.'
          curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 12 https://xguardgate.com/healthz || true
          exit 1

      - name: Keep storage-quota recovery deployed and report incomplete verification
        if: failure() && steps.deploy.outcome == 'success' && steps.production_smoke.outputs.quota_exhausted == 'true' && steps.paid_smoke.outcome == 'success' && steps.gateway_smoke.outcome != 'failure' && steps.mcp_smoke.outcome != 'failure' && steps.a2a_smoke.outcome != 'failure'
        run: |
          echo '::error title=Provider storage quota exhausted::The tested recovery build is deployed, but public data verification is incomplete. Durable Objects free limits reset at 00:00 UTC. The scheduled Live monitor will check service recovery. No subscription or billing changes were made.'
