name: Deploy XGuard Relay

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --prefix apps/relay --no-audit --no-fund

      - name: Apply Durable Object migration and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/relay/wrangler.jsonc --tag "git-${GITHUB_SHA:0:12}" --message "Apply XGuard ProofRail Durable Object migration ${GITHUB_SHA}"

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..35}; do
            egress="$(curl --silent --show-error --max-time 8 'https://api.xguardgate.com/v1/egress?build='"${GITHUB_SHA}" || true)"
            facilitator="$(curl --silent --show-error --max-time 8 https://api.xguardgate.com/facilitator || true)"
            if printf '%s' "$egress" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);if(x.name==="XGuard Secretless Egress"&&x.role.includes("credential broker")&&x.credits_per_authorized_egress_attempt===1&&x.providers_supported?.includes("stripe"))process.exit(0)}catch{}process.exit(1)})' && \
               printf '%s' "$facilitator" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);if(x.version==="5.0.1"&&x.kind==="facilitator"&&x.capabilities?.automatic_routing===true&&x.capabilities?.settlement_ambiguous_fail_closed===true)process.exit(0)}catch{}process.exit(1)})'; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = "1"

          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/.well-known/xguard-egress.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard Secretless Egress"||!x.fetch||!x.capabilities||!x.controls?.some(v=>v.includes("never returned")))process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/.well-known/xguard-egress-key.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.alg!=="RSA-OAEP-256"||x.jwk?.kty!=="RSA"||!x.kid)process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/v1/egress/providers | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.providers?.openai||!x.providers?.stripe||!x.providers?.anthropic||!x.providers?.github)process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/v1/egress/pricing | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.credits_per_authorized_egress_attempt!==1||!String(x.billing_boundary||"").includes("before credential release"))process.exit(1)})'

          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/v1/proof | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard ProofRail"||x.version!=="1.0.0"||x.algorithm!=="ES256"||x.proof_header!=="x-xguard-proof"||!x.verify||!x.public_key)process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/.well-known/xguard-proof-key.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard ProofRail"||x.alg!=="ES256"||x.jwk?.kty!=="EC"||x.jwk?.crv!=="P-256"||!x.kid)process.exit(1)})'
          proof_code="$(curl --silent --show-error --max-time 8 -o /tmp/xg-proof-invalid -w '%{http_code}' -X POST https://api.xguardgate.com/v1/proofs/verify -H 'content-type: application/json' --data '{"proof":"not-a-proof"}')"
          test "$proof_code" = "400"
          cat /tmp/xg-proof-invalid | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.valid!==false||!x.error)process.exit(1)})'

          code="$(curl --silent --show-error --max-time 8 -o /tmp/xg-egress-no-key -w '%{http_code}' -X POST https://api.xguardgate.com/v1/egress/credentials -H 'content-type: application/json' --data '{"provider":"github","value":"never-sent"}')"
          test "$code" = "401"
          grep -q 'xguard_key_required' /tmp/xg-egress-no-key
          code="$(curl --silent --show-error --max-time 8 -o /tmp/xg-egress-no-cap -w '%{http_code}' -X POST https://api.xguardgate.com/v1/egress/fetch -H 'content-type: application/json' --data '{"target":"https://api.github.com/"}')"
          test "$code" = "401"
          grep -q 'valid_xguard_capability_required' /tmp/xg-egress-no-cap

          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/architecture | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard Secretless Agent Gateway"||x.architecture?.billing_before_credential_release!==true||!x.secretless_egress?.credential_management)process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.info?.title!=="XGuard Secretless Agent Gateway"||!x.paths?.["/v1/egress/fetch"]||!x.paths?.["/v1/actions/execute"]||!x.paths?.["/verify"]||!x.paths?.["/settle"])process.exit(1)})'

          init="$(curl --fail --silent --show-error --max-time 8 -X POST https://api.xguardgate.com/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1.0.0"}}}')"
          printf '%s' "$init" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.result?.serverInfo?.name!=="xguard-secretless-agent-gateway"||x.result?.serverInfo?.version!=="5.0.1"||!String(x.result?.instructions||"").includes("ProofRail")||!String(x.result?.instructions||"").includes("reusable upstream API credentials"))process.exit(1)})'
          tools="$(curl --fail --silent --show-error --max-time 8 -X POST https://api.xguardgate.com/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          printf '%s' "$tools" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=(JSON.parse(s).result?.tools||[]).map(x=>x.name);if(!["xguard_proofrail","xguard_verify_proof","xguard_secretless_egress","xguard_egress_fetch","xguard_action_rail","xguard_facilitator","xguard_route"].every(v=>n.includes(v)))process.exit(1)})'

          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/supported | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.kinds)||x.xguard?.universal!==true||!x.xguard?.settlement_safety?.includes("fail-closed"))process.exit(1)})'
          curl --fail --silent --show-error --max-time 8 https://api.xguardgate.com/facilitator | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.x402Version!==2||!x.endpoints?.verify||!x.endpoints?.settle||x.capabilities?.settlement_ambiguous_fail_closed!==true)process.exit(1)})'

          page="$(curl --fail --silent --show-error --max-time 8 "https://xguardgate.com/?build=${GITHUB_SHA}")"
          printf '%s' "$page" | grep -q 'Agents get capabilities'
          printf '%s' "$page" | grep -q 'Never the secrets'
          printf '%s' "$page" | grep -q 'ProofRail'
          printf '%s' "$page" | grep -q 'signed execution evidence'
          printf '%s' "$page" | grep -q 'font-family:Arial'
          printf '%s' "$page" | grep -q 'rel="canonical"'
          printf '%s' "$page" | grep -q 'application/ld+json'
