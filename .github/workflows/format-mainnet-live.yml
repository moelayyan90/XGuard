name: Format mainnet live
on:
  push:
    branches: [mainnet/live-worker]
    paths: [".github/workflows/format-mainnet-live.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/live-worker
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/base-settlement.ts apps/worker/src/mainnet-coordinator.ts apps/worker/src/mainnet-protocol.ts apps/worker/src/mainnet.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/base-settlement.ts apps/worker/src/mainnet-coordinator.ts apps/worker/src/mainnet-protocol.ts apps/worker/src/mainnet.ts
          git commit -m "Format mainnet live gateway"
          git push origin HEAD:mainnet/live-worker
