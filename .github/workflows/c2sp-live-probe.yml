name: C2SP Live Probe

on:
  push:
    branches:
      - probe/c2sp-live-verifier

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live C2SP witness and print public verifier key
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error --max-time 15 https://api.xguardgate.com/witness)"
          key="$(curl --fail --silent --show-error --max-time 15 https://api.xguardgate.com/witness/verifier-key | tr -d '\r\n')"
          META="$meta" KEY="$key" node <<'NODE'
          const meta = JSON.parse(process.env.META);
          const key = process.env.KEY;
          if (meta.protocol !== "c2sp.org/tlog-witness") throw new Error("unexpected protocol");
          if (meta.push_endpoint !== "https://api.xguardgate.com/witness/add-checkpoint") throw new Error("unexpected push endpoint");
          if (!/^xguardgate\.com\/witness\+[0-9a-f]{8}\+[A-Za-z0-9+/=]+$/.test(key)) throw new Error("invalid verifier key");
          if (meta.verifier_key !== key) throw new Error("metadata/key mismatch");
          const g = (meta.accepted_logs || []).find(x => x.origin === "gblin.digital/receipts-log");
          if (!g) throw new Error("GBLIN log not pinned");
          console.log(JSON.stringify({
            ok: true,
            protocol: meta.protocol,
            witness: meta.witness,
            push_endpoint: meta.push_endpoint,
            verifier_key: key,
            gblin_origin: g.origin,
            gblin_origin_hash: g.origin_hash,
            monitor: "https://api.xguardgate.com/witness/" + g.origin_hash + "/checkpoint"
          }, null, 2));
          NODE

      - name: Bootstrap first live GBLIN checkpoint into XGuard witness
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="$(curl --fail --silent --show-error --max-time 15 https://mcp.gblin.digital/log/checkpoint)"
          [[ -n "$checkpoint" ]] || { echo "empty GBLIN checkpoint"; exit 1; }
          printf 'old 0\n\n%s\n' "$checkpoint" > "$RUNNER_TEMP/witness-request.txt"
          status="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/witness-response.txt" -w '%{http_code}'             -X POST --data-binary @"$RUNNER_TEMP/witness-request.txt"             https://api.xguardgate.com/witness/add-checkpoint)"
          response="$(cat "$RUNNER_TEMP/witness-response.txt")"
          if [[ "$status" == "200" ]]; then
            printf 'bootstrap_status=200\ncosignature=%s\n' "$(printf '%s' "$response" | tr -d '\r\n')"
          elif [[ "$status" == "409" ]]; then
            printf 'bootstrap_status=409\nheld_size=%s\n' "$(printf '%s' "$response" | tr -d '\r\n')"
          else
            printf 'unexpected_status=%s\nresponse=%s\n' "$status" "$response"
            exit 1
          fi
          origin_hash="cb6e6f270f915689e63aaa0e4e65e077518dfd3dffe76e2485d2a0047c4bfdfe"
          monitor="$(curl --fail --silent --show-error --max-time 15 "https://api.xguardgate.com/witness/$origin_hash/checkpoint")"
          printf '%s' "$monitor" | grep -F 'gblin.digital/receipts-log' >/dev/null
          printf '%s' "$monitor" | grep -F '— xguardgate.com/witness ' >/dev/null
          echo 'monitor_verified=true'
