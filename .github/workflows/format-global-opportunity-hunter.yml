name: Format global opportunity hunter

on:
  push:
    branches: [feat/global-opportunity-hunter]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply prettier to opportunity hunter') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/global-opportunity-hunter
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/global-opportunity-hunter.ts apps/worker/src/universal-mainnet.ts apps/worker/wrangler.mainnet.jsonc tests/global-opportunity-hunter.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/global-opportunity-hunter.ts apps/worker/src/universal-mainnet.ts apps/worker/wrangler.mainnet.jsonc tests/global-opportunity-hunter.test.ts
          git commit -m "style: apply prettier to opportunity hunter"
          git push origin HEAD:feat/global-opportunity-hunter
