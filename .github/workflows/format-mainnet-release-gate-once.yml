name: Format mainnet release gate once

on:
  push:
    branches: [fix/mainnet-release-gate-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mainnet-release-gate-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write package.json .github/workflows/deploy-mainnet.yml tests/mainnet-release-gate-source.test.ts
          rm .github/workflows/format-mainnet-release-gate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/deploy-mainnet.yml tests/mainnet-release-gate-source.test.ts .github/workflows/format-mainnet-release-gate-once.yml
          git commit -m "Format mainnet release gate"
          git push origin HEAD:fix/mainnet-release-gate-v2
