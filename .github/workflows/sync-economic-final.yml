name: Final Economic Firewall sync

on:
  push:
    branches:
      - agent/economic-firewall-clean
    paths:
      - .github/workflows/sync-economic-final.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-clean
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/economic-firewall-clean
