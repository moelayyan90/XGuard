name: Upgrade child safety risk graph once

on:
  push:
    branches: [agent/child-safety-platform]
    paths:
      - .github/workflows/upgrade-child-safety-temp.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply privacy-preserving actor risk graph
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/worker/src/child-safety.ts')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit('target not found:\n' + old[:240])
              text = text.replace(old, new, 1)

          replace_once(
          '''interface ScanInput {
            eventId?: string;
            riskSessionId?: string;
            contentKind?: string;
            language?: string;
            childLikely?: boolean;
            childAgeBand?: string;
            text?: string;
            signals?: string[];
          }''',
          '''interface ScanInput {
            eventId?: string;
            riskSessionId?: string;
            actorId?: string;
            targetId?: string;
            country?: string;
            contentKind?: string;
            language?: string;
            childLikely?: boolean;
            childAgeBand?: string;
            text?: string;
            signals?: string[];
          }

          interface ActorRiskSummary {
            highRiskEvents: number;
            criticalEvents: number;
            distinctTargets: number;
          }''')

          replace_once(
          '''  const eventId = clean(input.eventId, 160);
            const riskSessionId = clean(input.riskSessionId, 160);
            const contentKind = clean(input.contentKind, 40) as ContentKind;
            const text = clean(input.text, MAX_TEXT);
            if (!EVENT_ID.test(eventId)) return json({ error: "invalid_event_id" }, 400);
            if (riskSessionId && !SESSION_ID.test(riskSessionId))
              return json({ error: "invalid_risk_session_id" }, 400);''',
          '''  const eventId = clean(input.eventId, 160);
            const riskSessionId = clean(input.riskSessionId, 160);
            const actorId = clean(input.actorId, 160);
            const targetId = clean(input.targetId, 160);
            const contentKind = clean(input.contentKind, 40) as ContentKind;
            const text = clean(input.text, MAX_TEXT);
            if (!EVENT_ID.test(eventId)) return json({ error: "invalid_event_id" }, 400);
            if (riskSessionId && !SESSION_ID.test(riskSessionId))
              return json({ error: "invalid_risk_session_id" }, 400);
            if (actorId && !SESSION_ID.test(actorId))
              return json({ error: "invalid_actor_id" }, 400);
            if (targetId && !SESSION_ID.test(targetId))
              return json({ error: "invalid_target_id" }, 400);''')

          replace_once(
          '''  const sessionHash = riskSessionId ? await sha256(riskSessionId) : "";
            const priorHighRisk = sessionHash
              ? await recentHighRiskCount(env.DB, merchant.merchantId, sessionHash)
              : 0;

            try {
              const ai = await classifyWithAi(env, input, priorHighRisk);
              const decision = deterministicPolicy(ai, input, priorHighRisk);''',
          '''  const sessionHash = riskSessionId ? await sha256(riskSessionId) : "";
            const actorHash = actorId ? await sha256(actorId) : "";
            const targetHash = targetId ? await sha256(targetId) : "";
            const priorHighRisk = sessionHash
              ? await recentHighRiskCount(env.DB, merchant.merchantId, sessionHash)
              : 0;
            const actorRisk = actorHash
              ? await recentActorRiskSummary(env.DB, merchant.merchantId, actorHash)
              : { highRiskEvents: 0, criticalEvents: 0, distinctTargets: 0 };

            try {
              const ai = await classifyWithAi(env, input, priorHighRisk, actorRisk);
              const decision = deterministicPolicy(ai, input, priorHighRisk, actorRisk);''')

          replace_once(
          '''      sessionHash,
                  contentKind,''',
          '''      sessionHash,
                  actorHash,
                  targetHash,
                  contentKind,''')

          replace_once(
          '''      priorHighRiskEventsInSession: priorHighRisk,
                  feeUsd: (feeMicroUsd / 1_000_000).toFixed(3),
                  rawContentStored: false,
                  reporting:
                    decision.riskLevel === "CRITICAL" ? globalReportingLinks() : undefined,''',
          '''      priorHighRiskEventsInSession: priorHighRisk,
                  actorRisk24h: actorRisk,
                  feeUsd: (feeMicroUsd / 1_000_000).toFixed(3),
                  rawContentStored: false,
                  reporting:
                    decision.riskLevel === "CRITICAL"
                      ? reportingPayload(clean(input.country, 120))
                      : undefined,''')

          replace_once(
          '''async function classifyWithAi(
            env: ChildSafetyEnv,
            input: ScanInput,
            priorHighRisk: number,
          ): Promise<AiDecision> {''',
          '''async function classifyWithAi(
            env: ChildSafetyEnv,
            input: ScanInput,
            priorHighRisk: number,
            actorRisk: ActorRiskSummary,
          ): Promise<AiDecision> {''')

          replace_once(
          '''priorHighRiskEventsInSession=${priorHighRisk}
          signals=${''',
          '''priorHighRiskEventsInSession=${priorHighRisk}
          actorHighRiskEvents24h=${actorRisk.highRiskEvents}
          actorCriticalEvents24h=${actorRisk.criticalEvents}
          actorDistinctTargets24h=${actorRisk.distinctTargets}
          signals=${''')

          replace_once(
          '''function deterministicPolicy(
            ai: AiDecision,
            input: ScanInput,
            priorHighRisk: number,
          ): AiDecision & {''',
          '''function deterministicPolicy(
            ai: AiDecision,
            input: ScanInput,
            priorHighRisk: number,
            actorRisk: ActorRiskSummary,
          ): AiDecision & {''')

          replace_once(
          '''  if (priorHighRisk >= 2 && riskLevel !== "LOW") riskLevel = "CRITICAL";
            else if (priorHighRisk >= 1 && riskLevel === "MEDIUM") riskLevel = "HIGH";

            const primaryAction:''',
          '''  if (priorHighRisk >= 2 && riskLevel !== "LOW") riskLevel = "CRITICAL";
            else if (priorHighRisk >= 1 && riskLevel === "MEDIUM") riskLevel = "HIGH";

            if (
              childLikely &&
              riskLevel !== "LOW" &&
              (actorRisk.criticalEvents >= 1 ||
                actorRisk.highRiskEvents >= 3 ||
                actorRisk.distinctTargets >= 3)
            ) {
              riskLevel = "CRITICAL";
            }

            const primaryAction:''')

          replace_once(
          '''      disableAutoplay:
                categories.has("explicit_sexual_content") && riskLevel !== "LOW",
              requireHumanSafetyReview:''',
          '''      disableAutoplay:
                categories.has("explicit_sexual_content") && riskLevel !== "LOW",
              stopVideoPlayback:
                clean(input.contentKind, 40).startsWith("video") &&
                (riskLevel === "HIGH" || riskLevel === "CRITICAL"),
              quarantineActor:
                riskLevel === "CRITICAL" &&
                (actorRisk.criticalEvents >= 1 || actorRisk.distinctTargets >= 2),
              requireHumanSafetyReview:''')

          replace_once(
          '''function reportingResponse(countryRaw: string): Response {
            const key = countryRaw.trim().toLowerCase();
            const local = COUNTRY_HELP[key];
            return json({
              country: countryRaw || null,
              local: local ?? null,
              global: globalReportingLinks(),
              coverageNote:
                "Child Helpline International maintains 150+ members across 130+ countries and territories. INHOPE provides country-based CSAM reporting through its global hotline network. Where XGuard does not yet have a locally verified direct number, use those official country selectors rather than an unverified number.",
              emergency:
                "If a child is in immediate physical danger, contact the local emergency service or police for the child's current location.",
            });
          }''',
          '''function reportingResponse(countryRaw: string): Response {
            return json(reportingPayload(countryRaw));
          }

          function reportingPayload(countryRaw: string): Record<string, unknown> {
            const key = countryRaw.trim().toLowerCase();
            const local = COUNTRY_HELP[key];
            return {
              country: countryRaw || null,
              local: local ?? null,
              global: globalReportingLinks(),
              coverageNote:
                "Child Helpline International maintains 150+ members across 130+ countries and territories, but not every country has a child helpline. INHOPE provides country-based CSAM reporting through its global hotline network. Where XGuard does not yet have a locally verified direct number, use those official country selectors rather than an unverified number.",
              emergency:
                "If a child is in immediate physical danger, contact the local emergency service or police for the child's current location.",
            };
          }''')

          replace_once(
          '''  sessionHash: string,
            contentKind: ContentKind,''',
          '''  sessionHash: string,
            actorHash: string,
            targetHash: string,
            contentKind: ContentKind,''')

          replace_once(
          '''        "INSERT OR IGNORE INTO child_safety_scans(scan_id,merchant_id,external_event_id,risk_session_hash,content_kind,risk_level,action,categories_json,fee_micro_usd,created_at) VALUES(?,?,?,?,?,?,?,?,?,?)",
              )
              .bind(
                crypto.randomUUID(),
                merchantId,
                eventId,
                sessionHash || null,
                contentKind,''',
          '''        "INSERT OR IGNORE INTO child_safety_scans(scan_id,merchant_id,external_event_id,risk_session_hash,actor_hash,target_hash,content_kind,risk_level,action,categories_json,fee_micro_usd,created_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",
              )
              .bind(
                crypto.randomUUID(),
                merchantId,
                eventId,
                sessionHash || null,
                actorHash || null,
                targetHash || null,
                contentKind,''')

          needle = '''async function recentHighRiskCount(
            db: D1Database,
            merchantId: string,
            sessionHash: string,
          ): Promise<number> {
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const row = await db
              .prepare(
                "SELECT COUNT(*) AS count FROM child_safety_scans WHERE merchant_id=? AND risk_session_hash=? AND risk_level IN ('HIGH','CRITICAL') AND created_at>=?",
              )
              .bind(merchantId, sessionHash, since)
              .first<{ count: number }>();
            return Math.max(0, Number(row?.count ?? 0));
          }
          '''
          insert = needle + '''
          async function recentActorRiskSummary(
            db: D1Database,
            merchantId: string,
            actorHash: string,
          ): Promise<ActorRiskSummary> {
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const row = await db
              .prepare(
                "SELECT SUM(CASE WHEN risk_level IN ('HIGH','CRITICAL') THEN 1 ELSE 0 END) AS high_count,SUM(CASE WHEN risk_level='CRITICAL' THEN 1 ELSE 0 END) AS critical_count,COUNT(DISTINCT CASE WHEN risk_level IN ('HIGH','CRITICAL') THEN target_hash END) AS distinct_targets FROM child_safety_scans WHERE merchant_id=? AND actor_hash=? AND created_at>=?",
              )
              .bind(merchantId, actorHash, since)
              .first<{
                high_count: number | null;
                critical_count: number | null;
                distinct_targets: number | null;
              }>();
            return {
              highRiskEvents: Math.max(0, Number(row?.high_count ?? 0)),
              criticalEvents: Math.max(0, Number(row?.critical_count ?? 0)),
              distinctTargets: Math.max(0, Number(row?.distinct_targets ?? 0)),
            };
          }
          '''
          if needle not in text:
              raise SystemExit('recentHighRiskCount target not found')
          text = text.replace(needle, insert, 1)

          path.write_text(text)
      - run: npx prettier --write apps/worker/src/child-safety.ts
      - run: npm run typecheck
      - name: Commit risk graph upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety.ts
          git commit -m "Add cross-session child safety risk graph"
          git push origin HEAD:agent/child-safety-platform
