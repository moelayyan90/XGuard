name: Format Headless Auto Pay

on:
  push:
    branches:
      - feature/headless-auto-pay

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/headless-auto-pay
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write packages/sdk/src/auto-pay.ts tests/headless-auto-pay.test.ts packages/sdk/README.md packages/sdk/package.json packages/sdk/src/index.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sdk/src/auto-pay.ts tests/headless-auto-pay.test.ts packages/sdk/README.md packages/sdk/package.json packages/sdk/src/index.ts
          git commit -m "Format headless automated payment guard"
          git push origin HEAD:feature/headless-auto-pay
