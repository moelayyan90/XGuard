name: Package XGuard Email Shield WordPress plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/email-shield/integrations/wordpress/**"
      - ".github/workflows/email-shield-release.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build plugin archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/xguard-email-shield
          cp apps/email-shield/integrations/wordpress/xguard-email-shield.php dist/xguard-email-shield/
          cd dist
          zip -r xguard-email-shield.zip xguard-email-shield
      - name: Publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='email-shield-v3.0.0'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/xguard-email-shield.zip --clobber
          else
            gh release create "$tag" dist/xguard-email-shield.zip --title 'XGuard Email Shield v3.0.0' --notes 'Self-service WordPress integration for XGuard Email Shield.' --latest
          fi
