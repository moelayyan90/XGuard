name: Format universal webhook branch

on:
  push:
    branches:
      - agent/universal-webhook-ingress

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/universal-webhook-ingress
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format universal webhook files
        run: |
          npx prettier --write \
            apps/worker/src/universal-mainnet.ts \
            apps/worker/src/universal-webhook-ingress.ts \
            tests/universal-webhook-ingress.test.ts \
            tests/universal-webhook-source.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker/src/universal-mainnet.ts \
            apps/worker/src/universal-webhook-ingress.ts \
            tests/universal-webhook-ingress.test.ts \
            tests/universal-webhook-source.test.ts
          git commit -m "format universal webhook changes"
          git push origin HEAD:agent/universal-webhook-ingress
