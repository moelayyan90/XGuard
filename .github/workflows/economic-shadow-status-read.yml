name: Read live Economic Firewall shadow telemetry status

on:
  push:
    branches:
      - agent/economic-shadow-status-read
    paths:
      - .github/workflows/economic-shadow-status-read.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized public status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://xguard-mainnet.maqamapp.workers.dev/status > status.json
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('status.json', 'utf8'));
          const shadow = x.economicFirewallShadow;
          if (!shadow || shadow.mode !== 'observe' || shadow.telemetry !== 'operational') {
            console.error(JSON.stringify({mode: shadow?.mode ?? null, telemetry: shadow?.telemetry ?? null}));
            process.exit(1);
          }
          console.log(JSON.stringify({
            gateway: x.gateway,
            mode: x.mode,
            facilitator: x.facilitator,
            economicFirewallShadow: shadow
          }));
          NODE
          rm -f status.json
