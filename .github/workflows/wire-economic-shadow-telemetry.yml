name: Wire Economic Firewall shadow telemetry

on:
  push:
    branches:
      - agent/economic-shadow-telemetry
    paths:
      - .github/workflows/wire-economic-shadow-telemetry.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-shadow-telemetry
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Wire telemetry into observe-only mainnet path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet.ts')
          s = p.read_text()

          import_anchor = '''import {\n  deriveMainnetEconomicShadowBinding,\n  parseMainnetEconomicShadowMode,\n} from "./mainnet-economic-shadow.js";\n'''
          import_new = '''import {\n  deriveMainnetEconomicShadowBinding,\n  parseMainnetEconomicShadowMode,\n} from "./mainnet-economic-shadow.js";\nimport {\n  mainnetEconomicShadowStats,\n  pruneMainnetEconomicShadowTelemetry,\n  recordMainnetEconomicShadowObservation,\n} from "./mainnet-economic-shadow-telemetry.js";\n'''
          if import_anchor not in s:
              raise SystemExit('shadow import anchor not found')
          s = s.replace(import_anchor, import_new, 1)

          earned_anchor = '''  const earned = await context.env.DB.prepare(\n    "SELECT COUNT(*) AS count,COALESCE(SUM(fee_micro_usd),0) AS total FROM usage_events",\n  ).first<{ count: number; total: number }>();\n  return context.json({'''
          earned_new = '''  const earned = await context.env.DB.prepare(\n    "SELECT COUNT(*) AS count,COALESCE(SUM(fee_micro_usd),0) AS total FROM usage_events",\n  ).first<{ count: number; total: number }>();\n  const shadowTelemetry = await mainnetEconomicShadowStats(context.env.DB).catch(\n    (error) => {\n      console.warn(\n        JSON.stringify({\n          event: "economic_firewall_shadow_telemetry_read_failed",\n          code: errorCode(error),\n        }),\n      );\n      return null;\n    },\n  );\n  return context.json({'''
          if earned_anchor not in s:
              raise SystemExit('status earned anchor not found')
          s = s.replace(earned_anchor, earned_new, 1)

          status_anchor = '''    earnedMicroUsd: earned?.total ?? 0,\n    measuredAt: new Date().toISOString(),'''
          status_new = '''    earnedMicroUsd: earned?.total ?? 0,\n    economicFirewallShadow: {\n      mode: parseMainnetEconomicShadowMode(\n        context.env.ECONOMIC_FIREWALL_SHADOW_MODE,\n      ),\n      telemetry: shadowTelemetry === null ? "unavailable" : "operational",\n      ...(shadowTelemetry ?? {\n        intents: 0,\n        verifyEvents: 0,\n        settleEvents: 0,\n        correlatedIntents: 0,\n        settleWithoutVerifyIntents: 0,\n        authorizationMismatchEvents: 0,\n      }),\n    },\n    measuredAt: new Date().toISOString(),'''
          if status_anchor not in s:
              raise SystemExit('status response anchor not found')
          s = s.replace(status_anchor, status_new, 1)

          log_anchor = '''    console.log(\n      JSON.stringify({\n        event: "economic_firewall_shadow_bound",\n        requestId: context.get("requestId"),\n        operation,\n        merchantId: merchant.merchantId,\n        intentId: shadow.intent.intentId,\n        termsHash: shadow.intent.termsHash,\n        authorizationHash: shadow.authorizationHash,\n        amountMicroUsd: shadow.amountMicroUsd,\n      }),\n    );\n  } catch (error) {'''
          log_new = '''    console.log(\n      JSON.stringify({\n        event: "economic_firewall_shadow_bound",\n        requestId: context.get("requestId"),\n        operation,\n        merchantId: merchant.merchantId,\n        intentId: shadow.intent.intentId,\n        termsHash: shadow.intent.termsHash,\n        authorizationHash: shadow.authorizationHash,\n        amountMicroUsd: shadow.amountMicroUsd,\n      }),\n    );\n    context.executionCtx.waitUntil(\n      recordMainnetEconomicShadowObservation(\n        context.env.DB,\n        merchant.merchantId,\n        shadow,\n        operation,\n      ).catch((error) =>\n        console.warn(\n          JSON.stringify({\n            event: "economic_firewall_shadow_telemetry_write_failed",\n            requestId: context.get("requestId"),\n            operation,\n            merchantId: merchant.merchantId,\n            code: errorCode(error),\n          }),\n        ),\n      ),\n    );\n  } catch (error) {'''
          if log_anchor not in s:
              raise SystemExit('shadow bound log anchor not found')
          s = s.replace(log_anchor, log_new, 1)

          maintenance_anchor = '''  await refreshPayAIHealth(env).catch((error) =>\n    console.error(\n      JSON.stringify({ event: "payai_health_failed", code: errorCode(error) }),\n    ),\n  );\n  const nowEpoch = Math.floor(Date.now() / 1_000);'''
          maintenance_new = '''  await refreshPayAIHealth(env).catch((error) =>\n    console.error(\n      JSON.stringify({ event: "payai_health_failed", code: errorCode(error) }),\n    ),\n  );\n  if (\n    parseMainnetEconomicShadowMode(env.ECONOMIC_FIREWALL_SHADOW_MODE) ===\n    "observe"\n  )\n    await pruneMainnetEconomicShadowTelemetry(env.DB).catch((error) =>\n      console.warn(\n        JSON.stringify({\n          event: "economic_firewall_shadow_telemetry_prune_failed",\n          code: errorCode(error),\n        }),\n      ),\n    );\n  const nowEpoch = Math.floor(Date.now() / 1_000);'''
          if maintenance_anchor not in s:
              raise SystemExit('maintenance anchor not found')
          s = s.replace(maintenance_anchor, maintenance_new, 1)

          p.write_text(s)
          PY
      - name: Verify telemetry and full release candidate
        run: |
          npx prettier --write apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-shadow-telemetry.ts tests/worker/mainnet-economic-shadow-telemetry.test.ts apps/worker/migrations/0007_economic_firewall_shadow.sql
          npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Commit verified telemetry wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-shadow-telemetry.ts apps/worker/migrations/0007_economic_firewall_shadow.sql tests/worker/mainnet-economic-shadow-telemetry.test.ts
          git commit -m "feat: persist fail-open Economic Firewall shadow telemetry"
          git push origin HEAD:agent/economic-shadow-telemetry
