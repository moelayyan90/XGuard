name: Format mainnet branch

on:
  push:
    branches: [mainnet/base-usdc-treasury]
    paths:
      - "apps/worker/src/base-usdc.ts"
      - "tests/base-usdc.test.ts"
      - ".github/workflows/format-mainnet-branch.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/base-usdc-treasury
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/base-usdc.ts tests/base-usdc.test.ts
      - name: Show exact formatting diff
        run: git diff -- apps/worker/src/base-usdc.ts tests/base-usdc.test.ts
