name: Format mainnet branch

on:
  push:
    branches: [mainnet/base-usdc-treasury]
    paths:
      - "apps/worker/src/base-usdc.ts"
      - "tests/base-usdc.test.ts"
      - ".github/workflows/format-mainnet-branch.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/base-usdc-treasury
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/base-usdc.ts tests/base-usdc.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/base-usdc.ts tests/base-usdc.test.ts
          git commit -m "Format Base USDC billing files"
          git push origin HEAD:mainnet/base-usdc-treasury
