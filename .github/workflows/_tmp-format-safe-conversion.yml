name: Temporary format safe conversion branch

on:
  push:
    branches:
      - agent/safe-conversion-engine
    paths:
      - ".github/workflows/_tmp-format-safe-conversion.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/safe-conversion-engine
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format safe conversion changes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/worker/src/agent-discovery-modern.ts \
            apps/worker/src/migration-kit.ts \
            scripts/conversion-engine.mjs \
            scripts/smoke-mainnet.mjs \
            tests/migration-kit.test.ts
          rm .github/workflows/_tmp-format-safe-conversion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker/src/agent-discovery-modern.ts \
            apps/worker/src/migration-kit.ts \
            scripts/conversion-engine.mjs \
            scripts/smoke-mainnet.mjs \
            tests/migration-kit.test.ts \
            .github/workflows/_tmp-format-safe-conversion.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format safe conversion changes"
          git push origin HEAD:agent/safe-conversion-engine
