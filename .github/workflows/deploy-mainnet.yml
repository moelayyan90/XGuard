name: Deploy XGuard mainnet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: npm run verify:mainnet-release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy guarded production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::notice::Mainnet deployment is armed but waiting for Cloudflare GitHub Actions authorization."
            exit 0
          fi

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x&&x.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "${CONFIG_PATH}" \
            --database-name xguard-mainnet

          node - "${CONFIG_PATH}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const source = fs.readFileSync(path, 'utf8');
          if (!/"name"\s*:\s*"xguard-mainnet"/.test(source)) {
            throw new Error('refusing deployment: Worker target is not xguard-mainnet');
          }
          if (!/"main"\s*:\s*"src\/mainnet-modern\.ts"/.test(source)) {
            throw new Error('refusing deployment: mainnet entrypoint is not src/mainnet-modern.ts');
          }
          if (!/"database_name"\s*:\s*"xguard-mainnet"/.test(source)) {
            throw new Error('refusing deployment: D1 target is not xguard-mainnet');
          }
          const match = source.match(/"XGUARD_TREASURY_USDC_ADDRESS"\s*:\s*"([^"]+)"/);
          if (!match || !/^0x[0-9a-fA-F]{40}$/.test(match[1])) {
            throw new Error('mainnet treasury address is missing or invalid');
          }
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "${CONFIG_PATH}"
          npx wrangler deploy --config "${CONFIG_PATH}"

      - name: Verify live mainnet readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          VERIFY_TOKEN="${GITHUB_SHA:-$(date +%s)}"
          DISCOVERY_QUERY="?deploy=${VERIFY_TOKEN}"

          propagated=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\n%{http_code}' "${BASE_URL}/.well-known/agent-card.json${DISCOVERY_QUERY}&attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||x.version!=="0.4.0"||!x.xguardDiscovery||x.xguardDiscovery.preferredMcpProtocolVersion!=="2026-07-28")process.exit(1)})'; then
              propagated=1
              break
            fi
            sleep 5
          done
          if [[ "${propagated}" -ne 1 ]]; then
            echo "::error::The newly deployed XGuard discovery surface did not propagate within 90 seconds."
            exit 1
          fi

          curl -fsS --max-time 15 "${BASE_URL}/healthz" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.mode!=="mainnet")process.exit(1)})'

          root_headers="$(mktemp)"
          root_body="$(curl -fsS --max-time 15 -X POST -D "${root_headers}" "${BASE_URL}/")"
          printf '%s' "${root_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||x.mode!=="mainnet"||!x.endpoints||x.endpoints.settle!=="/settle")process.exit(1)})'
          if ! tr -d '\r' < "${root_headers}" | grep -qi '^x-xguard-discovery:[[:space:]]*root-post$'; then
            echo "::error::POST / did not return the guarded XGuard discovery response."
            cat "${root_headers}"
            rm -f "${root_headers}"
            exit 1
          fi
          rm -f "${root_headers}"

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/agent-card.json${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||x.version!=="0.4.0"||!String(x.providerManifest||"").endsWith("/.well-known/agent-card.json")&&false||!String(x.providerManifest||"").endsWith("/.well-known/x402/facilitator.json")||!Array.isArray(x.supportedInterfaces)||!x.supportedInterfaces.some(i=>i&&i.protocolBinding==="JSONRPC"&&i.protocolVersion==="0.3"&&String(i.url||"").endsWith("/a2a"))||!Array.isArray(x.skills)||!x.skills.some(k=>k&&k.id==="x402-payment-settlement")||!x.skills.some(k=>k&&k.id==="mcp-x402-discovery")||!x.xguardDiscovery||!String(x.xguardDiscovery.mcp||"").endsWith("/mcp")||x.xguardDiscovery.preferredMcpProtocolVersion!=="2026-07-28")process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/agent-market.json${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||x.version!=="0.4.0"||x.protocol!=="x402-v2"||x.network!=="eip155:8453"||!x.discovery||!String(x.discovery.agentCard||"").endsWith("/.well-known/agent-card.json")||!String(x.discovery.provider||"").endsWith("/.well-known/x402/facilitator.json")||!String(x.discovery.mcp||"").endsWith("/mcp")||x.discovery.preferredMcpProtocolVersion!=="2026-07-28")process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/x402/facilitator.json${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.kind!=="x402-facilitator"||x.status!=="production"||!x.facilitator||x.facilitator.baseUrl!=="https://xguard-mainnet.maqamapp.workers.dev"||x.facilitator.network!=="eip155:8453"||x.facilitator.scheme!=="exact"||!x.pricing||x.pricing.feeUsd!=="0.002"||!x.onboarding||x.onboarding.packageInstallationRequired!==false||!x.settlementExecution||x.settlementExecution.mode!=="routed"||x.settlementExecution.currentDownstream!=="xpay")process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/x402${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.kind!=="x402-facilitator"||x.status!=="production"||!x.facilitator||x.facilitator.network!=="eip155:8453")process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/monetization${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.manifest!=="xguard-monetization-v1"||x.schemaVersion!==1||!x.pricing||x.pricing.feeUsd!=="0.002"||!x.x402||!String(x.x402.providerManifest||"").endsWith("/.well-known/x402/facilitator.json"))process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/mcp/server.json${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="io.github.moelayyan90/xguard"||x.version!=="0.4.0"||!x.mcp||x.mcp.preferredProtocolVersion!=="2026-07-28"||!Array.isArray(x.remotes)||!x.remotes.some(r=>r&&r.type==="streamable-http"&&String(r.url||"").endsWith("/mcp")))process.exit(1)})'

          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/openapi.json${DISCOVERY_QUERY}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.openapi!=="3.1.0"||!x.paths||!x.paths["/verify"]||!x.paths["/settle"]||!x.paths["/.well-known/x402/facilitator.json"]||!x.paths["/mcp"]||!x.paths["/discovery/resources"]||!x.paths["/discovery/search"])process.exit(1)})'

          mcp_body="$(curl -fsS --max-time 15 \
            -X POST \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"xguard-deploy-smoke","version":"1.0.0"}}}}' \
            "${BASE_URL}/mcp")"
          printf '%s' "${mcp_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.jsonrpc!=="2.0"||x.id!==1||!x.result||x.result.resultType!=="complete"||!Array.isArray(x.result.supportedVersions)||!x.result.supportedVersions.includes("2026-07-28")||!x.result.capabilities||!x.result.capabilities.tools||!x.result._meta||!x.result._meta["io.modelcontextprotocol/serverInfo"])process.exit(1)})'

          llms_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/llms.txt${DISCOVERY_QUERY}")"
          if ! printf '%s' "${llms_body}" | grep -Fq '# XGuard' \
            || ! printf '%s' "${llms_body}" | grep -Fq '/.well-known/agent-card.json' \
            || ! printf '%s' "${llms_body}" | grep -Fq '/.well-known/x402/facilitator.json' \
            || ! printf '%s' "${llms_body}" | grep -Fq 'MCP:' \
            || ! printf '%s' "${llms_body}" | grep -Fq '/discovery/resources'; then
            echo "::error::llms.txt discovery metadata is missing or malformed."
            exit 1
          fi

          llms_full_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/llms-full.txt${DISCOVERY_QUERY}")"
          if ! printf '%s' "${llms_full_body}" | grep -Fq 'Settlement safety semantics' \
            || ! printf '%s' "${llms_full_body}" | grep -Fq 'Provider selection'; then
            echo "::error::llms-full.txt discovery metadata is missing or malformed."
            exit 1
          fi

          robots_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/robots.txt${DISCOVERY_QUERY}")"
          if ! printf '%s' "${robots_body}" | grep -Fq 'Allow: /' \
            || ! printf '%s' "${robots_body}" | grep -Fq '/openapi.json' \
            || ! printf '%s' "${robots_body}" | grep -Fq '/.well-known/x402/facilitator.json'; then
            echo "::error::robots.txt does not advertise XGuard discovery metadata."
            exit 1
          fi

          ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -w $'\n%{http_code}' "${BASE_URL}/readyz" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ready"||x.mainnet!==true||x.facilitator!=="operational")process.exit(1)})'; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::XGuard mainnet did not become ready within 90 seconds."
            exit 1
          fi

          curl -fsS --max-time 15 "${BASE_URL}/supported" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.kinds)||!x.kinds.some(k=>k&&k.x402Version===2&&k.network==="eip155:8453"&&k.scheme==="exact"))process.exit(1)})'

          status_ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\n%{http_code}' "${BASE_URL}/status?deploy=${VERIFY_TOKEN}&attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY"||x.facilitatorProvider!=="xpay"||!x.ambiguousRecovery||!Number.isInteger(x.ambiguousRecovery.pending)||!Number.isInteger(x.ambiguousRecovery.failed))process.exit(1)})'; then
              status_ready=1
              break
            fi
            sleep 5
          done
          if [[ "${status_ready}" -ne 1 ]]; then
            echo "::error::XGuard public status contract did not stabilize within 90 seconds."
            exit 1
          fi

          npm run smoke:mainnet
