name: Deploy XGuard mainnet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: npm run verify:mainnet-release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy guarded production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::notice::Mainnet deployment is armed but waiting for Cloudflare GitHub Actions authorization."
            exit 0
          fi

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x&&x.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "${CONFIG_PATH}" \
            --database-name xguard-mainnet

          node - "${CONFIG_PATH}" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const source = fs.readFileSync(path, "utf8");
          const required = [
            [/"name"\s*:\s*"xguard-mainnet"/, "Worker target"],
            [/"main"\s*:\s*"src\/monetized-mainnet\.ts"/, "monetized mainnet entrypoint"],
            [/"database_name"\s*:\s*"xguard-mainnet"/, "D1 target"],
            [/"XGUARD_VERIFY_FEE_MICRO_USD"\s*:\s*"200"/, "verify fee"],
            [/"XGUARD_MODEL_FEE_MICRO_USD"\s*:\s*"100"/, "model fee"],
            [/"XGUARD_TOOL_FEE_MICRO_USD"\s*:\s*"200"/, "tool fee"],
            [/"XGUARD_SOURCE_FEE_MICRO_USD"\s*:\s*"1000"/, "source fee"],
            [/"XGUARD_ANALYSIS_FEE_MICRO_USD"\s*:\s*"2000"/, "analysis fee"],
            [/"XGUARD_SECURITY_FEE_MICRO_USD"\s*:\s*"1000"/, "security fee"],
          ];
          for (const [pattern, label] of required) {
            if (!pattern.test(source)) throw new Error(`refusing deployment: invalid ${label}`);
          }
          const treasury = source.match(/"XGUARD_TREASURY_USDC_ADDRESS"\s*:\s*"([^"]+)"/);
          if (!treasury || !/^0x[0-9a-fA-F]{40}$/.test(treasury[1])) {
            throw new Error("mainnet treasury address is missing or invalid");
          }
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "${CONFIG_PATH}"
          npx wrangler deploy --config "${CONFIG_PATH}"

      - name: Verify live monetization boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          VERIFY_TOKEN="${GITHUB_SHA:-$(date +%s)}"

          propagated=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\n%{http_code}' "${BASE_URL}/.well-known/agent-card.json?deploy=${VERIFY_TOKEN}&attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||!x.xguardDiscovery)process.exit(1)})'; then
              propagated=1
              break
            fi
            sleep 5
          done
          if [[ "${propagated}" -ne 1 ]]; then
            echo "::error::The deployed XGuard discovery surface did not propagate."
            exit 1
          fi

          curl -fsS --max-time 15 "${BASE_URL}/healthz" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.mode!=="mainnet")process.exit(1)})'

          ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -w $'\n%{http_code}' "${BASE_URL}/readyz" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ready"||x.mainnet!==true||x.facilitator!=="operational")process.exit(1)})'; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::XGuard mainnet did not become ready."
            exit 1
          fi

          curl -fsS --max-time 15 "${BASE_URL}/v1/gateway/capabilities" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const b=x.billing||{};if(b.modelMicroUsd!==100||b.toolMicroUsd!==200||b.sourceMicroUsd!==1000||b.analysisMicroUsd!==2000||b.securityMicroUsd!==1000||b.chargingModel!=="prepaid-per-successful-gateway-event")process.exit(1)})'

          for path in '/discovery/resources?limit=1' '/discovery/search?query=weather'; do
            code="$(curl -sS -o /tmp/xguard-paywall.json -w '%{http_code}' --max-time 15 "${BASE_URL}${path}")"
            if [[ "${code}" != "401" ]]; then
              echo "::error::Expected unauthenticated ${path} to fail closed with 401, got ${code}."
              cat /tmp/xguard-paywall.json
              exit 1
            fi
          done

          verify_code="$(curl -sS -o /tmp/xguard-verify.json -w '%{http_code}' --max-time 15 \
            -X POST -H 'Content-Type: application/json' --data '{}' "${BASE_URL}/verify")"
          if [[ "${verify_code}" != "401" ]]; then
            echo "::error::Expected unauthenticated /verify to fail closed with 401, got ${verify_code}."
            cat /tmp/xguard-verify.json
            exit 1
          fi

          mcp_discover_code="$(curl -sS -o /tmp/xguard-mcp-discover.json -w '%{http_code}' --max-time 15 \
            -X POST \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"xguard-deploy-smoke","version":"1.0.0"}}}}' \
            "${BASE_URL}/mcp")"
          if [[ "${mcp_discover_code}" != "200" ]]; then
            echo "::error::Free MCP server discovery failed with ${mcp_discover_code}."
            cat /tmp/xguard-mcp-discover.json
            exit 1
          fi

          mcp_paid_code="$(curl -sS -o /tmp/xguard-mcp-paid.json -w '%{http_code}' --max-time 15 \
            -X POST \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: xguard_discover' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"xguard_discover","arguments":{"query":"weather"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"xguard-deploy-smoke","version":"1.0.0"}}}}' \
            "${BASE_URL}/mcp")"
          if [[ "${mcp_paid_code}" != "401" ]]; then
            echo "::error::Expected paid MCP execution without auth to fail with 401, got ${mcp_paid_code}."
            cat /tmp/xguard-mcp-paid.json
            exit 1
          fi

          status_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/status?deploy=${VERIFY_TOKEN}")"
          printf '%s' "${status_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY")process.exit(1)})'

          npm run smoke:mainnet
