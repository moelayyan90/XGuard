name: Deploy XGuard mainnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/src/mainnet*.ts"
      - "apps/worker/src/base-*.ts"
      - "apps/worker/wrangler.mainnet.jsonc"
      - "apps/worker/migrations/**"
      - "scripts/resolve-cloudflare-config.mjs"
      - ".github/workflows/deploy-mainnet.yml"

permissions:
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy guarded production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XGUARD_TREASURY_USDC_ADDRESS: ${{ secrets.XGUARD_TREASURY_USDC_ADDRESS }}
          PAYAI_API_KEY_ID: ${{ secrets.PAYAI_API_KEY_ID }}
          PAYAI_API_KEY_SECRET: ${{ secrets.PAYAI_API_KEY_SECRET }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          # Normalize common copy/paste wrappers around an API token without printing it.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${XGUARD_TREASURY_USDC_ADDRESS:-}" ]]; then
            echo "::notice::Mainnet deployment is armed but waiting for CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and XGUARD_TREASURY_USDC_ADDRESS GitHub Actions secrets."
            exit 0
          fi

          if [[ ! "${XGUARD_TREASURY_USDC_ADDRESS}" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::XGUARD_TREASURY_USDC_ADDRESS is not a valid EVM address."
            exit 1
          fi

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x&&x.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          # Keep the resolved config beside the worker source so Wrangler resolves
          # relative entrypoint and migrations paths against apps/worker.
          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "${CONFIG_PATH}" \
            --database-name xguard-mainnet

          node - "${CONFIG_PATH}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const source = fs.readFileSync(path, 'utf8');
          const marker = '"HEALTH_MAX_AGE_SECONDS": "300",';
          if (!source.includes(marker)) throw new Error('mainnet vars marker not found');
          const address = process.env.XGUARD_TREASURY_USDC_ADDRESS;
          const next = source.replace(marker, `${marker}\n    "XGUARD_TREASURY_USDC_ADDRESS": ${JSON.stringify(address)},`);
          fs.writeFileSync(path, next, 'utf8');
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "${CONFIG_PATH}"
          npx wrangler deploy --config "${CONFIG_PATH}"

          if [[ -n "${PAYAI_API_KEY_ID:-}" && -n "${PAYAI_API_KEY_SECRET:-}" ]]; then
            printf '%s' "${PAYAI_API_KEY_ID}" | npx wrangler secret put PAYAI_API_KEY_ID --config "${CONFIG_PATH}"
            printf '%s' "${PAYAI_API_KEY_SECRET}" | npx wrangler secret put PAYAI_API_KEY_SECRET --config "${CONFIG_PATH}"
          fi
