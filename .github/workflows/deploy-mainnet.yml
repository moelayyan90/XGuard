name: Deploy XGuard mainnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/src/mainnet*.ts"
      - "apps/worker/src/base-*.ts"
      - "apps/worker/wrangler.mainnet.jsonc"
      - "apps/worker/migrations/**"
      - "scripts/resolve-cloudflare-config.mjs"
      - ".github/workflows/deploy-mainnet.yml"

permissions:
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy guarded production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYAI_API_KEY_ID: ${{ secrets.PAYAI_API_KEY_ID }}
          PAYAI_API_KEY_SECRET: ${{ secrets.PAYAI_API_KEY_SECRET }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::notice::Mainnet deployment is armed but waiting for Cloudflare GitHub Actions authorization."
            exit 0
          fi

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x&&x.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "${CONFIG_PATH}" \
            --database-name xguard-mainnet

          node - "${CONFIG_PATH}" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const source = fs.readFileSync(path, 'utf8');
          const match = source.match(/"XGUARD_TREASURY_USDC_ADDRESS"\s*:\s*"([^"]+)"/);
          if (!match || !/^0x[0-9a-fA-F]{40}$/.test(match[1])) {
            throw new Error('mainnet treasury address is missing or invalid');
          }
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "${CONFIG_PATH}"
          npx wrangler deploy --config "${CONFIG_PATH}"

          if [[ -n "${PAYAI_API_KEY_ID:-}" && -n "${PAYAI_API_KEY_SECRET:-}" ]]; then
            printf '%s' "${PAYAI_API_KEY_ID}" | npx wrangler secret put PAYAI_API_KEY_ID --config "${CONFIG_PATH}"
            printf '%s' "${PAYAI_API_KEY_SECRET}" | npx wrangler secret put PAYAI_API_KEY_SECRET --config "${CONFIG_PATH}"
          fi

      - name: Verify live mainnet readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"

          curl -fsS --max-time 15 "${BASE_URL}/healthz" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.mode!=="mainnet")process.exit(1)})'

          root_headers="$(mktemp)"
          root_body="$(curl -fsS --max-time 15 -X POST -D "${root_headers}" "${BASE_URL}/")"
          printf '%s' "${root_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard"||x.mode!=="mainnet"||!x.endpoints||x.endpoints.settle!=="/settle")process.exit(1)})'
          if ! tr -d '\r' < "${root_headers}" | grep -qi '^x-xguard-discovery:[[:space:]]*root-post$'; then
            echo "::error::POST / did not return the guarded XGuard discovery response."
            cat "${root_headers}"
            rm -f "${root_headers}"
            exit 1
          fi
          rm -f "${root_headers}"

          ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -w $'\n%{http_code}' "${BASE_URL}/readyz" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ready"||x.mainnet!==true||x.facilitator!=="operational")process.exit(1)})'; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "::error::XGuard mainnet did not become ready within 90 seconds."
            exit 1
          fi

          curl -fsS --max-time 15 "${BASE_URL}/supported" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.kinds)||!x.kinds.some(k=>k&&k.x402Version===2&&k.network==="eip155:8453"&&k.scheme==="exact"))process.exit(1)})'

          curl -fsS --max-time 15 "${BASE_URL}/status" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY")process.exit(1)})'
