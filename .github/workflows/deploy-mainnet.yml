name: Deploy XGuard Email Shield

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/email-shield/**"
      - ".github/workflows/deploy-mainnet.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-email-shield-mainnet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate Email Shield source
        run: |
          set -euo pipefail
          node --check apps/email-shield/src/index.js
          node --check apps/email-shield/src/verifier.js
          node --check apps/email-shield/src/site.js
          python - <<'PY'
          import json
          json.load(open('apps/email-shield/wrangler.jsonc', encoding='utf-8'))
          PY
      - name: Create database, migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x?.name==="xguard-email-shield")?0:1)})'; then
            npx wrangler d1 create xguard-email-shield
          fi

          db_id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(v=>v?.name==="xguard-email-shield");if(!x?.uuid&&!x?.id)process.exit(1);process.stdout.write(x.uuid||x.id)})')"
          config="${RUNNER_TEMP}/xguard-email-shield.resolved.jsonc"
          node - apps/email-shield/wrangler.jsonc "$config" "$db_id" <<'NODE'
          const fs = require('node:fs');
          const [source, target, id] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(source, 'utf8'));
          const db = config.d1_databases?.find((x) => x.binding === 'DB');
          if (!db) throw new Error('DB binding missing');
          db.database_id = id;
          fs.writeFileSync(target, JSON.stringify(config, null, 2));
          NODE

          npx wrangler d1 migrations apply xguard-email-shield --remote --config "$config"
          npx wrangler deploy --config "$config"
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for base in 'https://api.xguardgate.com' 'https://xguardgate.com'; do
            ok=0
            for attempt in {1..30}; do
              if curl --fail --silent --show-error --max-time 10 "${base}/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.service!=="XGuard Email Shield")process.exit(1)})'; then ok=1; break; fi
              sleep 4
            done
            [[ "$ok" == 1 ]]
          done
          curl --fail --silent --show-error https://api.xguardgate.com/openapi.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.info?.title!=="XGuard Email Shield API"||!x.paths?.["/v1/verify"])process.exit(1)})'
      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard Email Shield production deployment failed'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='XGuard Email Shield is live and health-checked on Cloudflare'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-email-shield-deploy",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
