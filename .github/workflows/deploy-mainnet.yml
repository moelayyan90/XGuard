name: Deploy XGuard ACE Portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - ".github/workflows/deploy-mainnet.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-ace-portal-mainnet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate portal
        run: |
          set -euo pipefail
          node --check apps/portal/src/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps/portal/wrangler.jsonc','utf8'))"
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/portal/wrangler.jsonc
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for base in 'https://api.xguardgate.com' 'https://xguardgate.com'; do
            ok=0
            for attempt in {1..30}; do
              if body="$(curl --fail --silent --show-error --max-time 10 "${base}/healthz" 2>/dev/null)" && \
                printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.service!=="XGuard ACE")process.exit(1)})'; then
                ok=1
                break
              fi
              sleep 4
            done
            [[ "$ok" == 1 ]]
          done
          curl --fail --silent --show-error https://xguardgate.com/spec.json | \
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.name!=="XGuard ACE"||x.primitive!=="application-speed-bump"||x.critical_path_ai!==false)process.exit(1)})'
          curl --fail --silent --show-error https://xguardgate.com/ | grep -q 'Protect market makers from stale-quote flow.'
      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard ACE portal deployment failed'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='XGuard ACE portal is live and health-checked on Cloudflare'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-ace-deploy",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
