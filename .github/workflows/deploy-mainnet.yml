name: Deploy XGuard mainnet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xguard-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate release candidate
        run: npm run verify:mainnet-release
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy guarded production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::notice::Mainnet deployment is armed but waiting for Cloudflare GitHub Actions authorization."
            exit 0
          fi

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x&&x.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          CONFIG_PATH="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "${CONFIG_PATH}" \
            --database-name xguard-mainnet

          node - "${CONFIG_PATH}" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const source = fs.readFileSync(path, "utf8");
          const required = [
            [/"name"\s*:\s*"xguard-mainnet"/, "Worker target"],
            [/"main"\s*:\s*"src\/universal-mainnet\.ts"/, "universal mainnet entrypoint"],
            [/"database_name"\s*:\s*"xguard-mainnet"/, "D1 target"],
            [/"workers_dev"\s*:\s*false/, "workers.dev disabled"],
            [/"global_fetch_strictly_public"/, "strict public outbound fetch"],
            [/"XGUARD_FEE_MICRO_USD"\s*:\s*"40000"/, "x402 attempt fee"],
            [/"XGUARD_PAYMENT_DECISION_FEE_MICRO_USD"\s*:\s*"1000"/, "payment decision fee"],
            [/"WEBHOOK_DELIVERY_QUEUE"/, "durable webhook delivery queue"],
            [/"WEBHOOK_RATE_LIMITER"/, "webhook rate limiter"],
          ];
          for (const [pattern, label] of required) {
            if (!pattern.test(source)) throw new Error(`refusing deployment: invalid ${label}`);
          }
          const treasury = source.match(/"XGUARD_TREASURY_USDC_ADDRESS"\s*:\s*"([^"]+)"/);
          if (!treasury || !/^0x[0-9a-fA-F]{40}$/.test(treasury[1])) {
            throw new Error("mainnet treasury address is missing or invalid");
          }
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "${CONFIG_PATH}"
          npx wrangler deploy --config "${CONFIG_PATH}"

      - name: Verify live monetization boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguardgate.com"
          VERIFY_TOKEN="${GITHUB_SHA:-$(date +%s)}"

          propagated=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\n%{http_code}' "${BASE_URL}/.well-known/xguard/protocols.json?deploy=${VERIFY_TOKEN}&attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const ids=new Set((x.adapters||[]).map(a=>a.id));for(const id of ["x402","ap2","acp","visa-trusted-agent","mcp","a2a","http","openapi","graphql","json-rpc","webhook"]){if(!ids.has(id))process.exit(1)}if(x.protocolAgnostic!==true)process.exit(1)})'; then
              propagated=1
              break
            fi
            sleep 5
          done
          if [[ "${propagated}" -ne 1 ]]; then
            echo "::error::The universal XGuard protocol registry did not propagate."
            exit 1
          fi

          payment_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/payment-manifest?deploy=${VERIFY_TOKEN}")"
          printf '%s' "${payment_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const p=x.pricing||{};if(p.amountUsd!=="0.04"||p.amountMicroUsd!==40000||p.event!=="accepted_authenticated_economic_attempt")process.exit(1);if(!x.onboarding?.human||!x.execution?.verify||!x.execution?.settle)process.exit(1)})'

          agent_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/.well-known/agent-card.json?deploy=${VERIFY_TOKEN}")"
          printf '%s' "${agent_body}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.supportedInterfaces)||!x.supportedInterfaces.some(i=>i&&i.protocolVersion==="1.0"&&i.protocolBinding==="JSONRPC"))process.exit(1)})'

          curl -fsS --max-time 15 -H 'Accept: text/html' "${BASE_URL}/pay?deploy=${VERIFY_TOKEN}" | grep -q '\$0.04'

          health_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/healthz?deploy=${VERIFY_TOKEN}")"
          printf '%s' "${health_body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.mode!=="mainnet")process.exit(1)})'

          ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\n%{http_code}' "${BASE_URL}/readyz?deploy=${VERIFY_TOKEN}&attempt=${attempt}" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ready"||x.mainnet!==true||x.facilitator!=="operational")process.exit(1)})'; then
              ready=1
              break
            fi
            sleep 5
          done
          [[ "${ready}" -eq 1 ]] || { echo "::error::XGuard mainnet did not become ready."; exit 1; }

          for path in '/discovery/resources?limit=1' '/discovery/search?query=weather'; do
            code="$(curl -sS -o /tmp/xguard-paywall.json -w '%{http_code}' --max-time 15 "${BASE_URL}${path}")"
            [[ "${code}" == "401" ]] || { echo "::error::Expected ${path} to require auth, got ${code}."; exit 1; }
          done

          verify_code="$(curl -sS -o /tmp/xguard-verify.json -w '%{http_code}' --max-time 15 -X POST -H 'Content-Type: application/json' --data '{}' "${BASE_URL}/verify")"
          [[ "${verify_code}" == "401" ]] || { echo "::error::Expected /verify to require auth, got ${verify_code}."; exit 1; }

          status_body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${BASE_URL}/status?deploy=${VERIFY_TOKEN}")"
          printf '%s' "${status_body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY")process.exit(1)})'

          npm run smoke:mainnet
