name: Format child safety once

on:
  push:
    branches: [agent/child-safety-platform]
    paths:
      - apps/worker/src/child-safety.ts
      - apps/worker/src/universal-mainnet.ts
      - apps/worker/wrangler.mainnet.jsonc
      - tests/child-safety.test.ts
      - docs/CHILD_SAFETY.md
      - docs/child-safety-openapi.yaml
      - README.md
      - scripts/check-docs.mjs
      - .github/workflows/format-child-safety-temp.yml

permissions:
  contents: write

concurrency:
  group: format-child-safety
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx prettier --write
          apps/worker/src/child-safety.ts
          apps/worker/src/universal-mainnet.ts
          apps/worker/wrangler.mainnet.jsonc
          tests/child-safety.test.ts
          docs/CHILD_SAFETY.md
          docs/child-safety-openapi.yaml
          README.md
          scripts/check-docs.mjs
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety.ts apps/worker/src/universal-mainnet.ts apps/worker/wrangler.mainnet.jsonc tests/child-safety.test.ts docs/CHILD_SAFETY.md docs/child-safety-openapi.yaml README.md scripts/check-docs.mjs
          git commit -m "Format child safety platform"
          git push origin HEAD:agent/child-safety-platform
