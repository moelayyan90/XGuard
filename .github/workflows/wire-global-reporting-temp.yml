name: Wire global child safety reporting once

on:
  push:
    branches: [agent/global-child-safety-reporting]
    paths:
      - .github/workflows/wire-global-reporting-temp.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/global-child-safety-reporting
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Wire verified reporting directory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          u=Path('apps/worker/src/universal-mainnet.ts')
          s=u.read_text()
          needle='import { childSafetyInstitutionalResponse } from "./child-safety-institutional.js";\n'
          addition=needle+'import { childSafetyReportingDirectoryResponse } from "./child-safety-reporting-directory.js";\n'
          if 'childSafetyReportingDirectoryResponse' not in s:
              s=s.replace(needle,addition)
          needle2='    const childSafetyInstitutional =\n      childSafetyInstitutionalResponse(standardRequest);\n'
          block='    const childSafetyReporting =\n      childSafetyReportingDirectoryResponse(standardRequest);\n    if (childSafetyReporting !== null) return childSafetyReporting;\n\n'+needle2
          if 'const childSafetyReporting =' not in s:
              s=s.replace(needle2,block)
          u.write_text(s)

          p=Path('apps/worker/src/child-safety-institutional.ts')
          s=p.read_text()
          old='  )}<section class="partners">${items}</section><section class="panel"><h2>Emergency boundary</h2><p>If a child is in immediate physical danger, users must contact the local emergency service or police for the child’s current location. XGuard is a technology provider, not an emergency-response authority.</p></section>`;'
          new='  )}<section class="partners">${items}</section><section class="cta"><h2>Verified country routing</h2><p><a href="/child-safety/reporting-directory">Open XGuard’s verified reporting directory →</a></p><p>Direct numbers are published only when a current authoritative source provides them.</p></section><section class="panel"><h2>Emergency boundary</h2><p>If a child is in immediate physical danger, users must contact the local emergency service or police for the child’s current location. XGuard is a technology provider, not an emergency-response authority.</p></section>`;'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          npx prettier --write apps/worker/src/universal-mainnet.ts apps/worker/src/child-safety-reporting-directory.ts apps/worker/src/child-safety-institutional.ts tests/child-safety-reporting-directory.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/universal-mainnet.ts apps/worker/src/child-safety-reporting-directory.ts apps/worker/src/child-safety-institutional.ts tests/child-safety-reporting-directory.test.ts
          git commit -m "Wire verified global child safety reporting" || true
          git push origin HEAD:agent/global-child-safety-reporting

# trigger
