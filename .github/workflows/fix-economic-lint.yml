name: Fix Economic Firewall lint

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/fix-economic-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - name: Replace empty environment interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/economic-intent-coordinator.ts')
          s = p.read_text()
          old = 'export interface EconomicIntentCoordinatorEnv {}'
          new = 'export type EconomicIntentCoordinatorEnv = object;'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write apps/worker/src/economic-intent-coordinator.ts
      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/economic-intent-coordinator.ts
          git commit -m "fix: satisfy Economic Intent coordinator lint"
          git push origin HEAD:agent/economic-firewall-v2
