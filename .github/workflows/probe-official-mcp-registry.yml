name: Verify XGuard in Official MCP Registry

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query official registry API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          name = "io.github.moelayyan90/xguard"
          url = "https://registry.modelcontextprotocol.io/v0.1/servers?" + urllib.parse.urlencode({"search": name, "version": "latest"})
          req = urllib.request.Request(url, headers={"User-Agent":"XGuard-registry-status-check/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8", "replace")
              print("STATUS", r.status)
              print("BODY", body)
          data = json.loads(body)
          matches = []
          for item in data.get("servers", []):
              server = item.get("server", item)
              if str(server.get("name", "")).lower() == name.lower():
                  matches.append(item)
          print("MATCH_COUNT", len(matches))
          if matches:
              print("MATCH", json.dumps(matches[0], sort_keys=True))
          PY
