name: Build release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Pack publishable workspaces
        run: |
          mkdir release-artifacts
          npm pack --workspace @xguard/core --pack-destination release-artifacts
          npm pack --workspace @xguard/sdk --pack-destination release-artifacts
          npm pack --workspace xguard --pack-destination release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
