name: Format zero-friction PR

on:
  push:
    branches: [agent/zero-friction-x402]

permissions:
  contents: write

jobs:
  format:
    if: github.repository_owner == 'moelayyan90' && github.event.head_commit.message != 'chore: format zero-friction changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-friction-x402
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fix stale import and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/zero-friction-x402.ts')
          text = path.read_text().replace('  zeroFrictionAccount,\n', '')
          path.write_text(text)
          PY
          npx prettier --write apps/worker/src/mainnet-endpoint-discovery.ts apps/worker/src/public-payment-contract.ts apps/worker/src/universal-mainnet.ts apps/worker/src/zero-friction-billing.ts apps/worker/src/zero-friction-x402.ts tests/mainnet-endpoint-discovery.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'xguard-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/worker/src/mainnet-endpoint-discovery.ts apps/worker/src/public-payment-contract.ts apps/worker/src/universal-mainnet.ts apps/worker/src/zero-friction-billing.ts apps/worker/src/zero-friction-x402.ts tests/mainnet-endpoint-discovery.test.ts
          git commit -m 'chore: format zero-friction changes'
          git push origin HEAD:agent/zero-friction-x402
