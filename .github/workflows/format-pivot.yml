name: Format pivot branch

on:
  push:
    branches:
      - pivot/eudr-network

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pivot/eudr-network
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format pivot files
        run: >-
          npx prettier --write
          apps/worker/src/eudr-network.ts
          apps/worker/src/eudr-smart-employee-site.ts
          apps/worker/src/operations-employee.ts
          apps/worker/wrangler.mainnet.jsonc
          CROSS_BORDER_OPERATIONS.md
          EUDR_NETWORK.md
          EUDR_OPERATIONS_ENGINE.md
          README.md
          tests/eudr-network-source.test.ts
          tests/operations-employee-source.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/worker/src/eudr-network.ts \
            apps/worker/src/eudr-smart-employee-site.ts \
            apps/worker/src/operations-employee.ts \
            apps/worker/wrangler.mainnet.jsonc \
            CROSS_BORDER_OPERATIONS.md \
            EUDR_NETWORK.md \
            EUDR_OPERATIONS_ENGINE.md \
            README.md \
            tests/eudr-network-source.test.ts \
            tests/operations-employee-source.test.ts
          git commit -m "Format cross-border operations pivot"
          git push origin HEAD:pivot/eudr-network
