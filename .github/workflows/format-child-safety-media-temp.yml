name: Format child safety media once

on:
  push:
    branches: [agent/child-safety-media-scan]
    paths:
      - .github/workflows/format-child-safety-media-temp.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/child-safety-media-scan
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx prettier --write
          apps/worker/src/child-safety-media.ts
          apps/worker/src/universal-mainnet.ts
          packages/sdk/src/child-safety-media.ts
          tests/child-safety-media-sdk.test.ts
          tests/child-safety-media.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety-media.ts apps/worker/src/universal-mainnet.ts packages/sdk/src/child-safety-media.ts tests/child-safety-media-sdk.test.ts tests/child-safety-media.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format child safety media implementation"
          git push origin HEAD:agent/child-safety-media-scan
