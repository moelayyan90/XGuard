name: PressPilot CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
          PRESSPILOT_STORAGE: memory
        run: pytest -q tests
      - name: Compile check
        run: python -m compileall -q .
