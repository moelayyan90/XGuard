name: Format provider discovery

on:
  push:
    branches:
      - agent/provider-discovery-surface

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/provider-discovery-surface

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Apply repository Prettier version
        run: npx prettier --write apps/worker/src/discovery.ts tests/discovery.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/worker/src/discovery.ts tests/discovery.test.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/discovery.ts tests/discovery.test.ts
          git commit -m "style: format provider discovery"
          git push origin HEAD:agent/provider-discovery-surface
