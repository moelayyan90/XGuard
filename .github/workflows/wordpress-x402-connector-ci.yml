name: XGuard WordPress x402 Connector CI

on:
  pull_request:
    paths:
      - "integrations/wordpress/xguard-x402-connector/**"
      - ".github/workflows/wordpress-x402-connector-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/wordpress/xguard-x402-connector/**"
      - ".github/workflows/wordpress-x402-connector-ci.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy XGuard Relay"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate PHP and connector contract
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l integrations/wordpress/xguard-x402-connector/xguard-x402-connector.php
          php -l integrations/wordpress/xguard-x402-connector/test-contract.php
          php integrations/wordpress/xguard-x402-connector/test-contract.php

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate the candidate x402 compatibility metadata
        run: |
          npm ci --prefix apps/relay --no-audit --no-fund
          node apps/relay/test/public-metadata.mjs

      - name: Validate canonical production x402 compatibility surface after deployment
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://api.xguardgate.com/supported \
            | jq -e '.kinds | type == "array" and length > 0' >/dev/null
          curl --fail --silent --show-error --max-time 15 https://api.xguardgate.com/facilitator \
            | jq -e '.version == "5.2.0" and .x402Version == 2 and .endpoints.verify and .endpoints.settle and .capabilities.settlement_ambiguous_fail_closed == true' >/dev/null

      - name: Build installable WordPress plugin zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xguard-wp/xguard-x402-connector
          cp integrations/wordpress/xguard-x402-connector/xguard-x402-connector.php /tmp/xguard-wp/xguard-x402-connector/
          cp integrations/wordpress/xguard-x402-connector/README.md /tmp/xguard-wp/xguard-x402-connector/
          cd /tmp/xguard-wp
          zip -qr "$GITHUB_WORKSPACE/xguard-x402-wordpress-connector-1.0.0.zip" xguard-x402-connector
          unzip -l "$GITHUB_WORKSPACE/xguard-x402-wordpress-connector-1.0.0.zip" | grep -q 'xguard-x402-connector/xguard-x402-connector.php'
