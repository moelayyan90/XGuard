name: Verify XGuard Public Metadata Production

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/src/canonical-entry.js"
      - "apps/relay/src/public-metadata.js"
      - "apps/relay/src/a2a-entry.js"
      - "apps/relay/src/paid-agent-entry.js"
      - ".github/workflows/verify-public-metadata-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wait for canonical 5.1.0 metadata deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..45}; do
            node scripts/verify-production-identity.mjs && { ready=1; break; }
            sleep 4
          done
          test "$ready" = "1"

      - name: Verify security headers and HEAD parity
        shell: bash
        run: |
          set -euo pipefail
          for path in architecture openapi.json .well-known/xguard.json .well-known/ai-plugin.json .well-known/agent-card.json; do
            headers="$(mktemp)"
            curl --fail --silent --show-error --max-time 8 -D "$headers" "https://api.xguardgate.com/$path" -o /dev/null
            grep -qi '^strict-transport-security: .*max-age=31536000' "$headers"
            grep -qi '^x-xguard-version: 5.1.0' "$headers"
            curl --fail --silent --show-error --max-time 8 -I "https://api.xguardgate.com/$path" -o /dev/null
          done
