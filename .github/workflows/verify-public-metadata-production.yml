name: Verify XGuard Public Metadata Production

on:
  workflow_run:
    workflows: ["Deploy XGuard Relay"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wait for canonical 5.1.0 metadata deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..45}; do
            headers="$(mktemp)"
            curl --silent --show-error --max-time 8 -H 'x-xguard-traffic-class: synthetic' -H 'user-agent: xguard-public-metadata-verifier/5.1.0' -D "$headers" 'https://api.xguardgate.com/v1/ready?metadata-verification=1' -o /dev/null || true
            if grep -qi "^x-xguard-worker-version-tag: git-${DEPLOY_SHA:0:12}" "$headers" && node scripts/verify-production-identity.mjs; then ready=1; break; fi
            sleep 4
          done
          test "$ready" = "1"

      - name: Verify security headers and HEAD parity
        shell: bash
        run: |
          set -euo pipefail
          curl() { command curl -H 'x-xguard-traffic-class: synthetic' -H 'user-agent: xguard-public-metadata-verifier/5.1.0' "$@"; }
          for path in architecture openapi.json .well-known/xguard.json .well-known/ai-plugin.json .well-known/agent-card.json; do
            headers="$(mktemp)"
            curl --fail --silent --show-error --max-time 8 -D "$headers" "https://api.xguardgate.com/$path" -o /dev/null
            grep -qi '^strict-transport-security: .*max-age=31536000' "$headers"
            grep -qi '^x-xguard-version: 5.1.0' "$headers"
            curl --fail --silent --show-error --max-time 8 -I "https://api.xguardgate.com/$path" -o /dev/null
          done
