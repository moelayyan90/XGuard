name: Deploy Economic Firewall preview branch
# Re-run E2E after settlement RPC serialization fix.

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - apps/worker/src/economic-firewall.ts
      - apps/worker/src/economic-intent-coordinator.ts
      - apps/worker/wrangler.economic-preview.jsonc
      - packages/core/src/economic-intent.ts
      - packages/core/src/edge.ts
      - packages/core/src/index.ts
      - apps/worker/package.json
      - package.json
      - .github/workflows/deploy-economic-preview-branch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xguard-economic-preview-branch-deploy
  cancel-in-progress: true

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify release candidate
        run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Deploy isolated preview and run zero-value E2E
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          mkdir -p economic-preview-diagnostics
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "cloudflare_ci_authorization_unavailable" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi

          CONFIG="apps/worker/wrangler.economic-preview.jsonc"
          npx wrangler deploy --config "$CONFIG"

          PREVIEW_TOKEN="$(node -e 'const {createHmac}=require("node:crypto"); process.stdout.write(createHmac("sha256", process.env.CLOUDFLARE_API_TOKEN).update("xguard-economic-preview-v1").digest("hex"));')"
          printf '%s' "$PREVIEW_TOKEN" | npx wrangler secret put PREVIEW_API_TOKEN --config "$CONFIG"

          BASE_URL="https://xguard-economic-preview.maqamapp.workers.dev"
          HEALTH_OK=0
          for attempt in {1..12}; do
            HEALTH_STATUS="$(curl -sS -o economic-preview-diagnostics/health-body.txt -w '%{http_code}' "$BASE_URL/healthz" || true)"
            printf '%s' "$HEALTH_STATUS" > economic-preview-diagnostics/health-status.txt
            if [[ "$HEALTH_STATUS" == "200" ]]; then
              HEALTH_OK=1
              break
            fi
            sleep 5
          done
          if [[ "$HEALTH_OK" != "1" ]]; then
            echo "health" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi
          node -e 'const f=require("fs"); const x=JSON.parse(f.readFileSync("economic-preview-diagnostics/health-body.txt","utf8")); if(x.status!=="ok") process.exit(1);'

          EXPIRES_AT="$(node -e 'console.log(new Date(Date.now()+10*60*1000).toISOString())')"
          NONCE="$(node -e 'console.log(require("node:crypto").randomUUID())')"
          CREATE_BODY="$(node -e 'process.stdout.write(JSON.stringify({actorId:"ci-preview-agent",protocol:"preview",resource:{method:"GET",url:"https://example.com/",bodyHash:null},money:{maxAmountMicroUsd:0,currency:"USD",network:null,asset:null},expiresAt:process.argv[1],nonce:process.argv[2],metadataHash:null}))' "$EXPIRES_AT" "$NONCE")"

          CREATE_STATUS="$(curl -sS -o economic-preview-diagnostics/create-body.txt -w '%{http_code}' -X POST "$BASE_URL/v1/intents" -H "Authorization: Bearer $PREVIEW_TOKEN" -H 'Content-Type: application/json' --data "$CREATE_BODY" || true)"
          printf '%s' "$CREATE_STATUS" > economic-preview-diagnostics/create-status.txt
          if [[ "$CREATE_STATUS" != "201" && "$CREATE_STATUS" != "200" ]]; then
            echo "create" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi
          INTENT_ID="$(cat economic-preview-diagnostics/create-body.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!/^xi_[0-9a-f]{40}$/.test(x.intentId))process.exit(1);process.stdout.write(x.intentId);});')"

          AUTHORIZE_STATUS="$(curl -sS -o economic-preview-diagnostics/authorize-body.txt -w '%{http_code}' -X POST "$BASE_URL/v1/intents/$INTENT_ID/authorize" \
            -H "Authorization: Bearer $PREVIEW_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"authorization":{"kind":"ci-zero-value-preview"},"authorizedAmountMicroUsd":0}' || true)"
          printf '%s' "$AUTHORIZE_STATUS" > economic-preview-diagnostics/authorize-status.txt
          if [[ "$AUTHORIZE_STATUS" != "200" ]]; then
            echo "authorize" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi

          EXEC_STATUS="$(curl -sS -o economic-preview-diagnostics/execute-body.txt -w '%{http_code}' -X POST "$BASE_URL/v1/intents/$INTENT_ID/execute" \
            -H "Authorization: Bearer $PREVIEW_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"headers":{"accept":"text/html"}}' || true)"
          printf '%s' "$EXEC_STATUS" > economic-preview-diagnostics/execute-status.txt
          if [[ "$EXEC_STATUS" != "200" ]]; then
            echo "execute" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi

          SNAPSHOT_STATUS="$(curl -sS -o economic-preview-diagnostics/snapshot-body.txt -w '%{http_code}' "$BASE_URL/v1/intents/$INTENT_ID" -H "Authorization: Bearer $PREVIEW_TOKEN" || true)"
          printf '%s' "$SNAPSHOT_STATUS" > economic-preview-diagnostics/snapshot-status.txt
          if [[ "$SNAPSHOT_STATUS" != "200" ]]; then
            echo "snapshot" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi
          cat economic-preview-diagnostics/snapshot-body.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.state!=="FULFILLED"||!x.fulfillmentHash)process.exit(1);});'

          SETTLE_STATUS="$(curl -sS -o economic-preview-diagnostics/settle-body.txt -w '%{http_code}' -X POST "$BASE_URL/v1/intents/$INTENT_ID/settle" \
            -H "Authorization: Bearer $PREVIEW_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"protocol":"preview","settlement":{"kind":"ci-zero-value-preview"},"chargedAmountMicroUsd":0}' || true)"
          printf '%s' "$SETTLE_STATUS" > economic-preview-diagnostics/settle-status.txt
          if [[ "$SETTLE_STATUS" != "200" ]]; then
            echo "settle" > economic-preview-diagnostics/failure-stage.txt
            exit 1
          fi
          cat economic-preview-diagnostics/settle-body.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.state!=="FINAL"||x.proof?.result!=="EXACTLY_ONCE"||x.proof?.chargedAmountMicroUsd!==0)process.exit(1); console.log(JSON.stringify({intentId:x.intentId,state:x.state,result:x.proof.result,proofHash:x.proof.proofHash}));});'
          echo "success" > economic-preview-diagnostics/failure-stage.txt
      - name: Upload Economic Firewall E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-preview-e2e-diagnostics
          path: economic-preview-diagnostics
          if-no-files-found: warn
