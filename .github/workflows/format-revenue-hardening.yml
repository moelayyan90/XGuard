name: Format revenue hardening

on:
  push:
    branches: [agent/mainnet-revenue-hardening]

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mainnet-revenue-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format hardening files
        run: |
          npx prettier --write \
            apps/worker/src/mainnet-revenue-hardening.ts \
            apps/worker/src/mainnet-supervisor.ts \
            apps/worker/wrangler.mainnet.jsonc \
            tests/mainnet-revenue-hardening-source.test.ts \
            tests/worker/mainnet-revenue-hardening.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/worker/src/mainnet-revenue-hardening.ts \
            apps/worker/src/mainnet-supervisor.ts \
            apps/worker/wrangler.mainnet.jsonc \
            tests/mainnet-revenue-hardening-source.test.ts \
            tests/worker/mainnet-revenue-hardening.test.ts
          git commit -m 'Format mainnet revenue hardening'
          git push origin HEAD:agent/mainnet-revenue-hardening
