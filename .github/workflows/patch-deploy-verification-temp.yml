name: Patch mainnet deploy verification

on:
  push:
    branches:
      - agent/harden-mainnet-deploy-verification
    paths:
      - ".github/workflows/patch-deploy-verification-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make post-deploy status verification propagation-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deploy-mainnet.yml")
          text = path.read_text()
          old = '''          curl -fsS --max-time 15 "${BASE_URL}/status" \\
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY"||x.facilitatorProvider!=="xpay"||!x.ambiguousRecovery||!Number.isInteger(x.ambiguousRecovery.pending)||!Number.isInteger(x.ambiguousRecovery.failed))process.exit(1)})'\n'''
          new = '''          status_ready=0
          for attempt in {1..18}; do
            response="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -w $'\\n%{http_code}' "${BASE_URL}/status?deploy=${VERIFY_TOKEN}&attempt=${attempt}" || true)"
            code="${response##*$'\\n'}"
            body="${response%$'\\n'*}"
            if [[ "${code}" == "200" ]] && printf '%s' "${body}" \\
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet"||x.facilitator!=="HEALTHY"||x.facilitatorProvider!=="xpay"||!x.ambiguousRecovery||!Number.isInteger(x.ambiguousRecovery.pending)||!Number.isInteger(x.ambiguousRecovery.failed))process.exit(1)})'; then
              status_ready=1
              break
            fi
            sleep 5
          done
          if [[ "${status_ready}" -ne 1 ]]; then
            echo "::error::XGuard public status contract did not stabilize within 90 seconds."
            exit 1
          fi

          npm run smoke:mainnet
'''
          if old not in text:
              raise SystemExit("expected final /status verification block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-mainnet.yml
          git commit -m "fix: retry post-deploy public status verification"
          git push origin HEAD:agent/harden-mainnet-deploy-verification
