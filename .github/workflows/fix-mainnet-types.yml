name: Fix mainnet RPC typing

on:
  push:
    branches:
      - mainnet/live-worker
    paths:
      - ".github/workflows/fix-mainnet-types.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/live-worker
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply explicit RPC union typing
        run: >-
          python -c "from pathlib import Path; p=Path('apps/worker/src/mainnet.ts'); s=p.read_text(); s=s.replace('import {\\n  MainnetPaymentCoordinator,\\n  MainnetRequestGate,\\n} from \\\"./mainnet-coordinator.js\\\";', 'import {\\n  MainnetPaymentCoordinator,\\n  MainnetRequestGate,\\n  type MainnetPrepareResult,\\n} from \\\"./mainnet-coordinator.js\\\";'); s=s.replace('    const prepared = await stub.prepare({\\n      logicalPaymentKey: identities.logicalPaymentKey,\\n      requestFingerprint: identities.requestFingerprint,\\n      merchantId: merchant.merchantId,\\n      network,\\n    });', '    const prepared = (await stub.prepare({\\n      logicalPaymentKey: identities.logicalPaymentKey,\\n      requestFingerprint: identities.requestFingerprint,\\n      merchantId: merchant.merchantId,\\n      network,\\n    })) as MainnetPrepareResult;'); p.write_text(s)"
      - run: npx prettier --write apps/worker/src/mainnet.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet.ts
          git commit -m "Fix mainnet coordinator RPC result typing"
          git push origin HEAD:mainnet/live-worker
