name: XGuard site live diagnostic

on:
  push:
    branches: [diag/site-live-20260821]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify apex, www, and fallback
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            apex_dns="$(getent ahosts xguardgate.com | head -1 || true)"
            www_dns="$(getent ahosts www.xguardgate.com | head -1 || true)"
            apex_code="$(curl -sS -L -o /tmp/apex.html -w '%{http_code}' --max-time 15 https://xguardgate.com/ || true)"
            www_code="$(curl -sS -L -o /tmp/www.html -w '%{http_code}' --max-time 15 https://www.xguardgate.com/ || true)"
            fallback_code="$(curl -sS -L -o /tmp/fallback.html -w '%{http_code}' --max-time 15 https://xguard-public.maqamapp.workers.dev/ || true)"
            status_code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 15 https://xguardgate.com/v1/commerce/status || true)"
            echo "attempt=${attempt} apex_dns=${apex_dns:-missing} www_dns=${www_dns:-missing} apex_http=${apex_code} www_http=${www_code} fallback_http=${fallback_code} status_http=${status_code}"
            if [[ "$apex_code" == "200" && "$www_code" == "200" && "$fallback_code" == "200" && "$status_code" == "200" ]] && \
               grep -q 'XGuard' /tmp/apex.html && grep -q 'XGuard' /tmp/www.html && grep -q 'XGuard' /tmp/fallback.html && \
               node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("/tmp/status.json","utf8"));if(x.mode!=="global-commerce-hunter")process.exit(1)'; then
              echo 'XGuard apex, www, fallback and commerce status are live.'
              exit 0
            fi
            sleep 5
          done
          exit 1
