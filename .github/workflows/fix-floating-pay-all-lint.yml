name: Fix Floating Pay All Lint

on:
  push:
    branches:
      - feature/floating-pay-all

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/floating-pay-all
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply lint fixes and format
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'browser-extension/content.js';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '/* global chrome, document, MutationObserver, HTMLInputElement, location, setTimeout, clearTimeout */',
            '/* global chrome, document, MutationObserver, HTMLInputElement, location, setTimeout, clearTimeout, setInterval */',
          );
          source = source.replace(
            '  const SUCCESS_WORDS =\n    /\\b(payment complete|payment successful|order confirmed|thank you for your order|purchase complete)\\b|تمت الدفعة|تم الدفع|تم تأكيد الطلب|شكراً لطلبك/i;\n',
            '',
          );
          fs.writeFileSync(path, source);
          NODE
          npx prettier --write browser-extension/content.js
          npx eslint browser-extension/content.js --max-warnings=0
      - name: Commit lint fix if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/content.js
          git commit -m "Fix floating Pay All lint"
          git push origin HEAD:feature/floating-pay-all
