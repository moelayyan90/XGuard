name: Verify XGuard scheduled runtime

on:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-runtime-once.yml"

permissions:
  contents: read

jobs:
  verify-cron:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Observe a full production top-up scan cadence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare credentials unavailable"
            exit 1
          fi

          # Automatic chain scans are intentionally bounded to a five-minute cadence.
          # Observe longer than one complete cadence so this check cannot pass merely
          # because its tail window happened to fall between scan opportunities.
          log_file="$(mktemp)"
          timeout 370s npx wrangler tail xguard-mainnet \
            --format=json \
            --search automatic_topup_ \
            > "${log_file}" 2>&1 || true

          cat "${log_file}"
          if grep -q 'automatic_topup_scan_failed' "${log_file}"; then
            echo "::error::Automatic top-up scanner emitted a fatal failure during the full-cadence production check."
            exit 1
          fi

          if grep -q 'automatic_topup_scan_deferred' "${log_file}"; then
            echo "::warning::All configured RPC providers were temporarily unavailable during one scan; XGuard deferred safely instead of failing the cron."
          fi

          if grep -q 'automatic_topup_rpc_failover_recovered' "${log_file}"; then
            echo "::notice::RPC failover recovered an automatic top-up scan during the production check."
          fi

          echo "Full-cadence production cron check completed without automatic_topup_scan_failed."
