name: Verify XGuard scheduled runtime

on:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-cron:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Observe one production cron cycle
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare credentials unavailable"
            exit 1
          fi

          log_file="$(mktemp)"
          timeout 80s npx wrangler tail xguard-mainnet \
            --format=json \
            --search automatic_topup_scan_failed \
            > "${log_file}" 2>&1 || true

          cat "${log_file}"
          if grep -q 'automatic_topup_scan_failed' "${log_file}"; then
            echo "::error::Automatic top-up scanner failed during the post-deploy production cron check."
            exit 1
          fi

          echo "Production cron check completed without automatic top-up scan failures."
