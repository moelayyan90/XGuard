name: Verify PayPal credentials without a transaction
on:
  push:
    branches: [fix/live-paypal-readiness-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xguard-production
  cancel-in-progress: false
jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Preserve a proven source annotation after encrypted configuration refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/paypal-preview-metadata.mjs
      - name: Check live OAuth without creating an order, capture or transfer
        env:
          LIVE_ADMIN_KEY: ${{ secrets.LIVE_ADMIN_KEY || secrets.XGUARD_OPERATOR_KEY }}
        run: node scripts/paypal-readiness-check.mjs
