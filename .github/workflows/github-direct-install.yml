name: Verify direct GitHub CLI install

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/cli/**"
      - "packages/core/**"
      - ".github/workflows/github-direct-install.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/cli/**"
      - "packages/core/**"
      - ".github/workflows/github-direct-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve source revision
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run CLI directly from public GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          SPEC="git+https://github.com/moelayyan90/XGuard.git#${{ steps.ref.outputs.sha }}"
          npm exec --yes --package="$SPEC" -- xguard --help | tee /tmp/xguard-help.txt
          grep -qi 'xguard' /tmp/xguard-help.txt

      - name: Verify installed CLI can execute doctor help without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          SPEC="git+https://github.com/moelayyan90/XGuard.git#${{ steps.ref.outputs.sha }}"
          npm exec --yes --package="$SPEC" -- xguard doctor --help | tee /tmp/xguard-doctor.txt
          grep -qi 'doctor' /tmp/xguard-doctor.txt
