name: Fix Economic Firewall body types

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/fix-economic-body-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - name: Make HTTP bodies concrete ArrayBuffers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/economic-firewall.ts')
          s = p.read_text()
          s = s.replace(
              'return new Response(mayHaveBody ? responseBody : null, {',
              'return new Response(mayHaveBody ? toArrayBuffer(responseBody) : null, {',
              1,
          )
          s = s.replace(
              '): { headers: Headers; body: Uint8Array | undefined } {',
              '): { headers: Headers; body: ArrayBuffer | undefined } {',
              1,
          )
          s = s.replace(
              '  return { headers, body: bytes };\n}\n\nfunction assertSafeResourceUrl',
              '  return {\n    headers,\n    body: bytes === undefined ? undefined : toArrayBuffer(bytes),\n  };\n}\n\nfunction assertSafeResourceUrl',
              1,
          )
          marker = 'function sha256BytesHex(value: Uint8Array): string {'
          helper = '''function toArrayBuffer(value: Uint8Array): ArrayBuffer {\n  const copy = new Uint8Array(value.byteLength);\n  copy.set(value);\n  return copy.buffer;\n}\n\n'''
          if marker not in s:
              raise SystemExit('sha256 marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          npx prettier --write apps/worker/src/economic-firewall.ts
      - name: Commit type fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/economic-firewall.ts
          git commit -m "fix: use concrete ArrayBuffer HTTP bodies"
          git push origin HEAD:agent/economic-firewall-v2
