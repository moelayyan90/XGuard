name: Probe MCPServerDirectory public submit flow

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public submission form and request shape
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://mcpserverdirectory.org"
          url = base + "/submit"
          ua = {"User-Agent":"Mozilla/5.0 XGuard-registry-check"}
          req = urllib.request.Request(url, headers=ua)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
              print("PAGE_STATUS", r.status, "FINAL", r.geturl())
          print("PAGE_LENGTH", len(html))
          for tag in re.findall(r'<form\b[^>]*>|<(?:input|textarea|select|button)\b[^>]*>', html, re.I):
              print("TAG", tag)
          for needle in ["/api/","submit","github","repository","fetch(","method:","POST","action=","captcha","turnstile","recaptcha","supabase","firebase"]:
              for m in list(re.finditer(re.escape(needle), html, re.I))[:20]:
                  a=max(0,m.start()-900); b=min(len(html),m.end()+1800)
                  print("HTML_NEEDLE", needle, html[a:b].replace("\n"," "))

          candidates=set()
          for pat in [r'(?:src|href)=[\"\']([^\"\']+\.js(?:\?[^\"\']*)?)[\"\']', r'(/_next/static/[^\"\'<> ]+\.js)']:
              candidates.update(re.findall(pat, html, re.I))
          print("JS_COUNT",len(candidates))
          for raw in sorted(candidates):
              full=urllib.parse.urljoin(url, raw)
              try:
                  req=urllib.request.Request(full, headers=ua)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js=r.read().decode("utf-8","replace")
              except Exception as exc:
                  print("FETCH_ERROR",full,type(exc).__name__,str(exc)); continue
              low=js.lower()
              if not any(k in low for k in ["submit","/api/","github","repository","supabase","firebase"]):
                  continue
              print("=== BUNDLE",full,"LEN",len(js),"===")
              printed=0
              for needle in ["/api/","submit","github","repository","fetch(","method:","POST","captcha","turnstile","supabase","firebase"]:
                  for m in list(re.finditer(re.escape(needle), js, re.I))[:12]:
                      a=max(0,m.start()-900); b=min(len(js),m.end()+1800)
                      print("JS_NEEDLE",needle,js[a:b].replace("\\n"," "))
                      printed+=1
                      if printed>=160: break
                  if printed>=160: break
          PY
