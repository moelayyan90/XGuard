name: Deploy XGuard Credits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/credits/**"
      - ".github/workflows/deploy-credits.yml"

permissions:
  contents: read

concurrency:
  group: xguard-credits-mainnet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate worker
        run: |
          set -euo pipefail
          node --check apps/credits/src/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps/credits/wrangler.jsonc','utf8'))"
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/credits/wrangler.jsonc
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 https://credits.xguardgate.com/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 4
          done
          exit 1
