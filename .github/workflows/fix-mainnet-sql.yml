name: Fix mainnet SQL

on:
  push:
    branches: [mainnet/prepaid-live-gateway]
    paths:
      - ".github/workflows/fix-mainnet-sql.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mainnet/prepaid-live-gateway
      - name: Fix top-up INSERT placeholder count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet-billing.ts')
          s = p.read_text()
          old = "SELECT ?,intent_id,merchant_id,?,?,?,?,?,?,?,?,?,?,? FROM top_up_intents"
          new = "SELECT ?,intent_id,merchant_id,?,?,?,?,?,?,?,?,?,? FROM top_up_intents"
          if old not in s:
              raise SystemExit('expected SQL pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write apps/worker/src/mainnet-billing.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet-billing.ts
          git commit -m "Fix mainnet top-up SQL placeholder count"
          git push origin HEAD:mainnet/prepaid-live-gateway
