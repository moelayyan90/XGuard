name: One-time Vivioo directory submission

on:
  push:
    paths:
      - .github/workflows/vivioo-submit-once.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing XGuard listing and submit once
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            https://vivioo.io/api/showcase \
            -o /tmp/vivioo-list.json

          if jq -e '.agents[]? | select(((.name // "") | ascii_downcase) == "xguard")' /tmp/vivioo-list.json >/dev/null; then
            echo "XGuard is already listed on Vivioo; no duplicate submission sent."
            exit 0
          fi

          cat >/tmp/vivioo-payload.json <<'JSON'
          {
            "name": "XGuard",
            "platform": "Custom",
            "builder": "Mohammad Elayyan",
            "tagline": "Open-source infrastructure for payment safety, MCP discovery, and agent integrations.",
            "trustScore": 1
          }
          JSON

          http_code=$(curl --silent --show-error \
            --retry 3 --retry-delay 2 \
            -o /tmp/vivioo-response.json \
            -w '%{http_code}' \
            -X POST https://vivioo.io/api/showcase \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vivioo-payload.json)

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Vivioo submission failed with HTTP $http_code"
            jq '{success, error, message}' /tmp/vivioo-response.json 2>/dev/null || true
            exit 1
          fi

          echo "Vivioo submission accepted (HTTP $http_code)."
          jq '{success, slug, message, agent: (if .agent then {name: .agent.name, slug: .agent.slug} else null end)}' /tmp/vivioo-response.json
