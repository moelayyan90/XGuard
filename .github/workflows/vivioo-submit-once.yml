name: One-time Vivioo directory submission

on:
  push:
    paths:
      - .github/workflows/vivioo-submit-once.yml

permissions:
  contents: read
  issues: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing XGuard listing and submit once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            https://vivioo.io/api/showcase \
            -o /tmp/vivioo-list.json

          existing=$(jq -c '.agents[]? | select(((.name // "") | ascii_downcase) == "xguard")' /tmp/vivioo-list.json | head -n1 || true)
          if [[ -n "$existing" ]]; then
            slug=$(printf '%s' "$existing" | jq -r '.slug // "unknown"')
            echo "XGuard is already listed on Vivioo; no duplicate submission sent. slug=$slug"
            gh issue comment 306 \
              --repo moelayyan90/XGuard \
              --body "Vivioo public directory check on 2026-08-20 confirmed XGuard is listed. No duplicate submission was sent. Public slug returned by the directory: \`$slug\`."
            exit 0
          fi

          cat >/tmp/vivioo-payload.json <<'JSON'
          {
            "name": "XGuard",
            "platform": "Custom",
            "builder": "Mohammad Elayyan",
            "tagline": "Open-source infrastructure for payment safety, MCP discovery, and agent integrations.",
            "trustScore": 1
          }
          JSON

          http_code=$(curl --silent --show-error \
            --retry 3 --retry-delay 2 \
            -o /tmp/vivioo-response.json \
            -w '%{http_code}' \
            -X POST https://vivioo.io/api/showcase \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vivioo-payload.json)

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Vivioo submission failed with HTTP $http_code"
            jq '{success, error, message}' /tmp/vivioo-response.json 2>/dev/null || true
            exit 1
          fi

          slug=$(jq -r '.slug // .agent.slug // "unknown"' /tmp/vivioo-response.json)
          echo "Vivioo submission accepted (HTTP $http_code), slug=$slug."
          jq '{success, slug, message, agent: (if .agent then {name: .agent.name, slug: .agent.slug} else null end)}' /tmp/vivioo-response.json

          gh issue comment 306 \
            --repo moelayyan90/XGuard \
            --body "Vivioo directory submission accepted on 2026-08-20 via the public unauthenticated submission API. XGuard was checked for an existing listing first; no duplicate was sent. Returned slug: \`$slug\`. The response's private edit key was intentionally not logged or posted."
