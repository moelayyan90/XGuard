name: Publish XGuard to Official MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate server.json

      - name: Check whether this exact version is already public
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
          body="$(curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0.1/servers?search=${encoded}&limit=100")"
          if printf '%s' "$body" | grep -Fq "\"name\":\"${name}\"" && printf '%s' "$body" | grep -Fq "\"version\":\"${version}\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Registry already contains ${name} ${version}; publication is idempotently skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish XGuard
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish server.json

      - name: Verify XGuard is discoverable in the official registry
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
          for i in {1..12}; do
            body="$(curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0.1/servers?search=${encoded}&limit=100")"
            if printf '%s' "$body" | grep -Fq "\"name\":\"${name}\"" && printf '%s' "$body" | grep -Fq "\"version\":\"${version}\""; then
              echo "Verified ${name} ${version} in Official MCP Registry."
              exit 0
            fi
            sleep 5
          done
          echo "Published version was not observable through the registry search API."
          exit 1
