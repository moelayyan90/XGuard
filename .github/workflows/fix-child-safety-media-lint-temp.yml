name: Fix child safety media lint once

on:
  push:
    branches: [agent/child-safety-media-scan]
    paths:
      - .github/workflows/fix-child-safety-media-lint-temp.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/child-safety-media-scan
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Replace control-character regex with bounded character scan
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/worker/src/child-safety-media.ts')
          text = path.read_text()
          old = '''function clean(value: unknown, maxLength: number): string {
            return String(value ?? "")
              .replace(/[\\u0000-\\u001F\\u007F]/g, " ")
              .trim()
              .slice(0, maxLength);
          }'''
          new = '''function clean(value: unknown, maxLength: number): string {
            const text = String(value ?? "");
            let normalized = "";
            const limit = Math.min(text.length, Math.max(0, maxLength));
            for (let index = 0; index < limit; index += 1) {
              const code = text.charCodeAt(index);
              normalized += code < 32 || code == 127 ? " " : text.charAt(index);
            }
            return normalized.trim();
          }'''
          if old not in text:
              raise SystemExit('clean target not found')
          path.write_text(text.replace(old, new, 1))
      - run: npx prettier --write apps/worker/src/child-safety-media.ts
      - name: Commit lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety-media.ts
          git commit -m "Avoid control-character regex in media sanitizer"
          git push origin HEAD:agent/child-safety-media-scan
