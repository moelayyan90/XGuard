name: Hotfix top-up RPC resilience

on:
  push:
    branches: ["hotfix/topup-rpc-resilience"]

permissions:
  contents: write

jobs:
  patch_and_verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: hotfix/topup-rpc-resilience
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply hotfix
        run: node scripts/apply-topup-rpc-resilience-hotfix.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format hotfix
        run: npx prettier --write scripts/apply-topup-rpc-resilience-hotfix.mjs apps/worker/src/mainnet-supervisor.ts apps/worker/src/mainnet-revenue-hardening.ts apps/worker/wrangler.mainnet.jsonc tests/mainnet-revenue-hardening-source.test.ts tests/mainnet-topup-rpc-resilience-source.test.ts

      - name: Verify release
        run: npm run verify:release

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-topup-rpc-resilience.yml
          rm -f scripts/apply-topup-rpc-resilience-hotfix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden automatic top-up RPC scanning against rate limits"
          git push origin HEAD:hotfix/topup-rpc-resilience
