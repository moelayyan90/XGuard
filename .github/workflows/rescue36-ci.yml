name: Rescue36 CI
on:
  pull_request:
    paths:
      - 'apps/rescue36/**'
      - '.github/workflows/rescue36-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/rescue36/**'
      - '.github/workflows/rescue36-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Syntax
        run: python -m py_compile apps/rescue36/rescue36.py
      - name: Unit tests
        run: python -m unittest discover -s apps/rescue36/tests -v
