name: Payment security evidence

on:
  pull_request:
    paths:
      - "apps/worker/src/payment-decision.ts"
      - "apps/worker/src/mainnet-mcp-modern.ts"
      - "apps/worker/src/universal-mainnet.ts"
      - "apps/worker/migrations/**"
      - "browser-extension/**"
      - "tests/payment-decision.test.ts"
      - "tests/browser-payment-surface-source.test.ts"
      - ".github/workflows/payment-security-evidence.yml"
  push:
    branches: [main]
    paths:
      - "apps/worker/src/payment-decision.ts"
      - "apps/worker/src/mainnet-mcp-modern.ts"
      - "apps/worker/src/universal-mainnet.ts"
      - "apps/worker/migrations/**"
      - "browser-extension/**"
      - "tests/payment-decision.test.ts"
      - "tests/browser-payment-surface-source.test.ts"
      - ".github/workflows/payment-security-evidence.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create evidence directory
        run: mkdir -p payment-security-evidence

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Payment decision and browser privacy tests
        run: >-
          npx vitest run
          tests/payment-decision.test.ts
          tests/browser-payment-surface-source.test.ts
          --reporter=json
          --outputFile=payment-security-evidence/vitest.json

      - name: Secret scan
        run: npm run security:secrets

      - name: Dependency audit evidence
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > payment-security-evidence/npm-audit.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Bind evidence to commit
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > payment-security-evidence/commit.txt
          printf '%s\n' "XGuard Payment Security Evidence" > payment-security-evidence/README.txt
          printf '%s\n' "Generated by GitHub Actions for commit ${GITHUB_SHA}." >> payment-security-evidence/README.txt
          (cd payment-security-evidence && sha256sum vitest.json npm-audit.json commit.txt README.txt > SHA256SUMS)

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xguard-payment-security-evidence-${{ github.sha }}
          path: payment-security-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce dependency gate
        if: always()
        run: |
          if [ "${{ steps.audit.outputs.exit_code }}" != "0" ]; then
            echo "High-severity dependency audit gate failed."
            exit 1
          fi
