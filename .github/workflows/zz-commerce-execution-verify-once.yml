name: One-shot commerce execution verification

on:
  push:
    branches: [fix/commerce-end-to-end]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/commerce-end-to-end
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run checks and capture report
        id: checks
        shell: bash
        run: |
          set +e
          npx prettier --check apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts > /tmp/prettier.log 2>&1
          prettier_code=$?
          npx eslint apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts > /tmp/eslint.log 2>&1
          eslint_code=$?
          npm run typecheck > /tmp/typecheck.log 2>&1
          typecheck_code=$?
          {
            echo "prettier_exit=$prettier_code"
            echo "eslint_exit=$eslint_code"
            echo "typecheck_exit=$typecheck_code"
            echo
            echo "=== PRETTIER ==="
            cat /tmp/prettier.log
            echo
            echo "=== ESLINT ==="
            cat /tmp/eslint.log
            echo
            echo "=== TYPECHECK ==="
            cat /tmp/typecheck.log
          } > commerce-execution-ci-report.txt
          echo "prettier=$prettier_code" >> "$GITHUB_OUTPUT"
          echo "eslint=$eslint_code" >> "$GITHUB_OUTPUT"
          echo "typecheck=$typecheck_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- commerce-execution-ci-report.txt
          git commit -m "chore: record commerce execution verification"
          git push origin HEAD:fix/commerce-end-to-end
      - name: Enforce verification
        shell: bash
        run: |
          test "${{ steps.checks.outputs.prettier }}" = "0"
          test "${{ steps.checks.outputs.eslint }}" = "0"
          test "${{ steps.checks.outputs.typecheck }}" = "0"
