name: Diagnose Economic Firewall release

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/diagnose-release-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format
        continue-on-error: true
        run: npm run format:check
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Coverage tests
        continue-on-error: true
        run: npm run test:coverage
      - name: Worker tests
        continue-on-error: true
        run: npm run test:worker
      - name: Secret scan
        continue-on-error: true
        run: npm run security:secrets
      - name: No TODOs
        continue-on-error: true
        run: npm run quality:no-todos
      - name: Docs
        continue-on-error: true
        run: npm run quality:docs
      - name: TypeScript build
        continue-on-error: true
        run: npm run build
      - name: Dependency audit
        continue-on-error: true
        run: npm run security:deps
      - name: Wrangler types
        continue-on-error: true
        run: npm --workspace @xguard/worker run types -- --check
      - name: Testnet dry run
        continue-on-error: true
        run: npm --workspace @xguard/worker run build
      - name: Mainnet dry run
        continue-on-error: true
        run: npm --workspace @xguard/worker run build:mainnet
      - name: Economic preview dry run
        continue-on-error: true
        run: npm --workspace @xguard/worker run build:economic-preview
      - name: Pack core
        continue-on-error: true
        run: npm pack --dry-run --workspace @xguard/core
      - name: Pack SDK
        continue-on-error: true
        run: npm pack --dry-run --workspace @xguard/sdk
      - name: Pack CLI
        continue-on-error: true
        run: npm pack --dry-run --workspace xguard
