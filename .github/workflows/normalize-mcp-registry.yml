name: Normalize XGuard MCP Registry Versions

on:
  pull_request:
    paths:
      - "server.json"
      - ".github/workflows/normalize-mcp-registry.yml"
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/normalize-mcp-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate manifest structure locally
        # Pull requests stay deterministic when the public registry is unavailable;
        # the merged workflow still requires the official remote validation below.
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const manifest = require('./server.json');
          if (manifest.$schema !== 'https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json') throw new Error('unexpected MCP schema');
          if (manifest.name !== 'io.github.moelayyan90/xguard-control-plane') throw new Error('unexpected MCP registry name');
          if (manifest.version !== '5.1.0') throw new Error('unexpected MCP version');
          if (manifest.remotes?.length !== 1 || manifest.remotes[0]?.type !== 'streamable-http' || manifest.remotes[0]?.url !== 'https://api.xguardgate.com/mcp') throw new Error('unexpected MCP remote');
          NODE

      - name: Validate against the official registry after merge
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            ./mcp-publisher validate server.json && exit 0
            echo "Official MCP validation attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Read official version history
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          registry='https://registry.modelcontextprotocol.io'
          encoded='io.github.moelayyan90%2Fxguard-control-plane'
          curl --fail --silent --show-error --max-time 20 \
            "$registry/v0.1/servers/$encoded/versions?include_deleted=true" \
            -o /tmp/xguard-registry-versions.json
          cat /tmp/xguard-registry-versions.json
          jq -e '.servers | type == "array" and length > 0' /tmp/xguard-registry-versions.json >/dev/null
          jq -r '.servers[] | [.server.version, (._meta["io.modelcontextprotocol.registry/official"].status // "active")] | @tsv' /tmp/xguard-registry-versions.json

      - name: Validate release target
        shell: bash
        run: |
          set -euo pipefail
          target="$(node -p 'require("./server.json").version')"
          test -n "$target"
          echo "Manifest target version: $target"

      - name: Wait for manifest version to become official latest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          registry='https://registry.modelcontextprotocol.io'
          encoded='io.github.moelayyan90%2Fxguard-control-plane'
          target="$(node -p 'require("./server.json").version')"
          for i in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 \
              "$registry/v0.1/servers/$encoded/versions/latest" \
              -o /tmp/xguard-registry-latest.json; then
              version="$(jq -r '.server.version // empty' /tmp/xguard-registry-latest.json)"
              status="$(jq -r '._meta["io.modelcontextprotocol.registry/official"].status // "active"' /tmp/xguard-registry-latest.json)"
              if [[ "$version" == "$target" && "$status" == "active" ]]; then
                cat /tmp/xguard-registry-latest.json
                echo "Official latest is active $target."
                exit 0
              fi
              echo "Registry latest is ${version:-unknown} status=${status}; waiting for $target."
            fi
            sleep 5
          done
          echo "Official registry did not promote $target to active latest."
          exit 1

      - name: Authenticate with GitHub OIDC
        if: github.event_name != 'pull_request'
        run: ./mcp-publisher login github-oidc

      - name: Refresh version history after publication
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          registry='https://registry.modelcontextprotocol.io'
          encoded='io.github.moelayyan90%2Fxguard-control-plane'
          curl --fail --silent --show-error --max-time 20 \
            "$registry/v0.1/servers/$encoded/versions?include_deleted=true" \
            -o /tmp/xguard-registry-versions.json

      - name: Deprecate active versions older than manifest target
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          name='io.github.moelayyan90/xguard-control-plane'
          target="$(node -p 'require("./server.json").version')"
          mapfile -t rows < <(jq -r --arg target "$target" '.servers[] | select(.server.version != $target) | [.server.version, (._meta["io.modelcontextprotocol.registry/official"].status // "active")] | @tsv' /tmp/xguard-registry-versions.json)
          for row in "${rows[@]}"; do
            version="${row%%$'\t'*}"
            status="${row#*$'\t'}"
            if [[ "$status" != "active" ]]; then
              echo "Skipping $version: status=$status"
              continue
            fi
            echo "Deprecating superseded XGuard MCP version $version"
            ok=0
            for attempt in 1 2 3; do
              if ./mcp-publisher status --status deprecated \
                --message "Superseded by XGuard ${target}; use https://api.xguardgate.com/mcp" \
                "$name" "$version"; then
                ok=1
                break
              fi
              echo "status update attempt $attempt failed for $version"
              sleep 8
            done
            test "$ok" = "1"
          done

      - name: Verify only manifest target remains active
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          registry='https://registry.modelcontextprotocol.io'
          encoded='io.github.moelayyan90%2Fxguard-control-plane'
          target="$(node -p 'require("./server.json").version')"
          curl --fail --silent --show-error --max-time 20 \
            "$registry/v0.1/servers/$encoded/versions?include_deleted=true" \
            -o /tmp/xguard-registry-after.json
          jq -e --arg target "$target" '.servers[] | select(.server.version == $target) | ((._meta["io.modelcontextprotocol.registry/official"].status // "active") == "active")' /tmp/xguard-registry-after.json >/dev/null
          if jq -e --arg target "$target" '.servers[] | select(.server.version != $target) | select((._meta["io.modelcontextprotocol.registry/official"].status // "active") == "active")' /tmp/xguard-registry-after.json >/dev/null; then
            echo 'A superseded XGuard MCP version is still active.'
            cat /tmp/xguard-registry-after.json
            exit 1
          fi
          jq -r '.servers[] | [.server.version, (._meta["io.modelcontextprotocol.registry/official"].status // "active")] | @tsv' /tmp/xguard-registry-after.json
