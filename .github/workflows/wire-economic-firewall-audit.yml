name: Wire dormant Economic Firewall audit mode

on:
  push:
    branches:
      - agent/economic-firewall-audit-mode
    paths:
      - .github/workflows/wire-economic-firewall-audit.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-audit-mode
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Wire audit evaluation without changing payment outcomes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/mainnet.ts')
          s = p.read_text()

          import_anchor = '''import {\n  mainnetEconomicShadowStats,\n  pruneMainnetEconomicShadowTelemetry,\n  recordMainnetEconomicShadowObservation,\n} from "./mainnet-economic-shadow-telemetry.js";\n'''
          import_new = '''import {\n  mainnetEconomicShadowStats,\n  pruneMainnetEconomicShadowTelemetry,\n  recordMainnetEconomicShadowObservation,\n} from "./mainnet-economic-shadow-telemetry.js";\nimport {\n  evaluateMainnetEconomicSettlementAudit,\n  mainnetEconomicAuditStats,\n  parseMainnetEconomicAuditMode,\n  recordMainnetEconomicAuditDecision,\n} from "./mainnet-economic-audit.js";\n'''
          if import_anchor not in s:
              raise SystemExit('telemetry import anchor not found')
          s = s.replace(import_anchor, import_new, 1)

          env_anchor = '''  PAYAI_DOWNSTREAM_COST_MICRO_USD: string;\n  ECONOMIC_FIREWALL_SHADOW_MODE?: string;\n}'''
          env_new = '''  PAYAI_DOWNSTREAM_COST_MICRO_USD: string;\n  ECONOMIC_FIREWALL_SHADOW_MODE?: string;\n  ECONOMIC_FIREWALL_AUDIT_MODE?: string;\n}'''
          if env_anchor not in s:
              raise SystemExit('environment anchor not found')
          s = s.replace(env_anchor, env_new, 1)

          status_read_anchor = '''  const shadowTelemetry = await mainnetEconomicShadowStats(\n    context.env.DB,\n  ).catch((error) => {\n    console.warn(\n      JSON.stringify({\n        event: "economic_firewall_shadow_telemetry_read_failed",\n        code: errorCode(error),\n      }),\n    );\n    return null;\n  });\n  return context.json({'''
          status_read_new = '''  const shadowTelemetry = await mainnetEconomicShadowStats(\n    context.env.DB,\n  ).catch((error) => {\n    console.warn(\n      JSON.stringify({\n        event: "economic_firewall_shadow_telemetry_read_failed",\n        code: errorCode(error),\n      }),\n    );\n    return null;\n  });\n  const auditTelemetry = await mainnetEconomicAuditStats(context.env.DB).catch(\n    (error) => {\n      console.warn(\n        JSON.stringify({\n          event: "economic_firewall_audit_telemetry_read_failed",\n          code: errorCode(error),\n        }),\n      );\n      return null;\n    },\n  );\n  return context.json({'''
          if status_read_anchor not in s:
              raise SystemExit('status telemetry anchor not found')
          s = s.replace(status_read_anchor, status_read_new, 1)

          status_anchor = '''    economicFirewallShadow: {\n      mode: parseMainnetEconomicShadowMode(\n        context.env.ECONOMIC_FIREWALL_SHADOW_MODE,\n      ),\n      telemetry: shadowTelemetry === null ? "unavailable" : "operational",\n      ...(shadowTelemetry ?? {\n        intents: 0,\n        verifyEvents: 0,\n        settleEvents: 0,\n        correlatedIntents: 0,\n        settleWithoutVerifyIntents: 0,\n        authorizationMismatchEvents: 0,\n      }),\n    },\n    measuredAt: new Date().toISOString(),'''
          status_new = '''    economicFirewallShadow: {\n      mode: parseMainnetEconomicShadowMode(\n        context.env.ECONOMIC_FIREWALL_SHADOW_MODE,\n      ),\n      telemetry: shadowTelemetry === null ? "unavailable" : "operational",\n      ...(shadowTelemetry ?? {\n        intents: 0,\n        verifyEvents: 0,\n        settleEvents: 0,\n        correlatedIntents: 0,\n        settleWithoutVerifyIntents: 0,\n        authorizationMismatchEvents: 0,\n      }),\n    },\n    economicFirewallAudit: {\n      mode: parseMainnetEconomicAuditMode(\n        context.env.ECONOMIC_FIREWALL_AUDIT_MODE,\n      ),\n      telemetry: auditTelemetry === null ? "unavailable" : "operational",\n      ...(auditTelemetry ?? {\n        evaluatedSettles: 0,\n        pass: 0,\n        review: 0,\n        correlatedAuthorization: 0,\n        verifyNotObserved: 0,\n        authorizationMismatch: 0,\n      }),\n    },\n    measuredAt: new Date().toISOString(),'''
          if status_anchor not in s:
              raise SystemExit('status response anchor not found')
          s = s.replace(status_anchor, status_new, 1)

          wait_anchor = '''    context.executionCtx.waitUntil(\n      recordMainnetEconomicShadowObservation(\n        context.env.DB,\n        merchant.merchantId,\n        shadow,\n        operation,\n      ).catch((error) =>\n        console.warn(\n          JSON.stringify({\n            event: "economic_firewall_shadow_telemetry_write_failed",\n            requestId: context.get("requestId"),\n            operation,\n            merchantId: merchant.merchantId,\n            code: errorCode(error),\n          }),\n        ),\n      ),\n    );'''
          wait_new = '''    context.executionCtx.waitUntil(\n      persistEconomicFirewallObservation(\n        context,\n        merchant,\n        shadow,\n        operation,\n      ),\n    );'''
          if wait_anchor not in s:
              raise SystemExit('shadow waitUntil anchor not found')
          s = s.replace(wait_anchor, wait_new, 1)

          helper_anchor = '''async function requireMerchant(context: AppContext): Promise<MerchantIdentity> {'''
          helper = '''async function persistEconomicFirewallObservation(\n  context: AppContext,\n  merchant: MerchantIdentity,\n  shadow: ReturnType<typeof deriveMainnetEconomicShadowBinding>,\n  operation: "verify" | "settle",\n): Promise<void> {\n  if (\n    operation === "settle" &&\n    parseMainnetEconomicAuditMode(context.env.ECONOMIC_FIREWALL_AUDIT_MODE) ===\n      "audit"\n  ) {\n    try {\n      const decision = await evaluateMainnetEconomicSettlementAudit(\n        context.env.DB,\n        merchant.merchantId,\n        shadow,\n      );\n      console.log(\n        JSON.stringify({\n          event: "economic_firewall_audit_decision",\n          requestId: context.get("requestId"),\n          verdict: decision.verdict,\n          reason: decision.reason,\n          intentId: shadow.intent.intentId,\n        }),\n      );\n      await recordMainnetEconomicAuditDecision(context.env.DB, decision);\n    } catch (error) {\n      console.warn(\n        JSON.stringify({\n          event: "economic_firewall_audit_failed",\n          requestId: context.get("requestId"),\n          code: errorCode(error),\n        }),\n      );\n    }\n  }\n\n  await recordMainnetEconomicShadowObservation(\n    context.env.DB,\n    merchant.merchantId,\n    shadow,\n    operation,\n  ).catch((error) =>\n    console.warn(\n      JSON.stringify({\n        event: "economic_firewall_shadow_telemetry_write_failed",\n        requestId: context.get("requestId"),\n        operation,\n        merchantId: merchant.merchantId,\n        code: errorCode(error),\n      }),\n    ),\n  );\n}\n\n'''
          if helper_anchor not in s:
              raise SystemExit('requireMerchant anchor not found')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)
          p.write_text(s)
          PY
      - name: Verify dormant audit mode and full release candidate
        run: |
          npx prettier --write apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-audit.ts tests/worker/mainnet-economic-audit.test.ts
          npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Commit verified audit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mainnet.ts apps/worker/src/mainnet-economic-audit.ts apps/worker/migrations/0008_economic_firewall_audit.sql tests/worker/mainnet-economic-audit.test.ts
          git commit -m "feat: add dormant Economic Firewall audit mode"
          git push origin HEAD:agent/economic-firewall-audit-mode
