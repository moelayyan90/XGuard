name: Format Hosted Auto Pay

on:
  push:
    branches:
      - feature/hosted-auto-pay-decision

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/hosted-auto-pay-decision
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write packages/sdk/src/hosted-auto-pay.ts tests/hosted-auto-pay.test.ts packages/sdk/README.md packages/sdk/src/index.ts .github/workflows/github-release-packages.yml
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sdk/src/hosted-auto-pay.ts tests/hosted-auto-pay.test.ts packages/sdk/README.md packages/sdk/src/index.ts .github/workflows/github-release-packages.yml
          git commit -m "Format hosted automated payment authorizer"
          git push origin HEAD:feature/hosted-auto-pay-decision
