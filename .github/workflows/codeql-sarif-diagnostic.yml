name: Export CodeQL SARIF diagnostic

on:
  push:
    branches:
      - agent/economic-firewall-clean
    paths:
      - .github/workflows/codeql-sarif-diagnostic.yml

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-clean
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: false
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-economic-firewall
          path: sarif-results
          if-no-files-found: error
