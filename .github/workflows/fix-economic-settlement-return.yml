name: Fix Economic Firewall settlement return

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/fix-economic-settlement-return.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - name: Make settlement mutation RPC return void
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coordinator = Path('apps/worker/src/economic-intent-coordinator.ts')
          s = coordinator.read_text()
          old = '''  public recordSettlement(\n    input: EconomicIntentSettlementInput,\n  ): EconomicIntentSnapshot {'''
          new = '''  public recordSettlement(\n    input: EconomicIntentSettlementInput,\n  ): void {'''
          if old not in s:
              raise SystemExit('recordSettlement signature not found')
          s = s.replace(old, new, 1)
          old = '''      return this.snapshot(row);\n    }\n    if (row.state !== "FULFILLED")'''
          new = '''      return;\n    }\n    if (row.state !== "FULFILLED")'''
          if old not in s:
              raise SystemExit('recordSettlement idempotent return not found')
          s = s.replace(old, new, 1)
          old = '''    );\n    return this.snapshot(this.requireRow());\n  }\n\n  public quarantine('''
          new = '''    );\n  }\n\n  public quarantine('''
          if old not in s:
              raise SystemExit('recordSettlement final return not found')
          s = s.replace(old, new, 1)
          coordinator.write_text(s)

          worker = Path('apps/worker/src/economic-firewall.ts')
          s = worker.read_text()
          old = '''    const finalized = await stub.recordSettlement({\n      merchantId,\n      executionId: snapshot.executionId,\n      protocol,\n      settlement: rpcSafeJson(body.settlement),\n      chargedAmountMicroUsd: requiredSafeInteger(\n        body.chargedAmountMicroUsd,\n        "chargedAmountMicroUsd",\n      ),\n    });\n    return context.json(finalized, 200, {'''
          new = '''    await stub.recordSettlement({\n      merchantId,\n      executionId: snapshot.executionId,\n      protocol,\n      settlement: rpcSafeJson(body.settlement),\n      chargedAmountMicroUsd: requiredSafeInteger(\n        body.chargedAmountMicroUsd,\n        "chargedAmountMicroUsd",\n      ),\n    });\n    const finalized = await stub.getSnapshot(merchantId);\n    if (finalized === null)\n      throw new XGuardError("INTERNAL_ERROR", "Finalized intent disappeared", 500);\n    return context.json(finalized, 200, {'''
          if old not in s:
              raise SystemExit('settlement endpoint block not found')
          worker.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write apps/worker/src/economic-intent-coordinator.ts apps/worker/src/economic-firewall.ts
      - name: Verify settlement fix
        run: |
          npm ci --ignore-scripts
          npm run build
          npm --workspace @xguard/worker run build:economic-preview
      - name: Commit settlement fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/economic-intent-coordinator.ts apps/worker/src/economic-firewall.ts
          git commit -m "fix: separate settlement mutation from snapshot RPC"
          git push origin HEAD:agent/economic-firewall-v2
