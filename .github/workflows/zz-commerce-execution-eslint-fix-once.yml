name: One-shot commerce execution lint fix

on:
  push:
    branches: [fix/commerce-end-to-end]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/commerce-end-to-end
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply lint-safe sanitizers
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/worker/src/commerce-execution.ts')
          text = path.read_text()
          old = 'if (/^(fc|fd|fe80)/i.test(host.replace(/[\\[\\]]/g, ""))) return true;'
          new = 'if (/^(fc|fd|fe80)/i.test(host.replaceAll("[", "").replaceAll("]", ""))) return true;'
          if old not in text:
              raise SystemExit('unsafeHost target not found')
          text = text.replace(old, new, 1)
          old = '''function clean(raw: unknown, max = 500): string {
  return typeof raw === "string"
    ? raw
        .trim()
        .replace(/[\\u0000-\\u001f\\u007f]/g, "")
        .slice(0, max)
    : "";
}'''
          new = '''function clean(raw: unknown, max = 500): string {
  if (typeof raw !== "string") return "";
  let sanitized = "";
  for (const char of raw.trim()) {
    const code = char.charCodeAt(0);
    if (code >= 32 && code !== 127) sanitized += char;
  }
  return sanitized.slice(0, max);
}'''
          if old not in text:
              raise SystemExit('clean target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - run: npx prettier --write apps/worker/src/commerce-execution.ts
      - run: npx eslint apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts
      - run: npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/commerce-execution.ts
          git commit -m "fix: satisfy commerce execution lint"
          git push origin HEAD:fix/commerce-end-to-end
