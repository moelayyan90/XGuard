name: XGuard Distribution Surfaces CI

on:
  pull_request:
    paths:
      - "llms-install.md"
      - "apps/relay/src/discovery-entry.js"
      - "apps/relay/src/rail-entry.js"
      - ".github/workflows/distribution-surfaces-ci.yml"
  push:
    branches: [main]
    paths:
      - "llms-install.md"
      - "apps/relay/src/discovery-entry.js"
      - "apps/relay/src/rail-entry.js"
      - ".github/workflows/distribution-surfaces-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Validate agent install guide and marketplace discovery surfaces
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^# Install XGuard MCP' llms-install.md
          grep -q 'XGuard Universal Paid AI Agent + Secretless Gateway' llms-install.md
          grep -q 'https://api.xguardgate.com/mcp' llms-install.md
          grep -q 'xguard_secretless_egress' llms-install.md
          grep -q 'xguard_egress_fetch' llms-install.md
          grep -q 'xguard.web.fetch' llms-install.md
          grep -q 'xguard_proofrail' llms-install.md
          grep -q 'xguard_verify_proof' llms-install.md
          grep -q '/.well-known/mcp/server-card.json' llms-install.md
          grep -q 'url.pathname === "/.well-known/mcp/server-card.json"' apps/relay/src/discovery-entry.js
          grep -q 'xguard_secretless_egress' apps/relay/src/discovery-entry.js
          grep -q 'xguard_egress_fetch' apps/relay/src/discovery-entry.js
          grep -q 'xguard.web.fetch' apps/relay/src/discovery-entry.js
          grep -q 'xguard_proofrail' apps/relay/src/discovery-entry.js
          grep -q 'xguard_verify_proof' apps/relay/src/discovery-entry.js
          grep -q 'url.pathname === "/connect"' apps/relay/src/rail-entry.js
          grep -q 'url.pathname === "/logo.png"' apps/relay/src/rail-entry.js
          grep -q 'x-xguard-image-dimensions.*400x400' apps/relay/src/rail-entry.js

      - name: Verify canonical MCP remains live
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.xguardgate.com/mcp'
          init="$(curl --fail --silent --show-error --max-time 15 -X POST "$endpoint" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"xguard-distribution-ci","version":"1.0.0"}}}')"
          printf '%s' "$init" | jq -e '.result.serverInfo as $s | (["xguard-secretless-agent-gateway","xguard-universal-paid-secretless-gateway"] | index($s.name)) != null and (["5.0.2","5.1.0"] | index($s.version)) != null' >/dev/null
          tools="$(curl --fail --silent --show-error --max-time 15 -X POST "$endpoint" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          printf '%s' "$tools" | jq -e '[.result.tools[].name] as $n | ["xguard_secretless_egress","xguard_egress_fetch","xguard_proofrail","xguard_verify_proof"] | all(. as $x | $n | index($x) != null)' >/dev/null

      - name: Verify production marketplace assets after main deploy
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..60}; do
            connect="$(curl --silent --show-error --max-time 10 'https://xguardgate.com/connect' || true)"
            card="$(curl --silent --show-error --max-time 10 'https://xguardgate.com/.well-known/mcp/server-card.json' || true)"
            identity="$(curl --silent --show-error --max-time 10 'https://xguardgate.com/identity' || true)"
            llms="$(curl --silent --show-error --max-time 10 'https://xguardgate.com/llms.txt' || true)"
            sitemap="$(curl --silent --show-error --max-time 10 'https://xguardgate.com/sitemap.xml' || true)"
            if printf '%s' "$connect" | grep -q 'Connect XGuard' && \
               printf '%s' "$card" | jq -e '.serverInfo.name == "XGuard Universal Paid AI Agent + Secretless Gateway" and .serverInfo.version == "5.1.0" and ([.tools[].name] | index("xguard.web.fetch") != null) and ([.tools[].name] | index("xguard_egress_fetch") != null)' >/dev/null 2>&1 && \
               printf '%s' "$identity" | jq -e '.name == "XGuard Universal Paid AI Agent + Secretless Gateway" and .version == "5.1.0" and .discovery.smithery_server_card != null' >/dev/null 2>&1 && \
               printf '%s' "$llms" | grep -q 'Smithery server card' && \
               printf '%s' "$sitemap" | grep -q '<loc>https://xguardgate.com/.well-known/mcp/server-card.json</loc>'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
