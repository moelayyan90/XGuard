name: Publish XGuard to agent directories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"
      - "apps/worker/src/mainnet-a2a.ts"
      - "apps/worker/src/mainnet-modern.ts"
      - "apps/worker/src/agent-discovery-modern.ts"
      - ".github/workflows/publish-mcp-directories.yml"

permissions:
  contents: read

jobs:
  mcprepository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit XGuard repository for indexing
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS --max-time 20 \
            -X POST 'https://mcprepository.com/api/index' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://github.com/moelayyan90/XGuard"}')"
          printf '%s\n' "${response}"
          printf '%s' "${response}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.valid === false) {
                console.error(x.reason || x.message || "MCP Repository rejected XGuard");
                process.exit(1);
              }
              if (x.duplicate === true) {
                console.log("XGuard is already indexed by MCP Repository.");
                return;
              }
              if (x.status === "queued" || x.url || x.message) {
                console.log("XGuard MCP Repository index request accepted.");
                return;
              }
              console.error("Unexpected MCP Repository response shape");
              process.exit(1);
            });
          '

  mcpdirectory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit XGuard to MCP.Directory
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -w $'\n%{http_code}' \
            -X POST 'https://mcp.directory/api/submit-server' \
            -H 'Content-Type: application/json' \
            --data '{"githubUrl":"https://github.com/moelayyan90/XGuard","description":"x402 economic firewall and facilitator safety gateway with remote MCP on Base mainnet USDC."}')"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          printf '%s\n' "${body}"
          if [[ "${code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "XGuard MCP.Directory submission accepted."
            exit 0
          fi
          lower="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${code}" == "409" ]] || [[ "${lower}" == *"already"* ]] || [[ "${lower}" == *"exist"* ]]; then
            echo "XGuard is already submitted/listed by MCP.Directory."
            exit 0
          fi
          echo "MCP.Directory rejected XGuard (HTTP ${code})." >&2
          exit 1

  mcpso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit live XGuard MCP endpoint to mcp.so when automation is permitted
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -w $'\n%{http_code}' \
            -X POST 'https://mcp.so/api/submit-project' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://xguard-mainnet.maqamapp.workers.dev/mcp","avatar_url":"https://xguard-mainnet.maqamapp.workers.dev/logo.png"}' || true)"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          lower="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${code}" == "200" ]] || [[ "${code}" == "201" ]] || [[ "${code}" == "202" ]] || [[ "${code}" == "409" ]] || [[ "${lower}" == *"already"* ]] || [[ "${lower}" == *"exist"* ]]; then
            echo "XGuard mcp.so submission accepted or already present."
            exit 0
          fi
          if [[ "${code}" == "403" ]] && { [[ "${lower}" == *"just a moment"* ]] || [[ "${lower}" == *"challenges.cloudflare.com"* ]] || [[ "${lower}" == *"challenge-platform"* ]]; }; then
            echo "::notice::mcp.so protects its submission endpoint with a Cloudflare browser challenge. Automated submission was not bypassed; XGuard has been sent to support@mcp.so for manual review."
            exit 0
          fi
          printf '%s\n' "${body}"
          echo "mcp.so rejected XGuard (HTTP ${code})." >&2
          exit 1

  agentndx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check XGuard in AgentNDX curated index
        shell: bash
        run: |
          set -euo pipefail
          index="$(curl -fsS --max-time 30 'https://agentndx.ai/api/servers.json')"
          if INDEX="${index}" node <<'NODE'
          const items = JSON.parse(process.env.INDEX || "[]");
          const rows = Array.isArray(items) ? items : Array.isArray(items.servers) ? items.servers : [];
          const found = rows.some((x) => {
            const text = JSON.stringify(x || {}).toLowerCase();
            return text.includes("xguard") || text.includes("moelayyan90/xguard");
          });
          process.exit(found ? 0 : 1);
          NODE
          then
            echo "XGuard is listed by AgentNDX."
            exit 0
          fi
          echo "::notice::XGuard is not yet in AgentNDX's curated index. Their public submission page requires interactive review and does not expose a working machine POST endpoint; automated attempts returned 302/405 and are intentionally not bypassed."
          exit 0

  mcpub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit live XGuard endpoint to mcpub
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://xguard-mainnet.maqamapp.workers.dev'
          curl -fsS --max-time 20 "${ORIGIN}/.well-known/mcp.json" >/dev/null
          response="$(curl -sS --max-time 30 -w $'\n%{http_code}' \
            -X POST 'https://mcpub.dev/mcp' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"submit","arguments":{"url":"https://xguard-mainnet.maqamapp.workers.dev","description":"XGuard — x402 economic firewall and facilitator safety gateway for Base mainnet USDC, with remote MCP discovery and guarded settlement."}}}')"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          printf '%s\n' "${body}"
          if [[ ! "${code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "mcpub rejected XGuard (HTTP ${code})." >&2
            exit 1
          fi
          printf '%s' "${body}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.error) {
                const text=JSON.stringify(x.error).toLowerCase();
                if (text.includes("already") || text.includes("exist")) {
                  console.log("XGuard is already listed by mcpub.");
                  return;
                }
                console.error(JSON.stringify(x.error));
                process.exit(1);
              }
              console.log("XGuard mcpub submission accepted.");
            });
          '

  a2aregistry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for deployed XGuard A2A surface
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xguard-mainnet.maqamapp.workers.dev'
          propagated=0
          for attempt in $(seq 1 40); do
            card="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/.well-known/agent-card.json?registry=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "${card}" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d).on("end",()=>{
                try {
                  const x=JSON.parse(s);
                  const interfaces=Array.isArray(x.supportedInterfaces)?x.supportedInterfaces:[];
                  const v1=interfaces.some(i=>i&&i.protocolBinding==="JSONRPC"&&i.protocolVersion==="1.0"&&String(i.url||"").endsWith("/a2a"));
                  const v03=interfaces.some(i=>i&&i.protocolBinding==="JSONRPC"&&i.protocolVersion==="0.3"&&String(i.url||"").endsWith("/a2a"));
                  const skill=Array.isArray(x.skills)&&x.skills.some(k=>k&&k.id==="a2a-xguard-discovery");
                  process.exit(x.name==="XGuard"&&x.version==="0.4.0"&&x.preferredTransport==="JSONRPC"&&v1&&v03&&skill?0:1);
                } catch { process.exit(1); }
              });
            '
            then
              propagated=1
              break
            fi
            sleep 10
          done
          if [[ "${propagated}" -ne 1 ]]; then
            echo "::error::Timed out waiting for the deployed XGuard A2A surface."
            exit 1
          fi

          legacy="$(curl -fsS --max-time 20 \
            -X POST "${BASE}/a2a" \
            -H 'Content-Type: application/json' \
            -H 'A2A-Version: 0.3' \
            --data '{"jsonrpc":"2.0","id":"registry-preflight-03","method":"message/send","params":{"message":{"role":"user","messageId":"registry-preflight-message-03","parts":[{"kind":"text","text":"Describe XGuard integration."}]}}}')"
          printf '%s' "${legacy}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.jsonrpc!=="2.0"||x.id!=="registry-preflight-03"||!x.result||x.result.kind!=="message"||x.result.role!=="agent"||x.result?.metadata?.discoveryOnly!==true||x.result?.metadata?.paymentExecution!==false) process.exit(1);
            });
          '

          current="$(curl -fsS --max-time 20 \
            -X POST "${BASE}/a2a" \
            -H 'Content-Type: application/json' \
            -H 'A2A-Version: 1.0' \
            --data '{"jsonrpc":"2.0","id":"registry-preflight-10","method":"SendMessage","params":{"message":{"role":"ROLE_USER","messageId":"registry-preflight-message-10","parts":[{"text":"Describe XGuard integration."}]}}}')"
          printf '%s' "${current}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.jsonrpc!=="2.0"||x.id!=="registry-preflight-10"||!x.result||!x.result.message||x.result.message.role!=="ROLE_AGENT"||x.result.message?.metadata?.discoveryOnly!==true||x.result.message?.metadata?.paymentExecution!==false) process.exit(1);
            });
          '

      - name: Register XGuard Agent Card
        shell: bash
        run: |
          set -euo pipefail
          URI='https://xguard-mainnet.maqamapp.workers.dev/.well-known/agent-card.json'
          body_file="$(mktemp)"
          status="$(curl -sS --max-time 30 -o "${body_file}" -w '%{http_code}' \
            -X POST 'https://a2aregistry.org/api/agents/register' \
            -H 'Content-Type: application/json' \
            --data "{\"wellKnownURI\":\"${URI}\"}" || true)"
          response="$(cat "${body_file}")"
          rm -f "${body_file}"
          printf 'A2A Registry HTTP %s\n%s\n' "${status}" "${response}"

          RESPONSE="${response}" STATUS="${status}" node <<'NODE'
          const status = Number(process.env.STATUS || 0);
          const raw = process.env.RESPONSE || "";
          let x = {};
          try { x = JSON.parse(raw || "{}"); } catch {}
          const text = `${raw} ${JSON.stringify(x)}`.toLowerCase();
          const already = text.includes("already") || text.includes("exist") || text.includes("duplicate");
          const accepted = status >= 200 && status < 300 && (
            x.id || x.agent || x.success === true || x.registered === true || x.message || Object.keys(x).length > 0
          );
          if (accepted || already) {
            console.log("XGuard A2A Registry submission accepted or already registered.");
            process.exit(0);
          }
          console.error(x.detail || x.error || x.message || raw || `A2A Registry rejected XGuard with HTTP ${status}`);
          process.exit(1);
          NODE
