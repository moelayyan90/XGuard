name: Publish XGuard to MCP directories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"
      - "lhm.plugin.json"
      - "llms-install.md"
      - "SKILL.md"
      - "README.md"
      - "DISTRIBUTION.md"
      - ".github/xguard-directory-status.json"
      - "apps/worker/src/a2a-agent.ts"
      - "apps/worker/src/a2a-discovery.ts"
      - "apps/worker/src/agent-discovery-modern.ts"
      - "apps/worker/src/mainnet-mcp-modern.ts"
      - "apps/worker/src/mainnet-modern.ts"
      - "apps/worker/src/universal-mainnet.ts"
      - "apps/worker/src/payment-decision.ts"
      - "apps/worker/src/mcpub-discovery.ts"
      - ".github/workflows/publish-mcp-directories.yml"

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify payment-tool discovery metadata is synchronized
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          const lhm = JSON.parse(fs.readFileSync('lhm.plugin.json', 'utf8'));
          const runtime = fs.readFileSync('apps/worker/src/mainnet-mcp-modern.ts', 'utf8');
          const llms = fs.readFileSync('llms-install.md', 'utf8');
          const skill = fs.readFileSync('SKILL.md', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const distribution = fs.readFileSync('DISTRIBUTION.md', 'utf8');

          const runtimeVersion = runtime.match(/XGUARD_MCP_VERSION\s*=\s*"([^"]+)"/)?.[1];
          if (!runtimeVersion) throw new Error('Could not read XGUARD_MCP_VERSION from runtime');
          if (server.version !== runtimeVersion) throw new Error(`server.json ${server.version} != runtime ${runtimeVersion}`);
          if (lhm.version !== runtimeVersion) throw new Error(`lhm.plugin.json ${lhm.version} != runtime ${runtimeVersion}`);

          const requiredTools = [
            'xguard_payment_offer',
            'xguard_payment_decision',
            'xguard_discover',
            'xguard_resource_details',
            'xguard_status',
          ];
          const lhmNames = new Set(Array.isArray(lhm.tools) ? lhm.tools.map(t => t?.name) : []);
          for (const tool of requiredTools) {
            if (!runtime.includes(`name: "${tool}"`)) throw new Error(`Runtime no longer exposes ${tool}`);
            if (!lhmNames.has(tool)) throw new Error(`LHM manifest is missing ${tool}`);
            if (!llms.includes(`\`${tool}\``)) throw new Error(`llms-install.md is missing ${tool}`);
            if (!readme.includes(`\`${tool}\``)) throw new Error(`README.md is missing ${tool}`);
          }

          for (const tool of ['xguard_payment_offer', 'xguard_payment_decision']) {
            if (!skill.includes(`\`${tool}\``)) throw new Error(`SKILL.md is missing ${tool}`);
            if (!distribution.includes(`\`${tool}\``)) throw new Error(`DISTRIBUTION.md is missing ${tool}`);
          }

          if (readme.includes('three read-only catalog/status tools')) {
            throw new Error('README.md still advertises the obsolete three-tool discovery-only MCP surface');
          }
          if (!String(server.description || '').toLowerCase().includes('payment')) {
            throw new Error('Registry description must classify XGuard as a payment capability');
          }
          console.log(`XGuard discovery metadata synchronized at MCP ${runtimeVersion}`);
          NODE

  mcprepository:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh XGuard in MCP Repository
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS --max-time 20 \
            --retry 4 --retry-all-errors --retry-delay 2 \
            -X POST 'https://mcprepository.com/api/index' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://github.com/moelayyan90/XGuard"}')"
          printf '%s\n' "${response}"
          printf '%s' "${response}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.valid === false) {
                console.error(x.reason || x.message || "MCP Repository rejected XGuard");
                process.exit(1);
              }
              if (x.duplicate === true) {
                console.log("XGuard is already indexed by MCP Repository.");
                return;
              }
              if (x.status === "queued" || x.url || x.message) {
                console.log("XGuard MCP Repository refresh accepted.");
                return;
              }
              console.error("Unexpected MCP Repository response shape");
              process.exit(1);
            });
          '

  mcpub:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh XGuard in mcpub
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xguardgate.com'

          manifest="$(curl -fsS --max-time 20 --retry 4 --retry-all-errors --retry-delay 2 "${BASE}/.well-known/mcp.json")"
          printf '%s' "${manifest}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if (x.name !== "XGuard" || x.mcp !== "https://xguardgate.com/mcp" || x.registryName !== "io.github.moelayyan90/xguard") process.exit(1);
            });
          '

          submit="$(curl -sS --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 -w $'\n%{http_code}' \
            -X POST 'https://mcpub.dev/mcp' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"submit","arguments":{"url":"https://xguardgate.com","description":"XGuard payment coordination, transaction safety and evidence gateway for buyer/agent pre-payment decisions, MCP tools, API execution, and independent x402 settlement truth."}}}')"
          submit_code="${submit##*$'\n'}"
          submit_body="${submit%$'\n'*}"
          printf '%s\n' "${submit_body}"
          if [[ ! "${submit_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "mcpub submission returned HTTP ${submit_code}." >&2
            exit 1
          fi

          lookup="$(curl --fail-with-body -sS --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 \
            -X POST 'https://mcpub.dev/mcp' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get","arguments":{"url":"https://xguardgate.com"}}}')"
          printf '%s\n' "${lookup}"
          if ! printf '%s' "${lookup}" | grep -Fq 'xguardgate.com'; then
            echo "mcpub did not return the canonical XGuard endpoint after refresh." >&2
            exit 1
          fi
          echo "XGuard mcpub refresh verified."

  a2aregistry:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh XGuard in A2A Registry
        shell: bash
        run: |
          set -euo pipefail
          URI='https://xguardgate.com/.well-known/agent-card.json'
          card="$(curl -fsS --max-time 20 --retry 4 --retry-all-errors --retry-delay 2 "${URI}")"
          if ! printf '%s' "${card}" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const interfaces=Array.isArray(x.supportedInterfaces)?x.supportedInterfaces:[];
              const v1=interfaces.some(i=>i&&String(i.url||"")==="https://xguardgate.com/a2a"&&i.protocolBinding==="JSONRPC"&&String(i.protocolVersion||"")==="1.0");
              const v03=interfaces.some(i=>i&&String(i.url||"")==="https://xguardgate.com/a2a"&&i.protocolBinding==="JSONRPC"&&String(i.protocolVersion||"").startsWith("0.3"));
              process.exit(v1&&v03?0:1);
            });
          '; then
            echo "XGuard Agent Card is not A2A 1.0-compatible with the advertised 0.3 compatibility interface; refusing registry refresh."
            exit 1
          fi
          response="$(curl -sS --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 -w $'\n%{http_code}' \
            -X POST 'https://a2aregistry.org/api/agents/register' \
            -H 'Content-Type: application/json' \
            --data "{\"wellKnownURI\":\"${URI}\"}")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          printf '%s\n' "${body}"
          lower="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${code}" =~ ^2[0-9][0-9]$ ]] || [[ "${code}" == "409" ]] || [[ "${lower}" == *"already"* ]] || [[ "${lower}" == *"exist"* ]] || [[ "${lower}" == *"duplicate"* ]]; then
            echo "XGuard A2A Registry refresh accepted or already registered."
            exit 0
          fi
          echo "A2A Registry rejected XGuard refresh (HTTP ${code})." >&2
          exit 1
