name: XGuard x402 Facilitator CI

on:
  pull_request:
    paths:
      - "apps/relay/src/index.js"
      - "apps/relay/src/x402-market.js"
      - "apps/relay/src/rail-entry.js"
      - "apps/relay/src/secure-entry.js"
      - "apps/relay/src/trust-entry.js"
      - "apps/relay/src/egress-entry.js"
      - "apps/relay/src/egress-vault.js"
      - "apps/relay/src/site-egress.js"
      - "apps/relay/test/settlement-safety.mjs"
      - "apps/relay/wrangler.jsonc"
      - "server.json"
      - ".github/workflows/x402-facilitator-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/relay/src/index.js"
      - "apps/relay/src/x402-market.js"
      - "apps/relay/src/rail-entry.js"
      - "apps/relay/src/secure-entry.js"
      - "apps/relay/src/trust-entry.js"
      - "apps/relay/src/egress-entry.js"
      - "apps/relay/src/egress-vault.js"
      - "apps/relay/src/site-egress.js"
      - "apps/relay/test/settlement-safety.mjs"
      - "apps/relay/wrangler.jsonc"
      - "server.json"
      - ".github/workflows/x402-facilitator-ci.yml"

permissions:
  contents: read

jobs:
  facilitator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install relay dependencies
        run: npm install --prefix apps/relay --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check apps/relay/src/index.js
          node --check apps/relay/src/x402-market.js
          node --check apps/relay/src/rail-entry.js
          node --check apps/relay/src/secure-entry.js
          node --check apps/relay/src/trust-entry.js
          node --check apps/relay/src/egress-entry.js
          node --check apps/relay/src/egress-vault.js
          node --check apps/relay/src/site-egress.js
          node --check apps/relay/test/settlement-safety.mjs
      - name: Settlement safety behavior
        run: node apps/relay/test/settlement-safety.mjs
      - name: Secretless Egress unit behavior
        run: node --test apps/relay/src/egress-vault-test.js
      - name: Contract assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Secretless Agent Gateway' README.md
          grep -q 'Native x402 compatibility' README.md
          grep -q '/discovery/resources' apps/relay/src/x402-market.js
          grep -q 'batch-settlement' apps/relay/src/x402-market.js
          grep -q 'automatic_routing' apps/relay/src/x402-market.js
          grep -q 'settlement_ambiguous_fail_closed: true' apps/relay/src/x402-market.js
          grep -q 'settlement_transport_failover: "reconciliation-gated"' apps/relay/src/x402-market.js
          grep -q 'const VERSION = "5.0.1"' apps/relay/src/x402-market.js
          grep -q 'settlement_state_ambiguous_no_reconciliation' apps/relay/src/index.js
          grep -q 'ambiguous_settlement_fail_closed: true' apps/relay/src/index.js
          grep -q 'x-xguard-settlement-safety' apps/relay/src/index.js
          grep -q 'EGRESS_EXECUTION_CREDITS' apps/relay/wrangler.jsonc
          grep -q 'EgressCapabilityState' apps/relay/wrangler.jsonc
          grep -q 'workers_dev.*false' apps/relay/wrangler.jsonc
          node -e 'const x=require("./server.json"); if(!/^5\.0\.[0-9]+$/.test(String(x.version))||!String(x.title).includes("Secretless")||typeof x.description!=="string"||x.description.length>100||x.remotes?.[0]?.url!=="https://api.xguardgate.com/mcp") process.exit(1)'
      - name: Wrangler dry run
        run: npx --yes wrangler@4.123.0 deploy --dry-run --config apps/relay/wrangler.jsonc
