name: One-shot official sources formatter

on:
  push:
    branches: [fix/commerce-official-sources]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/commerce-official-sources
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/official-commerce-sources.ts apps/worker/src/commerce-mainnet.ts apps/worker/migrations/0027_official_commerce_sources.sql tests/official-commerce-sources.test.ts .github/workflows/commerce-official-sources-check.yml docs/commerce-official-sources.md
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/official-commerce-sources.ts apps/worker/src/commerce-mainnet.ts apps/worker/migrations/0027_official_commerce_sources.sql tests/official-commerce-sources.test.ts .github/workflows/commerce-official-sources-check.yml docs/commerce-official-sources.md
          git commit -m "style: format official commerce sources"
          git push origin HEAD:fix/commerce-official-sources
