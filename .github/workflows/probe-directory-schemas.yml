name: Submit XGuard to ServerHub

on:
  push:
    branches: [chore/probe-directory-schemas]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit XGuard
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -w $'\n%{http_code}' \
            -X POST 'https://www.serverhub.digital/api/submit' \
            -H 'Content-Type: application/json' \
            --data '{"github_url":"https://github.com/moelayyan90/XGuard","name":"XGuard","description":"x402 economic firewall and facilitator safety gateway for Base mainnet USDC, with remote MCP, A2A discovery, replay protection, finality verification, and guarded settlement routing.","category":"security","author_name":"moelayyan90","author_email":"mo.elayyan2023@gmail.com"}')"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP ${code}"
          printf '%s\n' "${body}"
          lower="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${code}" =~ ^2[0-9][0-9]$ ]] || [[ "${code}" == "409" ]] || [[ "${lower}" == *"already"* ]] || [[ "${lower}" == *"exist"* ]]; then
            echo "ServerHub submission accepted or already present."
            exit 0
          fi
          echo "ServerHub rejected XGuard (HTTP ${code})." >&2
          exit 1
