name: Inspect ServerHub category enum

on:
  push:
    branches: [chore/probe-directory-schemas]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract submit-page category values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/serverhub
          curl -fsS --max-time 20 'https://www.serverhub.digital/submit' -o /tmp/serverhub/page.html
          grep -oE 'src="[^"]+\.js[^" ]*"' /tmp/serverhub/page.html | cut -d'"' -f2 | sort -u > /tmp/serverhub/scripts.txt || true
          while IFS= read -r src; do
            [[ -z "${src}" ]] && continue
            if [[ "${src}" == http* ]]; then url="${src}"; else url="https://www.serverhub.digital${src}"; fi
            file="/tmp/serverhub/$(basename "${src}" | cut -d'?' -f1)"
            curl -fsS --max-time 20 "${url}" -o "${file}" || true
          done < /tmp/serverhub/scripts.txt
          echo '=== around Security ==='
          grep -RaoE '.{0,900}Security.{0,900}' /tmp/serverhub/*.js 2>/dev/null | head -20 || true
          echo '=== likely option values ==='
          grep -RaoE '.{0,300}(Data|DevTools|Communication|Productivity|Finance|Marketing|AI/ML|Database|Cloud|Security|Analytics|Other).{0,600}' /tmp/serverhub/*.js 2>/dev/null | grep -E 'value|label|option|category' | head -60 || true
