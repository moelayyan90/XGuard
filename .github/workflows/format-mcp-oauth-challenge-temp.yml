name: Format MCP OAuth challenge temporary

on:
  pull_request:
    paths:
      - "apps/worker/src/mcp-oauth-challenge.ts"
      - "tests/worker/mcp-oauth-challenge.test.ts"
      - ".github/workflows/format-mcp-oauth-challenge-temp.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/mcp-oauth-challenge.ts tests/worker/mcp-oauth-challenge.test.ts
      - name: Commit formatted challenge files
        shell: bash
        run: |
          if git diff --quiet -- apps/worker/src/mcp-oauth-challenge.ts tests/worker/mcp-oauth-challenge.test.ts; then
            exit 0
          fi
          git config user.name "xguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/worker/src/mcp-oauth-challenge.ts tests/worker/mcp-oauth-challenge.test.ts
          git commit -m "format MCP OAuth challenge"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
