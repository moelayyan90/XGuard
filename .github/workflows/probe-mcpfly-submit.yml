name: Probe MCPFly public submit endpoint

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect MCPFly submit client request shape
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request

          url = "https://mcpserver.so/_next/static/chunks/app/submit/page-307d78cf73fd5812.js"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 XGuard-registry-check"})
          with urllib.request.urlopen(req, timeout=30) as r:
              js = r.read().decode("utf-8", "replace")

          print("length", len(js))
          for needle in ["/api/v1", "submit", "github", "serverConfig", "server_config", "fetch(", "axios", "method:", "POST"]:
              print("===", needle, "===")
              count = 0
              for m in re.finditer(re.escape(needle), js, re.I):
                  a = max(0, m.start() - 700)
                  b = min(len(js), m.end() + 1200)
                  print(js[a:b].replace("\\n", " "))
                  count += 1
                  if count >= 8:
                      break
          PY
