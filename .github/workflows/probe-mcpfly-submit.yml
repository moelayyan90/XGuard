name: Probe MCPFly public submit endpoint

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public submit page and client bundles
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://mcpserver.so"
          req = urllib.request.Request(
              base + "/submit",
              headers={"User-Agent": "Mozilla/5.0 XGuard-registry-check"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")

          print("=== PAGE HINTS ===")
          for hit in sorted(set(re.findall(r'(?:https?://[^\"\'<>\\s]+|/api/[A-Za-z0-9_?&=./:-]+)', html))):
              if "api" in hit.lower() or "submit" in hit.lower():
                  print(hit)

          scripts = sorted(set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+\.js[^\"\']*)[\"\']', html, re.I)))
          print("=== JS BUNDLES ===")
          for script in scripts:
              print(script)

          patterns = [
              re.compile(r'https?://[^\"\'<>\\s]+'),
              re.compile(r'/api/[A-Za-z0-9_?&=./:-]+'),
              re.compile(r'[A-Za-z0-9_/-]*submit[A-Za-z0-9_/?&=.-]*', re.I),
          ]

          for script in scripts:
              url = urllib.parse.urljoin(base + "/submit", script)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 XGuard-registry-check"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js = r.read().decode("utf-8", "replace")
              except Exception as exc:
                  print("FETCH_ERROR", url, type(exc).__name__, str(exc))
                  continue
              hits = set()
              for pattern in patterns:
                  hits.update(pattern.findall(js))
              selected = sorted(h for h in hits if "submit" in h.lower() or "/api/" in h.lower())
              if selected:
                  print("=== HINTS", url, "===")
                  for hit in selected[:200]:
                      print(hit)
          PY
