name: Patch mainnet compatibility readiness once

on:
  push:
    branches: [fix/mainnet-compatibility-readiness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mainnet-compatibility-readiness
      - name: Split core and compatibility live smokes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/deploy-mainnet.yml';
          let source = fs.readFileSync(path, 'utf8');
          const old = '          npm run smoke:mainnet\n';
          const replacement = [
            '          echo "=== core mainnet smoke ==="',
            '          node scripts/smoke-mainnet.mjs',
            '          echo "=== x402 compatibility smoke ==="',
            '          node scripts/smoke-compatibility-mainnet.mjs',
            '',
          ].join('\n');
          if (!source.includes(old)) {
            throw new Error('deploy-mainnet.yml no longer contains the expected composite smoke command');
          }
          source = source.replace(old, replacement);
          fs.writeFileSync(path, source);
          fs.rmSync('.github/workflows/patch-mainnet-compat-readiness-once.yml');
          NODE
      - name: Commit focused readiness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split mainnet core and compatibility live smokes"
          git push origin HEAD:fix/mainnet-compatibility-readiness
