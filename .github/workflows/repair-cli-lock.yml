name: Repair CLI lockfile

on:
  push:
    branches: [agent/github-direct-install]
    paths:
      - "packages/cli/package.json"
      - ".github/workflows/repair-cli-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/github-direct-install
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts --workspace xguard
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches CLI package metadata"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for CLI runtime dependency"
          git push origin HEAD:agent/github-direct-install
