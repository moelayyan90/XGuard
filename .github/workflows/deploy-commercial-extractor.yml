name: Deploy Isolated XGuard Web Extractor

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-web-extractor-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Validate isolated Worker source
        run: |
          node --check commercial/cloudflare-xguard/src/safe-index.js
          node --check commercial/cloudflare-xguard/src/secure-entry.js

      - name: Refuse to target xguard-mainnet
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('commercial/cloudflare-xguard/wrangler.jsonc', 'utf8');
          if (!source.includes('"name": "xguard-web-extractor"')) {
            console.error('Commercial Worker must remain isolated as xguard-web-extractor');
            process.exit(1);
          }
          if (source.includes('"name": "xguard-mainnet"')) {
            console.error('Refusing to overwrite xguard-mainnet');
            process.exit(1);
          }
          NODE

      - name: Deploy isolated Web Extractor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n ')"
          [[ -n "$token" && -n "$account" ]] || { echo 'Cloudflare deployment credentials unavailable'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          npx wrangler deploy --config commercial/cloudflare-xguard/wrangler.jsonc

      - name: Install RapidAPI proxy secret when configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN="$token"
          if [[ -n "${RAPIDAPI_PROXY_SECRET:-}" ]]; then
            printf '%s' "$RAPIDAPI_PROXY_SECRET" | npx wrangler secret put RAPIDAPI_PROXY_SECRET --config commercial/cloudflare-xguard/wrangler.jsonc
          fi

      - name: Verify isolated endpoint without touching XGuard mainnet domains
        env:
          RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://xguard-web-extractor.maqamapp.workers.dev'
          for attempt in {1..20}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "${base}/healthz?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const x=require("/tmp/health.json");if(x.service!=="xguard-web-extractor"||x.live!==true)process.exit(1)'; then break; fi
            [[ "$attempt" != '20' ]] || { cat /tmp/health.json || true; exit 1; }
            sleep 5
          done
          headers=(-H 'content-type: application/json')
          if [[ -n "${RAPIDAPI_PROXY_SECRET:-}" ]]; then headers+=(-H "x-rapidapi-proxy-secret: ${RAPIDAPI_PROXY_SECRET}"); fi
          curl -fsS --max-time 30 "${headers[@]}" --data '{"url":"https://example.com","includeLinks":true}' "${base}/v1/extract" > /tmp/extract.json
          node -e 'const x=require("/tmp/extract.json");if(x.product!=="XGuard Web Extractor")process.exit(1)'

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='Isolated XGuard Web Extractor deployment failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='xguard-web-extractor deployed without touching xguard-mainnet'
            target_url='https://xguard-web-extractor.maqamapp.workers.dev'
          fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-web-extractor-isolated",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
