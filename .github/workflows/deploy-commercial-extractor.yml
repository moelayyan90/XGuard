name: Deploy XGuard Web Extractor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commercial/cloudflare-xguard/**"
      - "scripts/rebind-worker-domains.mjs"
      - ".github/workflows/deploy-commercial-extractor.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-mainnet-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Validate Worker source
        run: |
          node --check commercial/cloudflare-xguard/src/safe-index.js
          node --check commercial/cloudflare-xguard/src/secure-entry.js
          node --check scripts/rebind-worker-domains.mjs

      - name: Deploy Web Extractor directly over xguard-mainnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n ')"
          [[ -n "$token" && -n "$account" ]] || { echo 'Cloudflare deployment credentials unavailable'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          npx wrangler deploy --config commercial/cloudflare-xguard/wrangler.jsonc

      - name: Install RapidAPI proxy secret when configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN="$token"
          if [[ -n "${RAPIDAPI_PROXY_SECRET:-}" ]]; then
            printf '%s' "$RAPIDAPI_PROXY_SECRET" | npx wrangler secret put RAPIDAPI_PROXY_SECRET --config commercial/cloudflare-xguard/wrangler.jsonc
          fi

      - name: Bind all canonical domains to xguard-mainnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/rebind-worker-domains.mjs \
            xguardgate.com=xguard-mainnet \
            www.xguardgate.com=xguard-mainnet \
            extract.xguardgate.com=xguard-mainnet

      - name: Verify live production endpoint
        env:
          RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://xguardgate.com'
          for attempt in {1..30}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "${base}/healthz?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const x=require("/tmp/health.json");if(x.service!=="xguard-web-extractor"||x.live!==true)process.exit(1)'; then break; fi
            [[ "$attempt" != '30' ]] || { cat /tmp/health.json || true; exit 1; }
            sleep 5
          done
          curl -fsS "${base}/openapi.json" > /tmp/openapi.json
          node -e 'const x=require("/tmp/openapi.json");if(x.openapi!=="3.1.0"||!x.paths?.["/v1/extract"])process.exit(1)'
          headers=(-H 'content-type: application/json')
          if [[ -n "${RAPIDAPI_PROXY_SECRET:-}" ]]; then headers+=(-H "x-rapidapi-proxy-secret: ${RAPIDAPI_PROXY_SECRET}"); fi
          curl -fsS --max-time 30 "${headers[@]}" --data '{"url":"https://example.com","includeLinks":true}' "${base}/v1/extract" > /tmp/extract.json
          node -e 'const x=require("/tmp/extract.json");if(x.product!=="XGuard Web Extractor"||!String(x.title).includes("Example Domain")||!String(x.markdown).includes("Example Domain"))process.exit(1)'

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard Web Extractor deployment failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='xguard-mainnet is the production Web Extractor'
            target_url='https://xguardgate.com'
          fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-web-extractor-production",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
