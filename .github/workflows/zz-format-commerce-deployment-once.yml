name: One-shot commerce deployment formatter

on:
  push:
    branches: [fix/commerce-end-to-end]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/commerce-end-to-end
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/wrangler.mainnet.jsonc apps/worker/wrangler.public-fallback.jsonc .github/workflows/global-commerce-mainnet.yml .github/workflows/public-fallback.yml
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/wrangler.mainnet.jsonc apps/worker/wrangler.public-fallback.jsonc .github/workflows/global-commerce-mainnet.yml .github/workflows/public-fallback.yml
          git commit -m "style: format commerce deployment configuration"
          git push origin HEAD:fix/commerce-end-to-end
