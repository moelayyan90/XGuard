name: One-shot hunter stable formatter

on:
  push:
    branches: [feat/global-opportunity-hunter]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/global-opportunity-hunter
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Stabilize formatter output
        run: |
          npx prettier --write apps/worker/src/global-opportunity-hunter.ts
          npx prettier --write apps/worker/src/global-opportunity-hunter.ts
          npx prettier --check apps/worker/src/global-opportunity-hunter.ts
      - name: Persist stable output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/worker/src/global-opportunity-hunter.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/global-opportunity-hunter.ts
          git commit -m "style: stabilize hunter formatting"
          git push origin HEAD:feat/global-opportunity-hunter
