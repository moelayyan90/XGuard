name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonicalize mainnet hardening files
        run: |
          npx prettier --write \
            apps/worker/src/mainnet-recovery.ts \
            apps/worker/src/mainnet-supervisor.ts \
            apps/worker/src/xpay-rate-gate.ts \
            apps/worker/wrangler.mainnet.jsonc \
            tests/worker/mainnet-recovery.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/worker/src/mainnet-recovery.ts \
              apps/worker/src/mainnet-supervisor.ts \
              apps/worker/src/xpay-rate-gate.ts \
              apps/worker/wrangler.mainnet.jsonc \
              tests/worker/mainnet-recovery.test.ts
            git commit -m "format mainnet hardening"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
