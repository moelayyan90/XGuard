name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonicalize provider discovery files
        run: npx prettier --write apps/worker/src/discovery.ts tests/discovery.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- apps/worker/src/discovery.ts tests/discovery.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/worker/src/discovery.ts tests/discovery.test.ts
            git commit -m "format provider discovery"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
