name: XGuard ACE CI

on:
  push:
    branches: [main, "bam/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: xguard-ace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Reference simulation
        run: cargo run --quiet -p xguard-sim -- examples/rules.json examples/transactions.json > /tmp/xguard-decisions.json
      - name: Verify reference decisions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/xguard-decisions.json', 'utf8'));
          if (rows.length !== 2) throw new Error('expected two fixtures');
          if (rows[0].decision.delay_ms !== 20) throw new Error('protected flow must be delayed 20ms');
          if (rows[1].decision.delay_ms !== 0) throw new Error('bypass flow must remain on normal path');
          NODE

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Worker
        run: |
          node --check apps/portal/src/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps/portal/wrangler.jsonc','utf8'))"
      - name: Reject legacy product surfaces
        run: |
          if grep -RniE 'Email Shield|RapidAPI|WordPress|WooCommerce|x402|AI Inference Provider' \
            --exclude-dir=.git --exclude='*.lock' .; then
            echo 'Legacy XGuard product text remains in the active tree'
            exit 1
          fi
