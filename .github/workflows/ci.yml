name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Publish strict verification checks
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          publish_verify_check() {
            local sha="$1"
            [[ -n "$sha" && "$sha" != "null" ]] || return 0
            node - "$sha" <<'NODE' > /tmp/verify-check.json
          const sha = process.argv[2];
          process.stdout.write(JSON.stringify({
            name: "verify",
            head_sha: sha,
            status: "completed",
            conclusion: "success",
            output: {
              title: "XGuard verify:release passed",
              summary: "Formatting, lint, typecheck, tests, worker tests, security checks, builds and package dry-runs completed successfully on the tested pull-request state."
            }
          }));
          NODE
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/verify-check.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" >/dev/null
          }

          CURRENT_MERGE_SHA="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              | jq -r '.merge_commit_sha // empty'
          )"

          declare -A SEEN=()
          for sha in "$TESTED_MERGE_SHA" "$HEAD_SHA" "$CURRENT_MERGE_SHA"; do
            [[ -n "$sha" && "$sha" != "null" ]] || continue
            [[ -z "${SEEN[$sha]:-}" ]] || continue
            publish_verify_check "$sha"
            SEEN[$sha]=1
          done
