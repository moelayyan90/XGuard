name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: read

jobs:
  format-zero-friction:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/zero-friction-x402' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-friction-x402
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only final changed files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write apps/worker/src/public-payment-contract.ts apps/worker/src/zero-friction-x402.ts tests/zero-friction-billing.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name 'xguard-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/worker/src/public-payment-contract.ts apps/worker/src/zero-friction-x402.ts tests/zero-friction-billing.test.ts
          git commit -m 'chore: format final zero-friction files'
          git push origin HEAD:agent/zero-friction-x402

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
