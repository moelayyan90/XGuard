name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply and format mainnet status hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/worker/src/mainnet.ts")
          source = path.read_text()
          old = '''    successfulBillableSettlements: earned?.count ?? 0,
    earnedMicroUsd: earned?.total ?? 0,
    measuredAt: new Date().toISOString(),'''
          new = '''    successfulBillableSettlements: earned?.count ?? 0,
    earnedMicroUsd: earned?.total ?? 0,
    feeMicroUsd: feeMicroUsd(context.env),
    downstreamCostMicroUsd: downstreamCostMicroUsd(context.env),
    contributionMicroUsd:
      feeMicroUsd(context.env) - downstreamCostMicroUsd(context.env),
    measuredAt: new Date().toISOString(),'''
          if new not in source:
              if old not in source:
                  raise SystemExit("mainnet status response pattern not found")
              path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write \
            apps/worker/src/mainnet.ts \
            scripts/smoke-mainnet.mjs \
            docs/openapi.yaml \
            tests/mainnet-economics-source.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/worker/src/mainnet.ts scripts/smoke-mainnet.mjs docs/openapi.yaml tests/mainnet-economics-source.test.ts
            git commit -m "Expose live mainnet unit economics status"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
