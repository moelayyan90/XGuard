name: XGuard Live CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix apps/relay --no-audit --no-fund
      - name: Live syntax, security checks, strict types and behavior
        run: |
          npm run check
          npm test
      - name: Build and exercise actual workerd SQLite storage
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run build
          npm run --prefix apps/relay live:test-runtime
      - name: Preserve financial state and recovery invariants
        run: |
          node --test scripts/durable-object-deploy-guard-test.mjs
          node --test apps/relay/test/payment-context.mjs
          node apps/relay/test/settlement-safety.mjs
          node --test apps/relay/src/core/payment-rail-test.js apps/relay/src/core/reconcile-payment-test.js apps/relay/src/core/settlement-proof-test.js
          node --test apps/relay/src/seller-entry-test.js apps/relay/src/outcome-http-test.js
      - name: Validate production lifecycle against pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/durable-object-deploy-guard.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Dry-run the production bundle
        run: apps/relay/node_modules/.bin/wrangler deploy --dry-run --outdir .production-build --config apps/relay/wrangler.jsonc
