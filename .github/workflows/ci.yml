name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print settlement truth Prettier diff
        run: |
          npx prettier --write apps/worker/src/mainnet-settlement-truth.ts
          git diff --no-ext-diff -- apps/worker/src/mainnet-settlement-truth.ts
          git checkout -- apps/worker/src/mainnet-settlement-truth.ts
      - run: npm run verify:release
        env:
          WRANGLER_SEND_METRICS: "false"
