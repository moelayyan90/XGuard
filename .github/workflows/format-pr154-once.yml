name: Format PR 154 once

on:
  push:
    branches: [fix/mainnet-doc-entrypoints]

permissions:
  contents: write

concurrency:
  group: format-pr154-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mainnet-doc-entrypoints
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply repository Prettier and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            apps/mcp-example/src/server.ts \
            ARCHITECTURE.md \
            OPERATIONS.md \
            tests/mainnet-starter-source.test.ts \
            tests/mainnet-xpay-identity.test.ts
          rm -f .github/workflows/format-pr154-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format PR 154 with repository Prettier'
          git push origin HEAD:fix/mainnet-doc-entrypoints
