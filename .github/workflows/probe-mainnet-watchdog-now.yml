name: Probe mainnet watchdog now

on:
  push:
    branches:
      - fix/mainnet-deploy-latest-wins

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Probe live watchdog and active breaker state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          echo '--- watchdog healthz ---'
          curl -sS --max-time 20 -w $'\nHTTP=%{http_code}\n' https://xguard-watchdog.maqamapp.workers.dev/healthz
          echo '--- mainnet readyz ---'
          curl -sS --max-time 20 -w $'\nHTTP=%{http_code}\n' https://xguard-mainnet.maqamapp.workers.dev/readyz
          echo '--- watchdog OPEN breakers ---'
          npx wrangler d1 execute xguard-watchdog --remote --command "SELECT route_key,state,reason,fingerprint,opened_at,expires_at,updated_at,failures,successes FROM watchdog_breakers WHERE state='OPEN' ORDER BY updated_at DESC LIMIT 20;"
          echo '--- watchdog probe state ---'
          npx wrangler d1 execute xguard-watchdog --remote --command "SELECT probe_key,consecutive_failures,consecutive_successes,last_status,last_error_code,last_checked_at FROM watchdog_probe_state ORDER BY probe_key;"
