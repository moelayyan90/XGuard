name: Repair mainnet deploy guard

on:
  push:
    branches:
      - fix/mainnet-deploy-entrypoint-guard

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mainnet-deploy-entrypoint-guard
      - name: Update guarded production entrypoint assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy-mainnet.yml')
          source = path.read_text()
          old_regex = 'if (!/"main"\\s*:\\s*"src\\/mainnet-modern\\.ts"/.test(source)) {'
          new_regex = 'if (!/"main"\\s*:\\s*"src\\/monetized-mainnet\\.ts"/.test(source)) {'
          old_error = "throw new Error('refusing deployment: mainnet entrypoint is not src/mainnet-modern.ts');"
          new_error = "throw new Error('refusing deployment: mainnet entrypoint is not src/monetized-mainnet.ts');"
          if old_regex not in source or old_error not in source:
              raise SystemExit('stale guard markers not found exactly once')
          source = source.replace(old_regex, new_regex, 1).replace(old_error, new_error, 1)
          path.write_text(source)
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/deploy-mainnet.yml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-mainnet.yml
          git commit -m "fix: align deploy guard with monetized mainnet entrypoint"
          git push origin HEAD:fix/mainnet-deploy-entrypoint-guard
