name: Emergency stop all XGuard runtimes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-stop-all.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every known XGuard Worker through Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare credentials are unavailable; emergency stop cannot be claimed."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          for worker in xguard-mainnet xguard-watchdog xguard-testnet xguard-economic-preview xguard-testnet-test; do
            echo "Stopping ${worker}..."
            code="$(curl --silent --show-error --max-time 30 \
              --output "/tmp/${worker}-delete.json" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "${api}/${worker}?force=true" || true)"
            echo "DELETE ${worker} -> ${code}"
            if [[ "${code}" != "200" && "${code}" != "404" ]]; then
              cat "/tmp/${worker}-delete.json" || true
              echo "::error::Cloudflare did not confirm deletion of ${worker}."
              exit 1
            fi
          done

      - name: Verify public endpoints are not serving XGuard
        shell: bash
        run: |
          set -euo pipefail
          check_not_live() {
            local url="$1"
            local code
            code="$(curl -sS -L --max-time 15 -o /tmp/stop-check.out -w '%{http_code}' "${url}" || true)"
            echo "${url} -> ${code}"
            if [[ "${code}" == "200" ]]; then
              echo "::error::${url} still returns HTTP 200 after emergency stop."
              head -c 500 /tmp/stop-check.out || true
              exit 1
            fi
          }

          check_not_live "https://xguardgate.com/"
          check_not_live "https://xguard-watchdog.maqamapp.workers.dev/healthz"
          check_not_live "https://xguard-testnet.maqamapp.workers.dev/status"
          check_not_live "https://xguard-economic-preview.maqamapp.workers.dev/"

      - name: Confirm preserved data boundary
        run: echo "Public Workers stopped. Repository and D1 databases were intentionally not deleted."

      - name: Publish shutdown success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"xguard-shutdown","description":"All known XGuard public runtimes stopped"}'

      - name: Publish shutdown failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"xguard-shutdown","description":"XGuard shutdown verification failed"}'
