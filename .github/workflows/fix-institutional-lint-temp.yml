name: Fix institutional HTML escaping lint once

on:
  push:
    branches: [agent/complete-child-safety-platform]
    paths:
      - .github/workflows/fix-institutional-lint-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Replace escaping helper and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/worker/src/child-safety-institutional.ts')
          s=p.read_text()
          start=s.index('function esc(value: string): string {')
          end=s.index('function styles(): string {', start)
          replacement='''function esc(value: string): string {\n  return value.replace(/[&<>"]/g, (ch) => {\n    if (ch === "&") return "&amp;";\n    if (ch === "<") return "&lt;";\n    if (ch === ">") return "&gt;";\n    return "&quot;";\n  });\n}\n\n'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          npx prettier --write apps/worker/src/child-safety-institutional.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety-institutional.ts
          git commit -m "Fix institutional HTML escaping lint"
          git push origin HEAD:agent/complete-child-safety-platform
