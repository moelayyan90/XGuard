name: Submit XGuard to Kiprio MCP registry

on:
  push:
    branches: [chore/kiprio-submit]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit XGuard
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 30 -w $'\n%{http_code}' \
            -X POST 'https://kiprio.com/api/mcp-submit' \
            -H 'Content-Type: application/json' \
            --data '{"github_url":"https://github.com/moelayyan90/XGuard","submitter":"moelayyan90"}')"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP ${code}"
          printf '%s\n' "${body}"
          lower="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${code}" =~ ^2[0-9][0-9]$ ]] || [[ "${code}" == "409" ]] || [[ "${lower}" == *"already"* ]] || [[ "${lower}" == *"exist"* ]]; then
            echo "Kiprio submission accepted or already present."
            exit 0
          fi
          echo "Kiprio rejected XGuard (HTTP ${code})." >&2
          exit 1
