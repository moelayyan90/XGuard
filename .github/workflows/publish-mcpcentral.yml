name: Publish XGuard to MCPCentral

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcpcentral.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Check MCPCentral for this exact version
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
          body="$(curl --fail --silent --show-error "https://registry.mcpcentral.io/v0.1/servers?search=${encoded}&limit=100" || true)"
          if printf '%s' "$body" | grep -Fq "\"name\":\"${name}\"" && printf '%s' "$body" | grep -Fq "\"version\":\"${version}\""; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "MCPCentral already contains ${name} ${version}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with MCPCentral using GitHub OIDC
        if: steps.existing.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc --registry https://registry.mcpcentral.io

      - name: Publish XGuard to MCPCentral
        if: steps.existing.outputs.exists != 'true'
        run: ./mcp-publisher publish

      - name: Verify external listing
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./server.json").name')"
          version="$(node -p 'require("./server.json").version')"
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
          for i in {1..12}; do
            body="$(curl --fail --silent --show-error "https://registry.mcpcentral.io/v0.1/servers?search=${encoded}&limit=100" || true)"
            if printf '%s' "$body" | grep -Fq "\"name\":\"${name}\"" && printf '%s' "$body" | grep -Fq "\"version\":\"${version}\""; then
              echo "Verified ${name} ${version} in MCPCentral."
              exit 0
            fi
            sleep 5
          done
          echo "XGuard was not observable in MCPCentral after publication."
          exit 1
