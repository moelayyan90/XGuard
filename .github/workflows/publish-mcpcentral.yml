name: Publish XGuard to MCPCentral

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcpcentral.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Authenticate to MCPCentral with GitHub OIDC
        run: ./mcp-publisher login github-oidc --registry https://registry.mcpcentral.io
      - name: Publish remote XGuard server
        run: ./mcp-publisher publish server.json --registry https://registry.mcpcentral.io
