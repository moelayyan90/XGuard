name: Diagnose XGuard Live Domain

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Cloudflare Worker domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n ')"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')
          api='https://api.cloudflare.com/client/v4'
          curl -fsS "${auth[@]}" "${api}/accounts/${account}/workers/domains" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(JSON.stringify({success:x.success,result:(x.result||[]).filter(r=>String(r.hostname).includes("xguardgate.com")).map(r=>({hostname:r.hostname,service:r.service,zone_id:r.zone_id}))},null,2))})' || true

      - name: Check real browser-style GET and DNS
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          for host in xguardgate.com www.xguardgate.com app.xguardgate.com; do
            echo "--- ${host} ---"
            echo '1.1.1.1 A:'; dig @1.1.1.1 +time=3 +tries=1 +short A "$host" || true
            echo '8.8.8.8 A:'; dig @8.8.8.8 +time=3 +tries=1 +short A "$host" || true
            echo 'HEAD:'; curl -kIsS --connect-timeout 10 --max-time 15 "https://${host}/" | head -12 || true
            echo 'GET status/body:'
            code="$(curl -ksS --connect-timeout 10 --max-time 20 -A 'Mozilla/5.0 XGuard-Recovery' -D /tmp/headers.txt -o /tmp/root.html -w '%{http_code}' "https://${host}/?recovery=${GITHUB_RUN_ID}" || true)"
            echo "GET_HTTP=${code}"
            head -20 /tmp/headers.txt || true
            echo "BODY_BYTES=$(wc -c < /tmp/root.html 2>/dev/null || echo 0)"
            echo 'BODY_PREFIX:'; head -c 600 /tmp/root.html 2>/dev/null || true; echo
            echo 'TITLE:'; grep -o -m1 '<title>[^<]*</title>' /tmp/root.html 2>/dev/null || true
            echo 'health:'; curl -ksS --connect-timeout 10 --max-time 15 "https://${host}/healthz?recovery=${GITHUB_RUN_ID}" || true
            echo 'status:'; curl -ksS --connect-timeout 10 --max-time 15 "https://${host}/v1/status?recovery=${GITHUB_RUN_ID}" | head -c 1000 || true; echo
          done
