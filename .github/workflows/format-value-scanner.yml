name: Format value scanner

on:
  push:
    branches:
      - agent/value-harvester-core
    paths:
      - apps/worker/src/value-scanner.ts
      - .github/workflows/format-value-scanner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/value-harvester-core
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/value-scanner.ts
      - name: Commit formatted scanner
        shell: bash
        run: |
          if git diff --quiet -- apps/worker/src/value-scanner.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/value-scanner.ts
          git commit -m "format value scanner"
          git push origin HEAD:agent/value-harvester-core
