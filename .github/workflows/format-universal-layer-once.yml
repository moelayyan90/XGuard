name: Format universal payment layer once

on:
  push:
    branches:
      - agent/restore-universal-payment-layer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-universal-payment-layer
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply repository Prettier rules
        run: npx prettier --write apps/worker/src/payment-layer-public.ts tests/payment-layer-public.test.ts
      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker/src/payment-layer-public.ts tests/payment-layer-public.test.ts
          git commit -m "Format universal payment-layer files"
          git push origin HEAD:agent/restore-universal-payment-layer
