name: Format HTTP x402 bridge once

on:
  push:
    branches:
      - feature/http-x402-v1-client-v2-resource-bridge

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/http-x402-v1-client-v2-resource-bridge
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/x402-http-compatibility-bridge.ts tests/x402-http-compatibility-bridge.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/x402-http-compatibility-bridge.ts tests/x402-http-compatibility-bridge.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format x402 HTTP compatibility bridge"
          git push
