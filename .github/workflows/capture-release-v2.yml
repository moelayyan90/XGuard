name: Capture Economic Firewall release

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/capture-release-v2.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture verify release
        id: verify
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set +e
          npm run verify:release > verify-release-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: economic-v2-release-output
          path: verify-release-output.txt
          if-no-files-found: error
      - if: steps.verify.outputs.exit_code != '0'
        run: exit 1
