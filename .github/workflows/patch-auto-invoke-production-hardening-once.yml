name: Patch auto invoke production hardening once

on:
  push:
    branches: [fix/auto-invoke-production-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/auto-invoke-production-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-auto-invoke-production-hardening.mjs
      - name: Make bounded clone cancellation non-blocking
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/worker/src/auto-invoke.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldValue = '        await reader.cancel().catch(() => undefined);';
          const newValue = '        void reader.cancel().catch(() => undefined);';
          if (!source.includes(oldValue) && !source.includes(newValue)) {
            throw new Error('bounded reader cancellation block not found');
          }
          source = source.replace(oldValue, newValue);
          fs.writeFileSync(path, source);
          NODE
      - run: node scripts/patch-auto-invoke-production-tests.mjs
      - run: npx prettier --write apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts tests/worker/auto-invoke-accounting.test.ts
      - run: npm run build
      - run: npx vitest run tests/auto-invoke.test.ts
      - run: npx vitest run --config vitest.worker.config.ts tests/worker/auto-invoke-accounting.test.ts tests/worker/universal-gateway-billing.test.ts
      - run: npm run typecheck
      - name: Commit production hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts tests/worker/auto-invoke-accounting.test.ts
          git commit -m "Harden live auto-invoke execution and accounting"
          git push origin HEAD:fix/auto-invoke-production-hardening
