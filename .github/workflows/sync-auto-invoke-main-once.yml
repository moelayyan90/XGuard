name: Sync auto invoke with hardened main once

on:
  push:
    branches: [agent/zero-study-auto-invoke]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/zero-study-auto-invoke
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Merge current main and harden provider validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          source_path = Path('apps/worker/src/auto-invoke.ts')
          source = source_path.read_text()

          old_post = '''    const provider = parseProvider(body.provider);
    const apiKey = typeof body.apiKey === "string" ? body.apiKey.trim() : "";'''
          new_post = '''    const provider = parseAutoInvokeProvider(body.provider);
    if (provider === null)
      return jsonResponse({ error: "unsupported_provider" }, 400);
    const apiKey = typeof body.apiKey === "string" ? body.apiKey.trim() : "";'''
          if old_post in source:
              source = source.replace(old_post, new_post, 1)
          elif new_post not in source:
              raise SystemExit('vault POST provider block not found')

          old_delete = '''    const provider = parseProvider(
      decodeURIComponent(url.pathname.slice(`${VAULT_PATH}/`.length)),
    );'''
          new_delete = '''    const provider = parseAutoInvokeProvider(
      decodeURIComponent(url.pathname.slice(`${VAULT_PATH}/`.length)),
    );
    if (provider === null)
      return jsonResponse({ error: "unsupported_provider" }, 400);'''
          if old_delete in source:
              source = source.replace(old_delete, new_delete, 1)
          elif new_delete not in source:
              raise SystemExit('vault DELETE provider block not found')

          old_parser = '''function parseProvider(value: unknown): ProviderId {
  if (value === "openai" || value === "anthropic" || value === "gemini")
    return value;
  throw new Error("unsupported_provider");
}'''
          new_parser = '''export function parseAutoInvokeProvider(
  value: unknown,
): ProviderId | null {
  if (value === "openai" || value === "anthropic" || value === "gemini")
    return value;
  return null;
}'''
          if old_parser in source:
              source = source.replace(old_parser, new_parser, 1)
          elif new_parser not in source:
              raise SystemExit('provider parser block not found')

          source_path.write_text(source)

          test_path = Path('tests/auto-invoke.test.ts')
          test = test_path.read_text()
          import_marker = '''  isAutoInvokeBillableStatus,
  decryptProviderCredential,'''
          import_replacement = '''  isAutoInvokeBillableStatus,
  parseAutoInvokeProvider,
  decryptProviderCredential,'''
          if import_marker in test and 'parseAutoInvokeProvider' not in test:
              test = test.replace(import_marker, import_replacement, 1)
          elif 'parseAutoInvokeProvider' not in test:
              raise SystemExit('provider parser test import marker not found')

          block = '''
  it("rejects unsupported provider identifiers without throwing", () => {
    expect(parseAutoInvokeProvider("openai")).toBe("openai");
    expect(parseAutoInvokeProvider("anthropic")).toBe("anthropic");
    expect(parseAutoInvokeProvider("gemini")).toBe("gemini");
    expect(parseAutoInvokeProvider("unknown")).toBeNull();
    expect(parseAutoInvokeProvider(null)).toBeNull();
  });
'''
          if 'rejects unsupported provider identifiers without throwing' not in test:
              marker = '\n  it("does not intercept unrelated XGuard routes", async () => {'
              if marker not in test:
                  raise SystemExit('provider parser test insertion marker not found')
              test = test.replace(marker, block + marker, 1)
          test_path.write_text(test)
          PY

          npx prettier --write apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts
          npx vitest run tests/auto-invoke.test.ts
          npm run typecheck

          git rm .github/workflows/sync-auto-invoke-main-once.yml
          git add apps/worker/src/auto-invoke.ts tests/auto-invoke.test.ts
          git commit -m "Sync auto-invoke with hardened billing core"
          git push origin HEAD:agent/zero-study-auto-invoke
