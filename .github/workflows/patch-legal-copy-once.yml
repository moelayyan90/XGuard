name: Patch legal copy once

on:
  push:
    branches: [pivot/eudr-network]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pivot/eudr-network
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/eudr-smart-employee-site.ts')
          s = p.read_text()
          s = s.replace('XGuard is not a government, customs authority, competent authority, law firm or official certification body.', 'XGuard is an independent software service, not a government, customs authority, competent authority, law firm or official certification body.')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/eudr-smart-employee-site.ts
          git commit -m "copy: clarify independent software service boundary"
          git push origin HEAD:pivot/eudr-network
