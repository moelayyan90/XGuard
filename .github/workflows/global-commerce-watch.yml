name: XGuard Global Commerce health watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify commerce endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://xguardgate.com/v1/commerce/status)"
          printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.mode!=="global-commerce-hunter")process.exit(1);if(x.inventoryPolicy!=="no speculative inventory")process.exit(1)})'
