name: Publish XGuard Task Recovery

on:
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-public-release.yml"
  push:
    branches: [main]
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-public-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xguard-task-recovery-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate browser task recovery layer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("browser-extension/manifest.json", "utf8"));
          if (manifest.manifest_version !== 3) throw new Error("Manifest V3 required");
          if (manifest.name !== "XGuard Task Recovery") throw new Error("Unexpected product name");
          if (!Array.isArray(manifest.content_scripts) || manifest.content_scripts.length !== 1) throw new Error("Expected one content-script bundle");
          const script = manifest.content_scripts[0];
          if (JSON.stringify(script.matches) !== JSON.stringify(["https://*/*"])) throw new Error("Universal HTTPS task coverage missing");
          if (JSON.stringify(script.js) !== JSON.stringify(["recovery-layer.js", "universal-layer.js", "surface-rail.js"])) throw new Error("Recovery surface and payment adapters must all ship");
          NODE

      - name: Build public runtime ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./browser-extension/manifest.json").version')"
          OUT="${RUNNER_TEMP}/xguard-task-recovery"
          mkdir -p "${OUT}/icons" release-assets
          cp browser-extension/manifest.json "${OUT}/"
          cp browser-extension/recovery-layer.js "${OUT}/"
          cp browser-extension/universal-layer.js "${OUT}/"
          cp browser-extension/surface-rail.js "${OUT}/"
          cp browser-extension/service-worker.js "${OUT}/"
          cp browser-extension/options.html "${OUT}/"
          cp browser-extension/options.js "${OUT}/"
          cp browser-extension/icons/icon16.png "${OUT}/icons/"
          cp browser-extension/icons/icon32.png "${OUT}/icons/"
          cp browser-extension/icons/icon48.png "${OUT}/icons/"
          cp browser-extension/icons/icon128.png "${OUT}/icons/"
          (
            cd "${OUT}"
            zip -X -r "${GITHUB_WORKSPACE}/release-assets/xguard-task-recovery-${VERSION}.zip" .
          )
          (
            cd release-assets
            sha256sum "xguard-task-recovery-${VERSION}.zip" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: xguard-task-recovery
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable public GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./browser-extension/manifest.json").version')"
          TAG="xguard-task-recovery-v${VERSION}"
          NOTES=$(cat <<'EOF'
          XGuard Task Recovery is the browser-side task continuity and recovery surface.

          It detects meaningful HTTPS workflows, preserves local non-sensitive checkpoints, surfaces visible validation/failure states, identifies CAPTCHA/MFA/OTP as human-required, and helps users resume from the nearest recoverable step.

          The existing payment controls remain included as secondary adapters. XGuard does not bypass access controls, submit consequential actions automatically, or persist sensitive field values in recovery checkpoints.

          This is the public early-access runtime package. Browser-store publication is tracked separately and is not claimed by this release.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "XGuard Task Recovery v${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" release-assets/* --title "XGuard Task Recovery v${VERSION}" --notes "$NOTES" --prerelease
          fi

      - name: Verify public release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./browser-extension/manifest.json").version')"
          TAG="xguard-task-recovery-v${VERSION}"
          EXPECTED="xguard-task-recovery-${VERSION}.zip"
          for attempt in {1..12}; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$EXPECTED"; then
              exit 0
            fi
            sleep 5
          done
          echo "Public XGuard Task Recovery release asset was not observable"
          exit 1
