name: Promote institutional child safety front door once

on:
  push:
    branches: [agent/complete-child-safety-platform]
    paths:
      - .github/workflows/patch-institutional-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Promote front door
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/worker/src/child-safety-institutional.ts')
          s=p.read_text()
          marker='  if (url.pathname === "/v1/child-safety/institutional") {'
          front='''  if (["/", "/child-safety"].includes(url.pathname)) {\n    return html(page("Child Safety Infrastructure", homeBody()));\n  }\n\n'''
          if 'homeBody()' not in s:
              s=s.replace(marker,front+marker)
          marker2='function complianceBody(): string {'
          home='''function homeBody(): string {\n  return `${hero(\n    "Child-safety infrastructure",\n    "Protect children. Not monitor childhood.",\n    "XGuard is paid safety infrastructure for platforms, institutions and public-sector programmes. It analyzes defined safety events already entering a host service and returns proportionate controls without becoming a child-surveillance system.",\n  )}\n  <section class="grid">\n    ${card("For platforms", "Scan messages, chat windows, images, audio, video and ads. Apply ALLOW, WARN, BLUR, BLOCK, FREEZE CHAT or ESCALATE inside the service you already control.")}\n    ${card("For governments & regulators", "Run limited pilots, validate reporting routes and inspect safeguards without receiving a hidden feed of children’s private activity.")}\n    ${card("Commercial model", "Usage-based B2B/B2G pricing. Children are not the buyer; online services and institutions pay for analyzed safety events.")}\n    ${card("Global reporting", "Prefer locally verified child-protection routes, with established international networks as a fallback when a direct country number is not yet validated.")}\n  </section>\n  <section class="steps">\n    ${step("01", "Integrate", "Submit a defined safety event already entering your product flow.")}\n    ${step("02", "Assess", "XGuard evaluates grooming, solicitation, coercion, sextortion, explicit media, predatory contact and sexualized advertising.")}\n    ${step("03", "Control", "Receive a proportionate action and structured enforcement guidance.")}\n    ${step("04", "Review", "High and critical cases are surfaced for accountable human review and verified reporting routes.")}\n  </section>\n  <section class="grid">\n    <a class="partner" href="/child-safety/compliance"><strong>Compliance</strong><span>Risk assessment, safeguards and regulatory positioning →</span></a>\n    <a class="partner" href="/child-safety/pilot"><strong>Government / platform pilot</strong><span>A limited, measurable deployment without surveillance →</span></a>\n    <a class="partner" href="/child-safety/pricing"><strong>Pricing</strong><span>Usage-based commercial API pricing →</span></a>\n    <a class="partner" href="/child-safety/reporting"><strong>Global reporting</strong><span>Verified support and reporting networks →</span></a>\n  </section>\n  <section class="cta"><h2>Start an institutional conversation</h2><p>Partnerships, regulators and government pilots: <a href="mailto:info@xguardgate.com">info@xguardgate.com</a><br>Technical support: <a href="mailto:support@xguardgate.com">support@xguardgate.com</a></p></section>`;\n}\n\n'''
          if 'function homeBody' not in s:
              s=s.replace(marker2,home+marker2)
          p.write_text(s)
          PY
          npx prettier --write apps/worker/src/child-safety-institutional.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety-institutional.ts
          git commit -m "Promote institutional child safety front door" || true
          git push origin HEAD:agent/complete-child-safety-platform
