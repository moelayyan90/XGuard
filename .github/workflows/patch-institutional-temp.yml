name: Expose institutional child safety pages once

on:
  push:
    branches: [agent/complete-child-safety-platform]
    paths:
      - .github/workflows/patch-institutional-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Expose pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/worker/src/child-safety-public-site.ts')
          s=p.read_text()
          old='${navLink("governments", page, "/child-safety/governments", "Governments")}${navLink("integrate", page, "/child-safety/integrate", "Integrate")}${navLink("transparency", page, "/child-safety/transparency", "Transparency")}'
          new='${navLink("governments", page, "/child-safety/governments", "Governments")}<a href="/child-safety/compliance">Compliance</a><a href="/child-safety/pilot">Pilot</a><a href="/child-safety/pricing">Pricing</a><a href="/child-safety/reporting">Reporting</a>${navLink("integrate", page, "/child-safety/integrate", "Integrate")}${navLink("transparency", page, "/child-safety/transparency", "Transparency")}'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          npx prettier --write apps/worker/src/child-safety-public-site.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety-public-site.ts
          git commit -m "Expose compliance pilot pricing and reporting pages" || true
          git push origin HEAD:agent/complete-child-safety-platform
