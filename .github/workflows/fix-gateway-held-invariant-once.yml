name: Fix gateway held-balance invariant once

on:
  push:
    branches: [fix/universal-gateway-held-balance-invariant]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/universal-gateway-held-balance-invariant
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Guard EARNED and RELEASED transitions with held balance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/worker/src/universal-gateway-billing.ts')
          source = path.read_text()

          old_earn = '''        `UPDATE gateway_fee_reservations
         SET state='EARNED',operation_id=?,updated_at=?
         WHERE event_key=? AND merchant_id=? AND state='HELD'`,
      )
      .bind(operationId, now, row.event_key, row.merchant_id),'''
          new_earn = '''        `UPDATE gateway_fee_reservations
         SET state='EARNED',operation_id=?,updated_at=?
         WHERE event_key=? AND merchant_id=? AND state='HELD'
           AND EXISTS(
             SELECT 1 FROM merchants
             WHERE merchant_id=? AND held_balance_micro_usd>=?
           )`,
      )
      .bind(
        operationId,
        now,
        row.event_key,
        row.merchant_id,
        row.merchant_id,
        row.amount_micro_usd,
      ),'''

          old_release = '''        `UPDATE gateway_fee_reservations
         SET state='RELEASED',operation_id=?,updated_at=?
         WHERE event_key=? AND merchant_id=? AND state='HELD'`,
      )
      .bind(operationId, now, eventKey, merchantId),'''
          new_release = '''        `UPDATE gateway_fee_reservations
         SET state='RELEASED',operation_id=?,updated_at=?
         WHERE event_key=? AND merchant_id=? AND state='HELD'
           AND EXISTS(
             SELECT 1 FROM merchants
             WHERE merchant_id=? AND held_balance_micro_usd>=?
           )`,
      )
      .bind(
        operationId,
        now,
        eventKey,
        merchantId,
        merchantId,
        row.amount_micro_usd,
      ),'''

          if old_earn in source:
              source = source.replace(old_earn, new_earn, 1)
          elif new_earn not in source:
              raise SystemExit('earn transition block not found')

          if old_release in source:
              source = source.replace(old_release, new_release, 1)
          elif new_release not in source:
              raise SystemExit('release transition block not found')

          path.write_text(source)
          PY

          npx prettier --write apps/worker/src/universal-gateway-billing.ts tests/worker/universal-gateway-billing.test.ts
          npx vitest run --config vitest.worker.config.ts tests/worker/universal-gateway-billing.test.ts
          npm run typecheck

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/universal-gateway-billing.ts tests/worker/universal-gateway-billing.test.ts
          if git diff --cached --quiet; then
            echo "No code changes required."
            exit 0
          fi
          git commit -m "Fail closed on gateway held-balance drift"
          git push origin HEAD:fix/universal-gateway-held-balance-invariant
