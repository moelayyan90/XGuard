name: Verify C2SP production witness
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [fix/c2sp-gblin-interop]
  workflow_run:
    workflows: [Deploy XGuard Live]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: xguard-c2sp-production-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit automatic witnessing without submitting a checkpoint or payment
        env:
          C2SP_REQUIRE_HISTORY_STATUS: 'true'
        run: node scripts/c2sp-stability-audit.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: c2sp-stability-evidence
          path: c2sp-stability-evidence.json
          retention-days: 30
