name: One-shot commerce execution lint fix 2

on:
  push:
    branches: [fix/commerce-end-to-end]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/commerce-end-to-end
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Repair lint findings
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('apps/worker/src/commerce-execution.ts')
          text = path.read_text()
          text2 = text.replace('host.replace(/[\\[\\]]/g, "")', 'host.replaceAll("[", "").replaceAll("]", "")')
          pattern = r'function clean\(raw: unknown, max = 500\): string \{.*?\n\}'
          replacement = '''function clean(raw: unknown, max = 500): string {
            if (typeof raw !== "string") return "";
            let sanitized = "";
            for (const char of raw.trim()) {
              const code = char.charCodeAt(0);
              if (code >= 32 && code !== 127) sanitized += char;
            }
            return sanitized.slice(0, max);
          }'''
          text2, count = re.subn(pattern, replacement, text2, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('clean function not replaced')
          if text2 == text:
              raise SystemExit('no changes applied')
          path.write_text(text2)
      - run: npx prettier --write apps/worker/src/commerce-execution.ts
      - run: npx eslint apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts
      - run: npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/worker/src/commerce-execution.ts
          git commit -m "fix: harden commerce execution sanitizers"
          git push origin HEAD:fix/commerce-end-to-end
