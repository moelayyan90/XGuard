name: Format Economic Firewall

on:
  push:
    branches:
      - agent/economic-firewall-core
    paths:
      - packages/core/src/economic-intent.ts
      - tests/economic-intent.test.ts
      - .github/workflows/format-economic-firewall.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-core
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Prettier
        run: npx prettier --write packages/core/src/economic-intent.ts tests/economic-intent.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/economic-intent.ts tests/economic-intent.test.ts
          git commit -m "style: apply prettier to economic firewall"
          git push origin HEAD:agent/economic-firewall-core
