name: Fix Economic Firewall optional body

on:
  push:
    branches:
      - agent/economic-firewall-v2
    paths:
      - .github/workflows/fix-economic-optional-body.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/economic-firewall-v2
      - name: Omit undefined fetch body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/economic-firewall.ts')
          s = p.read_text()
          old = '''    const response = await fetch(snapshot.terms.resource.url, {\n      method: snapshot.terms.resource.method,\n      headers: outbound.headers,\n      body: outbound.body,\n      redirect: "manual",\n      signal: AbortSignal.timeout(RESOURCE_TIMEOUT_MS),\n    });'''
          new = '''    const response = await fetch(snapshot.terms.resource.url, {\n      method: snapshot.terms.resource.method,\n      headers: outbound.headers,\n      redirect: "manual",\n      signal: AbortSignal.timeout(RESOURCE_TIMEOUT_MS),\n      ...(outbound.body === undefined ? {} : { body: outbound.body }),\n    });'''
          if old not in s:
              raise SystemExit('fetch block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write apps/worker/src/economic-firewall.ts
      - name: Commit optional body fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/economic-firewall.ts
          git commit -m "fix: omit undefined Economic Firewall fetch body"
          git push origin HEAD:agent/economic-firewall-v2
