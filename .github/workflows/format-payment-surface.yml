name: One-time format payment surface

on:
  push:
    branches: [agent/buyer-side-payment-decision]
    paths:
      - ".github/workflows/format-payment-surface.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/buyer-side-payment-decision
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format payment surface
        run: |
          npx prettier --write \
            apps/worker/src/buyer-portal.ts \
            apps/worker/src/mainnet-mcp-modern.ts \
            apps/worker/src/payment-decision.ts \
            apps/worker/src/universal-mainnet.ts \
            apps/worker/wrangler.mainnet.jsonc \
            browser-extension/content.js \
            browser-extension/manifest.json \
            browser-extension/options.html \
            browser-extension/options.js \
            browser-extension/service-worker.js \
            tests/browser-payment-surface-source.test.ts \
            tests/payment-decision.test.ts \
            PAYMENT_DECISION.md \
            .github/workflows/payment-security-evidence.yml
      - name: Commit formatted result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-payment-surface.yml
          git add apps/worker browser-extension tests PAYMENT_DECISION.md .github/workflows/payment-security-evidence.yml
          git commit -m "Format buyer-side payment decision surface"
          git push origin HEAD:agent/buyer-side-payment-decision
