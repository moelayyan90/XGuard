name: Publish XGuard through IndexNow

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/src/discovery-entry.js"
      - "apps/relay/src/site-egress.js"
      - ".github/workflows/publish-indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for canonical ownership key
        shell: bash
        run: |
          set -euo pipefail
          key='f3fd1a3fde659a05a8dddfa614b408ac'
          for i in {1..60}; do
            site="$(curl --silent --show-error --max-time 10 "https://xguardgate.com/${key}.txt" || true)"
            if [[ "$site" == "$key" ]]; then
              echo 'IndexNow ownership key is live on xguardgate.com.'
              exit 0
            fi
            sleep 5
          done
          echo 'IndexNow ownership key did not become live in time.'
          exit 1

      - name: Submit canonical site and API discovery URLs
        shell: bash
        run: |
          set -euo pipefail
          key='f3fd1a3fde659a05a8dddfa614b408ac'
          payload="$(jq -n \
            --arg host 'xguardgate.com' \
            --arg key "$key" \
            --arg keyLocation "https://xguardgate.com/${key}.txt" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:[
              "https://xguardgate.com/",
              "https://xguardgate.com/identity",
              "https://xguardgate.com/llms.txt",
              "https://xguardgate.com/server.json",
              "https://xguardgate.com/.well-known/mcp/server-card.json",
              "https://xguardgate.com/.well-known/xguard.json",
              "https://xguardgate.com/sitemap.xml",
              "https://xguardgate.com/api/openapi.json",
              "https://xguardgate.com/api/architecture",
              "https://xguardgate.com/api/supported",
              "https://xguardgate.com/api/facilitator",
              "https://xguardgate.com/api/.well-known/xguard-egress.json",
              "https://xguardgate.com/api/.well-known/xguard-proof-key.json",
              "https://xguardgate.com/api/v1/proof"
            ]}')"
          code="$(curl --silent --show-error --max-time 30 \
            -o /tmp/indexnow-response \
            -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'content-type: application/json; charset=utf-8' \
            --data "$payload")"
          echo "IndexNow xguardgate.com HTTP ${code}"
          [[ "$code" == '200' || "$code" == '202' ]]
