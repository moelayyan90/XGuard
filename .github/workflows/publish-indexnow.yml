name: Publish XGuard through IndexNow

on:
  workflow_run:
    workflows: ["Deploy XGuard Relay"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Wait for public ownership key
        shell: bash
        run: |
          set -euo pipefail
          key='f3fd1a3fde659a05a8dddfa614b408ac'
          for i in {1..60}; do
            site="$(curl --silent --show-error --max-time 10 "https://xguardgate.com/${key}.txt" || true)"
            api="$(curl --silent --show-error --max-time 10 "https://api.xguardgate.com/${key}.txt" || true)"
            if [[ "$site" == "$key" && "$api" == "$key" ]]; then
              echo 'IndexNow ownership key is live on both XGuard hosts.'
              exit 0
            fi
            sleep 5
          done
          echo 'IndexNow ownership key did not become live in time.'
          exit 1

      - name: Submit website discovery URLs to IndexNow network
        shell: bash
        run: |
          set -euo pipefail
          key='f3fd1a3fde659a05a8dddfa614b408ac'
          payload="$(jq -n \
            --arg host 'xguardgate.com' \
            --arg key "$key" \
            --arg keyLocation "https://xguardgate.com/${key}.txt" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:[
              "https://xguardgate.com/",
              "https://xguardgate.com/identity",
              "https://xguardgate.com/developers",
              "https://xguardgate.com/connect",
              "https://xguardgate.com/try",
              "https://xguardgate.com/capabilities/extract-preview",
              "https://xguardgate.com/capabilities/web-extraction",
              "https://xguardgate.com/capabilities/product-offers",
              "https://xguardgate.com/capabilities/feed-digest",
              "https://xguardgate.com/llms.txt",
              "https://xguardgate.com/server.json",
              "https://xguardgate.com/.well-known/mcp/server-card.json",
              "https://xguardgate.com/.well-known/agent-card.json",
              "https://xguardgate.com/.well-known/agent.json",
              "https://xguardgate.com/.well-known/xguard.json",
              "https://xguardgate.com/sitemap.xml"
            ]}')"
          code="$(curl --silent --show-error --max-time 30 \
            -o /tmp/indexnow-site-response \
            -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'content-type: application/json; charset=utf-8' \
            --data "$payload")"
          echo "IndexNow xguardgate.com HTTP ${code}"
          [[ "$code" == '200' || "$code" == '202' ]]

      - name: Submit API discovery URLs to IndexNow network
        shell: bash
        run: |
          set -euo pipefail
          key='f3fd1a3fde659a05a8dddfa614b408ac'
          payload="$(jq -n \
            --arg host 'api.xguardgate.com' \
            --arg key "$key" \
            --arg keyLocation "https://api.xguardgate.com/${key}.txt" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:[
              "https://api.xguardgate.com/openapi.json",
              "https://api.xguardgate.com/agent.txt",
              "https://api.xguardgate.com/v1/capabilities",
              "https://api.xguardgate.com/architecture",
              "https://api.xguardgate.com/supported",
              "https://api.xguardgate.com/facilitator",
              "https://api.xguardgate.com/.well-known/xguard-egress.json",
              "https://api.xguardgate.com/.well-known/xguard-proof-key.json",
              "https://api.xguardgate.com/v1/proof"
            ]}')"
          code="$(curl --silent --show-error --max-time 30 \
            -o /tmp/indexnow-api-response \
            -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'content-type: application/json; charset=utf-8' \
            --data "$payload")"
          echo "IndexNow api.xguardgate.com HTTP ${code}"
          [[ "$code" == '200' || "$code" == '202' ]]
