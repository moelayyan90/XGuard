name: Live testnet monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-testnet-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Run live smoke checks
        id: smoke
        continue-on-error: true
        run: npm run smoke:live
      - name: Record monitor state
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[monitor] XGuard live testnet smoke failed";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            const failed = "${{ steps.smoke.outcome }}" !== "success";

            if (failed) {
              const body = [
                "The scheduled public testnet smoke check failed.",
                "",
                `Workflow run: ${runUrl}`,
                `Commit: ${context.sha}`,
                "",
                "The smoke check performs no payment. It verifies health, readiness, measured x402 capability, zero open reconciliation cases, malformed-input rejection, and the mainnet hard gate.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Recovered. Passing workflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
      - name: Fail workflow when smoke check failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
