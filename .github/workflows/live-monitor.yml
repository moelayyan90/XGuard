name: Monitor XGuard Live
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: [.github/workflows/live-monitor.yml, scripts/infra-provider-audit.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check canonical public facts and collection heartbeat
        run: node scripts/live-smoke.mjs
      - name: Check isolated paid availability without a transaction
        if: always()
        run: node scripts/live-paid-smoke.mjs --require-ready
  provider-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check provider resource counters and early exhaustion thresholds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROVIDER_USAGE_REQUIRED: 'true'
        run: node scripts/infra-provider-audit.mjs
