name: Live XGuard monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-xguard-monitor
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: testnet
            command: npm run smoke:live
            description: Base Sepolia non-billable gateway
          - target: mainnet
            command: npm run smoke:mainnet
            description: Base mainnet billable gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Run live ${{ matrix.target }} smoke checks
        id: smoke
        continue-on-error: true
        run: ${{ matrix.command }}
      - name: Record monitor state
        uses: actions/github-script@v8
        env:
          MONITOR_TARGET: ${{ matrix.target }}
          MONITOR_DESCRIPTION: ${{ matrix.description }}
          MONITOR_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const target = process.env.MONITOR_TARGET;
            const title = `[monitor] XGuard live ${target} smoke failed`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            const failed = process.env.MONITOR_OUTCOME !== "success";

            if (failed) {
              const body = [
                `The automated public ${target} smoke check failed.`,
                "",
                `Target: ${process.env.MONITOR_DESCRIPTION}`,
                `Workflow run: ${runUrl}`,
                `Commit: ${context.sha}`,
                "",
                "The smoke check makes no payment. Mainnet checks liveness, readiness, Base x402 capability, facilitator health, unit-economics configuration, and fail-closed merchant authentication. Testnet checks its non-billable safety boundary.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Recovered. Passing workflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
      - name: Fail workflow when smoke check failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
