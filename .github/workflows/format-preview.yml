name: Format preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format changed mainnet hardening files
        run: |
          npx prettier --write \
            README.md \
            QUICKSTART.md \
            docs/API.md \
            docs/openapi.yaml \
            scripts/check-docs.mjs \
            docs/FACILITATORS.md \
            apps/worker/wrangler.mainnet.jsonc \
            scripts/smoke-mainnet.mjs \
            package.json \
            .github/workflows/live-monitor.yml \
            UNIT_ECONOMICS.md \
            DEPLOYMENT.md \
            PAYOUTS.md \
            docs/EXTERNAL_BLOCKERS.md
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            QUICKSTART.md \
            docs/API.md \
            docs/openapi.yaml \
            scripts/check-docs.mjs \
            docs/FACILITATORS.md \
            apps/worker/wrangler.mainnet.jsonc \
            scripts/smoke-mainnet.mjs \
            package.json \
            .github/workflows/live-monitor.yml \
            UNIT_ECONOMICS.md \
            DEPLOYMENT.md \
            PAYOUTS.md \
            docs/EXTERNAL_BLOCKERS.md
          git commit -m "Format mainnet hardening files"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
