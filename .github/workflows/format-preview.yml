name: Preview Prettier output

on:
  push:
    branches: [agent/stabilize-mainnet-rpc]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Print formatted test
        run: npx prettier tests/mainnet-revenue-hardening-source.test.ts
