name: Format preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Persist configured downstream cost on finalized settlements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/worker/src/mainnet.ts")
          source = path.read_text()
          old_sql = "UPDATE settlement_projection SET state='SETTLED',fee_micro_usd=?,recorded_at=? WHERE logical_payment_key=?"
          new_sql = "UPDATE settlement_projection SET state='SETTLED',fee_micro_usd=?,downstream_cost_micro_usd=?,recorded_at=? WHERE logical_payment_key=?"

          if new_sql not in source:
              if old_sql not in source:
                  raise SystemExit("finalized settlement SQL not found")
              source = source.replace(old_sql, new_sql, 1)
              pattern = re.compile(
                  r"\.bind\(feeMicroUsd\(env\),\s*now,\s*job\.logical_payment_key\)\s*\.run\(\);",
                  re.MULTILINE,
              )
              replacement = ".bind(\n        feeMicroUsd(env),\n        downstreamCostMicroUsd(env),\n        now,\n        job.logical_payment_key,\n      )\n      .run();"
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit("finalized settlement bind not found")
              path.write_text(source)
          elif "downstreamCostMicroUsd(env)" not in source:
              raise SystemExit("downstream cost SQL exists without its bind")
          PY
      - name: Format changed mainnet hardening files
        run: |
          npx prettier --write \
            README.md \
            QUICKSTART.md \
            docs/API.md \
            docs/openapi.yaml \
            scripts/check-docs.mjs \
            docs/FACILITATORS.md \
            apps/worker/wrangler.mainnet.jsonc \
            apps/worker/src/mainnet.ts \
            scripts/smoke-mainnet.mjs \
            tests/mainnet-economics-source.test.ts \
            package.json \
            .github/workflows/live-monitor.yml \
            UNIT_ECONOMICS.md \
            DEPLOYMENT.md \
            PAYOUTS.md \
            docs/EXTERNAL_BLOCKERS.md
      - name: Commit hardening when needed
        run: |
          if git diff --quiet; then
            echo "Already hardened and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            QUICKSTART.md \
            docs/API.md \
            docs/openapi.yaml \
            scripts/check-docs.mjs \
            docs/FACILITATORS.md \
            apps/worker/wrangler.mainnet.jsonc \
            apps/worker/src/mainnet.ts \
            scripts/smoke-mainnet.mjs \
            tests/mainnet-economics-source.test.ts \
            package.json \
            .github/workflows/live-monitor.yml \
            UNIT_ECONOMICS.md \
            DEPLOYMENT.md \
            PAYOUTS.md \
            docs/EXTERNAL_BLOCKERS.md
          git commit -m "Persist mainnet downstream settlement cost"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
