name: Encrypted crawler premium inventory
on:
  push:
    branches: [codex/crawler-inventory-20261105]
    paths: [scripts/crawler-premium-inventory.mjs, scripts/crawler-inventory-public.pem, .github/workflows/crawler-premium-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read infrastructure and public contracts; encrypt the report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_ADMIN_KEY: ${{ secrets.LIVE_ADMIN_KEY || secrets.XGUARD_OPERATOR_KEY }}
        run: node scripts/crawler-premium-inventory.mjs
