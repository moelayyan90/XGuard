name: Format Universal Gateway

on:
  push:
    branches:
      - agent/universal-gateway-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format universal gateway files
        run: npx prettier --write apps/worker/src/universal-gateway.ts apps/worker/src/universal-gateway-billing.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/universal-gateway.ts apps/worker/src/universal-gateway-billing.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format universal gateway sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
