name: Deploy XGuard Autonomous AI Inference Provider

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-autonomous-inference-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify release gates
        run: npm run inference:verify
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Resolve D1, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare deployment credentials unavailable'; exit 1; }
          export CLOUDFLARE_API_TOKEN="$token"

          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x?.name==="xguard-mainnet")?0:1)})'; then
            npx wrangler d1 create xguard-mainnet
          fi

          config_path="${GITHUB_WORKSPACE}/apps/worker/wrangler.mainnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs \
            --template apps/worker/wrangler.mainnet.jsonc \
            --output "$config_path" \
            --database-name xguard-mainnet

          node - "$config_path" "$GITHUB_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, sha] = process.argv.slice(2);
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(/("XGUARD_GIT_COMMIT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(sha)}`);
          source = source.replace(/("XGUARD_DEPLOYED_AT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(new Date().toISOString())}`);
          for (const [pattern, label] of [
            [/"name"\s*:\s*"xguard-mainnet"/, 'production Worker'],
            [/"main"\s*:\s*"src\/inference-provider\.ts"/, 'inference entrypoint'],
            [/"database_name"\s*:\s*"xguard-mainnet"/, 'production D1'],
            [/"INFERENCE_COORDINATOR"/, 'concurrency coordinator'],
            [/"MIN_MARGIN_USD"/, 'profit guard'],
            [/"MAX_DAILY_LOSS_USD"/, 'loss guard'],
          ]) if (!pattern.test(source)) throw new Error(`invalid ${label}`);
          if (/XGUARD_PAY_TO|0x[0-9a-fA-F]{40}/.test(source)) throw new Error('hard-coded payout destination');
          fs.writeFileSync(file, source);
          NODE

          npx wrangler d1 migrations apply xguard-mainnet --remote --config "$config_path"
          npx wrangler deploy --config "$config_path"
          echo "XGUARD_RESOLVED_CONFIG=$config_path" >> "$GITHUB_ENV"

      - name: Install optional runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DGRID_PROVIDER_API_KEY: ${{ secrets.DGRID_PROVIDER_API_KEY }}
          XGUARD_ADMIN_TOKEN: ${{ secrets.XGUARD_ADMIN_TOKEN }}
          XGUARD_PAYOUT_DESTINATION: ${{ secrets.XGUARD_PAYOUT_DESTINATION }}
          XGUARD_UPSTREAM_1_API_KEY: ${{ secrets.XGUARD_UPSTREAM_1_API_KEY }}
          XGUARD_UPSTREAM_2_API_KEY: ${{ secrets.XGUARD_UPSTREAM_2_API_KEY }}
          XGUARD_UPSTREAM_3_API_KEY: ${{ secrets.XGUARD_UPSTREAM_3_API_KEY }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN="$token"
          for name in DGRID_PROVIDER_API_KEY XGUARD_ADMIN_TOKEN XGUARD_PAYOUT_DESTINATION XGUARD_UPSTREAM_1_API_KEY XGUARD_UPSTREAM_2_API_KEY XGUARD_UPSTREAM_3_API_KEY; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config "$XGUARD_RESOLVED_CONFIG"
            fi
          done

      - name: Ensure canonical custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '\r\n ')"
          api="https://api.cloudflare.com/client/v4/accounts/${account}/workers/domains"
          for hostname in xguardgate.com www.xguardgate.com; do
            payload="$(node -e 'const h=process.argv[1];process.stdout.write(JSON.stringify({hostname:h,service:"xguard-mainnet",zone_name:"xguardgate.com"}))' "$hostname")"
            response="$(curl --fail-with-body -sS --retry 4 --retry-all-errors -X PUT \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              --data "$payload" "$api")"
            printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).success!==true)process.exit(1)})'
          done

      - name: Verify production truth surfaces
        env:
          XGUARD_BASE_URL: https://xguardgate.com
          DGRID_PROVIDER_API_KEY: ${{ secrets.DGRID_PROVIDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          base="$XGUARD_BASE_URL"
          for attempt in {1..30}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "${base}/healthz?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && grep -q 'xguard-autonomous-ai-inference-provider' /tmp/health.json; then break; fi
            [[ "$attempt" != '30' ]] || { cat /tmp/health.json || true; exit 1; }
            sleep 5
          done
          curl -fsS "${base}/v1/status" > /tmp/status.json
          curl -fsS "${base}/v1/models" > /tmp/models.json
          curl -fsS "${base}/openapi.json" > /tmp/openapi.json
          curl -fsS "${base}/" > /tmp/site.html
          node <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          if (status.service !== 'XGuard Autonomous AI Inference Provider') throw new Error('service identity mismatch');
          if (typeof status.live !== 'boolean' || !Array.isArray(status.models)) throw new Error('truth status mismatch');
          if ('today' in status) throw new Error('public financial data exposed');
          const models = JSON.parse(fs.readFileSync('/tmp/models.json','utf8'));
          if (models.object !== 'list' || !Array.isArray(models.data)) throw new Error('model list mismatch');
          const openapi = JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          if (openapi.openapi !== '3.1.0' || !openapi.paths?.['/chat/completions']) throw new Error('OpenAPI mismatch');
          if (!fs.readFileSync('/tmp/site.html','utf8').includes('AUTONOMOUS AI INFERENCE PROVIDER')) throw new Error('site mismatch');
          NODE
          owner_code="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/v1/admin/metrics")"
          [[ "$owner_code" == '401' || "$owner_code" == '404' ]]
          npm run inference:smoke

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='XGuard inference deployment failed'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='XGuard inference control plane is production-verified'
            target_url='https://xguardgate.com'
          fi
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"xguard-inference-production",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
