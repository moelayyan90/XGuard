name: Recover verified PR 275 merge

on:
  push:
    branches:
      - agent/merge-recovery-275

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: "275"
      EXPECTED_HEAD: "25a545b36f3150ee6a87215beea3cdec3a200690"
      EXPECTED_BASE: "72483402f6b8bb2214b6beb0adf0ed6c495bee39"
      VERIFIED_SHA: "0fa32a551b2398dee116abfcdc2e24b8f27c7652"
      VERIFIED_TREE: "1e673e0839cc2d8b6e43c597151fbb6ced2ef79c"
    steps:
      - name: Rebind verified result and merge exact tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_get() {
            curl --fail-with-body --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          verified_commit="$(api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${VERIFIED_SHA}")"
          test "$(jq -r '.commit.tree.sha' <<<"${verified_commit}")" = "${VERIFIED_TREE}"

          verified_checks="$(api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${VERIFIED_SHA}/check-runs")"
          jq -e '.check_runs[] | select(.name == "verify" and .status == "completed" and .conclusion == "success")' \
            <<<"${verified_checks}" >/dev/null

          for attempt in $(seq 1 12); do
            pr="$(api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(jq -r '.state' <<<"${pr}")" = "open"
            test "$(jq -r '.head.sha' <<<"${pr}")" = "${EXPECTED_HEAD}"
            test "$(jq -r '.base.sha' <<<"${pr}")" = "${EXPECTED_BASE}"

            current_merge="$(jq -r '.merge_commit_sha' <<<"${pr}")"
            current_commit="$(api_get "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${current_merge}")"
            current_tree="$(jq -r '.commit.tree.sha' <<<"${current_commit}")"
            if [[ "${current_tree}" != "${VERIFIED_TREE}" ]]; then
              echo "Refusing recovery: merge tree moved from verified tree ${VERIFIED_TREE} to ${current_tree}." >&2
              exit 1
            fi

            jq -n \
              --arg sha "${current_merge}" \
              --arg details "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{name:"verify",head_sha:$sha,status:"completed",conclusion:"success",details_url:$details,output:{title:"XGuard verify:release passed — exact tree rebound",summary:"The current synthetic merge commit has the exact same Git tree and parents as the merge commit that passed verify:release. Recovery refuses to proceed if head, base, or tree differs."}}' \
              > /tmp/check.json

            curl --fail-with-body --silent --show-error \
              --retry 20 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/check.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" >/dev/null

            jq -n --arg sha "${EXPECTED_HEAD}" '{merge_method:"merge",sha:$sha}' > /tmp/merge.json
            http="$(curl --silent --show-error \
              --output /tmp/merge-response.json --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/merge.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge")"

            if [[ "${http}" == "200" ]] && jq -e '.merged == true' /tmp/merge-response.json >/dev/null; then
              cat /tmp/merge-response.json
              exit 0
            fi

            echo "Merge attempt ${attempt} returned HTTP ${http}; checking whether GitHub regenerated only the synthetic merge commit."
            cat /tmp/merge-response.json || true
            sleep 2
          done

          echo "Verified tree remained safe but GitHub did not accept the merge after retries." >&2
          exit 1
