name: Deploy CompatRelay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/compatrelay/**", ".github/workflows/deploy-compatrelay.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --check apps/compatrelay/src/index.js
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          test -n "$token" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.123.0 deploy --config apps/compatrelay/wrangler.jsonc --keep-vars
