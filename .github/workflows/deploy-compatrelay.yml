name: Deploy CompatRelay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/compatrelay/**", ".github/workflows/deploy-compatrelay.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Worker
        run: node --check apps/compatrelay/src/index.js
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          test -n "$token" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export CLOUDFLARE_API_TOKEN="$token"
          log="$(mktemp)"
          npx --yes wrangler@4.123.0 deploy --config apps/compatrelay/wrangler.jsonc --keep-vars 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$log" | tail -n 1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify live Worker
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$URL/healthz" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.service!=="CompatRelay")process.exit(1)})'; then
              break
            fi
            test "$attempt" -lt 30
            sleep 4
          done
          curl --fail --silent --show-error --max-time 10 "$URL/self-test" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="pass")process.exit(1)})'
      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          state=failure
          description='CompatRelay deployment or live verification failed'
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='CompatRelay is live and health-checked on Cloudflare'
          fi
          target_url="${LIVE_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          payload="$(node -e 'const [state,description,target_url]=process.argv.slice(1);process.stdout.write(JSON.stringify({state,context:"compatrelay-deploy",description,target_url}))' "$state" "$description" "$target_url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
