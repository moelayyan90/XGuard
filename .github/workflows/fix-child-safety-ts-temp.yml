name: Fix child safety TypeScript once

on:
  push:
    branches: [agent/child-safety-platform]
    paths:
      - .github/workflows/fix-child-safety-ts-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/child-safety-platform
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply strict indexed-access fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/worker/src/child-safety.ts')
          text = path.read_text()
          old = '  return authenticateMerchant(db, match[1].trim());'
          new = '  const token = match[1];\n  if (!token) return null;\n  return authenticateMerchant(db, token.trim());'
          if old not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace(old, new, 1))
      - run: npx prettier --write apps/worker/src/child-safety.ts
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/child-safety.ts
          git commit -m "Fix child safety bearer token narrowing"
          git push origin HEAD:agent/child-safety-platform
