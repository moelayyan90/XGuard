name: Verify XGuard Production Security

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/src/secure-entry.js"
      - "apps/relay/wrangler.jsonc"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for hardened MCP
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            body="$(curl --silent --show-error --max-time 8 -X POST https://api.xguardgate.com/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)"
            if printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);const t=x.result?.tools;if(Array.isArray(t)&&t.length===7&&t.every(v=>v.annotations?.readOnlyHint===true&&v.annotations?.destructiveHint===false&&v.outputSchema?.type==="object"&&String(v.description||"").includes("Example:")))process.exit(0)}catch{}process.exit(1)})'; then break; fi
            sleep 4
          done
          printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const t=x.result?.tools;if(!Array.isArray(t)||t.length!==7)process.exit(1);for(const v of t){if(v.annotations?.readOnlyHint!==true||v.annotations?.destructiveHint!==false||v.outputSchema?.type!=="object"||!String(v.description||"").includes("Example:"))process.exit(1);for(const p of Object.values(v.inputSchema?.properties||{})){if(typeof p.description!=="string"||!p.description.trim())process.exit(1)}}})'

      - name: Verify HTTPS and HSTS on both public MCP hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in api.xguardgate.com xguardgate.com; do
            curl --fail --silent --show-error --max-time 8 -I "https://$host/mcp" >"/tmp/$host.headers"
            grep -qi '^strict-transport-security: .*max-age=31536000' "/tmp/$host.headers"
            code="$(curl --silent --show-error --max-time 8 --max-redirs 0 -o /dev/null -w '%{http_code}' "http://$host/mcp")"
            test "$code" = "301" -o "$code" = "308"
          done

      - name: Verify canonical MCP identity
        shell: bash
        run: |
          set -euo pipefail
          for host in api.xguardgate.com xguardgate.com; do
            init="$(curl --fail --silent --show-error --max-time 8 -X POST "https://$host/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"production-security","version":"1.0.0"}}}')"
            printf '%s' "$init" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.result?.serverInfo?.name!=="xguard-control-plane"||x.result?.serverInfo?.version!=="4.1.0"||x.result?.protocolVersion!=="2026-07-28")process.exit(1)})'
          done
