name: Format MCP Trust Release

on:
  push:
    branches:
      - fix/verifymcp-trust

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verifymcp-trust
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/worker/src/mcp-oauth.ts apps/worker/src/mcp-public-contract.ts tests/mcp-trust-contract.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/mcp-oauth.ts apps/worker/src/mcp-public-contract.ts tests/mcp-trust-contract.test.ts
          git commit -m "Format MCP trust files"
          git push origin HEAD:fix/verifymcp-trust
