name: Format MCP trust release

on:
  push:
    branches:
      - fix/verifymcp-trust

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: format MCP trust files') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/verifymcp-trust
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format trust files
        run: npx prettier --write apps/worker/src/mcp-oauth.ts apps/worker/src/mcp-public-contract.ts tests/mcp-trust-contract.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker/src/mcp-oauth.ts apps/worker/src/mcp-public-contract.ts tests/mcp-trust-contract.test.ts
          git commit -m "chore: format MCP trust files"
          git push origin HEAD:fix/verifymcp-trust
