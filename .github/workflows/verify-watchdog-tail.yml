name: Verify XGuard post-deploy health

on:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xguard-post-deploy-health
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify canonical mainnet after deploy
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguardgate.com"

          retry_json() {
            local url="$1"
            local check="$2"
            for attempt in {1..18}; do
              if body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$url" 2>/dev/null)" \
                && printf '%s' "$body" | node -e "$check"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Post-deploy check failed for $url"
            return 1
          }

          retry_json "${BASE_URL}/healthz" \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x||typeof x!=="object")process.exit(1)})'

          retry_json "${BASE_URL}/status" \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.gateway!=="operational"||x.mode!=="mainnet")process.exit(1)})'

          retry_json "${BASE_URL}/.well-known/agent-card.json" \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!Array.isArray(x.supportedInterfaces)||!x.supportedInterfaces.some(i=>i&&i.protocolBinding==="JSONRPC"&&i.protocolVersion==="1.0"&&i.url==="https://xguardgate.com/a2a"))process.exit(1)})'

          echo "Verified: canonical XGuard mainnet is healthy after deploy."
