name: Verify XGuard watchdog tail ingestion

on:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xguard-watchdog-tail-verify
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Prove mainnet events reach the watchdog Tail Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare authorization is required to verify live Tail Worker ingestion."
            exit 1
          fi

          LOG_FILE="$(mktemp)"
          set +e
          timeout 40s npx wrangler tail xguard-watchdog \
            --format json \
            --search watchdog_invocation \
            >"${LOG_FILE}" 2>&1 &
          TAIL_PID=$!
          set -e

          sleep 8
          BASE_URL="https://xguard-mainnet.maqamapp.workers.dev"
          for attempt in 1 2 3; do
            curl -fsS --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}/healthz?tailVerify=${GITHUB_RUN_ID}-${attempt}" \
              >/dev/null
            sleep 2
          done

          set +e
          wait "${TAIL_PID}"
          TAIL_STATUS=$?
          set -e
          if [[ "${TAIL_STATUS}" -ne 0 && "${TAIL_STATUS}" -ne 124 ]]; then
            cat "${LOG_FILE}"
            echo "::error::wrangler tail exited unexpectedly with status ${TAIL_STATUS}."
            exit 1
          fi

          if ! grep -Fq 'watchdog_invocation' "${LOG_FILE}" \
            || ! grep -Fq 'xguard-mainnet' "${LOG_FILE}" \
            || ! grep -Fq '/healthz' "${LOG_FILE}"; then
            cat "${LOG_FILE}"
            echo "::error::No live xguard-mainnet /healthz invocation reached xguard-watchdog."
            exit 1
          fi

          echo "Verified: xguard-mainnet invocations are reaching xguard-watchdog in real time."
