name: Verify XGuard inference production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy XGuard Autonomous AI Inference Provider"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify live provider identity and optional real inference
        env:
          XGUARD_BASE_URL: https://xguardgate.com
          DGRID_PROVIDER_API_KEY: ${{ secrets.DGRID_PROVIDER_API_KEY }}
        run: npm run inference:smoke
