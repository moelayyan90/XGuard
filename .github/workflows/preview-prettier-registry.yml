name: Preview registry Prettier output

on:
  push:
    branches: [chore/registry-readiness-pack]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier output
        run: |
          npx prettier docs/registry-submissions/toolhive/server.json --write
          echo '---BEGIN-FORMATTED---'
          cat docs/registry-submissions/toolhive/server.json
          echo '---END-FORMATTED---'
