name: Commercial Surfaces

on:
  pull_request:
    paths:
      - "commercial/**"
      - ".github/workflows/commercial-surfaces.yml"
      - ".github/workflows/deploy-commercial-extractor.yml"
      - ".github/workflows/publish-apify-actor.yml"
  push:
    branches: [main]
    paths:
      - "commercial/**"
      - ".github/workflows/commercial-surfaces.yml"
      - ".github/workflows/deploy-commercial-extractor.yml"
      - ".github/workflows/publish-apify-actor.yml"

permissions:
  contents: read

jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate Actor metadata JSON
        run: |
          python -m json.tool commercial/apify-xguard/.actor/actor.json >/dev/null
          python -m json.tool commercial/apify-xguard/.actor/input_schema.json >/dev/null
          python -m json.tool commercial/apify-xguard/.actor/output_schema.json >/dev/null
          python -m json.tool commercial/apify-xguard/.actor/dataset_schema.json >/dev/null
          python -m json.tool commercial/apify-xguard/.actor/pay_per_event.json >/dev/null
          node --check commercial/apify-xguard/scripts/configure-store.mjs

      - name: Install and check Apify Actor
        working-directory: commercial/apify-xguard
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Install and test RapidAPI service
        working-directory: commercial/rapidapi-xguard
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Validate Cloudflare production origin
        run: |
          npm ci --ignore-scripts
          node --check commercial/cloudflare-xguard/src/index.js
          npx wrangler deploy --dry-run --config commercial/cloudflare-xguard/wrangler.jsonc --outdir /tmp/xguard-extractor-dry-run
          test -s /tmp/xguard-extractor-dry-run/index.js
