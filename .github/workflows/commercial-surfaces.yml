name: Commercial Surfaces

on:
  pull_request:
    paths:
      - "apps/email-shield/**"
      - "commercial/rapidapi-xguard/openapi.json"
      - ".github/workflows/commercial-surfaces.yml"
      - ".github/workflows/publish-rapidapi-listing.yml"
  push:
    branches: [main]
    paths:
      - "apps/email-shield/**"
      - "commercial/rapidapi-xguard/openapi.json"
      - ".github/workflows/commercial-surfaces.yml"
      - ".github/workflows/publish-rapidapi-listing.yml"

permissions:
  contents: read

jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate Email Shield runtime
        run: |
          node --check apps/email-shield/src/index.js
          node --check apps/email-shield/src/verifier.js
          node --check apps/email-shield/src/site.js

      - name: Validate RapidAPI contract
        run: |
          python -m json.tool commercial/rapidapi-xguard/openapi.json >/dev/null
          node -e 'const x=require("./commercial/rapidapi-xguard/openapi.json"); if(!x.openapi.startsWith("3.0")||x.info.title!=="XGuard Email Shield API"||x.servers?.[0]?.url!=="https://api.xguardgate.com"||!x.paths?.["/v1/verify"]||!x.paths?.["/v1/verify/batch"]) process.exit(1)'

      - name: Validate D1 migration and Wrangler config
        run: |
          python - <<'PY'
          import json, sqlite3
          json.load(open('apps/email-shield/wrangler.jsonc', encoding='utf-8'))
          db=sqlite3.connect(':memory:')
          db.executescript(open('apps/email-shield/migrations/0001_email_shield.sql', encoding='utf-8').read())
          assert db.execute("select count(*) from sqlite_master where type='table' and name='api_keys'").fetchone()[0] == 1
          PY
          npm ci --ignore-scripts
          npx wrangler deploy --dry-run --config apps/email-shield/wrangler.jsonc --outdir /tmp/xguard-email-shield-dry-run
