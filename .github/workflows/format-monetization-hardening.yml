name: Format monetization deployment changes

on:
  push:
    branches:
      - agent/monetization-deploy-hardening
    paths:
      - .github/workflows/format-monetization-hardening.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/monetization-deploy-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: >-
          npx prettier --write
          .github/workflows/deploy-mainnet.yml
          BILLING.md
          QUICKSTART.md
          apps/worker/src/a2a-agent.ts
          apps/worker/src/monetized-mainnet.ts
          scripts/smoke-mainnet.mjs
          tests/mainnet-release-gate-source.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-mainnet.yml BILLING.md QUICKSTART.md apps/worker/src/a2a-agent.ts apps/worker/src/monetized-mainnet.ts scripts/smoke-mainnet.mjs tests/mainnet-release-gate-source.test.ts
          git commit -m "Format monetization deployment changes"
          git push origin HEAD:agent/monetization-deploy-hardening
