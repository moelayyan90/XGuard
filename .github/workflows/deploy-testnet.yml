name: Deploy XGuard Inference testnet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xguard-inference-testnet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run inference:verify
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Migrate and deploy truthful blocked testnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || exit 1
          export CLOUDFLARE_API_TOKEN="$token"
          if ! npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);process.exit(Array.isArray(a)&&a.some(x=>x?.name==="xguard-testnet")?0:1)})'; then
            npx wrangler d1 create xguard-testnet
          fi
          config_path="${GITHUB_WORKSPACE}/apps/worker/wrangler.testnet.resolved.jsonc"
          node scripts/resolve-cloudflare-config.mjs --template apps/worker/wrangler.jsonc --output "$config_path" --database-name xguard-testnet
          node - "$config_path" "$GITHUB_SHA" <<'NODE'
          const fs = require('node:fs');
          const [file, sha] = process.argv.slice(2);
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(/("XGUARD_GIT_COMMIT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(sha)}`);
          source = source.replace(/("XGUARD_DEPLOYED_AT"\s*:\s*)"[^"]*"/, `$1${JSON.stringify(new Date().toISOString())}`);
          if (!/"main"\s*:\s*"src\/inference-provider\.ts"/.test(source)) throw new Error('invalid inference entrypoint');
          if (/XGUARD_PAY_TO|0x[0-9a-fA-F]{40}/.test(source)) throw new Error('hard-coded payout destination');
          fs.writeFileSync(file, source);
          NODE
          npx wrangler d1 migrations apply xguard-testnet --remote --config "$config_path"
          npx wrangler deploy --config "$config_path"
      - name: Verify testnet
        shell: bash
        run: |
          set -euo pipefail
          base='https://xguard-testnet.maqamapp.workers.dev'
          for attempt in {1..30}; do
            code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 15 "${base}/v1/status?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] && node -e 'const x=require("/tmp/status.json");if(x.service!=="XGuard Autonomous AI Inference Provider"||x.environment!=="test"||x.live!==false)process.exit(1)'; then break; fi
            [[ "$attempt" != '30' ]] || exit 1
            sleep 5
          done
          curl -fsS "${base}/openapi.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).openapi!=="3.1.0")process.exit(1)})'
