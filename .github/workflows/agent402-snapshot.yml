name: Agent402 read-only production snapshot
on:
  push:
    branches: [recovery/agent402-20261107]
    paths: [.github/workflows/agent402-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read active deployment, custom domains and routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token = (process.env.CLOUDFLARE_API_TOKEN || '').replace(/[\r\n]/g,'').trim().replace(/^Bearer\s+/i,'').replace(/^"|"$/g,'').trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if (!token || !account) throw Error('Missing existing deployment credentials');
          async function read(path, select) {
            const r = await fetch('https://api.cloudflare.com/client/v4/'+path,{headers:{authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(15000)});
            const b = await r.json(); console.log(JSON.stringify({resource:path.replace(account,'ACCOUNT'),status:r.status,success:b.success,result:select(b.result),errors:b.errors?.map(x=>({code:x.code,message:x.message}))})); return b.result;
          }
          await read('accounts/'+account+'/workers/scripts/xguard-mainnet/deployments',x=>x);
          await read('accounts/'+account+'/workers/domains',x=>x?.map(d=>({id:d.id,hostname:d.hostname,service:d.service,environment:d.environment,zone_id:d.zone_id})));
          const zones = await read('zones?name=xguardgate.com',x=>x?.map(z=>({id:z.id,name:z.name})));
          for (const z of zones || []) await read('zones/'+z.id+'/workers/routes',x=>x?.map(r=>({id:r.id,pattern:r.pattern,script:r.script})));
          JS
