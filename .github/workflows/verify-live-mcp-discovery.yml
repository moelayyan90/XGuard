name: Verify XGuard live MCP discovery

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy XGuard mainnet"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: xguard-live-mcp-discovery
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify live MCP manifest and tool surface
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://xguardgate.com"
          EXPECTED_VERSION="$(node -p "require('./server.json').version")"
          VERIFY_TOKEN="${{ github.event.workflow_run.head_sha || github.sha }}"

          manifest="$(curl -fsS --max-time 20 --retry 6 --retry-all-errors --retry-delay 3 \
            -H 'Cache-Control: no-cache' \
            "${BASE_URL}/.well-known/mcp/server.json?verify=${VERIFY_TOKEN}")"

          printf '%s' "${manifest}" | EXPECTED_VERSION="${EXPECTED_VERSION}" node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if(x.name!=="io.github.moelayyan90/xguard") throw new Error(`unexpected MCP name: ${x.name}`);
              if(x.version!==process.env.EXPECTED_VERSION) throw new Error(`live MCP version ${x.version} != expected ${process.env.EXPECTED_VERSION}`);
              const remotes=Array.isArray(x.remotes)?x.remotes:[];
              if(!remotes.some(r=>r?.type==="streamable-http"&&r?.url==="https://xguardgate.com/mcp")) throw new Error("live MCP manifest is missing canonical remote");
              if(x?.discovery?.paymentOffer!=="https://xguardgate.com/v1/payment/offer") throw new Error("live MCP manifest is missing paymentOffer discovery");
              if(x?.discovery?.paymentDecision!=="https://xguardgate.com/v1/payment/decision") throw new Error("live MCP manifest is missing paymentDecision discovery");
            });
          '

          rpc='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"xguard-live-discovery-check","version":"1.0"}}}}'
          tools="$(curl -fsS --max-time 20 --retry 6 --retry-all-errors --retry-delay 3 \
            -X POST "${BASE_URL}/mcp" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            --data "${rpc}")"

          printf '%s' "${tools}" | EXPECTED_VERSION="${EXPECTED_VERSION}" node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if(x?.error) throw new Error(`MCP tools/list failed: ${JSON.stringify(x.error)}`);
              const result=x?.result||{};
              const names=new Set((result.tools||[]).map(t=>t?.name));
              for(const name of ["xguard_payment_offer","xguard_payment_decision","xguard_discover","xguard_resource_details","xguard_status"]){
                if(!names.has(name)) throw new Error(`live MCP tools/list is missing ${name}`);
              }
              const version=result?._meta?.["io.modelcontextprotocol/serverInfo"]?.version;
              if(version!==process.env.EXPECTED_VERSION) throw new Error(`live MCP serverInfo version ${version} != expected ${process.env.EXPECTED_VERSION}`);
            });
          '

          echo "Live MCP discovery is synchronized at ${EXPECTED_VERSION}."

      - name: Publish live MCP discovery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="XGuard live MCP discovery verification failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state="success"
            description="XGuard live MCP discovery matches repository metadata"
          fi
          node - "${state}" "${description}" <<'NODE' > /tmp/xguard-mcp-live-status.json
          const [state, description] = process.argv.slice(2);
          process.stdout.write(JSON.stringify({
            state,
            context: "xguard-mcp-discovery-live",
            description,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/xguard-mcp-live-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" >/dev/null
