name: Inventory XGuard production domains
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/xguard-domain-inventory.mjs
      - .github/workflows/xguard-domain-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read current custom domains and active Worker versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN_INVENTORY_FILE: ${{ runner.temp }}/xguard-domains.json
        run: node scripts/xguard-domain-inventory.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: xguard-production-domains
          path: ${{ runner.temp }}/xguard-domains.json
          retention-days: 14
