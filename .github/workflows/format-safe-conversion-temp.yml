name: Format safe conversion engine

on:
  push:
    branches:
      - agent/safe-conversion-engine
    paths:
      - ".github/workflows/format-safe-conversion-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format conversion files
        run: npx prettier apps/worker/src/agent-discovery-modern.ts apps/worker/src/migration-kit.ts scripts/conversion-engine.mjs scripts/smoke-mainnet.mjs tests/migration-kit.test.ts --write
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/worker/src/agent-discovery-modern.ts apps/worker/src/migration-kit.ts scripts/conversion-engine.mjs scripts/smoke-mainnet.mjs tests/migration-kit.test.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/agent-discovery-modern.ts apps/worker/src/migration-kit.ts scripts/conversion-engine.mjs scripts/smoke-mainnet.mjs tests/migration-kit.test.ts
          git commit -m "style: format safe conversion engine"
          git push origin HEAD:agent/safe-conversion-engine
