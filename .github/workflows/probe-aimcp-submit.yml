name: Probe MCP Hub public submission flow

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect inline MCP Hub submit contract
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request

          page = "https://www.aimcp.info/en/submit"
          req = urllib.request.Request(page, headers={"User-Agent":"Mozilla/5.0 XGuard-registry-check"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          print("HTML_LENGTH", len(html))
          for needle in ["githubUrl", "contactEmail", "status:\"pending\"", "status:'pending'", "projectId", "apiKey", "firebase", "mcpSubmissions", "submissions", "addDoc", "collection(", "createdAt"]:
              matches=list(re.finditer(re.escape(needle), html, re.I))
              print("COUNT", needle, len(matches))
              for m in matches[:20]:
                  a=max(0,m.start()-2500); b=min(len(html),m.end()+4500)
                  print("---",needle,"AT",m.start(),"---")
                  print(html[a:b].replace("\n"," "))
          PY
