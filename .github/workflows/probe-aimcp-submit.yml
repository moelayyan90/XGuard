name: Probe MCP Hub public submission flow

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public MCP Hub submit page and client request shape
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://www.aimcp.info"
          url = base + "/en/submit"
          ua = {"User-Agent":"Mozilla/5.0 XGuard-registry-check"}
          req = urllib.request.Request(url, headers=ua)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
              print("PAGE_STATUS", r.status, "FINAL", r.geturl())
          print("PAGE_LENGTH", len(html))
          for needle in ["/api/","submit","github","repository","contactEmail","email","mcpName","author","fetch(","action="]:
              for m in list(re.finditer(re.escape(needle), html, re.I))[:12]:
                  a=max(0,m.start()-700); b=min(len(html),m.end()+1500)
                  print("HTML_NEEDLE", needle, html[a:b].replace("\n"," "))

          scripts = sorted(set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+\.js[^\"\']*)[\"\']', html, re.I)))
          print("SCRIPTS", len(scripts))
          for script in scripts:
              full=urllib.parse.urljoin(url, script)
              try:
                  req=urllib.request.Request(full, headers=ua)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js=r.read().decode("utf-8","replace")
              except Exception as exc:
                  print("FETCH_ERROR", full, type(exc).__name__, str(exc)); continue
              low=js.lower()
              if not any(k in low for k in ["submit","/api/","github","contactemail","repository"]):
                  continue
              print("=== BUNDLE",full,"LEN",len(js),"===")
              printed=0
              for needle in ["/api/","submit","github","repository","contactEmail","email","mcpName","author","fetch(","method:","POST","description"]:
                  for m in list(re.finditer(re.escape(needle), js, re.I))[:10]:
                      a=max(0,m.start()-800); b=min(len(js),m.end()+1600)
                      print("JS_NEEDLE",needle,js[a:b].replace("\\n"," "))
                      printed+=1
                      if printed>=180: break
                  if printed>=180: break
          PY
