name: Probe MCP Hub public submission flow

on:
  push:
    branches:
      - chore/distribution-watch-status-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate public MCP Hub submission contract
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = "https://www.aimcp.info"
          url = base + "/en/submit"
          ua = {"User-Agent":"Mozilla/5.0 XGuard-registry-check"}
          req = urllib.request.Request(url, headers=ua)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          scripts = sorted(set(re.findall(r'<script[^>]+src=[\"\']([^\"\']+\.js[^\"\']*)[\"\']', html, re.I)))

          for script in scripts:
              full=urllib.parse.urljoin(url, script)
              try:
                  req=urllib.request.Request(full, headers=ua)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js=r.read().decode("utf-8","replace")
              except Exception:
                  continue
              if "githubUrl" not in js and "firebase" not in js.lower() and "contactEmail" not in js:
                  continue
              print("BUNDLE",full,"LEN",len(js))
              for needle in [
                  "githubUrl:r.githubUrl",
                  "contactEmail:r.contactEmail",
                  "status:\"pending\"",
                  "projectId",
                  "apiKey",
                  "storageBucket",
                  "messagingSenderId",
                  "appId",
                  "F4)(",
                  "collection",
                  "addDoc",
                  "where",
                  "==",
              ]:
                  for m in list(re.finditer(re.escape(needle), js, re.I))[:20]:
                      a=max(0,m.start()-1800); b=min(len(js),m.end()+2600)
                      print("---",needle,"AT",m.start(),"---")
                      print(js[a:b].replace("\\n"," "))
          PY
