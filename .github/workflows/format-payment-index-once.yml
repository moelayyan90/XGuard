name: Format Payment Layer indexing once

on:
  push:
    branches:
      - agent/index-universal-payment-layer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/index-universal-payment-layer
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/payment-layer-indexing.test.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/payment-layer-indexing.test.ts
          git commit -m "Format Payment Layer indexing test"
          git push origin HEAD:agent/index-universal-payment-layer
