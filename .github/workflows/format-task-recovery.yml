name: Format task recovery sources

on:
  pull_request:
    paths:
      - "browser-extension/recovery-layer.js"
      - "tests/browser-task-recovery-source.test.ts"
      - ".github/workflows/format-task-recovery.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/universal-task-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx prettier --write browser-extension/recovery-layer.js tests/browser-task-recovery-source.test.ts

      - name: Commit formatted sources when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- browser-extension/recovery-layer.js tests/browser-task-recovery-source.test.ts; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "xguard-ci"
          git config user.email "xguard-ci@users.noreply.github.com"
          git add browser-extension/recovery-layer.js tests/browser-task-recovery-source.test.ts
          git commit -m "format task recovery sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
