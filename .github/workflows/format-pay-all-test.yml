name: Format Pay All Security Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/floating-pay-all

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/floating-pay-all
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Pay All security test
        run: npx prettier --write tests/browser-payment-surface-source.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-payment-surface-source.test.ts
          git commit -m "Format Pay All browser security test"
          git push origin HEAD:feature/floating-pay-all
