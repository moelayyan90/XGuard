name: Format Universal Payment Layer

on:
  push:
    branches:
      - feature/universal-payment-memory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/universal-payment-memory
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write browser-extension/service-worker.js browser-extension/universal-layer.js tests/browser-payment-surface-source.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/service-worker.js browser-extension/universal-layer.js tests/browser-payment-surface-source.test.ts
          git commit -m "Format universal payment layer"
          git push origin HEAD:feature/universal-payment-memory
