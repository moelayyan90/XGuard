name: Check watchdog recovery once

on:
  push:
    branches:
      - fix/watchdog-service-binding-probes

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verify synthetic probes recovered
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          sleep 70
          npx wrangler d1 execute xguard-mainnet --remote --command "SELECT probe_key,consecutive_failures,consecutive_successes,last_status,last_error_code,last_checked_at FROM watchdog_probe_state WHERE probe_key IN ('healthz','readyz','x402-discovery','mcp-discovery') ORDER BY probe_key;"
          npx wrangler d1 execute xguard-mainnet --remote --command "SELECT route_key,state,reason,expires_at FROM watchdog_breakers WHERE state='OPEN' AND expires_at>datetime('now') ORDER BY updated_at DESC;"
          curl -fsS --max-time 20 https://xguard-watchdog.maqamapp.workers.dev/healthz
          curl -fsS --max-time 20 https://xguard-mainnet.maqamapp.workers.dev/readyz
