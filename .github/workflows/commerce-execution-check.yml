name: XGuard Commerce Execution Check

on:
  push:
    branches: [fix/commerce-end-to-end]
  pull_request:
    paths:
      - "apps/worker/src/commerce-execution.ts"
      - "apps/worker/src/commerce-mainnet.ts"
      - "apps/worker/migrations/0026_commerce_execution.sql"
      - ".github/workflows/commerce-execution-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatting
        run: npx prettier --check apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts apps/worker/migrations/0026_commerce_execution.sql
      - name: Lint changed runtime files
        run: npx eslint apps/worker/src/commerce-execution.ts apps/worker/src/commerce-mainnet.ts
      - name: Typecheck monorepo
        run: npm run typecheck
