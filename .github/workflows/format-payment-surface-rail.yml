name: Format Payment Surface Rail

on:
  push:
    branches:
      - feature/payment-surface-rail

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/payment-surface-rail
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write browser-extension/surface-rail.js
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/surface-rail.js
          git commit -m "Format inline payment surface rail"
          git push origin HEAD:feature/payment-surface-rail
