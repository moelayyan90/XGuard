name: Deploy XGuard watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/src/mainnet-watchdog.ts"
      - "apps/worker/src/watchdog-policy.ts"
      - "apps/worker/src/watchdog-store.ts"
      - "apps/worker/wrangler.watchdog.jsonc"
      - "apps/worker/migrations/0012_watchdog_control_plane.sql"
      - ".github/workflows/deploy-watchdog.yml"

permissions:
  contents: read

concurrency:
  group: xguard-watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Validate watchdog source and config
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npx wrangler deploy --dry-run --config apps/worker/wrangler.watchdog.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy independent watchdog Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          export CLOUDFLARE_API_TOKEN

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deployment credentials are missing."
            exit 1
          fi

          CONFIG="apps/worker/wrangler.watchdog.jsonc"
          if ! grep -Fq '"name": "xguard-watchdog"' "${CONFIG}"; then
            echo "::error::Refusing to deploy a non-watchdog Worker."
            exit 1
          fi

          D1_ID="$(npx wrangler d1 info xguard-watchdog --json | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => (data += chunk));
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              if (!parsed.uuid) process.exit(2);
              process.stdout.write(parsed.uuid);
            });
          ')"
          sed "s/00000000-0000-0000-0000-000000000000/${D1_ID}/g" "${CONFIG}" > "${RUNNER_TEMP}/wrangler.watchdog.resolved.jsonc"
          CONFIG="${RUNNER_TEMP}/wrangler.watchdog.resolved.jsonc"

          npx wrangler d1 migrations apply xguard-watchdog --remote --config "${CONFIG}"
          npx wrangler deploy --config "${CONFIG}"

      - name: Verify watchdog health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --retry 3 --retry-delay 2 \
            https://xguard-watchdog.maqamapp.workers.dev/healthz
