name: Format PR 315

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 315 && github.event.pull_request.head.ref == 'agent/unify-xguard-public-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only PR 315 files
        run: >-
          npx prettier --write
          apps/worker/src/public-payment-contract.ts
          ARCHITECTURE.md
          BILLING.md
          docs/API.md
          docs/openapi.yaml
          tests/discovery.test.ts
          tests/public-payment-contract-consistency.test.ts
          TREASURY.md
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/worker/src/public-payment-contract.ts \
            ARCHITECTURE.md \
            BILLING.md \
            docs/API.md \
            docs/openapi.yaml \
            tests/discovery.test.ts \
            tests/public-payment-contract-consistency.test.ts \
            TREASURY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format public contract unification'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
