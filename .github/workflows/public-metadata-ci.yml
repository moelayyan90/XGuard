name: XGuard Public Metadata CI

on:
  pull_request:
    paths:
      - "apps/relay/src/public-metadata.js"
      - "apps/relay/src/rail-entry.js"
      - "apps/relay/src/egress-entry.js"
      - "apps/relay/test/public-metadata.mjs"
      - ".github/workflows/public-metadata-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/relay/src/public-metadata.js"
      - "apps/relay/src/rail-entry.js"
      - "apps/relay/src/egress-entry.js"
      - "apps/relay/test/public-metadata.mjs"
      - ".github/workflows/public-metadata-ci.yml"

permissions:
  contents: read

jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check apps/relay/src/public-metadata.js
          node --check apps/relay/src/rail-entry.js
          node --check apps/relay/src/egress-entry.js
          node --check apps/relay/test/public-metadata.mjs
      - name: Canonical metadata contract
        run: node apps/relay/test/public-metadata.mjs
      - name: Prevent stale public identity regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const VERSION = "5.1.0"' apps/relay/src/public-metadata.js
          grep -q 'const X402_COMPONENT_VERSION = "5.1.0"' apps/relay/src/public-metadata.js
          grep -q 'XGuard Universal Paid AI Agent + Secretless Gateway' apps/relay/src/public-metadata.js
          grep -q 'payment_manifest' apps/relay/src/public-metadata.js
          grep -q 'billing_before_credential_release: true' apps/relay/src/public-metadata.js
          grep -q 'settlement_ambiguous_fail_closed: true' apps/relay/src/public-metadata.js
          grep -q 'publicMetadata.fetch' apps/relay/src/rail-entry.js
