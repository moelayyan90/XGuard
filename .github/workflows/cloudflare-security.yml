name: Harden XGuard Cloudflare Zone

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/wrangler.jsonc"
      - ".github/workflows/cloudflare-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure and audit Cloudflare zone security
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          [[ -n "$token" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Cloudflare repository secrets are missing'; exit 1; }

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')
          zone_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/zones?name=xguardgate.com&account.id=$CLOUDFLARE_ACCOUNT_ID")"
          zone_id="$(printf '%s' "$zone_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const z=x.result?.find(z=>z.name==="xguardgate.com");if(!z?.id)process.exit(1);process.stdout.write(z.id)})')"
          echo "Resolved xguardgate.com zone"

          api_call() {
            local label="$1" method="$2" url="$3" data="${4:-}" out="$5"
            local code
            if [[ -n "$data" ]]; then
              code="$(curl --silent --show-error "${auth[@]}" -X "$method" "$url" --data "$data" -o "$out" -w '%{http_code}')"
            else
              code="$(curl --silent --show-error "${auth[@]}" -X "$method" "$url" -o "$out" -w '%{http_code}')"
            fi
            echo "$label HTTP $code"
            [[ "$code" =~ ^2[0-9][0-9]$ ]]
          }

          dnssec_ok=0
          if api_call 'DNSSEC read' GET "$api/zones/$zone_id/dnssec" '' /tmp/dnssec-read.json; then
            if node -e 'const x=require("/tmp/dnssec-read.json");process.exit(x.result?.status==="active"?0:1)'; then
              echo 'Cloudflare DNSSEC is already active.'
              dnssec_ok=1
            fi
          fi

          if [[ "$dnssec_ok" = "0" ]]; then
            if api_call 'DNSSEC activate' PATCH "$api/zones/$zone_id/dnssec" '{"status":"active"}' /tmp/dnssec-write.json; then
              if node -e 'const x=require("/tmp/dnssec-write.json");process.exit(x.result?.status==="active"?0:1)'; then
                echo 'Cloudflare DNSSEC activated.'
                dnssec_ok=1
              fi
            else
              echo '::warning::Current CLOUDFLARE_API_TOKEN cannot activate DNSSEC.'
              cat /tmp/dnssec-write.json || true
            fi
          fi

          if api_call 'Always Use HTTPS' PATCH "$api/zones/$zone_id/settings/always_use_https" '{"value":"on"}' /tmp/https.json; then
            echo 'Cloudflare Always Use HTTPS enabled.'
          else
            echo '::warning::Zone Settings edit permission is unavailable; HTTP→HTTPS is still enforced and production-tested by the XGuard Worker.'
          fi

          if api_call 'HSTS' PATCH "$api/zones/$zone_id/settings/security_header" '{"value":{"strict_transport_security":{"enabled":true,"max_age":31536000,"include_subdomains":true,"preload":false,"nosniff":true}}}' /tmp/hsts.json; then
            echo 'Cloudflare zone-level HSTS enabled.'
          else
            echo '::warning::Zone Settings edit permission is unavailable; HSTS is still emitted and production-tested by the XGuard Worker.'
          fi

          if [[ "$dnssec_ok" != "1" ]]; then
            echo '::error::DNSSEC remains inactive because the repository Cloudflare token lacks the required permission.'
            exit 1
          fi
