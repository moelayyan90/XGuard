name: Probe public MCP directory submit forms

on:
  push:
    branches: [chore/directory-submit-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public submit forms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.request

          urls = [
              'https://mcpservers.org/submit',
              'https://mcpmarket.com/submit',
              'https://www.serverhub.digital/',
              'https://www.vaultplane.com/',
          ]
          for url in urls:
              print(f'===== {url} =====')
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 XGuard directory submission probe'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      html = r.read().decode('utf-8', 'replace')
                      print('HTTP', r.status, 'final', r.geturl(), 'bytes', len(html))
              except Exception as e:
                  print('ERROR', repr(e))
                  continue
              for m in re.finditer(r'<form\b[^>]*>.*?</form>', html, re.I|re.S):
                  block = m.group(0)
                  print('FORM_TAG', re.search(r'<form\b[^>]*>', block, re.I|re.S).group(0)[:1000])
                  for tag in re.findall(r'<(?:input|select|textarea|button)\b[^>]*>', block, re.I|re.S):
                      print('FIELD', re.sub(r'\s+', ' ', tag)[:1000])
              for pat in [r'/api/[A-Za-z0-9_./?-]+', r'api/[A-Za-z0-9_./?-]+']:
                  hits = sorted(set(re.findall(pat, html)))
                  if hits:
                      print('API_HINTS', hits[:50])
          PY
