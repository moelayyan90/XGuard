name: Submit XGuard to mcpservers.org

on:
  push:
    branches: [chore/directory-submit-probe]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit free XGuard listing
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://mcpservers.org/_serverFn/62b9fa2877951ac582b1d0a4835a88ab4b119b1d5fd1a39a67a6a9faadcbc72d'
          curl -sS --max-time 30 \
            -D /tmp/headers \
            -o /tmp/body \
            -w '%{http_code}\n' \
            -A 'Mozilla/5.0 XGuard directory submission' \
            -H 'x-tsr-serverFn: true' \
            -F 'name=XGuard' \
            -F 'description=Hosted x402 v2 safety and routing gateway with remote MCP discovery for paid APIs and tools.' \
            -F 'url=https://github.com/moelayyan90/XGuard' \
            -F 'category=development' \
            -F 'email=mo.elayyan2023@gmail.com' \
            -F 'plan=free' \
            "$endpoint" | tee /tmp/http-code
          echo '---HEADERS---'
          cat /tmp/headers
          echo '---BODY---'
          cat /tmp/body
          code="$(tail -n1 /tmp/http-code)"
          case "$code" in
            2??) ;;
            *) echo "submission failed with HTTP $code" >&2; exit 1 ;;
          esac
          if grep -Eqi 'submitted successfully|Submission completed|submission|pending|review' /tmp/body; then
            echo 'MCPSERVERS_SUBMISSION=ACCEPTED'
          else
            echo 'MCPSERVERS_SUBMISSION=HTTP_ACCEPTED_UNPARSED'
          fi
