name: Probe public MCP directory submit forms

on:
  push:
    branches: [chore/directory-submit-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect mcpservers.org client submission code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as htmllib
          import re
          import urllib.parse
          import urllib.request

          base='https://mcpservers.org/submit'
          headers={'User-Agent':'Mozilla/5.0 XGuard directory submission probe'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as r:
              page=r.read().decode('utf-8','replace')
          scripts=[urllib.parse.urljoin(base,htmllib.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)]
          print('SCRIPT_URLS')
          for s in scripts: print(s)

          needles=(
              'toolautosubmit','toolname','submit_mcp_server','Submit a new MCP server',
              'FormData','fetch(','XMLHttpRequest','serverAction','action=','/submit',
              'contact_email','category','One sentence about your server'
          )
          for src in scripts:
              try:
                  with urllib.request.urlopen(urllib.request.Request(src,headers=headers),timeout=20) as r:
                      js=r.read().decode('utf-8','replace')
              except Exception as e:
                  print('SCRIPT_ERROR',src,repr(e)); continue
              print('SCRIPT',src,'BYTES',len(js))
              found=False
              for needle in needles:
                  pos=[]; start=0
                  while len(pos)<8:
                      i=js.find(needle,start)
                      if i<0: break
                      pos.append(i); start=i+len(needle)
                  if pos:
                      found=True
                      print('NEEDLE',needle,'POSITIONS',pos)
                      for i in pos[:3]:
                          print('CONTEXT',re.sub(r'\s+',' ',js[max(0,i-1200):i+2400]))
              if not found:
                  print('NO_MATCH')

          print('PAGE_MARKERS')
          for needle in ('toolautosubmit','toolname','__next_f.push','submit_mcp_server','serverAction','action'):
              for m in list(re.finditer(re.escape(needle),page,re.I))[:5]:
                  i=m.start(); print(needle,re.sub(r'\s+',' ',page[max(0,i-1200):i+2400]))
          PY
