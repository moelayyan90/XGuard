name: Probe public MCP directory submit forms

on:
  push:
    branches: [chore/directory-submit-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print mcpservers.org submit route bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -A 'Mozilla/5.0 XGuard directory submission probe' \
            'https://mcpservers.org/assets/submit-D6ie-Y5K.js' -o /tmp/submit.js
          wc -c /tmp/submit.js
          cat /tmp/submit.js
