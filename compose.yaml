services:
  xguard:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      XGUARD_PUBLIC_TESTNET: "true"
      XGUARD_MAINNET_ENABLED: "false"
      XGUARD_API_KEY_PEPPER: "${XGUARD_API_KEY_PEPPER:?set a random secret}"
      XGUARD_ADMIN_TOKEN: "${XGUARD_ADMIN_TOKEN:?set a random owner-only token}"
    volumes:
      - xguard-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  xguard-data:
