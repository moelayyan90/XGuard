name: Verify XGuard MCPCentral Discovery

on:
  workflow_run:
    workflows: ["Publish XGuard to Official MCP Registry"]
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/publish-mcpcentral.yml"
      - "scripts/verify-mcpcentral.mjs"
      - "scripts/mcpcentral-contract*.mjs"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate exact-version discovery checks
        run: |
          node --check scripts/verify-mcpcentral.mjs
          node --test scripts/mcpcentral-contract-test.mjs
  observe:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify upstream publication and actual MCPCentral mirror
        # MCPCentral mirrors the official registry daily. Its public API is
        # read-only: https://mcpcentral.io/docs/submit-a-server
        # A missing/stale mirror remains a failed check until the next sync.
        run: node scripts/verify-mcpcentral.mjs
