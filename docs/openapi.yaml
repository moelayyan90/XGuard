openapi: 3.1.0
info:
  title: XGuard Mainnet API
  version: 0.2.0-mainnet-rc
  description: >-
    Live x402 v2 facilitator-compatible gateway and independent settlement truth
    layer for Base mainnet native USDC. XGuard charges $0.002 only after a
    successful settlement reaches independent finalized on-chain confirmation.
    Merchant top-ups are prepaid service balances, not earned revenue.
  license:
    name: Apache-2.0
servers:
  - url: https://xguard-mainnet.maqamapp.workers.dev
    description: Live Base mainnet Worker
tags:
  - name: Operations
  - name: Merchants
  - name: Billing
  - name: Settlement Truth
  - name: x402
paths:
  /:
    get:
      tags: [Operations]
      summary: Discover release, network, pricing, and endpoints
      responses:
        "200":
          description: Gateway metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /healthz:
    get:
      tags: [Operations]
      summary: Check Worker liveness
      responses:
        "200":
          description: Worker is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, mode, network]
                properties:
                  status: { const: ok }
                  mode: { const: mainnet }
                  network: { const: "eip155:8453" }
  /readyz:
    get:
      tags: [Operations]
      summary: Check D1 and fresh facilitator readiness
      responses:
        "200":
          description: Mainnet is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Database or facilitator readiness failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /supported:
    get:
      tags: [x402]
      summary: Return measured x402 v2 mainnet capability
      responses:
        "200":
          description: Facilitator capability response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedResponse"
  /status:
    get:
      tags: [Operations]
      summary: Return live gateway and accounting status
      responses:
        "200":
          description: Current mainnet status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /v1/register:
    post:
      tags: [Merchants]
      summary: Register a merchant and create a bearer API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "201":
          description: Merchant created; apiKey is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400": { description: Invalid registration request }
        "429": { description: Rate limit exceeded }
  /v1/balance:
    get:
      tags: [Billing]
      summary: Return merchant prepaid service balance
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401": { description: Invalid or missing merchant API key }
  /v1/topups/intents:
    post:
      tags: [Billing]
      summary: Create a one-time exact Base USDC top-up intent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountUsd]
              properties:
                amountUsd:
                  type: string
                  pattern: "^[0-9]+(?:\\.[0-9]{1,6})?$"
      responses:
        "201":
          description: One-time deposit intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpIntentResponse"
        "400": { description: Invalid amount }
        "401": { description: Invalid or missing merchant API key }
  /v1/topups/claim:
    post:
      tags: [Billing]
      summary: Verify and claim a finalized matching Base USDC deposit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claimToken, transactionHash]
              properties:
                claimToken: { type: string, minLength: 1 }
                transactionHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Deposit claimed and service balance credited
          content:
            application/json:
              schema:
                type: object
                required: [credited, balance]
                properties:
                  credited: { const: true }
                  balance: { $ref: "#/components/schemas/BalanceResponse" }
        "400":
          {
            description: Invalid,
            mismatched,
            unfinalized,
            expired,
            or already-claimed deposit,
          }
        "401": { description: Invalid or missing merchant API key }
  /v1/settlements/{logicalPaymentKey}/truth:
    get:
      tags: [Settlement Truth]
      summary: Read XGuard's independent truth for one logical settlement
      description: >-
        Returns whether the expected Base USDC settlement is independently
        FINALIZED, still PENDING, PROVEN_FAILED, or in CONFLICT. Only FINALIZED
        sets authoritativeForRelease=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LogicalPaymentKey"
      responses:
        "200":
          description: Terminal or conflict settlement truth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementTruthResponse"
        "202":
          description: Independent evidence is still pending
          headers:
            Retry-After:
              schema: { type: integer, const: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementTruthResponse"
        "401": { description: Invalid or missing merchant API key }
        "403": { description: API key lacks settlement scope }
        "404": { description: No merchant-owned settlement truth record exists }
        "503": { description: Settlement truth storage or resolver unavailable }
  /v1/settlements/{logicalPaymentKey}/resolve:
    post:
      tags: [Settlement Truth]
      summary: Trigger immediate independent settlement resolution
      description: >-
        Prioritizes an ambiguous EIP-3009 recovery record, checks finalized Base
        AuthorizationUsed/AuthorizationCanceled evidence, verifies the exact USDC
        transfer when present, and re-checks a pending known transaction. It never
        blindly resubmits the payment authorization.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LogicalPaymentKey"
      responses:
        "200":
          description: Resolution reached a terminal or conflict truth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementTruthResponse"
        "202":
          description: Resolution ran but sufficient final evidence is not yet available
          headers:
            Retry-After:
              schema: { type: integer, const: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementTruthResponse"
        "401": { description: Invalid or missing merchant API key }
        "403": { description: API key lacks settlement scope }
        "404": { description: No merchant-owned settlement truth record exists }
        "503": { description: Settlement truth storage or resolver unavailable }
  /verify:
    post:
      tags: [x402]
      summary: Verify an x402 v2 Base authorization without submitting value
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: Malformed or unsupported payment request }
        "401": { description: Invalid or missing merchant API key }
        "413": { description: Request body exceeded the hard limit }
        "415": { description: Content-Type was not application/json }
        "429": { description: Rate or concurrency limit exceeded }
        "503": { description: No fresh safe facilitator route }
  /settle:
    post:
      tags: [x402]
      summary: Reserve the XGuard fee and settle once through the selected Base route
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilitatorRequest"
      responses:
        "200":
          description: Downstream settlement result with independent XGuard truth state when available
          headers:
            X-XGuard-Replayed:
              schema: { type: boolean }
            X-XGuard-Payment-Key:
              schema:
                type: string
                pattern: "^[0-9a-f]{64}$"
            X-XGuard-Fee-State:
              schema: { type: string }
            X-XGuard-Truth-State:
              schema:
                $ref: "#/components/schemas/SettlementTruthState"
            X-XGuard-Truth-Endpoint:
              schema: { type: string }
            X-XGuard-Resolve-Endpoint:
              schema: { type: string }
            X-XGuard-Release-Safe:
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { description: Malformed or unsupported payment request }
        "401": { description: Invalid or missing merchant API key }
        "402": { description: Insufficient XGuard prepaid service balance }
        "409":
          { description: Conflicting binding or settlement already in progress }
        "413": { description: Request body exceeded the hard limit }
        "415": { description: Content-Type was not application/json }
        "429": { description: Rate or concurrency limit exceeded }
        "503":
          { description: Unavailable route or ambiguous post-submit outcome }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: XGuard merchant API key
  parameters:
    LogicalPaymentKey:
      name: logicalPaymentKey
      in: path
      required: true
      description: Immutable XGuard logical authorization identity
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{64}$"
  schemas:
    RootResponse:
      type: object
      required:
        [name, version, protocol, mode, network, asset, price, endpoints]
      properties:
        name: { const: XGuard }
        version: { type: string }
        protocol: { const: x402-v2 }
        mode: { const: mainnet }
        network: { const: "eip155:8453" }
        asset: { const: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" }
        price:
          type: object
          required: [amount, currency, event, model]
          properties:
            amount: { const: "0.002" }
            currency: { const: USD }
            event: { const: successful_billable_settlement }
            model: { const: merchant_prepaid_service_balance }
        endpoints:
          type: object
          additionalProperties: { type: string }
    ReadinessResponse:
      type: object
      required: [status, mainnet]
      properties:
        status: { enum: [ready, not_ready] }
        mainnet: { const: true }
        facilitator: { enum: [operational, degraded] }
    CapabilityKind:
      type: object
      required: [x402Version, scheme, network]
      properties:
        x402Version: { const: 2 }
        scheme: { const: exact }
        network: { const: "eip155:8453" }
        extra:
          type: object
          additionalProperties: true
    SupportedResponse:
      type: object
      required: [kinds, extensions, signers]
      properties:
        kinds:
          type: array
          items: { $ref: "#/components/schemas/CapabilityKind" }
        extensions:
          type: array
          items: { type: string }
        signers:
          type: object
          additionalProperties: true
    StatusResponse:
      type: object
      required:
        - gateway
        - mode
        - network
        - facilitator
        - pendingFinality
        - openReconciliationCases
        - successfulBillableSettlements
        - earnedMicroUsd
        - measuredAt
      properties:
        gateway: { const: operational }
        mode: { const: mainnet }
        network: { const: "eip155:8453" }
        facilitator: { type: string }
        pendingFinality: { type: integer, minimum: 0 }
        openReconciliationCases: { type: integer, minimum: 0 }
        successfulBillableSettlements: { type: integer, minimum: 0 }
        earnedMicroUsd: { type: integer, minimum: 0 }
        measuredAt: { type: string, format: date-time }
    Merchant:
      type: object
      required: [merchantId, name, availableMicroUsd, heldMicroUsd]
      properties:
        merchantId: { type: string }
        name: { type: string }
        availableMicroUsd: { type: integer, minimum: 0 }
        heldMicroUsd: { type: integer, minimum: 0 }
    RegisterResponse:
      type: object
      required: [merchant, apiKey, warning, treasury]
      properties:
        merchant: { $ref: "#/components/schemas/Merchant" }
        apiKey: { type: string, pattern: "^xg_live_" }
        warning: { type: string }
        treasury:
          type: object
          required: [network, asset, address]
          properties:
            network: { const: "eip155:8453" }
            asset: { const: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" }
            address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    BalanceResponse:
      $ref: "#/components/schemas/Merchant"
    TopUpIntentResponse:
      type: object
      required:
        - intentId
        - claimToken
        - requestedMicroUsd
        - exactDepositMicroUsd
        - exactDepositUsdc
        - expiresAtEpoch
        - network
        - asset
        - treasuryAddress
        - instruction
      properties:
        intentId: { type: string }
        claimToken: { type: string }
        requestedMicroUsd: { type: integer, minimum: 10000 }
        exactDepositMicroUsd: { type: integer, minimum: 10001 }
        exactDepositUsdc: { type: string }
        expiresAtEpoch: { type: integer, minimum: 1 }
        network: { const: "eip155:8453" }
        asset: { const: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" }
        treasuryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        instruction: { type: string }
    SettlementTruthState:
      type: string
      enum: [FINALIZED, PENDING, PROVEN_FAILED, CONFLICT]
    SettlementTruthResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - logicalPaymentKey
        - state
        - authoritativeForRelease
        - network
        - asset
        - payer
        - payTo
        - amountMicroUsd
        - transactionHash
        - source
        - reason
        - observedAt
        - proofDigest
        - truthEndpoint
        - resolveEndpoint
      properties:
        version: { const: xguard-settlement-truth-v1 }
        logicalPaymentKey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        state:
          $ref: "#/components/schemas/SettlementTruthState"
        authoritativeForRelease: { type: boolean }
        network: { const: "eip155:8453" }
        asset:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        payer:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        payTo:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        amountMicroUsd: { type: integer, minimum: 1 }
        transactionHash:
          anyOf:
            - type: string
              pattern: "^0x[0-9a-fA-F]{64}$"
            - type: "null"
        source:
          type: string
          enum: [finality, recovery, combined]
        reason: { type: string }
        observedAt: { type: string, format: date-time }
        proofDigest:
          anyOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        truthEndpoint: { type: string }
        resolveEndpoint: { type: string }
    FacilitatorRequest:
      type: object
      required: [x402Version, paymentPayload, paymentRequirements]
      additionalProperties: false
      properties:
        x402Version: { const: 2 }
        paymentPayload:
          type: object
          additionalProperties: true
        paymentRequirements:
          type: object
          additionalProperties: true
