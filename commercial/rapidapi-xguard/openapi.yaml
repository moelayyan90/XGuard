openapi: 3.1.0
info:
  title: XGuard Web Extractor API
  version: 1.0.0
  description: Convert a public web page into clean Markdown, text, metadata, and normalized links for AI agents and RAG pipelines.
servers:
  - url: https://YOUR_PROVIDER_ORIGIN
paths:
  /health:
    get:
      operationId: health
      summary: Service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /v1/extract:
    post:
      operationId: extractPage
      summary: Extract one public web page
      description: Billing is managed by RapidAPI. The provider origin accepts calls only from the configured RapidAPI proxy in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 4096
                  example: https://example.com/article
                includeLinks:
                  type: boolean
                  default: true
                maxContentChars:
                  type: integer
                  minimum: 1000
                  maximum: 1000000
                  default: 200000
                timeoutMs:
                  type: integer
                  minimum: 1000
                  maximum: 60000
                  default: 20000
                maxHtmlBytes:
                  type: integer
                  minimum: 100000
                  maximum: 10000000
                  default: 5000000
      responses:
        '200':
          description: Successful extraction
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean, const: true }
                  result:
                    type: object
                    properties:
                      url: { type: string }
                      statusCode: { type: integer }
                      title: { type: string }
                      description: { type: string }
                      lang: { type: [string, 'null'] }
                      canonical: { type: [string, 'null'] }
                      markdown: { type: string }
                      text: { type: string }
                      links: { type: array, items: { type: object } }
                      contentLength: { type: integer }
                      extractedAt: { type: string, format: date-time }
        '400': { description: Invalid URL or request }
        '401': { description: Request not authorized by provider proxy secret }
        '413': { description: Request body too large }
        '422': { description: Unsupported or oversized upstream content }
        '502': { description: Upstream fetch or extraction failed }
        '504': { description: Upstream timeout }
