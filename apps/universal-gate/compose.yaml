services:
  xguard-gate:
    image: ghcr.io/moelayyan90/xguard-gate:5.0.1
    build:
      context: ../..
      dockerfile: apps/universal-gate/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FACILITATOR_URL: https://api.xguardgate.com
      NETWORK: eip155:8453
      ORIGIN_URL: https://example.com
      PAY_TO: "0x0000000000000000000000000000000000000000"
      AUTO_GATE_OPENAPI: "false"
      DEFAULT_PRICE: "$$0.01"
      PROTECTED_PATTERNS: >-
        [{"method":"GET","pattern":"/api/premium/*","price":"$$0.01","description":"Premium API access"}]
    # For paid XGuard Usage Credits, pass XGUARD_LICENSE_KEY from your
    # platform's secret manager rather than committing it here.
