apiVersion: apps/v1
kind: Deployment
metadata:
  name: xguard-gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xguard-gate
  template:
    metadata:
      labels:
        app: xguard-gate
    spec:
      containers:
        - name: xguard-gate
          image: ghcr.io/moelayyan90/xguard-gate:5.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FACILITATOR_URL
              value: https://api.xguardgate.com
            - name: NETWORK
              value: eip155:8453
            - name: ORIGIN_URL
              value: https://api.example.com
            - name: PAY_TO
              value: "0x0000000000000000000000000000000000000000"
            - name: AUTO_GATE_OPENAPI
              value: "true"
            - name: OPENAPI_URL
              value: https://api.example.com/openapi.json
            - name: DEFAULT_PRICE
              value: "$0.01"
            - name: XGUARD_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: xguard-gate-secrets
                  key: license-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /__xguard/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /__xguard/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: xguard-gate
spec:
  selector:
    app: xguard-gate
  ports:
    - port: 80
      targetPort: 8080
