name: Rescue36 Android 16 Migration
description: Automatically migrate Android projects to API 36, apply safe Android 16 compatibility fixes, and verify the build.
author: Rescue36
inputs:
  path:
    description: Android project root
    required: false
    default: .
  verify:
    description: Run lint, unit tests, and assembleDebug after fixes
    required: false
    default: 'true'
outputs:
  report:
    description: Path to the generated report
    value: ${{ steps.rescue.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - shell: bash
      run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
    - id: rescue
      shell: bash
      env:
        R36_PATH: ${{ inputs.path }}
        R36_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        args=(fix "$R36_PATH" --report "$R36_PATH/rescue36-report.md")
        if [[ "$R36_VERIFY" == "true" ]]; then args+=(--verify); fi
        python "$GITHUB_ACTION_PATH/rescue36.py" "${args[@]}"
        echo "report=$R36_PATH/rescue36-report.md" >> "$GITHUB_OUTPUT"
